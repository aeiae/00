<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>📚 导航首页</title>
    <meta name="description" content="支持分组、多视图、拖拽开关、ZIP导出、导入配置的静态导航页">
    <!-- JSZip 用于打包全部 HTML 为 ZIP -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        /* ============ CSS 变量（亮色主题） ============ */
        :root {
            --bg-start: #eef2ff;
            --bg-mid: #f7f0ff;
            --bg-end: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-bg-hover: rgba(255, 255, 255, 0.98);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 2px 8px rgba(31, 38, 135, 0.06);
            --card-shadow-hover: 0 6px 16px rgba(31, 38, 135, 0.12);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888a8;
            --accent: #5a5ad6;
            --accent-hover: #4a4ac0;
            --accent-grad: linear-gradient(135deg, #5a5ad6, #8b5bd6);
            --search-bg: rgba(255, 255, 255, 0.8);
            --search-border: rgba(90, 90, 214, 0.2);
            --search-focus-border: rgba(90, 90, 214, 0.5);
            --header-bg: rgba(255, 255, 255, 0.7);
            --badge-bg: rgba(90, 90, 214, 0.1);
            --badge-text: #5a5ad6;
            --divider: rgba(0, 0, 0, 0.05);
            --icon-color: #5a5ad6;
            --skeleton-bg: rgba(255, 255, 255, 0.7);
            --skeleton-shine: rgba(255, 255, 255, 0.9);
            --error-bg: #fff5f5;
            --error-border: #feb2b2;
            --error-text: #c53030;
            --toggle-bg: #e2e8f0;
            --toggle-active: #5a5ad6;
            --footer-text: #8888a8;
            --scrollbar-thumb: #c4c4d4;
            --list-hover-bg: rgba(90, 90, 214, 0.05);
            --group-title-bg: rgba(90, 90, 214, 0.06);
            --group-title-text: #5a5ad6;
            --view-btn-bg: #e2e8f0;
            --view-btn-active: #5a5ad6;
            --view-btn-color: #4a4a6a;
            --modal-overlay: rgba(0, 0, 0, 0.45);
            --modal-bg: #ffffff;
            --modal-text: #1a1a2e;
            --input-bg: #f8f8fc;
            --input-border: #d0d0e0;
            --danger: #e53e3e;
            --success: #38a169;
            --drag-over-bg: rgba(90, 90, 214, 0.12);
            --drag-clone-shadow: 0 10px 30px rgba(0,0,0,0.2);
            --masonry-gap: 14px;
            --timeline-line: #5a5ad6;
            --timeline-dot: #5a5ad6;
            --drag-handle-bg: rgba(90, 90, 214, 0.08);
            --drag-handle-color: #5a5ad6;
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --bg-start: #0f0f1a;
            --bg-mid: #1a1a2e;
            --bg-end: #0f1a2e;
            --card-bg: rgba(30, 30, 50, 0.9);
            --card-bg-hover: rgba(40, 40, 65, 0.98);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.35);
            --text-primary: #e8e8f0;
            --text-secondary: #b8b8d0;
            --text-muted: #7a7a9a;
            --accent: #7b7bff;
            --accent-hover: #8f8fff;
            --accent-grad: linear-gradient(135deg, #6b6bff, #9b6bff);
            --search-bg: rgba(30, 30, 50, 0.8);
            --search-border: rgba(123, 123, 255, 0.25);
            --search-focus-border: rgba(123, 123, 255, 0.55);
            --header-bg: rgba(20, 20, 35, 0.7);
            --badge-bg: rgba(123, 123, 255, 0.15);
            --badge-text: #9b9bff;
            --divider: rgba(255, 255, 255, 0.06);
            --icon-color: #7b7bff;
            --skeleton-bg: rgba(40, 40, 65, 0.7);
            --skeleton-shine: rgba(60, 60, 90, 0.9);
            --error-bg: rgba(50, 10, 10, 0.7);
            --error-border: #7f1d1d;
            --error-text: #fca5a5;
            --toggle-bg: #2d2d45;
            --toggle-active: #7b7bff;
            --footer-text: #6a6a8a;
            --scrollbar-thumb: #3a3a55;
            --list-hover-bg: rgba(123, 123, 255, 0.08);
            --group-title-bg: rgba(123, 123, 255, 0.12);
            --group-title-text: #9b9bff;
            --view-btn-bg: #2d2d45;
            --view-btn-active: #7b7bff;
            --view-btn-color: #b8b8d0;
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --modal-bg: #1e1e32;
            --modal-text: #e8e8f0;
            --input-bg: #2a2a42;
            --input-border: #3a3a55;
            --danger: #fc8181;
            --success: #68d391;
            --drag-over-bg: rgba(123, 123, 255, 0.15);
            --drag-clone-shadow: 0 10px 30px rgba(0,0,0,0.5);
            --timeline-line: #7b7bff;
            --timeline-dot: #7b7bff;
            --drag-handle-bg: rgba(123, 123, 255, 0.15);
            --drag-handle-color: #7b7bff;
        }

        /* ============ 基础重置 ============ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC",
                "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 45%, var(--bg-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.5s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px;
            overflow-x: hidden;
            touch-action: pan-x pan-y;
            /* 性能优化：启用硬件加速 */
            -webkit-overflow-scrolling: touch;
        }

        /* 背景装饰 - 降低模糊强度提升性能 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.2;
            transition: opacity 0.5s ease;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -120px;
            right: -80px;
            opacity: 0.12;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: #d65b8b;
            bottom: -80px;
            left: -60px;
            opacity: 0.08;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ 密码验证层 ============ */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .password-box {
            background: var(--modal-bg);
            color: var(--modal-text);
            border-radius: 20px;
            padding: 30px 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .password-box h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .password-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--modal-text);
            outline: none;
            text-align: center;
            letter-spacing: 4px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .password-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(90, 90, 214, 0.15);
        }
        .password-btn {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: var(--accent-grad);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .password-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(90, 90, 214, 0.3);
        }
        .password-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ============ 头部 ============ */
        .header {
            text-align: center;
            padding: 30px 18px 24px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 12px rgba(31, 38, 135, 0.05);
            position: relative;
            overflow: hidden;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 4px;
            background: var(--accent-grad);
            border-radius: 0 0 6px 6px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 6px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .theme-btn,
        .settings-btn {
            background: var(--toggle-bg);
            border: none;
            border-radius: 50px;
            padding: 7px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-weight: 500;
            font-family: inherit;
        }
        .theme-btn:hover,
        .settings-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.04);
        }
        .theme-btn:active,
        .settings-btn:active { transform: scale(0.95); }

        .site-title {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .site-stats {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 5px 16px;
            background: var(--badge-bg);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--badge-text);
            font-weight: 600;
            transition: background 0.3s, color 0.3s;
        }
        .site-stats .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .search-wrap {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            padding: 0 4px;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 480px;
        }
        .search-box input {
            width: 100%;
            padding: 13px 20px 13px 44px;
            border-radius: 50px;
            border: 2px solid var(--search-border);
            background: var(--search-bg);
            backdrop-filter: blur(4px);
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus {
            border-color: var(--search-focus-border);
            box-shadow: 0 0 0 4px rgba(90, 90, 214, 0.12);
            background: var(--card-bg);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-box input:focus ~ .search-icon { color: var(--accent); }

        /* 视图切换 - 纯图标 */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .view-btn {
            background: var(--view-btn-bg);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 22px;
            color: var(--view-btn-color);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
            position: relative;
        }
        .view-btn.active {
            background: var(--view-btn-active);
            color: #fff;
            box-shadow: 0 6px 16px rgba(90, 90, 214, 0.3);
            transform: scale(1.05);
        }
        .view-btn:hover {
            transform: translateY(-2px);
            background: var(--accent);
            color: #fff;
        }
        .view-btn:active { transform: scale(0.95); }
        .view-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--modal-bg);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .view-btn:hover::after { opacity: 1; }

        /* ============ 内容区域 ============ */
        .file-groups {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .file-group {
            animation: fadeInGroup 0.4s ease-out;
            position: relative;
            /* 性能优化：跳过屏幕外渲染 */
            content-visibility: auto;
            contain-intrinsic-size: 500px;
        }
        @keyframes fadeInGroup {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .group-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--group-title-text);
            background: var(--group-title-bg);
            padding: 8px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: inline-block;
            letter-spacing: 0.02em;
            backdrop-filter: blur(2px);
        }

        /* 宫格模式 */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
        }
        /* 列表模式 */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* 瀑布流模式 */
        .file-masonry {
            column-count: 4;
            column-gap: 16px;
        }
        .file-masonry .file-card-masonry {
            break-inside: avoid;
            margin-bottom: 16px;
        }
        /* 时间线模式 */
        .file-timeline {
            position: relative;
            padding-left: 30px;
            border-left: 3px solid var(--timeline-line);
            margin-left: 10px;
        }
        .file-timeline .file-card-timeline {
            position: relative;
            margin-bottom: 20px;
        }
        .file-timeline .file-card-timeline::before {
            content: '';
            position: absolute;
            left: -37px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--timeline-dot);
            box-shadow: 0 0 0 4px rgba(90,90,214,0.2);
        }

        /* 卡片通用样式 - 移除 backdrop-filter 提升性能 */
        .file-card-grid,
        .file-card-list,
        .file-card-masonry,
        .file-card-timeline {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
            padding: 16px;
            box-shadow: var(--card-shadow);
            will-change: transform;
        }
        .file-card-grid {
            flex-direction: column;
            padding: 18px 16px;
        }
        .file-card-list {
            flex-direction: row;
            align-items: center;
            padding: 14px 16px;
        }
        .file-card-masonry {
            flex-direction: column;
            padding: 18px 16px;
        }
        .file-card-timeline {
            flex-direction: row;
            align-items: center;
            padding: 14px 16px;
        }
        .file-card-grid:hover,
        .file-card-list:hover,
        .file-card-masonry:hover,
        .file-card-timeline:hover {
            background: var(--card-bg-hover);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-1px);
            border-color: var(--accent);
            outline: none;
        }
        .file-card-grid::before,
        .file-card-masonry::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-grad);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 16px 16px 0 0;
        }
        .file-card-grid:hover::before,
        .file-card-masonry:hover::before { opacity: 1; }
        .file-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--badge-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--icon-color);
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .file-card-grid:hover .file-icon,
        .file-card-list:hover .file-icon,
        .file-card-masonry:hover .file-icon,
        .file-card-timeline:hover .file-icon {
            background: var(--accent);
            color: #fff;
            transform: rotate(-5deg) scale(1.05);
        }
        .file-info { flex: 1; min-width: 0; }
        .file-name {
            font-weight: 700;
            font-size: 0.98rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            transition: color 0.3s;
        }
        .file-card-grid:hover .file-name,
        .file-card-list:hover .file-name,
        .file-card-masonry:hover .file-name,
        .file-card-timeline:hover .file-name { color: var(--accent); }
        .file-dir {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.01em;
        }
        .file-arrow {
            color: var(--text-muted);
            opacity: 0;
            transition: all 0.3s;
            font-size: 1rem;
            margin-left: auto;
        }
        .file-card-grid:hover .file-arrow,
        .file-card-list:hover .file-arrow,
        .file-card-masonry:hover .file-arrow,
        .file-card-timeline:hover .file-arrow {
            opacity: 1;
            transform: translateX(2px);
            color: var(--accent);
        }

        /* 拖拽手柄 */
        .drag-handle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--drag-handle-bg);
            color: var(--drag-handle-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
            font-size: 18px;
            opacity: 0.7;
            touch-action: none;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle:hover { opacity: 1; background: var(--accent); color: #fff; }

        /* 拖拽相关 */
        .file-card-dragging {
            opacity: 0.4;
        }
        .drag-clone {
            position: fixed;
            z-index: 10001;
            pointer-events: none;
            box-shadow: var(--drag-clone-shadow);
            transform: rotate(2deg) scale(1.05);
            background: var(--card-bg-hover);
            border-radius: 16px;
            padding: 16px;
            max-width: 220px;
            will-change: transform;
        }
        .group-drop-target {
            background: var(--drag-over-bg);
            border-radius: 12px;
            outline: 2px dashed var(--accent);
            outline-offset: 4px;
        }

        /* 状态消息 */
        .status-msg {
            text-align: center;
            padding: 30px 20px;
            border-radius: 16px;
            border: 2px dashed var(--card-border);
            background: var(--card-bg);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .status-msg .status-icon { font-size: 2.6rem; margin-bottom: 10px; display: block; }
        .status-msg.error {
            border-color: var(--error-border);
            background: var(--error-bg);
            color: var(--error-text);
        }
        .status-msg code {
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.8rem;
        }
        [data-theme="dark"] .status-msg code {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 骨架屏 */
        .loading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            padding: 6px 0;
        }
        .skeleton-card {
            background: var(--skeleton-bg);
            border-radius: 16px;
            padding: 20px 16px;
            height: 100px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: slide 1.8s infinite;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        @keyframes slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .sk-line {
            height: 12px;
            border-radius: 5px;
            background: var(--skeleton-shine);
            margin-bottom: 8px;
            opacity: 0.6;
        }
        .sk-line:first-child { width: 55%; height: 16px; }
        .sk-line:nth-child(2) { width: 80%; }
        .sk-line:last-child { width: 35%; margin-bottom: 0; }

        /* 设置模态框 */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 20px;
        }
        .settings-overlay.open { display: flex; }
        .settings-modal {
            background: var(--modal-bg);
            color: var(--modal-text);
            border-radius: 20px;
            width: 100%;
            max-width: 620px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--divider);
        }
        .settings-header h3 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .settings-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }
        .settings-close:hover { color: var(--text-primary); }
        .settings-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .settings-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .settings-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 6px;
            margin-bottom: 12px;
        }
        .settings-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .settings-file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 6px;
            border-radius: 8px;
            transition: background 0.2s;
            flex-wrap: wrap;
        }
        .settings-file-item:hover { background: var(--list-hover-bg); }
        .settings-file-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }
        .settings-file-item .file-name { font-size: 0.9rem; font-weight: 500; }
        .settings-file-item .file-path {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        .settings-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--divider);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-btn-primary,
        .settings-btn-secondary {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .settings-btn-primary { background: var(--accent-grad); color: #fff; }
        .settings-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(90,90,214,0.3); }
        .settings-btn-secondary { background: var(--toggle-bg); color: var(--text-secondary); }
        .settings-btn-secondary:hover { background: var(--text-muted); color: #fff; }
        .import-file-input { display: none; }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 16px;
            font-size: 0.75rem;
            color: var(--footer-text);
            letter-spacing: 0.02em;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; }

        /* 响应式 */
        @media (max-width: 768px) {
            .file-masonry { column-count: 2; }
            .file-timeline { padding-left: 20px; }
            .file-timeline .file-card-timeline::before { left: -27px; }
        }
        @media (max-width: 480px) {
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .file-masonry { column-count: 1; }
            .file-timeline { padding-left: 16px; }
            .file-timeline .file-card-timeline::before { left: -23px; width: 10px; height: 10px; }
            .settings-modal { max-height: 90vh; }
            .header-top { flex-wrap: wrap; gap: 8px; }
            .view-btn { width: 40px; height: 40px; font-size: 18px; }
        }
        @media (max-width: 380px) {
            .file-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- 密码验证层 -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h2>🔒 访问验证</h2>
            <p>首次访问请输入密码</p>
            <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码" autocomplete="off">
            <button class="password-btn" id="passwordConfirm">确认访问</button>
            <div class="password-error" id="passwordError"></div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <div class="settings-header">
                <h3>⚙️ 导航设置</h3>
                <button class="settings-close" id="settingsClose" aria-label="关闭设置">&times;</button>
            </div>
            <div class="settings-body">
                <!-- 拖拽开关 -->
                <div class="settings-option">
                    <input type="checkbox" id="enableDragCheckbox">
                    <label for="enableDragCheckbox" style="font-weight:600;cursor:pointer;">启用拖拽排序（显示手柄）</label>
                </div>
                <div class="settings-section-title">显示 / 隐藏 文件</div>
                <div id="settingsFileList"></div>
            </div>
            <div class="settings-footer">
                <button class="settings-btn-secondary" id="exportHtmlBtn">📄 导出导航页</button>
                <button class="settings-btn-secondary" id="exportAllHtmlBtn">📦 导出全部HTML(ZIP)</button>
                <button class="settings-btn-secondary" id="exportConfigBtn">📤 导出配置</button>
                <button class="settings-btn-secondary" id="importConfigBtn">📂 导入配置</button>
                <input type="file" id="importFileInput" class="import-file-input" accept=".json">
                <button class="settings-btn-primary" id="saveSettingsBtn">完成</button>
            </div>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <header class="header">
            <div class="header-top">
                <button class="settings-btn" id="openSettingsBtn" type="button" aria-label="打开设置">
                    <span>⚙️</span> <span>设置</span>
                </button>
                <button class="theme-btn" id="themeToggle" type="button" aria-label="切换主题">
                    <span id="themeIcon">🌙</span>
                    <span id="themeLabel">暗色</span>
                </button>
            </div>
            <h1 class="site-title">📚 导航首页</h1>
            <div class="site-stats" id="siteStats" style="display:none;">
                <span class="dot"></span>
                <span id="statsText">加载中...</span>
            </div>
            <div class="search-wrap">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索 HTML 文件..." autocomplete="off" aria-label="搜索文件">
                    <span class="search-icon" aria-hidden="true">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="view-toggle" id="viewToggle">
                <button class="view-btn active" data-view="grid" data-tooltip="宫格">🔲</button>
                <button class="view-btn" data-view="list" data-tooltip="列表">📋</button>
                <button class="view-btn" data-view="masonry" data-tooltip="瀑布流">🧱</button>
                <button class="view-btn" data-view="timeline" data-tooltip="时间线">⏱️</button>
            </div>
        </header>

        <main>
            <div id="loadingContainer" class="loading-grid">
                <div class="skeleton-card"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="skeleton-card"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="skeleton-card"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="skeleton-card"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
            </div>
            <div id="fileGroups" class="file-groups"></div>
            <div id="statusMessage" class="status-msg" style="display:none;"></div>
        </main>

        <footer class="footer">
            <span>静态导航 · 多视图 · 拖拽开关 · ZIP导出 · 密码保护</span>
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            /* ============ 配置区域 ============ */
            const AUTO_LOAD_FILES_JSON = true;
            const MANUAL_FILES = [];
            const EXCLUDED_FILENAMES = ['index.html', '404.html'];
            const PASSWORD = '2580399';
            const VERIFIED_KEY = 'nav_verified';
            const CONFIG_KEY = 'nav_config_v2';
            const VIEW_KEY = 'nav_view';
            const DRAG_ENABLED_KEY = 'nav_drag_enabled';

            /* ============ DOM ============ */
            const passwordOverlay = document.getElementById('passwordOverlay');
            const passwordInput = document.getElementById('passwordInput');
            const passwordConfirm = document.getElementById('passwordConfirm');
            const passwordError = document.getElementById('passwordError');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const openSettingsBtn = document.getElementById('openSettingsBtn');
            const settingsFileList = document.getElementById('settingsFileList');
            const exportHtmlBtn = document.getElementById('exportHtmlBtn');
            const exportAllHtmlBtn = document.getElementById('exportAllHtmlBtn');
            const exportConfigBtn = document.getElementById('exportConfigBtn');
            const importConfigBtn = document.getElementById('importConfigBtn');
            const importFileInput = document.getElementById('importFileInput');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const enableDragCheckbox = document.getElementById('enableDragCheckbox');
            const fileGroupsContainer = document.getElementById('fileGroups');
            const loadingContainer = document.getElementById('loadingContainer');
            const statusMessage = document.getElementById('statusMessage');
            const searchInput = document.getElementById('searchInput');
            const siteStats = document.getElementById('siteStats');
            const statsText = document.getElementById('statsText');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            const viewToggle = document.getElementById('viewToggle');

            /* ============ 状态 ============ */
            let allFiles = [];
            let fileOrder = [];
            let hiddenFiles = {};
            let customGroups = {};
            let filteredFiles = [];
            let currentView = localStorage.getItem(VIEW_KEY) || 'grid';
            let dragEnabled = localStorage.getItem(DRAG_ENABLED_KEY) === 'true';
            let dragging = false;
            let longPressTimer = null;
            let dragData = null;
            let rafId = null;

            /* ============ 密码验证 ============ */
            function checkPassword() {
                if (localStorage.getItem(VERIFIED_KEY) === 'true') {
                    passwordOverlay.style.display = 'none';
                    return true;
                }
                passwordOverlay.style.display = 'flex';
                return false;
            }
            function verifyPassword() {
                if (passwordInput.value.trim() === PASSWORD) {
                    localStorage.setItem(VERIFIED_KEY, 'true');
                    passwordOverlay.style.display = 'none';
                    initApp();
                } else {
                    passwordError.textContent = '密码错误，请重试';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }
            passwordConfirm.addEventListener('click', verifyPassword);
            passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') verifyPassword(); });
            passwordInput.addEventListener('input', () => passwordError.textContent = '');

            /* ============ 主题 ============ */
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('nav-theme', theme);
                if (theme === 'dark') { themeIcon.textContent = '☀️'; themeLabel.textContent = '亮色'; }
                else { themeIcon.textContent = '🌙'; themeLabel.textContent = '暗色'; }
            }
            applyTheme(localStorage.getItem('nav-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
            themeToggle.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(next);
            });

            /* ============ 视图切换 ============ */
            function setView(view) {
                currentView = view;
                localStorage.setItem(VIEW_KEY, view);
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });
                renderFiles(filteredFiles);
            }
            viewToggle.addEventListener('click', e => {
                const btn = e.target.closest('.view-btn');
                if (btn) setView(btn.dataset.view);
            });
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === currentView);
            });

            /* ============ 工具函数 ============ */
            function normalizePath(p) { return p.replace(/^\/+/, ''); }
            function getFileName(p) { const parts = normalizePath(p).split('/'); return parts[parts.length - 1]; }
            function getDisplayName(p) { return getFileName(p).replace(/\.html$/i, ''); }
            function getOriginalDir(p) { const clean = normalizePath(p); const parts = clean.split('/'); return parts.length > 1 ? parts.slice(0, -1).join('/') : ''; }
            function getEffectiveDir(p) { return customGroups[p] !== undefined ? customGroups[p] : getOriginalDir(p); }
            function getGroupLabel(dir) { return dir === '' ? '根目录' : dir; }

            /* ============ 加载文件 ============ */
            async function loadFilesFromJson() {
                if (!AUTO_LOAD_FILES_JSON) return null;
                try {
                    const res = await fetch('files.json', { cache: 'no-cache' });
                    if (!res.ok) return null;
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        return data.filter(item => item && (item.path || item.file || item.url)).map(item => {
                            const path = item.path || item.file || item.url;
                            return {
                                name: item.name || getDisplayName(path),
                                path: normalizePath(path),
                                url: normalizePath(path),
                                directory: getOriginalDir(path),
                            };
                        }).filter(item => !EXCLUDED_FILENAMES.includes(getFileName(item.path).toLowerCase()));
                    }
                } catch (e) { /* ignore */ }
                return null;
            }
            function loadManualFiles() {
                return MANUAL_FILES.filter(item => item && (item.path || item.file || item.url)).map(item => {
                    const path = item.path || item.file || item.url;
                    return {
                        name: item.name || getDisplayName(path),
                        path: normalizePath(path),
                        url: normalizePath(path),
                        directory: getOriginalDir(path),
                    };
                }).filter(item => !EXCLUDED_FILENAMES.includes(getFileName(item.path).toLowerCase()));
            }

            /* ============ 配置管理 ============ */
            function loadConfig() {
                try {
                    const saved = localStorage.getItem(CONFIG_KEY);
                    if (saved) {
                        const config = JSON.parse(saved);
                        if (config.order) fileOrder = config.order;
                        if (config.hidden) hiddenFiles = config.hidden;
                        if (config.customGroups) customGroups = config.customGroups;
                    }
                } catch (e) { /* ignore */ }
            }
            function saveConfig() {
                try {
                    localStorage.setItem(CONFIG_KEY, JSON.stringify({ order: fileOrder, hidden: hiddenFiles, customGroups: customGroups }));
                } catch (e) { console.warn('保存配置失败', e); }
            }
            function mergeConfig(files) {
                if (!fileOrder.length) {
                    fileOrder = files.map(f => f.path);
                } else {
                    const set = new Set(files.map(f => f.path));
                    fileOrder = fileOrder.filter(p => set.has(p));
                    const current = new Set(fileOrder);
                    files.forEach(f => { if (!current.has(f.path)) fileOrder.push(f.path); });
                }
                Object.keys(hiddenFiles).forEach(path => {
                    if (!files.some(f => f.path === path)) delete hiddenFiles[path];
                });
                Object.keys(customGroups).forEach(path => {
                    if (!files.some(f => f.path === path)) delete customGroups[path];
                });
                saveConfig();
            }
            function getVisibleFiles() {
                const map = {};
                allFiles.forEach(f => map[f.path] = f);
                return fileOrder.filter(p => map[p] && !hiddenFiles[p]).map(p => map[p]);
            }

            /* ============ 渲染 ============ */
            function renderFiles(files) {
                loadingContainer.style.display = 'none';
                if (!files.length) {
                    fileGroupsContainer.innerHTML = '';
                    fileGroupsContainer.style.display = 'none';
                    statusMessage.style.display = 'block';
                    statusMessage.className = 'status-msg';
                    statusMessage.innerHTML = '<span class="status-icon">📂</span>没有可显示的 HTML 文件';
                    siteStats.style.display = 'none';
                    return;
                }
                statusMessage.style.display = 'none';
                fileGroupsContainer.style.display = 'flex';
                fileGroupsContainer.innerHTML = '';
                siteStats.style.display = 'inline-flex';
                statsText.textContent = `共 ${files.length} 个 HTML 文件`;

                const groups = new Map();
                files.forEach(file => {
                    const dir = getEffectiveDir(file.path);
                    const label = getGroupLabel(dir);
                    if (!groups.has(label)) groups.set(label, []);
                    groups.get(label).push(file);
                });
                const sortedGroups = Array.from(groups.entries()).sort((a, b) => {
                    if (a[0] === '根目录') return -1;
                    if (b[0] === '根目录') return 1;
                    return a[0].localeCompare(b[0], 'zh-CN');
                });

                sortedGroups.forEach(([label, groupFiles]) => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'file-group';
                    groupDiv.dataset.group = label;
                    const title = document.createElement('h2');
                    title.className = 'group-title';
                    title.textContent = `${label} (${groupFiles.length})`;
                    groupDiv.appendChild(title);
                    const content = document.createElement('div');
                    content.className = {
                        'grid': 'file-grid',
                        'list': 'file-list',
                        'masonry': 'file-masonry',
                        'timeline': 'file-timeline'
                    }[currentView] || 'file-grid';
                    groupFiles.forEach(file => content.appendChild(createCard(file)));
                    groupDiv.appendChild(content);
                    fileGroupsContainer.appendChild(groupDiv);
                });
                attachDragEvents();
            }

            function createCard(file) {
                const card = document.createElement('a');
                card.href = file.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.dataset.path = file.path;
                let cardClass = 'file-card-grid';
                if (currentView === 'list') cardClass = 'file-card-list';
                else if (currentView === 'masonry') cardClass = 'file-card-masonry';
                else if (currentView === 'timeline') cardClass = 'file-card-timeline';
                card.className = cardClass;
                card.innerHTML = `
                    <div class="file-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>
                    <div class="file-info">
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-dir" title="${getGroupLabel(getEffectiveDir(file.path))}">📁 ${getGroupLabel(getEffectiveDir(file.path))}</div>
                    </div>
                    <span class="file-arrow">→</span>
                `;
                if (dragEnabled) {
                    const handle = document.createElement('span');
                    handle.className = 'drag-handle';
                    handle.innerHTML = '⠿';
                    handle.setAttribute('aria-label', '拖拽手柄');
                    card.appendChild(handle);
                }
                card.setAttribute('aria-label', `打开 ${file.path}`);
                return card;
            }

            /* ============ 设置面板 ============ */
            function openSettings() {
                settingsOverlay.classList.add('open');
                enableDragCheckbox.checked = dragEnabled;
                renderSettingsList();
            }
            function closeSettings() { settingsOverlay.classList.remove('open'); }
            function renderSettingsList() {
                const map = {};
                allFiles.forEach(f => map[f.path] = f);
                settingsFileList.innerHTML = '';
                fileOrder.forEach(path => {
                    const file = map[path];
                    if (!file) return;
                    const item = document.createElement('div');
                    item.className = 'settings-file-item';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = !hiddenFiles[path];
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) delete hiddenFiles[path];
                        else hiddenFiles[path] = true;
                        saveConfig();
                        refreshMain();
                    });
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-name';
                    nameSpan.textContent = file.name;
                    const pathSpan = document.createElement('span');
                    pathSpan.className = 'file-path';
                    pathSpan.textContent = path;
                    item.appendChild(checkbox);
                    item.appendChild(nameSpan);
                    item.appendChild(pathSpan);
                    settingsFileList.appendChild(item);
                });
            }

            function refreshMain() {
                filteredFiles = getVisibleFiles();
                renderFiles(filteredFiles);
                statsText.textContent = filteredFiles.length !== allFiles.length ? `显示 ${filteredFiles.length} / ${allFiles.length} 个文件` : `共 ${allFiles.length} 个 HTML 文件`;
            }

            /* ============ 导出功能 ============ */
            async function exportHtmlSource() {
                try {
                    const res = await fetch(window.location.href);
                    const html = await res.text();
                    const blob = new Blob([html], { type: 'text/html' });
                    downloadBlob(blob, 'navigation-page.html');
                } catch (e) {
                    const html = document.documentElement.outerHTML;
                    const blob = new Blob([html], { type: 'text/html' });
                    downloadBlob(blob, 'navigation-page.html');
                }
            }
            async function exportAllHtmlSource() {
                const filesToExport = fileOrder.map(path => {
                    const f = allFiles.find(x => x.path === path);
                    return f ? { path: f.path, name: f.name } : { path, name: getDisplayName(path) };
                });
                if (!filesToExport.length) {
                    alert('没有可导出的文件');
                    return;
                }

                // 创建 JSZip 实例
                const zip = new JSZip();
                const folder = zip.folder('html-files');

                for (const file of filesToExport) {
                    try {
                        const res = await fetch(file.path);
                        if (res.ok) {
                            const content = await res.text();
                            const pathParts = file.path.split('/');
                            if (pathParts.length > 1) {
                                let currentFolder = folder;
                                for (let i = 0; i < pathParts.length - 1; i++) {
                                    currentFolder = currentFolder.folder(pathParts[i]);
                                }
                                currentFolder.file(pathParts[pathParts.length - 1], content);
                            } else {
                                folder.file(file.path, content);
                            }
                        } else {
                            folder.file(file.path, `// 无法获取内容 (${res.status})`);
                        }
                    } catch (e) {
                        folder.file(file.path, `// 获取失败: ${e.message}`);
                    }
                }

                const blob = await zip.generateAsync({ type: 'blob' });
                downloadBlob(blob, 'all-html-source.zip');
            }
            function exportConfig() {
                const data = {
                    version: 1,
                    order: fileOrder,
                    hidden: hiddenFiles,
                    customGroups: customGroups,
                    files: fileOrder.map(p => {
                        const f = allFiles.find(x => x.path === p);
                        return { path: p, name: f?.name || getDisplayName(p) };
                    }),
                };
                downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'navigation-config.json');
            }
            function downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            /* ============ 导入配置 ============ */
            function importConfig(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const config = JSON.parse(e.target.result);
                        if (config.order) fileOrder = config.order;
                        if (config.hidden) hiddenFiles = config.hidden;
                        if (config.customGroups) customGroups = config.customGroups;
                        saveConfig();
                        mergeConfig(allFiles);
                        refreshMain();
                        renderSettingsList();
                        alert('配置导入成功！');
                    } catch (err) {
                        alert('配置文件格式错误');
                    }
                };
                reader.readAsText(file);
            }

            /* ============ 拖拽排序（长按拖拽，跨分组） ============ */
            function attachDragEvents() {
                const cards = document.querySelectorAll('.file-card-grid, .file-card-list, .file-card-masonry, .file-card-timeline');
                cards.forEach(card => {
                    card.removeEventListener('pointerdown', handlePointerDown);
                    if (dragEnabled) {
                        card.addEventListener('pointerdown', handlePointerDown);
                    }
                });
            }

            function handlePointerDown(e) {
                const card = e.currentTarget;
                if (!dragEnabled) return;
                longPressTimer = setTimeout(() => {
                    startDrag(card, e);
                }, 500);
                card.addEventListener('pointerup', () => clearTimeout(longPressTimer), { once: true });
                card.addEventListener('pointermove', () => clearTimeout(longPressTimer), { once: true });
            }

            function startDrag(card, startEvent) {
                dragging = true;
                const path = card.dataset.path;
                dragData = { path, card, clone: null, startX: startEvent.clientX, startY: startEvent.clientY, currentGroup: null };
                const clone = card.cloneNode(true);
                clone.className = 'drag-clone';
                clone.style.transform = `translate(${startEvent.clientX}px, ${startEvent.clientY}px)`;
                clone.style.width = card.offsetWidth + 'px';
                document.body.appendChild(clone);
                dragData.clone = clone;
                card.classList.add('file-card-dragging');

                document.addEventListener('pointermove', handleDragMove);
                document.addEventListener('pointerup', handleDragEnd);
            }

            function handleDragMove(e) {
                if (!dragging) return;
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(() => {
                    const clone = dragData.clone;
                    clone.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;

                    const groups = document.querySelectorAll('.file-group');
                    let targetGroup = null;
                    groups.forEach(g => {
                        const rect = g.getBoundingClientRect();
                        if (e.clientY >= rect.top && e.clientY <= rect.bottom && e.clientX >= rect.left && e.clientX <= rect.right) {
                            targetGroup = g;
                        }
                    });
                    groups.forEach(g => g.classList.remove('group-drop-target'));
                    if (targetGroup) {
                        targetGroup.classList.add('group-drop-target');
                        dragData.currentGroup = targetGroup;
                    } else {
                        dragData.currentGroup = null;
                    }
                });
            }

            function handleDragEnd(e) {
                if (!dragging) return;
                dragging = false;
                if (rafId) cancelAnimationFrame(rafId);
                document.removeEventListener('pointermove', handleDragMove);
                document.removeEventListener('pointerup', handleDragEnd);

                const sourcePath = dragData.path;
                const sourceCard = dragData.card;
                const targetGroup = dragData.currentGroup;
                const clone = dragData.clone;
                if (clone) clone.remove();
                sourceCard.classList.remove('file-card-dragging');
                document.querySelectorAll('.group-drop-target').forEach(g => g.classList.remove('group-drop-target'));

                if (!targetGroup) { dragData = null; return; }

                const targetGroupLabel = targetGroup.dataset.group;
                const targetDir = targetGroupLabel === '根目录' ? '' : targetGroupLabel;

                if (targetDir === getOriginalDir(sourcePath)) {
                    delete customGroups[sourcePath];
                } else {
                    customGroups[sourcePath] = targetDir;
                }
                saveConfig();
                dragData = null;
                refreshMain();
            }

            /* ============ 搜索 ============ */
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim().toLowerCase();
                const visible = getVisibleFiles();
                if (!q) filteredFiles = [...visible];
                else filteredFiles = visible.filter(f => f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q) || getGroupLabel(getEffectiveDir(f.path)).toLowerCase().includes(q));
                renderFiles(filteredFiles);
                statsText.textContent = filteredFiles.length !== allFiles.length ? `找到 ${filteredFiles.length} / ${allFiles.length} 个文件` : `共 ${allFiles.length} 个 HTML 文件`;
            });

            /* ============ 键盘快捷键 ============ */
            document.addEventListener('keydown', e => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                    searchInput.blur();
                }
            });

            /* ============ 事件绑定 ============ */
            openSettingsBtn.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });
            exportHtmlBtn.addEventListener('click', exportHtmlSource);
            exportAllHtmlBtn.addEventListener('click', exportAllHtmlSource);
            exportConfigBtn.addEventListener('click', exportConfig);
            importConfigBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', e => {
                if (e.target.files[0]) importConfig(e.target.files[0]);
            });
            saveSettingsBtn.addEventListener('click', () => {
                closeSettings();
                refreshMain();
            });
            enableDragCheckbox.addEventListener('change', () => {
                dragEnabled = enableDragCheckbox.checked;
                localStorage.setItem(DRAG_ENABLED_KEY, dragEnabled);
                refreshMain();
            });

            /* ============ 错误与加载 ============ */
            function showError(msg) {
                loadingContainer.style.display = 'none';
                fileGroupsContainer.style.display = 'none';
                siteStats.style.display = 'none';
                statusMessage.style.display = 'block';
                statusMessage.className = 'status-msg error';
                statusMessage.innerHTML = `<span class="status-icon">⚠️</span><strong>加载失败</strong><br>${msg}`;
            }
            function showLoading() {
                loadingContainer.style.display = 'grid';
                fileGroupsContainer.style.display = 'none';
                statusMessage.style.display = 'none';
                siteStats.style.display = 'none';
            }

            /* ============ 主初始化 ============ */
            async function initApp() {
                showLoading();
                try {
                    loadConfig();
                    let files = [];
                    const json = await loadFilesFromJson();
                    如果 (json && json.长度) 文件 = json;
                    否则 文件 = 加载手动文件();
                    如果 (文件.长度) {
                        所有文件 = 文件;
                        mergeConfig(files);
                        filteredFiles = getVisibleFiles();
                        renderFiles(filteredFiles);
                        statsText.textContent = filteredFiles.length !== allFiles.length ? `显示 ${filteredFiles.length} / ${allFiles.length} 个文件` : `共 ${allFiles.length} 个 HTML 文件`;
                    } else {
                        allFiles = [];
                        fileOrder = [];
                        hiddenFiles = {};
                        customGroups = {};
                        filteredFiles = [];
                        renderFiles([]);
                    }
                } catch (err) {
                    showError(err.message || '未知错误');
                }
            }

            if (checkPassword()) {
                initApp();
            }
        })();
    </script>
</body>
</html>
