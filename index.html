                        saveConfig();
                        mergeConfig(allFiles);
                        refreshMain();
                        renderSettingsList();
                        alert('配置导入成功！');
                    } catch (err) {
                        alert('配置文件格式错误');
                    }
                };
                reader.readAsText(file);
            }

            /* ============ 搜索输入 ============ */
            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value.trim().toLowerCase();
                refreshMain();
            });

            /* ============ 事件绑定 ============ */
            openSettingsBtn.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });
            selectLocalFolderBtn.addEventListener('click', selectLocalFolder);
            exportHtmlBtn.addEventListener('click', exportHtmlSource);
            exportAllHtmlBtn.addEventListener('click', exportAllHtmlSource);
            exportConfigBtn.addEventListener('click', exportConfig);
            importConfigBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', e => {
                if (e.target.files[0]) importConfig(e.target.files[0]);
            });
            saveSettingsBtn.addEventListener('click', () => {
                // 密度已随滑块实时更新，只需保存当前值（已在updateDensity中保存）
                closeSettings();
                refreshMain();
            });
            enableSortCheckbox.addEventListener('change', () => {
                sortEnabled = enableSortCheckbox.checked;
                localStorage.setItem(SORT_ENABLED_KEY, sortEnabled);
                refreshMain();
            });

            sortModeSelect.addEventListener('change', () => {
                sortMode = sortModeSelect.value;
                localStorage.setItem(SORT_MODE_KEY, sortMode);
                refreshMain();
            });

            /* ============ 错误与加载 ============ */
            function showError(msg) {
                loadingContainer.style.display = 'none';
                fileGroupsContainer.style.display = 'none';
                siteStats.style.display = 'none';
                statusMessage.style.display = 'block';
                statusMessage.className = 'status-msg error';
                statusMessage.innerHTML = `<span class="status-icon">⚠️</span><strong>加载失败</strong><br>${msg}`;
            }

            function showLoading() {
                loadingContainer.style.display = 'grid';
                fileGroupsContainer.style.display = 'none';
                groupTabsContainer.style.display = 'none';
                statusMessage.style.display = 'none';
                siteStats.style.display = 'none';
            }

            /* ============ 主初始化 ============ */
            async function initApp() {
                showLoading();
                try {
                    loadConfig();
                    initDensity();
                    let files = [];
                    const json = await loadFilesFromJson();
                    if (json && json.length) files = json;
                    else files = loadManualFiles();
                    if (files.length) {
                        allFiles = files;
                        mergeConfig(files);
                        // 恢复视图
                        setView(currentView);
                        refreshMain();
                    } else {
                        allFiles = [];
                        fileOrder = [];
                        hiddenFiles = {};
                        customGroups = {};
                        filteredFiles = [];
                        displayedFiles = [];
                        renderFiles([]);
                    }
                    groupTabsContainer.style.display = 'flex';
                } catch (err) {
                    showError(err.message || '未知错误');
                }
            }

            if (checkPassword()) {
                initApp();
            }
        })();
    </script>
</body>
</html>
