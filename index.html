<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 本次按用户要求做真·手机端适配；若要回到「固定1980视口 = 电脑版」的统一规范，把下一行改成 content="width=1980" 即可 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>导航首页</title>
<meta name="description" content="支持本地文件夹读取、分组筛选、搜索、拖拽排序、导入导出的离线单文件导航页">
<style>
/* ==================== 主题变量（亮色 · 对齐 02 控制台） ==================== */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --surface-3:#f0f2f5;
  --line:#eceef1;
  --line-strong:#e0e4e9;
  --text:#1c1f24;
  --text-2:#5b636e;
  --muted:#9aa1ac;
  --accent:#3a6ff7;
  --accent-hover:#2f60e0;
  --accent-soft:#eef3ff;
  --hover:#f4f7fd;
  --danger:#d9534f;
  --danger-soft:#fff4f3;
  --success:#2f9e6f;
  --shadow:0 1px 2px rgba(20,30,50,.04);
  --shadow-hover:0 6px 18px rgba(20,40,80,.09);
  --radius:8px;
  --side-w:232px;
}
[data-theme="dark"]{
  --bg:#14171c;
  --surface:#1b1f26;
  --surface-2:#20252d;
  --surface-3:#252b34;
  --line:#2a313a;
  --line-strong:#343d48;
  --text:#e5e9ef;
  --text-2:#aab3bf;
  --muted:#7c8592;
  --accent:#5b8cff;
  --accent-hover:#7aa0ff;
  --accent-soft:#1f2a40;
  --hover:#242c38;
  --danger:#f07a76;
  --danger-soft:#3a2323;
  --shadow:0 1px 2px rgba(0,0,0,.2);
  --shadow-hover:0 6px 18px rgba(0,0,0,.35);
}

/* ==================== 基础 ==================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;color:var(--text);background:var(--bg);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}

/* ==================== 骨架：左栏 + 右工作区 ==================== */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);width:100%;height:100vh}
.sidebar{
  display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-right:1px solid var(--line);
}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- 左侧栏 ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;letter-spacing:-.02em;
}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:2px}
.side-stat{
  margin:14px 14px 0;padding:8px 10px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;
}
.side-stat .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.side-section{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 10px 10px}
.side-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 6px 8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
}
.side-label span{font-variant-numeric:tabular-nums;letter-spacing:0}
.group-nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.gnav-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;
  border-radius:6px;color:var(--text-2);font-size:12.5px;text-align:left;
  white-space:nowrap;transition:background .15s,color .15s;
}
.gnav-item:hover{background:var(--hover);color:var(--text)}
.gnav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.gnav-item .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gnav-item .gcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gnav-item.active .gcount{color:var(--accent)}
.gnav-item .gdot{width:6px;height:6px;border-radius:2px;background:var(--line-strong);flex:none}
.gnav-item.active .gdot{background:var(--accent)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.side-btn{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;
  color:var(--text-2);font-size:12.5px;text-align:left;transition:background .15s,color .15s;
}
.side-btn:hover{background:var(--hover);color:var(--text)}
.side-btn .ico{width:16px;text-align:center;font-size:13px}
.side-tip{padding:8px 10px 2px;font-size:10.5px;color:var(--muted)}
.side-tip kbd{
  display:inline-block;padding:0 4px;border:1px solid var(--line-strong);border-radius:3px;
  background:var(--surface-2);font:inherit;font-size:10px;color:var(--text-2);
}

/* ---------- 顶部工具条 ---------- */
.topbar{
  height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.search-box{position:relative;flex:1;max-width:520px}
.search-box input{
  width:100%;height:34px;padding:0 46px 0 34px;border:1px solid var(--line-strong);
  border-radius:6px;background:var(--surface-2);outline:none;font-size:12.5px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.search-box input::placeholder{color:var(--muted)}
.search-box input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.kbd-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;pointer-events:none}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.menu-btn{
  display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);align-items:center;justify-content:center;
  font-size:15px;color:var(--text-2);flex:none;
}
.menu-btn:hover{background:var(--hover);color:var(--text)}
.drawer-mask{position:fixed;inset:0;background:rgba(18,24,34,.4);z-index:8999}
.order-select{
  height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);color:var(--text-2);font-size:11.5px;
  outline:none;cursor:pointer;white-space:nowrap;
}
.order-select:focus{border-color:var(--accent)}
.result-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);gap:2px}
.seg button{
  padding:5px 11px;border-radius:4px;font-size:11.5px;color:var(--text-2);
  transition:background .15s,color .15s;white-space:nowrap;
}
.seg button:hover:not(.active):not(:disabled){background:var(--hover)}
.seg button.active{background:var(--accent);color:#fff;font-weight:600}

/* ---------- 内容区 ---------- */
.content{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 48px}
.groups{display:flex;flex-direction:column;gap:22px}
.group{content-visibility:auto;contain-intrinsic-size:220px;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.group-head .bar{width:3px;height:12px;border-radius:2px;background:var(--accent);flex:none}
.group-head h2{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.01em}
.group-head .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.group.drop-active{background:var(--accent-soft);border-radius:8px;outline:1px dashed var(--accent);outline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
.rows{display:flex;flex-direction:column;gap:6px}

/* ---------- 卡片 ---------- */
.card{
  position:relative;display:flex;text-decoration:none;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;user-select:none;min-width:0;
}
.card:hover{border-color:var(--accent);background:var(--surface-2);box-shadow:var(--shadow-hover)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card-ico{
  width:28px;height:28px;border-radius:6px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.card:hover .card-ico{background:var(--accent);color:#fff}
.card-body{min-width:0;display:flex}
.card-name{font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-path{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-arrow{margin-left:auto;color:var(--muted);opacity:0;transition:opacity .15s;flex:none;font-size:14px;line-height:1}
.card:hover .card-arrow{opacity:1;color:var(--accent)}
.card-row{align-items:center;gap:11px;padding:8px 12px;min-height:44px}
.card-row .card-body{flex:1;align-items:center;gap:14px}
.card-row .card-name{flex:0 1 38%;min-width:80px}
.card-row .card-path{flex:1;min-width:0}
.card-tile{flex-direction:column;align-items:flex-start;gap:10px;padding:13px}
.card-tile .card-body{flex-direction:column;gap:3px;width:100%}
.card-tile .card-name,.card-tile .card-path{width:100%}
.card-tile .card-arrow{display:none}

/* 拖拽 */
.drag-handle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  cursor:grab;touch-action:none;z-index:2;
}
.card-tile .drag-handle{top:9px;transform:none}
.drag-handle:active{cursor:grabbing}
.drag-handle:hover{background:var(--accent);color:#fff}
.sort-on .card-row{padding-right:40px}
.sort-on .card-arrow{display:none}
.drag-clone{
  position:fixed;left:0;top:0;z-index:10001;pointer-events:none;
  box-shadow:0 14px 34px rgba(0,0,0,.22);border:1px solid var(--accent);
  background:var(--surface);opacity:.96;padding:10px 12px;display:flex;align-items:center;gap:10px;
}
.drag-clone .card-body{display:flex;flex-direction:column;gap:2px}
.drag-clone .card-path,.drag-clone .card-arrow,.drag-clone .drag-handle{display:none}
.card.dragging{opacity:.38}
.card.drop-before::before,.card.drop-after::after{
  content:'';position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3;border-radius:2px;
}
.card.drop-before::before{top:-4px}
.card.drop-after::after{bottom:-4px}

/* 骨架屏 / 状态 */
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
.skeleton-card{height:76px;border-radius:var(--radius);background:var(--surface-3);border:1px solid var(--line);position:relative;overflow:hidden}
.skeleton-card::after{
  content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--surface),transparent);animation:slide 1.5s infinite;
}
@keyframes slide{to{transform:translateX(100%)}}
.status{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:52px 20px;border:1px dashed var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--text-2);font-size:12.5px;text-align:center;
}
.status .status-icon{font-size:26px;line-height:1}
.status strong{color:var(--text);font-size:13px}
.status .hint{color:var(--muted);font-size:11.5px}
.status.error{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.btn{
  padding:7px 14px;border-radius:6px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:600;transition:background .15s,transform .15s;white-space:nowrap;
}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn.sec{background:var(--surface-3);color:var(--text-2);border:1px solid var(--line)}
.btn.sec:hover{background:var(--hover);color:var(--text)}

/* ==================== 覆盖层：密码 / 设置 ==================== */
.gate,.overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(18,24,34,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:16px;
}
.gate{z-index:9999}
.overlay{z-index:10000}
.gate-card,.modal{
  background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.22);width:100%;
}
.gate-card{max-width:340px;padding:26px 24px;text-align:center}
.gate-card h2{font-size:16px;font-weight:700;margin-bottom:5px}
.gate-card p{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.gate-card input{
  width:100%;height:38px;padding:0 12px;text-align:center;letter-spacing:3px;
  border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);outline:none;font-size:13px;
}
.gate-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate-card .btn{width:100%;margin-top:12px;height:36px}
.gate-error{min-height:18px;margin-top:9px;font-size:11.5px;color:var(--danger)}

.modal{max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:13.5px;font-weight:700}
.modal-close{font-size:20px;color:var(--muted);line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface-2);flex:none}
.modal-foot .btn.sec{flex:1;min-width:96px}
.modal-foot .btn.primary{flex:1;min-width:96px}
.sec-title{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec-block{margin-bottom:18px}
.row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted-text{font-size:11.5px;color:var(--muted)}
.check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.check-row input,.settings-file-item input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
.mini-tools{display:flex;gap:8px;margin-bottom:6px}
.mini-tools button{font-size:11px;color:var(--accent);padding:2px 4px}
.mini-tools button:hover{text-decoration:underline}
.settings-list{border:1px solid var(--line);border-radius:6px;max-height:230px;overflow-y:auto}
.settings-file-item{display:flex;align-items:center;gap:9px;padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.settings-file-item:last-child{border-bottom:0}
.settings-file-item:hover{background:var(--hover)}
.settings-file-item .nm{flex:0 1 42%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.settings-file-item .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--muted);font-family:Consolas,"SF Mono",monospace}
.settings-empty{padding:16px;text-align:center;font-size:11.5px;color:var(--muted)}
.import-file-input,.folder-fallback-input{display:none}

/* ==================== 手机端 / 窄屏适配 ==================== */
@media (max-width:820px){
  body{font-size:14px}
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:270px;z-index:9000;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.18);border-right:1px solid var(--line);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .topbar{height:auto;min-height:52px;padding:8px 12px;gap:9px;flex-wrap:wrap}
  .search-box{max-width:none;flex:1 1 calc(100% - 46px);min-width:0}
  .search-box input{height:38px;font-size:14px}
  .kbd-hint{display:none}
  .topbar-right{flex:1 1 100%;margin-left:0;gap:8px;justify-content:space-between}
  .seg button{padding:8px 12px;font-size:12px}
  .order-select{height:34px;font-size:12px}
  .content{padding:14px 12px calc(32px + env(safe-area-inset-bottom))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .card-row{min-height:52px;padding:10px 12px}
  .card-name{font-size:13.5px}
  .card-path{font-size:11.5px}
  .card-tile{padding:12px}
  .drag-handle{width:34px;height:34px;font-size:17px;right:6px}
  .card-tile .drag-handle{top:6px}
  .sort-on .card-row{padding-right:46px}
  .gnav-item{padding:10px;font-size:13.5px}
  .side-btn{padding:11px 10px;font-size:13.5px}
  .gate-card{max-width:calc(100vw - 32px)}
  .gate-card input,.gate-card .btn{height:42px}
  .modal{max-width:calc(100vw - 24px);max-height:92vh}
  .modal-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .modal-foot .btn{min-width:calc(50% - 4px);padding:10px 8px}
  .settings-file-item{padding:9px 10px}
  .settings-file-item input,.check-row input{width:18px;height:18px}
  .mini-tools button{padding:6px 4px}
}
@media (max-width:420px){
  .result-count{display:none}
  .topbar-right{justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- 访问验证 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h2>🔒 访问验证</h2>
    <p>首次访问请输入密码</p>
    <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="off" aria-label="访问密码">
    <button class="btn" id="passwordConfirm">确认访问</button>
    <div class="gate-error" id="passwordError"></div>
  </div>
</div>

<!-- 设置面板 -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="导航设置">
    <div class="modal-head">
      <h3>⚙️ 导航设置</h3>
      <button class="modal-close" id="settingsClose" aria-label="关闭设置">&times;</button>
    </div>
    <div class="modal-body">
      <div class="sec-block">
        <div class="sec-title">本地文件夹</div>
        <div class="row-inline">
          <button class="btn" id="selectLocalFolderBtn">📁 选择本地文件夹</button>
          <span class="muted-text" id="localFolderStatus">未选择</span>
        </div>
        <input type="file" id="folderFallbackInput" class="folder-fallback-input" webkitdirectory multiple accept=".html,.htm">
      </div>
      <div class="sec-block">
        <div class="sec-title">排序</div>
        <label class="check-row" for="enableSortCheckbox">
          <input type="checkbox" id="enableSortCheckbox"> 启用拖拽排序（显示手柄，可跨分组移动）
        </label>

<script>
(function(){
'use strict';

/* ==================================================================
   1. 配置（localStorage 键与原版完全一致，配置可无缝迁移）
   ================================================================== */
var CFG = {
  autoLoadFilesJson:true,
  manualFiles:[],
  excluded:['index.html','404.html'],
  password:'25803699',
  keys:{ verified:'nav_verified', config:'nav_config_v2', view:'nav_view', sort:'nav_sort_enabled', theme:'nav-theme' }
};

/* ==================================================================
   2. 状态
   ================================================================== */
var S = {
  allFiles:[], fileOrder:[], hidden:{}, customGroups:{},
  filtered:[], displayed:[],
  view:localStorage.getItem(CFG.keys.view) || 'list',
  sortEnabled:localStorage.getItem(CFG.keys.sort) === 'true',
  orderMode:'name',       // 'name' 按名称（默认） | 'custom' 用户拖拽顺序
  modeExplicit:false,     // 旧配置无 orderMode 时用于推断是否手动排过序
  group:'全部', query:'',
  localHandles:{},   // path -> FileSystemFileHandle | File
  localSource:''
};
if (S.view !== 'grid') S.view = 'list';

/* ==================================================================
   3. DOM 引用
   ================================================================== */
var $ = function(id){ return document.getElementById(id); };
var D = {
  gate:$('gate'), passwordInput:$('passwordInput'), passwordConfirm:$('passwordConfirm'), passwordError:$('passwordError'),
  settingsOverlay:$('settingsOverlay'), settingsClose:$('settingsClose'), openSettingsBtn:$('openSettingsBtn'),
  settingsFileList:$('settingsFileList'), selectLocalFolderBtn:$('selectLocalFolderBtn'),
  localFolderStatus:$('localFolderStatus'), folderFallbackInput:$('folderFallbackInput'),
  enableSortCheckbox:$('enableSortCheckbox'), selectAllBtn:$('selectAllBtn'), selectNoneBtn:$('selectNoneBtn'),
  exportAllHtmlBtn:$('exportAllHtmlBtn'),
  exportConfigBtn:$('exportConfigBtn'), importConfigBtn:$('importConfigBtn'),
  importFileInput:$('importFileInput'), saveSettingsBtn:$('saveSettingsBtn'),
  sidebar:$('sidebar'), drawerMask:$('drawerMask'), menuBtn:$('menuBtn'),
  orderModeSelect:$('orderModeSelect'),
  siteStats:$('siteStats'), statsText:$('statsText'), groupNav:$('groupNav'), groupCount:$('groupCount'),
  themeToggle:$('themeToggle'), themeIcon:$('themeIcon'), themeLabel:$('themeLabel'),
  searchInput:$('searchInput'), resultCount:$('resultCount'),
  viewToggle:$('viewToggle'), gridViewBtn:$('gridViewBtn'), listViewBtn:$('listViewBtn'),
  loadingContainer:$('loadingContainer'), fileGroups:$('fileGroups'), statusMessage:$('statusMessage')
};

var ICON_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>';

/* ==================================================================
   4. 通用工具
   ================================================================== */
var U = {
  normalizePath:function(p){ return String(p).replace(/^\/+/,''); },
  fileName:function(p){ var a=U.normalizePath(p).split('/'); return a[a.length-1]; },
  displayName:function(p){ return U.fileName(p).replace(/\.html?$/i,''); },
  originalDir:function(p){ var a=U.normalizePath(p).split('/'); return a.length>1 ? a.slice(0,-1).join('/') : ''; },
  effectiveDir:function(p){ return S.customGroups[p] !== undefined ? S.customGroups[p] : U.originalDir(p); },
  groupLabel:function(dir){ return dir === '' ? '根目录' : dir; },
  compareGroups:function(a,b){ if(a==='根目录') return -1; if(b==='根目录') return 1; return a.localeCompare(b,'zh-CN'); },
  compareByName:function(a,b){
    return a.name.localeCompare(b.name,'zh-CN',{numeric:true}) ||
           a.path.localeCompare(b.path,'zh-CN',{numeric:true});
  },
  excluded:function(name){ return CFG.excluded.indexOf(String(name).toLowerCase()) >= 0; },
  makeFile:function(path,isLocal){
    var p=U.normalizePath(path);
    return { name:U.displayName(p), path:p, url:isLocal ? '#' : p, directory:U.originalDir(p), isLocal:!!isLocal };
  },
  debounce:function(fn,wait){
    var t=null;
    return function(){ var args=arguments,self=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(self,args); },wait); };
  },
  download:function(blob,filename){
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  },
  /* UTF-8 编码，兼容无 TextEncoder 的环境 */
  utf8:function(str){
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    var out=[],i,c,c2,cp;
    for(i=0;i<str.length;i++){
      c=str.charCodeAt(i);
      if(c<0x80) out.push(c);
      else if(c<0x800) out.push(0xC0|(c>>6),0x80|(c&63));
      else if(c>=0xD800&&c<=0xDBFF&&i+1<str.length){
        c2=str.charCodeAt(++i);
        cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00);
        out.push(0xF0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63));
      } else out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    }
    return new Uint8Array(out);
  }
};

/* ==================================================================
   5. 内置 ZIP 生成器（Store 模式，替代 JSZip CDN —— 完全离线）
   ================================================================== */
var Zip = (function(){
  var table=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    table[n]=c>>>0;
  }
  function crc32(buf){
    var c=0xFFFFFFFF;
    for(var i=0;i<buf.length;i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF)>>>0;
  }
  function W(){ this.parts=[]; this.length=0; }
  W.prototype.push=function(a){
    var u = (a instanceof Uint8Array) ? a : new Uint8Array(a);
    this.parts.push(u); this.length+=u.length; return this;
  };
  W.prototype.u16=function(v){ return this.push([(v>>>0)&255,(v>>>8)&255]); };
  W.prototype.u32=function(v){ return this.push([(v>>>0)&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]); };
  W.prototype.bytes=function(){
    var out=new Uint8Array(this.length),o=0;
    for(var i=0;i<this.parts.length;i++){ out.set(this.parts[i],o); o+=this.parts[i].length; }
    return out;
  };
  function dosTime(d){ return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)) & 0xFFFF; }
  function dosDate(d){ return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()) & 0xFFFF; }

  /* entries: [{ name:String, data:Uint8Array }] */
  function build(entries){
    var d=new Date(), t=dosTime(d), dt=dosDate(d);
    var local=new W(), central=new W(), offset=0, count=0;
    for(var i=0;i<entries.length;i++){
      var e=entries[i], nameBytes=U.utf8(e.name), data=e.data, size=data.length, crc=crc32(data);
      var lh=new W();
      lh.u32(0x04034b50).u16(20).u16(0x0800).u16(0).u16(t).u16(dt)
        .u32(crc).u32(size).u32(size).u16(nameBytes.length).u16(0)
        .push(nameBytes).push(data);
      var lhb=lh.bytes();
      local.push(lhb);
      var ch=new W();
      ch.u32(0x02014b50).u16(20).u16(20).u16(0x0800).u16(0).u16(t).u16(dt)
        .u32(crc).u32(size).u32(size).u16(nameBytes.length).u16(0).u16(0)
        .u16(0).u16(0).u32(0).u32(offset).push(nameBytes);
      central.push(ch.bytes());
      offset+=lhb.length; count++;
    }
    var cd=central.bytes(), end=new W();
    end.u32(0x06054b50).u16(0).u16(0).u16(count).u16(count).u32(cd.length).u32(offset).u16(0);
    return new Blob([local.bytes(),cd,end.bytes()],{type:'application/zip'});
  }
  return { build:build, crc32:crc32 };
})();

/* ==================================================================
   6. 配置存取
   ================================================================== */
var Store = {
  load:function(){
    try{
      var raw=localStorage.getItem(CFG.keys.config);
      if(!raw) return;
      var cfg=JSON.parse(raw);
      if(Array.isArray(cfg.order)) S.fileOrder=cfg.order.filter(function(p){return typeof p==='string';});
      if(cfg.hidden && typeof cfg.hidden==='object'){
        S.hidden={};
        Object.keys(cfg.hidden).forEach(function(k){ if(cfg.hidden[k]===true) S.hidden[k]=true; });
      }
      if(cfg.customGroups && typeof cfg.customGroups==='object'){
        S.customGroups={};
        Object.keys(cfg.customGroups).forEach(function(k){ if(typeof cfg.customGroups[k]==='string') S.customGroups[k]=cfg.customGroups[k]; });
      }
      if(cfg.orderMode==='name' || cfg.orderMode==='custom'){ S.orderMode=cfg.orderMode; S.modeExplicit=true; }
    }catch(e){ /* 配置损坏时按默认处理 */ }
  },
  save:function(){
    try{
      localStorage.setItem(CFG.keys.config,JSON.stringify({
        order:S.fileOrder, hidden:S.hidden, customGroups:S.customGroups, orderMode:S.orderMode
      }));
    }catch(e){ console.warn('保存配置失败',e); }
  },
  /* 文件集合变化时，保留已有自定义顺序并清理失效项 */
  merge:function(files){
    var set={}; files.forEach(function(f){ set[f.path]=true; });
    if(!S.fileOrder.length) S.fileOrder=files.slice().sort(U.compareByName).map(function(f){ return f.path; });
    else{
      S.fileOrder=S.fileOrder.filter(function(p){ return set[p]; });
      var cur={}; S.fileOrder.forEach(function(p){ cur[p]=true; });
      files.forEach(function(f){ if(!cur[f.path]) S.fileOrder.push(f.path); });
    }
    /* 旧配置没有 orderMode：若已保存的顺序不是名称序，判定为用户手动排过序 */
    if(!S.modeExplicit && S.fileOrder.length){
      var nameOrder=files.slice().sort(U.compareByName).map(function(f){ return f.path; }).join('\n');
      if(S.fileOrder.join('\n')!==nameOrder) S.orderMode='custom';
    }
    S.modeExplicit=true;
    Object.keys(S.hidden).forEach(function(p){ if(!set[p]) delete S.hidden[p]; });
    Object.keys(S.customGroups).forEach(function(p){ if(!set[p]) delete S.customGroups[p]; });
    Store.save();
  },
  /* 当前排序模式下的全部文件（含隐藏） */
  orderedAll:function(){
    var map={}; S.allFiles.forEach(function(f){ map[f.path]=f; });
    var paths=S.fileOrder.filter(function(p){ return map[p]; });
    var cur={}; paths.forEach(function(p){ cur[p]=true; });
    S.allFiles.forEach(function(f){ if(!cur[f.path]) paths.push(f.path); });
    var list=paths.map(function(p){ return map[p]; });
    if(S.orderMode==='name') list.sort(U.compareByName);
    return list;
  },
  visible:function(){
    return Store.orderedAll().filter(function(f){ return !S.hidden[f.path]; });
  }
};

/* ==================================================================
   7. 数据源：files.json / 手动列表 / 本地文件夹
   ================================================================== */
var Source = {
  fromJson:function(){
    if(!CFG.autoLoadFilesJson) return Promise.resolve(null);
    return fetch('files.json',{cache:'no-cache'}).then(function(res){
      if(!res.ok) return null;
      return res.json();
    }).then(function(data){
      if(!Array.isArray(data) || !data.length) return null;
      var out=data.filter(function(it){ return it && (it.path||it.file||it.url); }).map(function(it){
        var p=it.path||it.file||it.url;
        var f=U.makeFile(p,false);
        if(it.name) f.name=String(it.name);
        return f;
      }).filter(function(f){ return !U.excluded(U.fileName(f.path)); });
      return out.length ? out : null;
    }).catch(function(){ return null; });
  },
  manual:function(){
    return CFG.manualFiles.filter(function(it){ return it && (it.path||it.file||it.url); }).map(function(it){
      var p=it.path||it.file||it.url, f=U.makeFile(p,false);
      if(it.name) f.name=String(it.name);
      return f;
    }).filter(function(f){ return !U.excluded(U.fileName(f.path)); });
  },
  /* File System Access API 递归扫描 */
  scanDir:function(dirHandle,rel,files,handles){
    var iter=dirHandle.values();
    function step(){
      return iter.next().then(function(r){
        if(r.done) return;
        var entry=r.value;
        if(entry.kind==='file'){
          if(!/\.html?$/i.test(entry.name) || U.excluded(entry.name)) return step();
          var p=rel ? rel+'/'+entry.name : entry.name;
          handles[p]=entry;
          files.push(U.makeFile(p,true));
          return step();
        }
        if(entry.kind==='directory'){
          var sub=rel ? rel+'/'+entry.name : entry.name;
          return Source.scanDir(entry,sub,files,handles).then(step);
        }
        return step();
      });
    }
    return step();
  },
  pickFolder:function(){
    if(typeof window.showDirectoryPicker==='function'){
      window.showDirectoryPicker({mode:'read'}).then(function(dirHandle){
        var files=[],handles={};
        return Source.scanDir(dirHandle,'',files,handles).then(function(){
          Source.applyLocal(files,handles,'文件系统访问');
        });
      }).catch(function(err){
        if(err && err.name==='AbortError') return;   // 用户主动取消，不打扰
        D.folderFallbackInput.click();              // 其余情况降级到 webkitdirectory
      });
    } else {
      D.folderFallbackInput.click();
    }
  },
  /* 兼容降级：file:// 双击打开、旧版浏览器也能选目录 */
  onFallbackChange:function(e){
    var list=Array.prototype.slice.call(e.target.files||[]);
    var files=[],handles={};
    list.forEach(function(f){
      if(!/\.html?$/i.test(f.name) || U.excluded(f.name)) return;
      var p=String(f.webkitRelativePath||f.name).replace(/\\/g,'/');
      var parts=p.split('/');
      var rel=parts.length>1 ? parts.slice(1).join('/') : parts[0];  // 去掉所选根目录名，与 showDirectoryPicker 一致
      handles[rel]=f;
      files.push(U.makeFile(rel,true));
    });
    e.target.value='';
    if(!files.length){ alert('所选文件夹中没有找到 HTML 文件。'); return; }
    Source.applyLocal(files,handles,'文件夹导入');
  },
  applyLocal:function(files,handles,label){
    S.allFiles=files;
    S.localHandles=handles;
    S.localSource=label+' · '+files.length+' 个文件';
    Store.merge(files);
    D.localFolderStatus.textContent=S.localSource;
    Renderer.render();
    Settings.close();
  },
  /* 统一读取本地文件，兼容 handle 与 File 两种来源 */
  readLocal:function(path){
    var h=S.localHandles[path];
    if(!h) return Promise.reject(new Error('文件句柄已失效，请重新选择文件夹'));
    if(typeof File!=='undefined' && h instanceof File) return Promise.resolve(h);
    return h.getFile();
  }
};

/* ==================================================================
   8. 渲染
   ================================================================== */
var Renderer = {
  loading:function(){
    D.loadingContainer.hidden=false;
    D.fileGroups.hidden=true;
    D.groupNav.hidden=true;
    D.statusMessage.hidden=true;
    D.siteStats.hidden=true;
    D.resultCount.textContent='';
  },
  error:function(msg){
    Renderer.loading();
    D.statusMessage.hidden=false;
    D.statusMessage.className='status error';
    D.statusMessage.replaceChildren();
    var ic=document.createElement('span'); ic.className='status-icon'; ic.textContent='⚠️';
    var t=document.createElement('strong'); t.textContent='加载失败';
    var d=document.createElement('span'); d.textContent=String(msg||'未知错误');
    D.statusMessage.appendChild(ic); D.statusMessage.appendChild(t); D.statusMessage.appendChild(d);
  },
  empty:function(){
    D.loadingContainer.hidden=true;
    D.fileGroups.hidden=true;
    D.groupNav.hidden=false;
    D.siteStats.hidden=true;
    D.statusMessage.hidden=false;
    D.statusMessage.className='status';
    D.statusMessage.replaceChildren();
    var noData=S.allFiles.length===0;
    var allHidden=!noData && Store.visible().length===0;
    var ic=document.createElement('span'); ic.className='status-icon'; ic.textContent=noData?'📂':(allHidden?'🙈':'🔍');
    var t=document.createElement('strong');
    t.textContent=noData?'还没有可显示的 HTML 文件':(allHidden?'文件已全部隐藏':'没有匹配的结果');
    var h=document.createElement('span'); h.className='hint';
    h.textContent=noData ? '可在设置中选择本地文件夹，或在同目录放置 files.json'
      : (allHidden ? '在「设置 → 显示 / 隐藏 文件」中重新勾选' : '试试清空搜索词或切换分组');
    D.statusMessage.appendChild(ic); D.statusMessage.appendChild(t); D.statusMessage.appendChild(h);
    if(noData || allHidden){
      var b=document.createElement('button'); b.className='btn'; b.id='emptyPickBtn'; b.type='button';
      b.textContent=noData?'📁 选择本地文件夹':'⚙️ 打开设置';
      D.statusMessage.appendChild(b);
    }
  },
  navItem:function(label,count,isAll){
    var b=document.createElement('button');
    b.type='button'; b.className='gnav-item'+(S.group===label?' active':'');
    b.dataset.group=label;
    var dot=document.createElement('span'); dot.className='gdot';
    var nm=document.createElement('span'); nm.className='gname'; nm.textContent=label;
    var ct=document.createElement('span'); ct.className='gcount'; ct.textContent=String(count);
    b.appendChild(dot); b.appendChild(nm); b.appendChild(ct);
    if(isAll) b.setAttribute('aria-label','显示全部');
    return b;
  },
  groupNav:function(){
    var counts=new Map();
    S.filtered.forEach(function(f){
      var l=U.groupLabel(U.effectiveDir(f.path));
      counts.set(l,(counts.get(l)||0)+1);
    });
    var labels=Array.from(counts.keys()).sort(U.compareGroups);
    D.groupNav.replaceChildren();
    D.groupNav.appendChild(Renderer.navItem('全部',S.filtered.length,true));
    labels.forEach(function(l){ D.groupNav.appendChild(Renderer.navItem(l,counts.get(l),false)); });
    D.groupCount.textContent=String(labels.length);
  },
  stats:function(){
    var total=S.allFiles.length, visible=Store.visible().length, shown=S.displayed.length;
    if(shown===visible && visible===total) D.statsText.textContent='共 '+total+' 个 HTML 文件';
    else if(shown===visible) D.statsText.textContent='显示 '+visible+' / '+total+' 个文件';
    else D.statsText.textContent='显示 '+shown+' / '+visible+' 个可见文件';
    D.siteStats.hidden = shown===0;
    D.resultCount.textContent = shown ? ('显示 '+shown+' 项') : '';
  },
  card:function(file){
    var a=document.createElement('a');
    a.className='card '+(S.view==='list'?'card-row':'card-tile');
    a.dataset.path=file.path;
    a.title=file.path;
    a.setAttribute('aria-label','打开 '+file.path);
    if(file.isLocal){
      a.href='#';
      a.addEventListener('click',function(ev){
        ev.preventDefault();
        Source.readLocal(file.path).then(function(f){
          var url=URL.createObjectURL(f);
          window.open(url,'_blank');
          setTimeout(function(){ URL.revokeObjectURL(url); },60000);
        }).catch(function(){ alert('无法读取本地文件，请重新选择文件夹'); });
      });
    } else {
      a.href=file.url; a.target='_blank'; a.rel='noopener noreferrer';
    }
    var ico=document.createElement('span'); ico.className='card-ico'; ico.setAttribute('aria-hidden','true'); ico.innerHTML=ICON_SVG;
    var body=document.createElement('span'); body.className='card-body';
    var nm=document.createElement('span'); nm.className='card-name'; nm.textContent=file.name;   // textContent 防 XSS
    var pt=document.createElement('span'); pt.className='card-path'; pt.textContent=U.groupLabel(U.effectiveDir(file.path));
    body.appendChild(nm); body.appendChild(pt);
    var ar=document.createElement('span'); ar.className='card-arrow'; ar.textContent='→';
    a.appendChild(ico); a.appendChild(body); a.appendChild(ar);
    if(S.sortEnabled){
      var hd=document.createElement('span'); hd.className='drag-handle'; hd.textContent='⠿';
      hd.setAttribute('aria-label','拖拽手柄'); a.appendChild(hd);
    }
    return a;
  },
  files:function(){
    D.loadingContainer.hidden=true;
    if(!S.displayed.length){ Renderer.empty(); D.fileGroups.classList.remove('sort-on'); return; }
    D.statusMessage.hidden=true;
    D.fileGroups.hidden=false;
    D.fileGroups.classList.toggle('sort-on',S.sortEnabled);
    var groups=new Map();
    S.displayed.forEach(function(f){
      var l=U.groupLabel(U.effectiveDir(f.path));
      if(!groups.has(l)) groups.set(l,[]);
      groups.get(l).push(f);
    });
    var sorted=Array.from(groups.entries()).sort(function(a,b){ return U.compareGroups(a[0],b[0]); });
    var frag=document.createDocumentFragment();
    sorted.forEach(function(pair){
      var label=pair[0], list=pair[1];
      var sec=document.createElement('section'); sec.className='group'; sec.dataset.group=label;
      var head=document.createElement('div'); head.className='group-head';
      var bar=document.createElement('span'); bar.className='bar';
      var h2=document.createElement('h2'); h2.textContent=label;
      var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=String(list.length);
      head.appendChild(bar); head.appendChild(h2); head.appendChild(cnt);
      var box=document.createElement('div'); box.className=S.view==='list'?'rows':'grid';
      list.forEach(function(f){ box.appendChild(Renderer.card(f)); });
      sec.appendChild(head); sec.appendChild(box); frag.appendChild(sec);
    });
    D.fileGroups.replaceChildren(frag);
  },
  render:function(){
    var visible=Store.visible(), q=S.query;
    S.filtered = q ? visible.filter(function(f){
      return f.name.toLowerCase().indexOf(q)>=0 ||
             f.path.toLowerCase().indexOf(q)>=0 ||
             U.groupLabel(U.effectiveDir(f.path)).toLowerCase().indexOf(q)>=0;
    }) : visible.slice();
    if(S.group!=='全部' && !S.filtered.some(function(f){ return U.groupLabel(U.effectiveDir(f.path))===S.group; })) S.group='全部';
    S.displayed = S.group==='全部' ? S.filtered.slice() : S.filtered.filter(function(f){ return U.groupLabel(U.effectiveDir(f.path))===S.group; });
    Renderer.groupNav();
    Renderer.files();
    Renderer.stats();
  },
  mode:function(){
    D.gridViewBtn.classList.toggle('active',S.view==='grid');
    D.listViewBtn.classList.toggle('active',S.view==='list');
    D.orderModeSelect.value=S.orderMode;
    D.fileGroups.classList.toggle('sort-on',S.sortEnabled);
  }
};

/* ==================================================================
   9. 拖拽排序：跨分组移动 + 同组插入排序
   ================================================================== */
var Drag = {
  state:null,
  onPointerDown:function(e){
    if(!S.sortEnabled) return;
    var h=e.target.closest ? e.target.closest('.drag-handle') : null;
    if(!h) return;
    var card=h.closest('.card');
    if(!card) return;
    e.preventDefault();
    var clone=card.cloneNode(true);
    clone.classList.add('drag-clone');
    clone.classList.remove('card-row','card-tile');
    clone.style.width=Math.min(card.offsetWidth||220,260)+'px';
    clone.style.transform='translate('+(e.clientX+12)+'px,'+(e.clientY+12)+'px)';
    document.body.appendChild(clone);
    card.classList.add('dragging');
    Drag.state={ path:card.dataset.path, clone:clone, card:card, raf:0, target:null, after:true, group:null };
    document.addEventListener('pointermove',Drag.onMove);
    document.addEventListener('pointerup',Drag.onUp);
    document.addEventListener('pointercancel',Drag.onUp);
  },
  clearMarks:function(){
    var els=D.fileGroups.querySelectorAll('.drop-before,.drop-after,.drop-active');
    Array.prototype.forEach.call(els,function(el){ el.classList.remove('drop-before','drop-after','drop-active'); });
  },
  onMove:function(e){
    var st=Drag.state;
    if(!st || !document.elementFromPoint) return;
    if(st.raf) cancelAnimationFrame(st.raf);
    st.raf=requestAnimationFrame(function(){
      st.clone.style.transform='translate('+(e.clientX+12)+'px,'+(e.clientY+12)+'px)';
      var el=document.elementFromPoint(e.clientX,e.clientY);
      var targetCard=el&&el.closest ? el.closest('.card:not(.dragging)') : null;
      var groupEl=el&&el.closest ? el.closest('.group') : null;
      if(!groupEl) groupEl=targetCard ? targetCard.closest('.group') : null;
      if(!groupEl){
        var all=D.fileGroups.querySelectorAll('.group');
        Array.prototype.forEach.call(all,function(g){
          var r=g.getBoundingClientRect();
          if(e.clientY>=r.top && e.clientY<=r.bottom) groupEl=g;
        });
      }
      Drag.clearMarks();
      if(groupEl) groupEl.classList.add('drop-active');
      if(targetCard){
        var r=targetCard.getBoundingClientRect();
        var after = S.view==='grid' ? (e.clientX > r.left+r.width/2) : (e.clientY > r.top+r.height/2);
        targetCard.classList.add(after?'drop-after':'drop-before');
        st.target=targetCard.dataset.path; st.after=after;
      } else { st.target=null; st.after=true; }
      st.group=groupEl ? groupEl.dataset.group : null;
    });
  },
  onUp:function(){
    var st=Drag.state;
    if(!st) return;
    if(st.raf) cancelAnimationFrame(st.raf);
    document.removeEventListener('pointermove',Drag.onMove);
    document.removeEventListener('pointerup',Drag.onUp);
    document.removeEventListener('pointercancel',Drag.onUp);
    if(st.clone && st.clone.parentNode) st.clone.parentNode.removeChild(st.clone);
    st.card.classList.remove('dragging');
    Drag.clearMarks();
    Drag.state=null;
    if(!st.group) return;

    var src=st.path, label=st.group, dir=(label==='根目录'?'':label);
    if(dir===U.originalDir(src)) delete S.customGroups[src];
    else S.customGroups[src]=dir;

    /* 以「当前显示顺序」为基准重排，保证名称模式下拖完也能所见即所得 */
    var order=Store.orderedAll().map(function(f){ return f.path; }).filter(function(p){ return p!==src; }), idx=order.length;
    if(st.target && st.target!==src){
      var base=order.indexOf(st.target);
      idx = base<0 ? order.length : (st.after ? base+1 : base);
    } else {
      var members=S.displayed.filter(function(f){
        return f.path!==src && U.groupLabel(U.effectiveDir(f.path))===label;
      }).map(function(f){ return f.path; });
      var last=-1;
      members.forEach(function(p){ var i=order.indexOf(p); if(i>last) last=i; });
      idx = last>=0 ? last+1 : order.length;
    }
    order.splice(Math.max(0,Math.min(idx,order.length)),0,src);
    S.fileOrder=order;
    S.orderMode='custom';   // 拖拽后自动切到自定义顺序
    S.modeExplicit=true;
    Store.save();
    Renderer.mode();
    Renderer.render();
  }
};

/* ==================================================================
   10. 设置面板
   ================================================================== */
var Settings = {
  open:function(){
    D.settingsOverlay.hidden=false;
    D.enableSortCheckbox.checked=S.sortEnabled;
    D.localFolderStatus.textContent=S.localSource||'未选择';
    Settings.renderList();
  },
  close:function(){ D.settingsOverlay.hidden=true; },
  renderList:function(){
    var list=Store.orderedAll();
    var frag=document.createDocumentFragment();
    list.forEach(function(f){
      var path=f.path;
      var row=document.createElement('div'); row.className='settings-file-item';
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!S.hidden[path];
      cb.addEventListener('change',function(){
        if(cb.checked) delete S.hidden[path]; else S.hidden[path]=true;
        Store.save(); Renderer.render();
      });
      var nm=document.createElement('span'); nm.className='nm'; nm.textContent=f.name; nm.title=f.name;
      var pt=document.createElement('span'); pt.className='pt'; pt.textContent=path; pt.title=path;
      row.appendChild(cb); row.appendChild(nm); row.appendChild(pt); frag.appendChild(row);
    });
    D.settingsFileList.replaceChildren(frag);
    if(!list.length){
      var empty=document.createElement('div'); empty.className='settings-empty'; empty.textContent='暂无文件';
      D.settingsFileList.appendChild(empty);
    }
  },
  setAll:function(show){
    S.hidden={};
    if(!show) S.allFiles.forEach(function(f){ S.hidden[f.path]=true; });
    Store.save(); Renderer.render(); Settings.renderList();
  }
};

/* ==================================================================
   11. 导入 / 导出
   ================================================================== */
var Transfer = {
  exportAll:function(){
    if(!confirm('确定要打包导出全部HTML文件吗？')) return;
    var list=Store.orderedAll().map(function(f){ return { path:f.path, file:f }; });
    if(!list.length){ alert('没有可导出的文件'); return; }
    var entries=[];
    var chain=Promise.resolve();
    list.forEach(function(item){
      chain=chain.then(function(){
        var text;
        if(item.file.isLocal){
          return Source.readLocal(item.path).then(function(f){ return f.text(); })
            .catch(function(e){ return '// 读取失败: '+e.message; });
        }
        return fetch(item.path).then(function(res){
          return res.ok ? res.text() : '// 无法获取内容 ('+res.status+')';
        }).catch(function(e){ return '// 获取失败: '+e.message; });
      }).then(function(t){ entries.push({ name:'html-files/'+item.path, data:U.utf8(t) }); });
    });
    chain.then(function(){ U.download(Zip.build(entries),'all-html-source.zip'); });
  },
  exportConfig:function(){
    if(!confirm('确定要导出配置文件吗？')) return;
    var data={
      version:2, order:S.fileOrder, hidden:S.hidden, customGroups:S.customGroups, orderMode:S.orderMode,
      files:Store.orderedAll().map(function(f){ return { path:f.path, name:f.name }; })
    };
    U.download(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),'navigation-config.json');
  },
  importConfig:function(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var cfg=JSON.parse(ev.target.result);
        if(Array.isArray(cfg.order)) S.fileOrder=cfg.order.filter(function(p){ return typeof p==='string'; });
        if(cfg.orderMode==='name' || cfg.orderMode==='custom'){ S.orderMode=cfg.orderMode; S.modeExplicit=true; }
        if(cfg.hidden && typeof cfg.hidden==='object'){
          S.hidden={};
          Object.keys(cfg.hidden).forEach(function(k){ if(cfg.hidden[k]===true) S.hidden[k]=true; });
        }
        if(cfg.customGroups && typeof cfg.customGroups==='object'){
          S.customGroups={};
          Object.keys(cfg.customGroups).forEach(function(k){ if(typeof cfg.customGroups[k]==='string') S.customGroups[k]=cfg.customGroups[k]; });
        }
        Store.save(); Store.merge(S.allFiles); Renderer.mode(); Renderer.render(); Settings.renderList();
        alert('配置导入成功！');
      }catch(err){ alert('配置文件格式错误'); }
    };
    reader.readAsText(file);
  }
};

/* ==================================================================
   12. 密码 / 主题 / 初始化 / 事件
   ================================================================== */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  try{ localStorage.setItem(CFG.keys.theme,theme); }catch(e){}
  D.themeIcon.textContent = theme==='dark' ? '☀️' : '🌙';
  D.themeLabel.textContent = theme==='dark' ? '亮色' : '暗色';
}
(function initTheme(){
  var saved=null;
  try{ saved=localStorage.getItem(CFG.keys.theme); }catch(e){}
  var prefersDark = typeof window.matchMedia==='function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark?'dark':'light'));
})();

function verifyPassword(){
  if(D.passwordInput.value.trim()===CFG.password){
    try{ localStorage.setItem(CFG.keys.verified,'true'); }catch(e){}
    D.gate.hidden=true;
    App.init();
  } else {
    D.passwordError.textContent='密码错误，请重试';
    D.passwordInput.value='';
    D.passwordInput.focus();
  }
}
function checkPassword(){
  var ok=false;
  try{ ok=localStorage.getItem(CFG.keys.verified)==='true'; }catch(e){}
  D.gate.hidden=ok;
  return ok;
}

var App = {
  init:function(){
    Renderer.loading();
    Store.load();
    Source.fromJson().then(function(json){
      var files=(json && json.length) ? json : Source.manual();
      if(files.length){ S.allFiles=files; Store.merge(files); }
      else { S.allFiles=[]; S.fileOrder=[]; S.hidden={}; S.customGroups={}; }
      Renderer.mode();
      D.groupNav.hidden=false;
      Renderer.render();
    }).catch(function(err){ Renderer.error(err && err.message ? err.message : '未知错误'); });
  }
};

/* ---------- 事件绑定（尽量用委托，重渲染后无需重复绑定） ---------- */
function closeDrawer(){ D.sidebar.classList.remove('open'); D.drawerMask.hidden=true; }
D.passwordConfirm.addEventListener('click',verifyPassword);
D.passwordInput.addEventListener('keydown',function(e){ if(e.key==='Enter') verifyPassword(); });
D.passwordInput.addEventListener('input',function(){ D.passwordError.textContent=''; });

D.themeToggle.addEventListener('click',function(){
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});

D.viewToggle.addEventListener('click',function(e){
  var b=e.target.closest('button[data-view]'); if(!b || b.disabled) return;
  S.view=b.dataset.view;
  try{ localStorage.setItem(CFG.keys.view,S.view); }catch(err){}
  Renderer.mode(); Renderer.files();
});

D.groupNav.addEventListener('click',function(e){
  var b=e.target.closest('.gnav-item'); if(!b) return;
  S.group=b.dataset.group;
  Renderer.render();
  closeDrawer();
});

D.searchInput.addEventListener('input',U.debounce(function(){
  S.query=D.searchInput.value.trim().toLowerCase();
  Renderer.render();
},120));

D.statusMessage.addEventListener('click',function(e){
  if(e.target.closest && e.target.closest('#emptyPickBtn')) Settings.open();
});

D.fileGroups.addEventListener('pointerdown',Drag.onPointerDown);

D.openSettingsBtn.addEventListener('click',function(){ closeDrawer(); Settings.open(); });
D.settingsClose.addEventListener('click',Settings.close);
D.settingsOverlay.addEventListener('click',function(e){ if(e.target===D.settingsOverlay) Settings.close(); });
D.selectLocalFolderBtn.addEventListener('click',Source.pickFolder);
D.folderFallbackInput.addEventListener('change',Source.onFallbackChange);
D.enableSortCheckbox.addEventListener('change',function(){
  S.sortEnabled=D.enableSortCheckbox.checked;
  try{ localStorage.setItem(CFG.keys.sort,String(S.sortEnabled)); }catch(e){}
  Renderer.mode(); Renderer.files();
});
D.selectAllBtn.addEventListener('click',function(){ Settings.setAll(true); });
D.selectNoneBtn.addEventListener('click',function(){ Settings.setAll(false); });
D.exportAllHtmlBtn.addEventListener('click',Transfer.exportAll);
D.exportConfigBtn.addEventListener('click',Transfer.exportConfig);
D.importConfigBtn.addEventListener('click',function(){ D.importFileInput.click(); });
D.importFileInput.addEventListener('change',function(e){
  if(e.target.files && e.target.files[0]) Transfer.importConfig(e.target.files[0]);
  e.target.value='';
});
D.saveSettingsBtn.addEventListener('click',function(){ Settings.close(); Renderer.render(); });

/* 排序方式：默认名称；切到「自定义」时以当前顺序为起点，避免顺序跳变 */
D.orderModeSelect.addEventListener('change',function(){
  var m=D.orderModeSelect.value==='custom' ? 'custom' : 'name';
  if(m==='custom' && S.orderMode==='name') S.fileOrder=Store.orderedAll().map(function(f){ return f.path; });
  S.orderMode=m; S.modeExplicit=true;
  Store.save(); Renderer.mode(); Renderer.render();
});

/* 手机端侧栏抽屉 */
D.menuBtn.addEventListener('click',function(){
  var open=!D.sidebar.classList.contains('open');
  D.sidebar.classList.toggle('open',open);
  D.drawerMask.hidden=!open;
});
D.drawerMask.addEventListener('click',closeDrawer);

document.addEventListener('keydown',function(e){
  if(e.key==='/' && document.activeElement!==D.searchInput && D.gate.hidden){
    e.preventDefault(); D.searchInput.focus(); return;
  }
  if(e.key==='Escape'){
    if(!D.settingsOverlay.hidden){ Settings.close(); return; }
    if(!D.drawerMask.hidden){ closeDrawer(); return; }
    if(document.activeElement===D.searchInput || D.searchInput.value){
      D.searchInput.value=''; S.query=''; Renderer.render(); D.searchInput.blur();
    }
  }
});

if(checkPassword()) App.init();
})();
</script>
