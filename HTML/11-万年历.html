<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>万年历</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --line:#e5e8ec; --line2:#eff1f4;
  --text:#1f2329; --t2:#5c646f; --t3:#9aa2ad;
  --accent:#4a6cf7; --accent-w:#edf1ff;
  --red:#d0453b; --red-w:#fdeceb;
  --green:#3f8f5f; --amber:#c98a12;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --r:12px; --sbw:336px;
}
html[data-theme="dark"]{
  --bg:#15171a; --card:#1d2024; --line:#2b2f35; --line2:#232730;
  --text:#e7e9ec; --t2:#a8b0bb; --t3:#78818e;
  --accent:#6d8bff; --accent-w:#242a3d;
  --red:#e0685e; --red-w:#33221f;
  --green:#5aa877; --amber:#d9a334;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 12px;height:48px;
}
.brand{font-size:14px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.brand span{color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:7px;font-size:12px;color:var(--t2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.spacer{flex:1}
.iconbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:14px}
.iconbtn:hover{background:var(--bg);color:var(--text)}
.iconbtn.act{color:var(--accent)}

/* ---------- 导航条 ---------- */
.navbar{
  position:sticky;top:48px;z-index:55;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:6px 12px;
}
.navbar .cur{font-size:15px;font-weight:600;min-width:130px;text-align:center;white-space:nowrap}
.navbar .cur small{font-weight:400;color:var(--t3);font-size:11px;margin-left:6px}
.btn{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--t2);font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{opacity:.9;color:#fff}
.btn.sm{padding:2px 8px;font-size:11px}
.btn.dg{color:var(--red);border-color:var(--red)}

/* ---------- 布局 ---------- */
.wrap{display:flex;align-items:flex-start;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
.col-main{flex:1;min-width:0}
.col-side{width:var(--sbw);flex:none;position:sticky;top:104px;max-height:calc(100vh - 116px);overflow:auto}
@media(max-width:960px){
  .col-side{width:100%;position:static;max-height:none;overflow:visible}
  .wrap{flex-direction:column;padding:10px 10px 86px;align-items:stretch}
}
@media(min-width:961px){.wrap{padding-bottom:86px}}

/* ---------- 倒计时条 ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cdchip{
  flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 11px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--shadow);cursor:pointer
}
.cdchip b{font-size:18px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.15}
.cdchip b em{font-style:normal;font-size:11px;font-weight:600;margin-left:1px}
.cdchip i{font-style:normal;font-size:11px;color:var(--t3)}
.cdchip .t{font-size:12px;color:var(--t2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdchip.past b{color:var(--t3)}

/* ---------- 月视图 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2);background:var(--card)}
.wk div{padding:6px 0;text-align:center;font-size:11px;color:var(--t3)}
.wk div.we{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{
  position:relative;min-height:92px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:4px 5px 3px;cursor:pointer;display:flex;flex-direction:column;gap:1px;overflow:hidden;
}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:var(--bg)}
.cell.other{background:transparent;opacity:.42}
.cell.other .dsub{visibility:hidden}
.cell.sel{background:var(--accent-w)}
.dnum{display:flex;align-items:center;gap:3px;line-height:1.1}
.dn{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;min-width:19px}
.badge{font-size:9px;line-height:12px;height:12px;padding:0 2px;border-radius:3px;font-weight:600;transform:scale(.92);transform-origin:left center}
.badge.x{background:var(--red);color:#fff}
.badge.b{background:var(--line);color:var(--t2)}
.cell.rest .dn{color:var(--red)}
.cell.today .dn{background:var(--accent);color:#fff;border-radius:6px;padding:0 4px;margin:-1px -3px;font-weight:600}
.dsub{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.dsub.fes{color:var(--red)}
.dsub.term{color:var(--green)}
.dsub.lm1{color:var(--t2)}
.ev{font-size:10px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px;background:var(--accent-w);color:var(--accent)}
.ev.done{background:var(--line2);color:var(--t3);text-decoration:line-through}
.dots{display:none;gap:2px;position:absolute;right:4px;bottom:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block}
@media(max-width:640px){
  .cell{min-height:62px;padding:4px 3px 3px}
  .dn{font-size:13px}
  .dsub{font-size:9px}
  .ev{display:none}
  .dots{display:flex}
}

.todaybar{
  margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;
  gap:4px 10px;font-size:12px;color:var(--t2);line-height:1.6}
.todaybar b{font-size:13px;color:var(--text);font-weight:600}
.todaybar .t3{color:var(--t3)}
.todaybar .red{color:var(--red)}
.todaybar .green{color:var(--green)}

/* ---------- 年视图 ---------- */
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media(max-width:1100px){.ygrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:960px){.ygrid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(max-width:400px){.ygrid{grid-template-columns:repeat(2,1fr);gap:6px}}
.ym{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;box-shadow:var(--shadow);min-width:0;width:100%}
.ym:hover{border-color:var(--accent)}
.ym h4{margin:0 0 5px;font-size:12px;font-weight:600;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.ym h4 em{font-style:normal;font-size:10px;color:var(--t3)}
.ywk,.ycells{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.ywk div{text-align:center;font-size:9px;color:var(--t3);padding-bottom:2px}
.ywk div.we{color:var(--red)}
.yd{position:relative;height:23px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text);font-variant-numeric:tabular-nums;border-radius:4px;min-width:0;padding:0}
@media(max-width:960px){.yd{height:20px;font-size:9px}}
.yd.blank{visibility:hidden}
.yd.rest{color:var(--red)}
.yd.work{color:var(--t2)}
.yd.fes{background:var(--red-w);color:var(--red);font-weight:600}
.yd.term{background:var(--accent-w);color:var(--accent)}
.yd.today{background:var(--accent);color:#fff;font-weight:600}
.yd.has::after{content:'';position:absolute;right:1px;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--accent)}
.yd.today.has::after{background:#fff}

/* ---------- 日视图 ---------- */
.daywrap{display:grid;grid-template-columns:250px 1fr;gap:12px}
.daywrap>div{min-width:0;width:100%}
@media(max-width:960px){.daywrap{grid-template-columns:1fr}}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;min-width:0}
.daycard .big{font-size:52px;line-height:1;font-weight:200;font-variant-numeric:tabular-nums}
.daycard .ym2{font-size:12px;color:var(--t2);margin-top:2px}
.daycard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--t2);white-space:nowrap}
.tag.r{background:var(--red-w);border-color:transparent;color:var(--red)}
.tag.g{background:var(--accent-w);border-color:transparent;color:var(--accent)}
.daycard hr{border:none;border-top:1px solid var(--line2);margin:11px 0}
.kv{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);padding:2px 0}
.kv b{font-weight:500;color:var(--t2)}

.tl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tl .head{padding:8px 12px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.tl .allday{padding:8px 12px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.tl .hours{max-height:60vh;overflow:auto}
.hrow{display:flex;border-bottom:1px solid var(--line2);min-height:34px}
.hrow .hh{width:44px;flex:none;font-size:10px;color:var(--t3);padding:4px 0 0 8px;font-variant-numeric:tabular-nums}
.hrow .hb{flex:1;border-left:1px solid var(--line2);padding:2px 4px;display:flex;flex-direction:column;gap:2px}
.sitem{
  display:flex;align-items:center;gap:6px;font-size:11px;background:var(--accent-w);color:var(--accent);
  border-radius:5px;padding:2px 6px;overflow:hidden;cursor:pointer
}
.sitem time{font-variant-numeric:tabular-nums;opacity:.8;flex:none}
.sitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem.done{opacity:1}
.sitem.done span{text-decoration:line-through;color:var(--t3)}
.sitem.done time{color:var(--t3)}
.sitem .x{margin-left:auto;opacity:.5;flex:none}
.empty{padding:22px 12px;text-align:center;color:var(--t3);font-size:12px}

/* ---------- 侧栏 ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.sec>h3{
  margin:0;padding:9px 12px;font-size:12px;font-weight:600;color:var(--t2);
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none
}
.sec>h3 .n{margin-left:auto;font-weight:400;color:var(--t3);font-size:11px}
.sec>h3 .caret{font-size:9px;color:var(--t3);transition:transform .15s}
.sec.fold>h3 .caret{transform:rotate(-90deg)}
.sec.fold .body{display:none}
.sec .body{padding:0 8px 8px}
.item{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation
}
.item:hover{background:var(--bg)}
.item .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}
.item .main{flex:1;min-width:0}
.item .t1{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{text-align:right;flex:none}
.item .rt b{font-size:19px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.item .rt b em{font-style:normal;font-size:11px;font-weight:600;margin-left:1px}
.item .rt i{font-style:normal;font-size:9px;color:var(--t3)}
.item.past .rt b{color:var(--t3)}
.grp{font-size:10px;color:var(--t3);padding:6px 8px 2px;display:flex;justify-content:space-between}
.grp em{font-style:normal}

.hdlist{max-height:44vh;overflow:auto;margin:2px 0 8px}
.hdrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.hdrow input[type=date]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);outline:none}
.hdrow select{flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);outline:none}
.hdrow .iconbtn{width:28px;height:28px;flex:none;color:var(--t3)}
.hdrow .iconbtn:hover{background:var(--red-w);color:var(--red)}

/* ---------- 悬浮按钮 ---------- */
.fab{
  position:fixed;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;
  box-shadow:0 4px 14px rgba(74,108,247,.35);z-index:80;right:18px;bottom:22px;
  transition:box-shadow .15s,transform .15s;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none
}
.fab:active{transform:scale(.92)}
.fab.drag{box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:.9}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(16,20,28,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:400px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal header{padding:13px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header .x{margin-left:auto;color:var(--t3);font-size:16px}
.modal .bd{padding:12px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label{font-size:11px;color:var(--t3)}
.fld input,.fld select,.fld textarea{
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);outline:none;width:100%
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld textarea{resize:vertical;min-height:64px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.fld input[type=color]{padding:2px;height:32px}
.fld .inline{display:flex;gap:8px}
.fld .inline>*{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.chk input{width:15px;height:15px;accent-color:var(--accent)}
.hint{font-size:10px;color:var(--t3);line-height:1.5}
.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;white-space:pre-wrap;color:var(--t2);max-height:150px;overflow:auto}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}
.setrow>span{font-size:12px;color:var(--t2)}

.ctx{position:fixed;z-index:110;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;min-width:120px}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:12px;color:var(--text)}
.ctx button:hover{background:var(--bg)}
.ctx button.dg{color:var(--red)}
.toast{
  position:fixed;left:50%;bottom:82px;transform:translate(-50%,10px);background:rgba(28,32,40,.92);color:#fff;
  padding:7px 14px;border-radius:20px;font-size:12px;z-index:200;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">万年历</div>
  <div class="seg" id="segView">
    <button data-v="year">年</button>
    <button data-v="month" class="on">月</button>
    <button data-v="day">日</button>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnSync" title="云同步">⇅</button>
  <button class="iconbtn" id="btnSet" title="设置">⚙</button>
</header>

<div class="navbar">
  <button class="btn sm" id="btnPrev">‹</button>
  <button class="btn sm" id="btnNext">›</button>
  <div class="cur" id="curLabel"></div>
  <div class="spacer"></div>
  <button class="btn sm" id="btnToday">今天</button>
</div>

<div class="wrap">
  <div class="col-main">
    <div class="strip" id="strip"></div>
    <div id="viewYear" class="hidden"><div class="ygrid" id="ygrid"></div></div>
    <div id="viewMonth"><div class="panel"><div class="wk" id="mwk"></div><div class="grid" id="mgrid"></div></div><div class="todaybar" id="todaybar"></div></div>
    <div id="viewDay" class="hidden"><div class="daywrap"><div id="daycard"></div><div id="daytl"></div></div></div>
  </div>
  <aside class="col-side" id="side"></aside>
</div>

<button class="fab" id="fab">+</button>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>

<script>
/* =========================================================
   万年历 · 农历节气 · 倒计时 / 纪念日 / 日程

   ========================================================= */
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return n<10?'0'+n:''+n};
var dkey=function(y,m,d){return y+'-'+pad(m)+'-'+pad(d)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var WD=['日','一','二','三','四','五','六'];

/* ---------- 内置法定节假日放假安排（1=休 0=班/调休） ---------- */
var SCHEDULE={
'2024':{'01-01':1,'02-04':0,'02-10':1,'02-11':1,'02-12':1,'02-13':1,'02-14':1,'02-15':1,'02-16':1,'02-17':1,'02-18':0,'04-04':1,'04-05':1,'04-06':1,'04-07':0,'04-28':0,'05-01':1,'05-02':1,'05-03':1,'05-04':1,'05-05':1,'05-11':0,'06-08':1,'06-09':1,'06-10':1,'09-14':0,'09-15':1,'09-16':1,'09-17':1,'09-29':0,'10-01':1,'10-02':1,'10-03':1,'10-04':1,'10-05':1,'10-06':1,'10-07':1,'10-12':0},
'2025':{'01-01':1,'01-26':0,'01-28':1,'01-29':1,'01-30':1,'01-31':1,'02-01':1,'02-02':1,'02-03':1,'02-04':1,'02-08':0,'04-04':1,'04-05':1,'04-06':1,'04-27':0,'05-01':1,'05-02':1,'05-03':1,'05-04':1,'05-05':1,'05-31':1,'06-01':1,'06-02':1,'09-28':0,'10-01':1,'10-02':1,'10-03':1,'10-04':1,'10-05':1,'10-06':1,'10-07':1,'10-08':1,'10-11':0},
'2026':{'01-01':1,'01-02':1,'01-03':1,'01-04':0,'02-14':0,'02-15':1,'02-16':1,'02-17':1,'02-18':1,'02-19':1,'02-20':1,'02-21':1,'02-22':1,'02-23':1,'02-28':0,'04-04':1,'04-05':1,'04-06':1,'05-01':1,'05-02':1,'05-03':1,'05-04':1,'05-05':1,'05-09':0,'06-19':1,'06-20':1,'06-21':1,'09-20':0,'09-25':1,'09-26':1,'09-27':1,'10-01':1,'10-02':1,'10-03':1,'10-04':1,'10-05':1,'10-06':1,'10-07':1,'10-10':0}
};

/* ---------- 数据层 ---------- */
var LS='lunarcal_v1';
var DEF={updatedAt:'',countdowns:[],anniversaries:[],events:[],holidays:{},
  settings:{theme:'light',accent:'#4a6cf7',firstDay:1,fab:null,cnOnly:true},
  sync:{url:'',key:'',table:'calendar_sync',room:'my-calendar',auto:false,lastSync:''}};
var DB;
function load(){
  try{
    var raw=localStorage.getItem(LS);
    if(raw){var o=JSON.parse(raw);
      DB={updatedAt:o.updatedAt||'',countdowns:o.countdowns||[],anniversaries:o.anniversaries||[],events:o.events||[],
          holidays:o.holidays||{},
          settings:Object.assign({},DEF.settings,o.settings||{}),
          sync:Object.assign({},DEF.sync,o.sync||{})};
      if(!o.settings||!o.settings.fd1){DB.settings.firstDay=1;DB.settings.fd1=true}
      return;}
  }catch(e){}
  DB=JSON.parse(JSON.stringify(DEF));
}
function cleanDemo(){
  var ch=false;
  ['countdowns','anniversaries','events'].forEach(function(k){
    var n=DB[k].length;
    DB[k]=DB[k].filter(function(x){return String(x&&x.title||'').indexOf('示例：')!==0});
    if(DB[k].length!==n)ch=true;
  });
  return ch;
}
function save(push){
  DB.updatedAt=new Date().toISOString();
  try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('本地存储写入失败')}
  if(push&&DB.sync.url&&DB.sync.key&&DB.sync.auto) schedPush();
}
load();

/* ---------- 农历缓存 ---------- */
var _lc={};
function info(y,m,d){var k=dkey(y,m,d);return _lc[k]||(_lc[k]=calendar.getDateBySolar(y,m,d))}
function hstate(y,m,d){
  var ov=DB.holidays[String(y)];
  if(ov){
    var ovv=ov[pad(m)+'-'+pad(d)];
    if(ovv!==undefined) return ovv===-1?null:ovv;
  }
  var s=SCHEDULE[String(y)]; if(!s) return null;
  var v=s[pad(m)+'-'+pad(d)]; return v===undefined?null:v;
}
function isRest(y,m,d){
  var h=hstate(y,m,d); if(h===1)return true; if(h===0)return false;
  var w=new Date(y,m-1,d).getDay(); return w===0||w===6;
}
/* 仅保留中国传统节日（含农历节日与中国法定假日），其余一律不显示 */
var CN_FEST=['元旦','除夕','春节','元宵节','龙头节','上巳节','端午节','七夕节','中元节','中秋节','重阳节',
  '下元节','腊八节','北小年','南小年','寒衣节','劳动节','国庆节'];
var FEST_ALIAS={'北小年':'小年','南小年':'小年'};
function festOf(i){
  var arr=String(i.festival||'').split(/\s+/).filter(Boolean);
  if(DB.settings.cnOnly!==false) arr=arr.filter(function(n){return CN_FEST.indexOf(n)>=0});
  var n=arr[0]||'';
  return FEST_ALIAS[n]||n;
}
function subText(y,m,d){
  var i=info(y,m,d); if(!i) return {t:'',c:''};
  var f=festOf(i);
  if(f) return {t:f,c:'fes'};
  if(i.term) return {t:i.term,c:'term'};
  if(i.lDay===1) return {t:i.lMonthZH,c:'lm1'};
  return {t:i.lDayZH,c:''};
}

/* ---------- 视图状态 ---------- */
var now=new Date();
var ST={view:'month',y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};
var tdy={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};

/* ---------- 日程展开 ---------- */
function evMap(y,m){
  var dim=new Date(y,m,0).getDate(),map={};
  function add(d,ev){(map[dkey(y,m,d)]=map[dkey(y,m,d)]||[]).push(ev)}
  DB.events.forEach(function(ev){
    var p=ev.date.split('-'),ey=+p[0],em=+p[1],ed=+p[2];
    var e0=new Date(ey,em-1,ed).getTime();
    if(ev.repeat==='none'){ if(ey===y&&em===m) add(ed,ev); return; }
    if(e0>new Date(y,m-1,dim,23,59,59).getTime()) return;
    var dd,t;
    if(ev.repeat==='day'){ for(dd=1;dd<=dim;dd++){ t=new Date(y,m-1,dd).getTime(); if(t>=e0) add(dd,ev);} }
    else if(ev.repeat==='week'){ var wd=new Date(e0).getDay(); for(dd=1;dd<=dim;dd++){ t=new Date(y,m-1,dd).getTime(); if(t>=e0&&new Date(t).getDay()===wd) add(dd,ev);} }
    else if(ev.repeat==='month'){ if(ed<=dim){ t=new Date(y,m-1,ed).getTime(); if(t>=e0) add(ed,ev);} }
    else if(ev.repeat==='year'){ if(m===em&&ed<=dim){ t=new Date(y,m-1,ed).getTime(); if(t>=e0) add(ed,ev);} }
  });
  return map;
}
function annMap(y,m){
  var dim=new Date(y,m,0).getDate(),map={};
  DB.anniversaries.forEach(function(a){
    if(a.lunar){ return; }
    var p=a.date.split('-'); if(+p[1]===m&&+p[2]<=dim){(map[dkey(y,m,+p[2])]=map[dkey(y,m,+p[2])]||[]).push(a)}
  });
  return map;
}

/* ---------- 倒计时 ---------- */
function cdDiff(c){
  var t=new Date(c.date+'T'+(c.time||'00:00')).getTime();
  var diff=t-Date.now(),past=diff<0; diff=Math.abs(diff);
  var days=Math.floor(diff/86400000);
  var h=Math.floor(diff%86400000/3600000),mi=Math.floor(diff%3600000/60000);
  return {past:past,days:days,h:h,mi:mi,ms:t};
}
function sortedCd(){
  return DB.countdowns.slice().sort(function(a,b){
    if(!!b.top!==!!a.top) return b.top?1:-1;
    return cdDiff(a).ms-cdDiff(b).ms;
  });
}
/* ---------- 纪念日 ---------- */
function sod(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()}
function annNext(a){
  var sy=now0().getFullYear(),p=a.date.split('-');
  if(!a.lunar){
    for(var y=sy-1;y<=sy+1;y++){
      var t=new Date(y,+p[1]-1,+p[2]);
      if(t.getTime()>=sod()) return {t:t,nth:y-(+p[0]),date:dkey(t.getFullYear(),t.getMonth()+1,t.getDate())};
    }
  }else{
    var li=info(+p[0],+p[1],+p[2]);
    if(!li) return null;
    for(var ly=sy-1;ly<=sy+1;ly++){
      var r=calendar.getDateByLunar(ly,li.lMonth,li.lDay,li.isLeap);
      if(r){var t2=new Date(r.sYear,r.sMonth-1,r.sDay);
        if(t2.getTime()>=sod()) return {t:t2,nth:ly-li.lYear,date:dkey(r.sYear,r.sMonth,r.sDay)};}
    }
  }
  return null;
}
function now0(){return new Date()}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  applyTheme();
  $('#curLabel').innerHTML=curLabel();
  $('#viewYear').classList.toggle('hidden',ST.view!=='year');
  $('#viewMonth').classList.toggle('hidden',ST.view!=='month');
  $('#viewDay').classList.toggle('hidden',ST.view!=='day');
  renderStrip();
  if(ST.view==='year') renderYear();
  if(ST.view==='month') renderMonth();
  if(ST.view==='day') renderDay();
  renderSide();
}
function curLabel(){
  if(ST.view==='year') return ST.y+'年';
  if(ST.view==='day'){
    var i=info(ST.y,ST.m,ST.d);
    return ST.y+'年'+ST.m+'月'+ST.d+'日 <small>星期'+WD[new Date(ST.y,ST.m-1,ST.d).getDay()]+(i&&i.lMonthZH?' · 农历'+i.lMonthZH+i.lDayZH:'')+'</small>';
  }
  return ST.y+'年'+ST.m+'月 <small>'+ganzhiYear()+'</small>';
}
function ganzhiYear(){var i=info(ST.y,ST.m,ST.d);return i?i.gzYearZH+'年 · '+i.animal+'年':''}

function renderStrip(){
  var list=sortedCd().filter(function(c){return c.top}).slice(0,6);
  $('#strip').innerHTML=list.map(function(c){
    var v=cdDiff(c);
    return '<div class="cdchip'+(v.past?' past':'')+'" data-cdid="'+c.id+'">'
      +'<b>'+(v.past?'-':'')+v.days+'<em>天</em></b><span class="t">'+esc(c.title)+'</span></div>';
  }).join('');
  $$('#strip .cdchip').forEach(function(el){
    tap(el,function(){openCountdown(el.dataset.cdid)});
    bindLong(el,function(){menu(el,cdMenus(el.dataset.cdid))});
  });
  var sb=document.querySelector('.col-side');
  if(sb) sb.style.paddingTop=innerWidth>960?$('#strip').offsetHeight+'px':'';
}
window.addEventListener('resize',function(){renderStrip()});

/* ---------- 月视图 ---------- */
function renderMonth(){
  var fd=DB.settings.firstDay; // 0=周日 1=周一
  var wk='';
  for(var i=0;i<7;i++){var w=(i+fd)%7; wk+='<div class="'+(w===0||w===6?'we':'')+'">'+WD[w]+'</div>'}
  $('#mwk').innerHTML=wk;
  var first=new Date(ST.y,ST.m-1,1);
  var start=(first.getDay()-fd+7)%7;
  var dim=new Date(ST.y,ST.m,0).getDate();
  var prevDim=new Date(ST.y,ST.m-1,0).getDate();
  var em=evMap(ST.y,ST.m), am=annMap(ST.y,ST.m);
  var cells=[];
  for(var k=0;k<start;k++) cells.push({y:ST.m===1?ST.y-1:ST.y,m:ST.m===1?12:ST.m-1,d:prevDim-start+1+k,other:1});
  for(var d=1;d<=dim;d++) cells.push({y:ST.y,m:ST.m,d:d});
  var tail=(7-cells.length%7)%7;
  for(var t=0;t<tail;t++) cells.push({y:ST.m===12?ST.y+1:ST.y,m:ST.m===12?1:ST.m+1,d:t+1,other:1});
  var mine=new Date(ST.y,ST.m-1,ST.d).getTime();
  $('#mgrid').innerHTML=cells.map(function(c){
    var cls=['cell'];
    if(c.other) cls.push('other');
    if(isRest(c.y,c.m,c.d)) cls.push('rest');
    if(c.y===tdy.y&&c.m===tdy.m&&c.d===tdy.d) cls.push('today');
    if(!c.other&&c.d===ST.d) cls.push('sel');
    var h=hstate(c.y,c.m,c.d);
    var badge=h===1?'<span class="badge x">休</span>':(h===0?'<span class="badge b">班</span>':'');
    var s=subText(c.y,c.m,c.d);
    var key=dkey(c.y,c.m,c.d);
    var evs=(em[key]||[]).concat((am[key]||[]).map(function(a){return {title:'纪念日 · '+a.title,_ann:a}}));
    var dots=evs.length?'<div class="dots">'+evs.slice(0,3).map(function(){return '<i></i>'}).join('')+'</div>':'';
    var chips=evs.slice(0,2).map(function(e){
      return '<div class="ev'+(!e._ann&&evDone(e,key)?' done':'')+'">'+esc(e.title)+'</div>'}).join('');
    return '<div class="'+cls.join(' ')+'" data-d="'+key+'">'
      +'<div class="dnum"><span class="dn">'+c.d+'</span>'+badge+'</div>'
      +'<div class="dsub '+s.c+'">'+esc(s.t)+'</div>'+chips+dots+'</div>';
  }).join('');
  (function(){
    var ti=info(tdy.y,tdy.m,tdy.d);
    var fe=festOf(ti);
    var bar='<b>今天 '+tdy.m+'月'+tdy.d+'日</b><span>星期'+WD[new Date(tdy.y,tdy.m-1,tdy.d).getDay()]+'</span>'
      +'<span class="t3">｜</span><span>农历'+(ti.isLeap?'闰':'')+ti.lMonthZH+ti.lDayZH+'</span>'
      +'<span>'+ti.gzYearZH+'年 · '+ti.animal+'</span>'
      +(ti.term?'<span class="green">'+ti.term+'</span>':'')
      +(fe?'<span class="red">'+esc(fe)+'</span>':'')
    var el=$('#todaybar');
    el.innerHTML=bar;
    el.onclick=function(){ST.y=tdy.y;ST.m=tdy.m;ST.d=tdy.d;setView('day')};
  })();
  $$('#mgrid .cell').forEach(function(el){
    tap(el,function(){var p=el.dataset.d.split('-');ST.y=+p[0];ST.m=+p[1];ST.d=+p[2];ST.view='day';render()});
    bindLong(el,function(){
      var p=el.dataset.d.split('-');
      menu(el,[{label:'新增日程',fn:function(){openEvent(null,dkey(+p[0],+p[1],+p[2]))}},

      +'<div class="t2">'+esc(a.date)+(n?' → '+n.date:'')+' · 已 '+since+' 天</div></div>'
      +'<div class="rt"><b>'+(days===0?'今天':days+'<em>天</em>')+'</b><i>第 '+Math.max(0,n?n.nth:0)+' 年</i></div></div>';
  }).join('')||empty('还没有纪念日'));

function secRender(k,title,n,body){
  return '<div class="sec'+(FOLD[k]?' fold':'')+'"><h3 data-k="'+k+'"><span class="caret">▼</span>'+title
    +'<span class="n">'+n+'</span></h3><div class="body">'+body+'</div></div>';
}
function empty(t){return '<div class="empty">'+t+'</div>'}
function weekOf(s){var p=s.split('-');return '星期'+WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
function upcoming(){
  var base=sod(),out={},list=[];
  DB.events.forEach(function(ev){
    occIn(ev,0,30).forEach(function(o){list.push({d:o,ev:ev})});
  });
  if(!list.length) return '';
  list.sort(function(a,b){return a.d===b.d?(a.ev.time||'99')<(b.ev.time||'99')?-1:1:(a.d<b.d?-1:1)});
  var cur='';
  list.slice(0,40).forEach(function(x){
    if(x.d!==cur){cur=x.d;out[cur]=''}
    var p=x.d.split('-');
    var days=Math.round((new Date(+p[0],+p[1]-1,+p[2]).getTime()-base)/86400000);
    out[cur]+='<div class="item'+(evDone(x.ev,x.d)?' past':'')+'" data-eid="'+x.ev.id+'" data-d="'+x.d+'">'
      +'<div class="bar" style="background:'+(x.ev.color||'var(--accent)')+'"></div>'
      +'<div class="main"><div class="t1">'+esc(x.ev.title)+'</div>'
      +'<div class="t2">'+x.d+' '+weekOf(x.d)+(x.ev.time?' '+x.ev.time:'')+(x.ev.repeat!=='none'?' · '+RT[x.ev.repeat]:'')+'</div></div>'
      +'<div class="rt"><b>'+(days===0?'今天':days+'<em>天</em>')+'</b></div></div>';
  });
  return Object.keys(out).map(function(k){
    var p=k.split('-'),days=Math.round((new Date(+p[0],+p[1]-1,+p[2]).getTime()-base)/86400000);
    var lab=days===0?'今天':(days===1?'明天':(k+' '+weekOf(k)));
    return '<div class="grp"><span>'+lab+'</span><em>'+(k===dkey(tdy.y,tdy.m,tdy.d)?'':days+'天后')+'</em></div>'+out[k];
  }).join('');
}
var RT={none:'',day:'每天',week:'每周',month:'每月',year:'每年'};
function occIn(ev,a,b){
  var res=[],p=ev.date.split('-'),ey=+p[0],em=+p[1],ed=+p[2];
  var e0=new Date(ey,em-1,ed).getTime();
  for(var i=a;i<=b;i++){
    var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);
    if(t.getTime()<e0){ if(ev.repeat==='none') continue; }
    var y=t.getFullYear(),m=t.getMonth()+1,d=t.getDate(),ok=false;
    if(ev.repeat==='none') ok=(y===ey&&m===em&&d===ed);
    else if(ev.repeat==='day') ok=t.getTime()>=e0;
    else if(ev.repeat==='week') ok=t.getTime()>=e0&&t.getDay()===new Date(e0).getDay();
    else if(ev.repeat==='month') ok=t.getTime()>=e0&&d===ed;
    else if(ev.repeat==='year') ok=t.getTime()>=e0&&m===em&&d===ed;
    if(ok) res.push(dkey(y,m,d));
  }
  return res;
}

/* =========================================================
   表单 / 弹层

function modal(title,body,footer,opt){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="modal"><header>'+esc(title)+'<button class="x">✕</button></header>'
    +'<div class="bd">'+body+'</div><div class="ft" style="padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end">'
    +(footer||'')+'</div></div>';
  $('#layer').appendChild(m);
  m.querySelector('.x').onclick=function(){m.remove()};
  if(!opt||opt.mask!==false) m.onclick=function(e){if(e.target===m)m.remove()};
  return m;
}
function closeModal(m){if(m&&m.parentNode)m.remove()}
function formModal(title,fields,values,onOk,extraBtn){
  var body=fields.map(function(f){
    var v=values[f.k]!==undefined?values[f.k]:(f.def!==undefined?f.def:'');
    var inp;
    if(f.type==='select'){inp='<select data-k="'+f.k+'">'+f.options.map(function(o){
      return '<option value="'+o.v+'"'+(String(v)===String(o.v)?' selected':'')+'>'+esc(o.t)+'</option>'}).join('')+'</select>';}
    else if(f.type==='textarea'){inp='<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';}
    else if(f.type==='color'){inp='<input type="color" data-k="'+f.k+'" value="'+esc(v||'#4a6cf7')+'">';}
    else if(f.type==='check'){return '<label class="chk"><input type="checkbox" data-k="'+f.k+'"'+(v?' checked':'')+'>'+esc(f.label||'')+'</label>';}
    else {inp='<input type="'+f.type+'" data-k="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';}
    return '<div class="fld"><label>'+esc(f.label||'')+'</label>'+inp+'</div>';
  }).join('');
  var m=modal(title,body,'<button class="btn" data-c>取消</button><button class="btn p" data-ok>保存</button>');
  m.querySelector('[data-c]').onclick=function(){m.remove()};
  if(extraBtn){var eb=document.createElement('button');eb.className='btn dg';eb.style.marginRight='auto';
    eb.textContent=extraBtn.t;eb.onclick=function(){extraBtn.fn(m)};
    m.querySelector('.ft').insertBefore(eb,m.querySelector('.ft').firstChild);}
  m.querySelector('[data-ok]').onclick=function(){
    var o={};$$('[data-k]',m).forEach(function(el){
      o[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;});
    if(onOk(o,m)!==false) m.remove();
  };
  return m;
}
function confirmBox(t,fn){
  var m=modal(t,'<div style="font-size:12px;color:var(--t2)">此操作不可撤销。</div>',
    '<button class="btn" data-c>取消</button><button class="btn p" data-ok style="background:var(--red);border-color:var(--red);color:#fff">删除</button>');
  m.querySelector('[data-c]').onclick=function(){m.remove()};
  m.querySelector('[data-ok]').onclick=function(){m.remove();fn()};
}

/* ---------- 倒计时 ---------- */
function openCountdown(id,date){

  formModal(id?'编辑倒计时':'新增倒计时',[
    {k:'title',label:'标题',type:'text',ph:'例如：国庆、发工资、项目上线'},
    {k:'date',label:'目标日期',type:'date'},
    {k:'time',label:'目标时刻',type:'time'},
    {k:'color',label:'标记颜色',type:'color'},
    {k:'top',label:'置顶显示（显示在顶部倒计时条）',type:'check'}
  ],c,function(o){
    if(!o.title.trim()){toast('请填写标题');return false}
    if(!o.date){toast('请选择日期');return false}
    o.title=o.title.trim();

    else{o.id=uid();DB.countdowns.push(o)}

  },id?{t:'删除',fn:function(m){closeModal(m);delItem('countdowns',id)}}:null);
}
/* ---------- 纪念日 ---------- */

/* ---------- 日程 ---------- */
function openEvent(id,date){
  var dt=date||dkey(ST.y,ST.m,ST.d),preTime='';
  if(dt.indexOf('|')>0){var q=dt.split('|');dt=q[0];preTime=q[1]}
  var e=id?DB.events.filter(function(x){return x.id===id})[0]:
    {date:dt,time:preTime,note:'',repeat:'none',color:'#4a6cf7',done:false};
  var rep=!!id&&e.repeat&&e.repeat!=='none';
  var doneNow=rep?evDone(e,dt):e.done;
  var vals=Object.assign({},e,{done:doneNow});
  formModal(id?'编辑日程':'新增日程',[
    {k:'title',label:'标题',type:'text',ph:'例如：部门周会'},
    {k:'date',label:'日期',type:'date'},
    {k:'time',label:'时间（留空为全天）',type:'time'},
    {k:'repeat',label:'重复',type:'select',options:[
      {v:'none',t:'不重复'},{v:'day',t:'每天'},{v:'week',t:'每周'},{v:'month',t:'每月'},{v:'year',t:'每年'}]},
    {k:'note',label:'备注',type:'textarea',ph:'可留空'},
    {k:'color',label:'标记颜色',type:'color'},
    {k:'done',label:rep?'已完成（仅当天）':'已完成',type:'check'}
  ],vals,function(o){
    if(!o.title.trim()){toast('请填写标题');return false}
    if(!o.date){toast('请选择日期');return false}
    o.title=o.title.trim();
    if(id){var tgt=DB.events.filter(function(x){return x.id===id})[0];
      if(rep){setEvDone(tgt,dt,!!o.done);delete o.done}
      Object.assign(tgt,o)}
    else{o.id=uid();DB.events.push(o)}
    save(true);render();toast('已保存');
  },id?{t:'删除',fn:function(m){closeModal(m);delItem('events',id)}}:null);
}
function delItem(kind,id){
  confirmBox('确定删除这一条？',function(){
    DB[kind]=DB[kind].filter(function(x){return x.id!==id});save(true);render();toast('已删除');
  });
}
function cdMenus(id){return [{label:'编辑',fn:function(){openCountdown(id)}},
  {label:'删除',dg:1,fn:function(){delItem('countdowns',id)}}]}
function anMenus(id){return [{label:'编辑',fn:function(){openAnniv(id)}},
  {label:'删除',dg:1,fn:function(){delItem('anniversaries',id)}}]}
function evMenus(id,date){
  var e=DB.events.filter(function(x){return x.id===id})[0]||{};
  var rep=e.repeat&&e.repeat!=='none'&&!!date;
  return [{label:(rep?evDone(e,date):e.done)?'标记未完成':'标记完成',fn:function(){
      if(rep) setEvDone(e,date,!evDone(e,date)); else e.done=!e.done;
      save(true);render();}},
    {label:'编辑',fn:function(){openEvent(id,date)}},
    {label:'删除',dg:1,fn:function(){delItem('events',id)}}];
}

function evDone(ev,key){return ev.repeat==='none'?!!ev.done:(ev.doneDates||[]).indexOf(key)>=0}
function setEvDone(ev,key,v){
  if(ev.repeat==='none'){ev.done=v;return}
  ev.doneDates=ev.doneDates||[];
  var i=ev.doneDates.indexOf(key);
  if(v&&i<0)ev.doneDates.push(key);
  if(!v&&i>=0)ev.doneDates.splice(i,1);
}

/* ---------- 右键/长按菜单 ---------- */
var ctxEl=null;
function menu(anchor,items){
  closeMenu();
  var r=anchor.getBoundingClientRect();
  var m=document.createElement('div');m.className='ctx';
  m.innerHTML=items.map(function(it,i){return '<button data-i="'+i+'" class="'+(it.dg?'dg':'')+'">'+esc(it.label)+'</button>'}).join('');
  $('#layer').appendChild(m);ctxEl=m;
  var w=m.offsetWidth,h=m.offsetHeight;
  var x=Math.min(r.left,innerWidth-w-8),y=Math.min(r.bottom+4,innerHeight-h-8);
  m.style.left=Math.max(6,x)+'px';m.style.top=Math.max(6,y)+'px';
  $$('button',m).forEach(function(b){b.onclick=function(){closeMenu();items[+b.dataset.i].fn()}});
  setTimeout(function(){document.addEventListener('click',onceClose)},0);
}
function onceClose(){closeMenu();document.removeEventListener('click',onceClose)}
function closeMenu(){if(ctxEl){ctxEl.remove();ctxEl=null}}
function bindLong(el,fn){
  var timer=null,moved=false,sx=0,sy=0;
  el.addEventListener('pointerdown',function(e){moved=false;el.__lp=false;sx=e.clientX;sy=e.clientY;
    timer=setTimeout(function(){if(!moved){el.__lp=true;fn(e)}},480);});
  el.addEventListener('pointermove',function(e){
    if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){moved=true;clearTimeout(timer)}});
  el.addEventListener('pointerup',function(){clearTimeout(timer)});
  el.addEventListener('pointercancel',function(){clearTimeout(timer)});
  el.addEventListener('pointerleave',function(){clearTimeout(timer)});
  el.addEventListener('contextmenu',function(e){e.preventDefault();fn(e)});
}

function tap(el,fn){el.addEventListener('click',function(e){if(el.__lp){el.__lp=false;return}fn(e)})}

/* ---------- Toast ---------- */
var tT=null;
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');
  clearTimeout(tT);tT=setTimeout(function(){el.classList.remove('on')},1800)}

/* ---------- 主题 ---------- */
function applyTheme(){
  var s=DB.settings;
  var th=s.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):s.theme;
  document.documentElement.setAttribute('data-theme',th);
  document.documentElement.style.setProperty('--accent',s.accent||'#4a6cf7');
  document.documentElement.style.setProperty('--accent-w',mix(th==='dark'?'#1d2024':'#ffffff',s.accent||'#4a6cf7',.88));
  var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',th==='dark'?'#15171a':'#f5f6f8');
}
function mix(a,b,r){
  var pa=hex(a),pb=hex(b);
  return 'rgb('+[0,1,2].map(function(i){return Math.round(pa[i]*r+pb[i]*(1-r))}).join(',')+')';
}
function hex(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x}).join('');
  return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}

/* ---------- 设置 ---------- */

  var s=DB.settings;
  var body=''
   +'<div class="setrow"><span>主题</span><select data-k="theme" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)">'

       return '<option value="'+p[0]+'"'+(s.theme===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></div>'
   +'<div class="setrow"><span>主题色</span><input type="color" data-k="accent" value="'+esc(s.accent||'#4a6cf7')+'" style="width:44px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none"></div>'
   +'<div class="setrow"><span>每周起始</span><select data-k="firstDay" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)">'
     +'<option value="0"'+(s.firstDay==0?' selected':'')+'>周日</option><option value="1"'+(s.firstDay==1?' selected':'')+'>周一</option></select></div>'
   +'<label class="chk"><input type="checkbox" data-k="cnOnly"'+(s.cnOnly!==false?' checked':'')+'>只显示中国传统节日与节气</label>'
   +'<hr style="border:none;border-top:1px solid var(--line2);margin:4px 0">'
   +'<div class="fld"><label>数据管理</label><div style="display:flex;gap:8px">'
     +'<button class="btn" data-exp style="flex:1">导出 JSON</button>'
     +'<button class="btn" data-imp style="flex:1">导入 JSON</button></div></div>'
   +'<div class="fld"><label>节假日安排（可自行补充未来年份）</label>'
     +'<button class="btn" data-hd>放假 / 调休日期</button></div>'
   +'<hr style="border:none;border-top:1px solid var(--line2);margin:4px 0">'
   +'<div class="fld"><label>云同步（Supabase REST，可选）</label>'
     +'<input data-k="url" placeholder="https://xxx.supabase.co" value="'+esc(DB.sync.url)+'"></div>'
   +'<div class="fld"><label>API Key（anon / publishable key）</label>'
     +'<input data-k="key" placeholder="sb_publishable_... 或 eyJhbGci..." value="'+esc(DB.sync.key)+'"></div>'
   +'<label class="chk"><input type="checkbox" data-k="auto"'+(DB.sync.auto?' checked':'')+'>保存后自动上传</label>'
   +'<div class="hint">最后一次同步：'+(DB.sync.lastSync?new Date(DB.sync.lastSync).toLocaleString('zh-CN'):'从未')+'</div>'
   +'<div class="hint" style="margin-top:6px">多台设备填同一个地址和 Key 即可完全同步。首次使用需先在 Supabase 建一次表（建表 SQL 由助手单独提供）。</div>';
  var m=modal('设置',body,'<button class="btn" data-up>上传</button><button class="btn" data-down>下载</button><button class="btn" data-c>关闭</button><button class="btn p" data-ok>保存</button>');
  m.querySelector('[data-c]').onclick=function(){m.remove()};

      syncPull(true,function(){schedPush();toast('已开启自动同步')});

function editHolidays(after){
  var years=[],yy;for(yy=2020;yy<=2035;yy++)years.push(yy);
  var cur=ST.y; if(years.indexOf(cur)<0)years.unshift(cur);
  var body='<div class="setrow"><span>年份</span><select data-y style="border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg)">'
    +years.map(function(v){return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+v+' 年</option>'}).join('')+'</select></div>'
    +'<div class="hdlist" id="hdList"></div>'
    +'<button class="btn" data-add style="width:100%">＋ 添加一个日期</button>'
    +'<div class="hint" style="margin-top:8px">「放假」标红<b>休</b>，「调休上班」标灰<b>班</b>。内置 2024–2026 数据来自国务院办公厅放假安排，之后年份请对照当年公告添加。改动只保存与内置不同的部分。</div>';
  var m=modal('节假日安排',body,'<button class="btn" data-c>取消</button><button class="btn p" data-ok>保存</button>');
  var rows=[];
  function curYear(){return String(+m.querySelector('[data-y]').value)}
  function rowsOf(y){
    var merged={},bi=SCHEDULE[y]||{},ov=DB.holidays[y]||{};
    Object.keys(bi).forEach(function(k){merged[k]=bi[k]});
    Object.keys(ov).forEach(function(k){ if(ov[k]===-1) delete merged[k]; else merged[k]=ov[k]; });
    return Object.keys(merged).sort().map(function(k){return {d:k,v:merged[k]}});
  }
  function paint(){
    var y=curYear();
    var box=m.querySelector('#hdList');
    if(!rows.length&&!box.dataset.init){rows=rowsOf(y);box.dataset.init='1'}
    box.innerHTML=rows.length?rows.map(function(r,i){
      return '<div class="hdrow" data-i="'+i+'">'
        +'<input type="date" value="'+y+'-'+r.d+'">'
        +'<select><option value="1"'+(r.v===1?' selected':'')+'>放假</option>'
        +'<option value="0"'+(r.v===0?' selected':'')+'>调休上班</option></select>'
        +'<button class="iconbtn" data-del title="删除">✕</button></div>';
    }).join(''):'<div class="empty">这一年还没有任何安排</div>';
    $$('.hdrow',box).forEach(function(row){
      var i=+row.dataset.i;
      row.querySelector('input').onchange=function(){var q=this.value.split('-');if(q.length===3)rows[i].d=q[1]+'-'+q[2]};
      row.querySelector('select').onchange=function(){rows[i].v=+this.value};
      row.querySelector('[data-del]').onclick=function(){rows.splice(i,1);paint()};
    });
  }
  m.querySelector('[data-y]').onchange=function(){rows=rowsOf(curYear());m.querySelector('#hdList').dataset.init='1';paint()};
  m.querySelector('[data-add]').onclick=function(){
    var y=curYear(),used={};rows.forEach(function(r){used[r.d]=1});
    var nd='01-01';
    for(var mo=1;mo<=12&&used[nd];mo++)for(var dd=1;dd<=31;dd++){var k=pad(mo)+'-'+pad(dd);if(!used[k]){nd=k;break}}
    rows.push({d:nd,v:1});rows.sort(function(a,b){return a.d<b.d?-1:1});paint();
  };
  var closeAll=function(){m.remove();if(after)after()};
  m.querySelector('[data-c]').onclick=closeAll;
  m.querySelector('.x').onclick=closeAll;
  m.querySelector('[data-ok]').onclick=function(){
    var y=curYear(),bi=SCHEDULE[y]||{},out={};
    rows.forEach(function(r){if(!r.d)return; if(r.v!==bi[r.d]) out[r.d]=r.v;});
    Object.keys(bi).forEach(function(k){
      if(!rows.some(function(r){return r.d===k})) out[k]=-1;
    });
    if(Object.keys(out).length) DB.holidays[y]=out; else delete DB.holidays[y];
    save(true);render();closeAll();toast('已更新 '+y+' 年安排');
  };
  paint();
}
function exportJson(anchor){
  menu(anchor,[
    {label:'导出到文件',fn:function(){
      var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='万年历数据_'+dkey(tdy.y,tdy.m,tdy.d)+'.json';a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast('已导出');}},
    {label:'导出到粘贴板',fn:function(){
      var txt=JSON.stringify(DB,null,2);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){toast('已复制到粘贴板')},
          function(){fallbackCopy(txt)});
      }else fallbackCopy(txt);}}
  ]);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');ta.value=txt;
  ta.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制到粘贴板')}
  catch(e){toast('复制失败，请改用导出到文件')}
  ta.remove();
}
function applyImport(raw){
  try{
    var o=JSON.parse(raw);
    if(!o||typeof o!=='object'||(!o.events&&!o.countdowns&&!o.anniversaries)){toast('内容不是有效的万年历数据');return}
    ['countdowns','anniversaries','events'].forEach(function(k){if(Array.isArray(o[k]))DB[k]=o[k]});
    if(o.holidays)DB.holidays=o.holidays;
    if(o.settings)Object.assign(DB.settings,o.settings);
    save(true);render();toast('已导入 '+DB.events.length+' 条日程等数据');
  }catch(e){toast('内容不是有效的万年历数据')}
}
function importJson(anchor){
  menu(anchor,[
    {label:'从文件导入',fn:function(){
      var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
      inp.onchange=function(){
        var f=inp.files[0];if(!f)return;
        var r=new FileReader();
        r.onload=function(){applyImport(r.result)};r.readAsText(f);
      };inp.click();}},
    {label:'从文本导入',fn:function(){
      var m=modal('从文本导入','<div class="fld"><label>粘贴之前导出的 JSON 文本</label>'
        +'<textarea data-txt style="min-height:180px;font-family:monospace;font-size:11px"></textarea></div>',
        '<button class="btn" data-c>取消</button><button class="btn p" data-ok>导入</button>');
      m.querySelector('[data-c]').onclick=function(){m.remove()};
      m.querySelector('[data-ok]').onclick=function(){
        var v=m.querySelector('[data-txt]').value.trim();
        if(!v){toast('请先粘贴文本');return}
        m.remove();applyImport(v);
      };}}
  ]);
}

/* ---------- 云同步 ---------- */
function localEmpty(){return !DB.countdowns.length&&!DB.anniversaries.length&&!DB.events.length}
function syncCfg(){
  if(!DB.sync.url||!DB.sync.key){toast('请先在设置里填写同步地址与 Key');return null}
  return {base:DB.sync.url.replace(/\/+$/,''),key:DB.sync.key,table:DB.sync.table||'calendar_sync',room:DB.sync.room||'my-calendar'};
}
function hdrs(c,extra){
  var h={'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json'};
  return Object.assign(h,extra||{});
}
var pushT=null;
function schedPush(){clearTimeout(pushT);pushT=setTimeout(function(){syncPush(false)},1200)}
function doPush(c,verbose){
  var payload=Object.assign({},DB);delete payload.sync;
  fetch(c.base+'/rest/v1/'+c.table+'?on_conflict=key',{method:'POST',headers:hdrs(c,{'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({key:c.room,data:payload,updated_at:new Date().toISOString()})})
   .then(function(r){if(!r.ok)throw new Error(r.status);DB.sync.lastSync=new Date().toISOString();save(false);
     if(verbose)toast('已上传到云端');syncBadge('ok')})
   .catch(function(e){if(verbose)toast('上传失败：'+e.message);syncBadge('err')});
}
function syncPush(verbose){
  var c=syncCfg();if(!c)return;
  /* 本地为空且从未同步过：先取云端，避免把云端清空 */
  if(localEmpty()&&!DB.sync.lastSync){
    if(verbose)toast('先核对云端数据…');
    syncPull(verbose,function(){doPush(syncCfg(),verbose)});
    return;
  }
  if(verbose)toast('上传中…');
  doPush(c,verbose);
}
function syncPull(verbose,cb){
  var c=syncCfg();if(!c){if(cb)cb();return}
  if(verbose)toast('下载中…');
  fetch(c.base+'/rest/v1/'+c.table+'?key=eq.'+encodeURIComponent(c.room)+'&select=data,updated_at',{headers:hdrs(c)})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
   .then(function(j){
     if(!j||!j.length){if(verbose)toast('云端暂无数据');if(cb)cb();return}
     var row=j[0],remote=row.data||{};
     var rt=row.updated_at?new Date(row.updated_at).getTime():0;
     var lt=DB.updatedAt?new Date(DB.updatedAt).getTime():0;
     var doMerge=function(){
       ['countdowns','anniversaries','events'].forEach(function(k){DB[k]=Array.isArray(remote[k])?remote[k]:[]});
       DB.holidays=remote.holidays||{};
       DB.settings=Object.assign({},DEF.settings,remote.settings||{});
       if(rt) DB.updatedAt=new Date(rt).toISOString();
       if(cleanDemo()&&DB.sync.auto) schedPush();
       DB.sync.lastSync=new Date().toISOString();save(false);render();
       if(verbose)toast('已与云端同步');syncBadge('ok');
     };
     if(lt>rt+1000&&!localEmpty()){
       if(!verbose){if(cb)cb();return;}
       var m=modal('云端数据较旧','<div style="font-size:12px;color:var(--t2);line-height:1.7">本地最后修改：'+new Date(lt).toLocaleString('zh-CN')
         +'<br>云端最后修改：'+new Date(rt).toLocaleString('zh-CN')+'<br><br>选择要保留的版本：</div>',
         '<button class="btn" data-c>取消</button><button class="btn" data-up>以本地覆盖云端</button><button class="btn p" data-d>以云端覆盖本地</button>');
       m.querySelector('[data-c]').onclick=function(){m.remove()};
       m.querySelector('[data-up]').onclick=function(){m.remove();syncPush(true)};
       m.querySelector('[data-d]').onclick=function(){m.remove();doMerge(true)};
     } else {doMerge(verbose);if(cb)cb();}
   })
   .catch(function(e){if(verbose)toast('下载失败：'+e.message);syncBadge('err')});
}
function syncBadge(s){var b=$('#btnSync');b.classList.toggle('act',s==='ok');
  if(s==='err'){b.style.color='var(--red)';setTimeout(function(){b.style.color=''},1500)}}
function bootSync(){
  if(DB.sync.url&&DB.sync.key){syncPull(false);setInterval(function(){syncPull(false)},60000)}
}

/* ---------- FAB ---------- */
function initFab(){
  var fab=$('#fab'),s=DB.settings;
  if(s.fab){fab.style.left=s.fab.x+'px';fab.style.top=s.fab.y+'px';fab.style.right='auto';fab.style.bottom='auto'}
  var timer=null,drag=false,dragMoved=false,ox=0,oy=0,moved=false,suppressClick=false;
  function fabMenu(){
    menu(fab,[{label:'新增倒计时',fn:function(){openCountdown(null,dkey(ST.y,ST.m,ST.d))}},
      {label:'新增纪念日',fn:function(){openAnniv(null,dkey(ST.y,ST.m,ST.d))}},
      {label:'新增日程',fn:function(){openEvent(null,dkey(ST.y,ST.m,ST.d))}}]);
  }
  fab.addEventListener('pointerdown',function(e){
    try{fab.setPointerCapture&&fab.setPointerCapture(e.pointerId)}catch(err){}
    moved=false;dragMoved=false;var r=fab.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
    timer=setTimeout(function(){drag=true;fab.classList.add('drag');toast('拖动到任意位置，松手固定')},420);
  });
  fab.addEventListener('pointermove',function(e){
    if(Math.abs(e.clientX-ox)>6||Math.abs(e.clientY-oy)>6)moved=true;
    if(!drag)return;
    var x=Math.max(6,Math.min(innerWidth-52,e.clientX-ox));
    var y=Math.max(6,Math.min(innerHeight-52,e.clientY-oy));
    if(x!==parseFloat(fab.style.left)||y!==parseFloat(fab.style.top))dragMoved=true;
    fab.style.left=x+'px';fab.style.top=y+'px';fab.style.right='auto';fab.style.bottom='auto';
  });
  fab.addEventListener('pointerup',function(){
    clearTimeout(timer);
    if(drag){drag=false;fab.classList.remove('drag');
      if(dragMoved){
        DB.settings.fab={x:parseFloat(fab.style.left)||18,y:parseFloat(fab.style.top)||innerHeight-68};
        save(false);suppressClick=true;
      }
      /* 长按未动：交给 click 弹菜单 */
      return;}
    /* 快速点按：交给 click 弹菜单（移动端 click 最可靠） */
  });
  fab.addEventListener('click',function(){
    if(suppressClick){suppressClick=false;return}
    clearTimeout(timer);drag=false;fab.classList.remove('drag');
    if(moved)return;
    fabMenu();
  });
  fab.addEventListener('pointercancel',function(){
    clearTimeout(timer);drag=false;fab.classList.remove('drag');
  });
}

/* ---------- 事件绑定 ---------- */
function clampY(y){return Math.max(1900,Math.min(2100,y))}
function step(n){
  if(ST.view==='year'){ST.y=clampY(ST.y+n);if(ST.y<1900||ST.y>2100)return}
  else if(ST.view==='month'){ST.m+=n;if(ST.m>12){ST.m=1;ST.y++}if(ST.m<1){ST.m=12;ST.y--};ST.y=clampY(ST.y)}
  else{var d=new Date(ST.y,ST.m-1,ST.d+n);ST.y=d.getFullYear();ST.m=d.getMonth()+1;ST.d=d.getDate()}
  render();
}
$('#btnPrev').onclick=function(){step(-1)};
$('#btnNext').onclick=function(){step(1)};
$('#btnToday').onclick=function(){ST.y=tdy.y;ST.m=tdy.m;ST.d=tdy.d;render()};
$('#btnSet').onclick=openSettings;
$('#btnSync').onclick=function(){
  menu(this,[{label:'从云端下载',fn:function(){syncPull(true)}},
    {label:'上传到云端',fn:function(){syncPush(true)}},
    {label:'同步设置…',fn:openSettings}]);
};
$$('#segView button').forEach(function(b){
  b.onclick=function(){ST.view=b.dataset.v;$$('#segView button').forEach(function(x){x.classList.toggle('on',x===b)});render()};
});
document.addEventListener('keydown',function(e){
  if($('#layer').children.length)return;
  if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
  else if(e.key==='t'||e.key==='T'){$('#btnToday').click()}
  else if(e.key==='y')setView('year');
  else if(e.key==='m')setView('month');
  else if(e.key==='d')setView('day');
});
function setView(v){ST.view=v;$$('#segView button').forEach(function(x){x.classList.toggle('on',x.dataset.v===v)});render()}
/* 触摸左右滑动切换 */
(function(){
  var x0=null,y0=null;
  var area=document.querySelector('.col-main');
  area.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  area.addEventListener('touchend',function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dy)<50)step(dx<0?1:-1);
    x0=y0=null;
  },{passive:true});
})();
window.addEventListener('resize',function(){closeMenu()});

/* ---------- 启动 ---------- */
if(cleanDemo())save(true);
initFab();render();bootSync();
})();
</script>
</body>

<!--
Supabase 建表 SQL（首次使用前在 Supabase 控制台 → SQL Editor 执行一次）：

create table if not exists calendar_sync (
  key text primary key,
  data jsonb,
  updated_at timestamptz default now()
);
alter table calendar_sync enable row level security;
create policy "anon rw" on calendar_sync
  for all to anon using (true) with check (true);
-->
