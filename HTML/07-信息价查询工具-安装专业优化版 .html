<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端固定为1280px宽度，直接显示桌面版，不缩放适配 -->
    <meta name="viewport" content="width=1280">
    <title>信息价查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f8fafc;
            width: 100vw;
            min-width: 1200px;
        }
        .filter-panel {
            width: 400px;
            padding: 20px;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
            min-width: 400px;
            position: fixed;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10;
            overflow-y: hidden;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .import-area {
            padding: 10px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .import-area:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59,130,246,0.1);
        }
        .refresh-btn {
            position: absolute;
            top: 8px; right: 8px;
            width: 24px; height: 24px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .refresh-btn:hover {
            background: #3b82f6;
            color: white;
        }
        .import-btn {
            padding: 6px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .import-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .filter-group select {
            flex: 1;
            min-width: 0;
            max-width: calc(100% - 60px);
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            transition: border 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .filter-group input {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            transition: border 0.3s ease;
            width: 100%;
        }
        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .clear-btn {
            width: 50px;
            padding: 8px 0;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            text-align: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .clear-btn:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }
        .period-container {
            max-height: 200px;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 6px;
            padding: 8px;
            border: 1px solid #cbd5e1;
        }
        .period-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .period-item:hover {
            background: #e2e8f0;
        }
        .period-item input[type="checkbox"] {
            margin-right: 8px;
            width: 14px; height: 14px;
            accent-color: #3b82f6;
        }
        .period-item label {
            cursor: pointer;
            font-weight: normal;
            margin: 0;
            flex: 1;
            font-size: 13px;
        }
        .search-all-group {
            padding: 8px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .search-all-group label {
            color: #475569;
            font-weight: 600;
            font-size: 12px;
        }
        .search-all-group input {
            width: 100%;
            margin-top: 4px;
        }
        .search-btn {
            padding: 10px;
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.2);
        }
        .data-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-width: 0;
            margin-left: 400px;
        }
        .table-wrapper {
            width: 100%;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            min-width: 0;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            table-layout: auto;
            min-width: 800px;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            white-space: normal;
            word-wrap: break-word;
        }
        .data-table th {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            font-weight: 600;
            color: #1e293b;
            position: sticky;
            top: 0;
            font-size: 13px;
            z-index: 10;
            white-space: nowrap;
        }
        .data-table tr:hover {
            background: #f8fafc;
        }
        .empty-tip {
            text-align: center;
            padding: 60px;
            color: #64748b;
            font-size: 16px;
        }
        #fileInput {
            display: none;
        }
        #importStatus {
            margin-top: 8px;
            color: #10b981;
            font-size: 12px;
            font-weight: 500;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .data-table th:nth-child(1), .data-table td:nth-child(1) { width: calc(3.5/16*100%); min-width: 150px; }
        .data-table th:nth-child(2), .data-table td:nth-child(2) { width: calc(3.5/16*100%); min-width: 150px; }
        .data-table th:nth-child(3), .data-table td:nth-child(3) { width: calc(3/16*100%); min-width: 120px; }
        .data-table th:nth-child(4), .data-table td:nth-child(4) { width: calc(3/16*100%); min-width: 120px; }
        .data-table th:nth-child(5), .data-table td:nth-child(5) { width: calc(1/16*100%); min-width: 60px; }
        .data-table th:nth-child(6), .data-table td:nth-child(6) { width: calc(2/16*100%); min-width: 80px; }

        .clear-all-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 4px;
        }
        .clear-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.2);
        }

        .price-cell {
            cursor: copy;
        }
        .price-cell:hover {
            background-color: #e8f4ea;
        }

        @media screen and (max-width: 1400px) {
            .filter-panel { width: 380px; padding: 16px; }
            .data-panel { padding: 16px; margin-left: 380px; }
            .data-table th, .data-table td { padding: 10px 12px; font-size: 12px; }
        }
        @media screen and (max-width: 1200px) {
            .filter-panel { width: 360px; padding: 14px; }
            .data-panel { margin-left: 360px; }
            .filter-group select, .filter-group input { padding: 6px 8px; font-size: 12px; }
            .clear-btn { width: 40px; padding: 6px 0; font-size: 10px; }
        }

        .custom-contextmenu {
            position: absolute;
            width: 180px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 9999;
            display: none;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .contextmenu-item {
            padding: 8px 16px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .contextmenu-item:hover {
            background: #f0f9ff;
            color: #3b82f6;
        }
        .contextmenu-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 4px 0;
        }

        /* 新增：价格趋势浮窗 */
        .trend-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .trend-modal-content {
            width: 60%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
        }
        .trend-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #f1f5f9;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .trend-close:hover {
            background: #ef4444;
            color: white;
        }
        .trend-title {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }
        .trend-data-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .trend-data-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .trend-data-item:last-child {
            border-bottom: none;
        }
        .trend-period {
            font-weight: 600;
            color: #475569;
        }
        .trend-price {
            color: #10b981;
            font-weight: 500;
        }
        .trend-selected {
            color: #ef4444 !important;
            font-weight: 600 !important;
        }
        
        /* 自动消失提示框 */
        .toast-notice {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* 新增：期数选择控制按钮 */
        .period-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .period-control-btn {
            flex: 1;
            padding: 6px 8px;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            color: #475569;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .period-control-btn:hover {
            background: #cbd5e1;
        }
        
        /* 按钮布局调整 */
        .button-row {
            display: flex;
            gap: 8px;
        }
        .button-row button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="filter-panel">
        <div class="panel-header">
        </div>
        
        <div class="import-area">
            <button class="refresh-btn" onclick="refreshLocalData()" title="刷新本地导入数据">↻</button>
            <p style="color: #475569; font-size: 12px; margin-bottom: 4px;">导入Excel数据文件</p>
            <button class="import-btn" onclick="document.getElementById('fileInput').click()">本地导入</button>
            <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="importExcel(event)">
            <p id="importStatus"></p>
        </div>

        <div class="filter-group">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="installFilter" onchange="refreshAllFilters()" style="width: 16px; height: 16px; accent-color: #3b82f6;" checked>
                <label for="installFilter" style="font-size: 13px; font-weight: 600;">仅显示【安装专业】数据</label>
            </div>
        </div>

        <div class="filter-group">
            <label style="font-size: 12px;">选择期数</label>
            <div class="period-controls">
                <button class="period-control-btn" onclick="selectAllPeriods()">全选</button>
                <button class="period-control-btn" onclick="unselectAllPeriods()">取消全选</button>
            </div>
            <div id="periodContainer" class="period-container">
                <div style="text-align:center;color:#999;padding:10px">请先导入数据</div>
            </div>
        </div>

        <div class="filter-group">
            <label for="category1" style="font-size: 12px;">分类Ⅰ</label>
            <div class="select-wrapper">
                <select id="category1" onchange="updateCategory2Options(); autoSearch();">
                    <option value="">全部</option>
                </select>
                <button class="clear-btn" onclick="clearSelect('category1')">清除</button>
            </div>
        </div>

        <div class="filter-group">
            <label for="category2" style="font-size: 12px;">分类Ⅱ</label>
            <div class="select-wrapper">
                <select id="category2" onchange="updateMaterialNameOptions(); autoSearch();">
                    <option value="">全部</option>
                </select>
                <button class="clear-btn" onclick="clearSelect('category2')">清除</button>
            </div>
        </div>

        <div class="filter-group">
            <label for="materialName" style="font-size: 12px;">材料名称</label>
            <div class="select-wrapper">
                <select id="materialName" onchange="updateSpecOptions(); autoSearch();">
                    <option value="">全部</option>
                </select>
                <button class="clear-btn" onclick="clearSelect('materialName')">清除</button>
            </div>
        </div>

        <div class="filter-group">
            <label for="specModel" style="font-size: 12px;">规格型号</label>
            <div class="select-wrapper">
                <select id="specModel" onchange="autoSearch();">
                    <option value="">全部</option>
                </select>
                <button class="clear-btn" onclick="clearSelect('specModel')">清除</button>
            </div>
        </div>

        <div class="filter-group search-all-group">
            <label style="font-size: 12px;">搜索</label>
            <div class="select-wrapper">
                <input type="text" id="searchAll" placeholder="输入关键词搜索所有内容" oninput="autoSearch()">
                <button class="clear-btn" onclick="clearSelect('searchAll')">清除</button>
            </div>
        </div>

        <div class="button-row">
            <button class="clear-all-btn" onclick="clearAllFilters()">清空筛选/关键词</button>
            <button class="search-btn" onclick="searchData()">查询数据</button>
        </div>
    </div>

    <div class="data-panel">
        <div class="table-wrapper">
            <table class="data-table" id="resultTable">
                <thead>
                    <tr>
                        <th>分类Ⅰ</th>
                        <th>分类Ⅱ</th>
                        <th>材料名称</th>
                        <th>型号规格</th>
                        <th>单位</th>
                        <th id="avgHeader">价格</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="empty-tip">请先导入数据并进行查询</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="custom-contextmenu" id="priceContextMenu">
        <div class="contextmenu-item" id="menuPriceTrend">价格趋势</div>
        <div class="contextmenu-divider" id="menuDivider1"></div>
        
        <!-- 乘系数菜单 -->
        <div id="multiplierMenuContainer"></div>
        
        <!-- 无缝钢管换算菜单 -->
        <div class="contextmenu-divider" id="pipeDivider"></div>
        <div id="steelPipeMenuContainer"></div>
        
        <!-- 单位换算菜单 -->
        <div class="contextmenu-divider" id="unitConvertDivider"></div>
        <div id="unitConvertMenuContainer"></div>
        
        <div class="contextmenu-divider" id="menuDivider2"></div>
    </div>

    <!-- 新增：价格趋势浮窗 -->
    <div class="trend-modal" id="trendModal">
        <div class="trend-modal-content">
            <button class="trend-close" onclick="closeTrendModal()">×</button>
            <h3 class="trend-title" id="trendTitle">材料价格趋势</h3>
            <ul class="trend-data-list" id="trendDataList"></ul>
        </div>
    </div>

    <!-- 自动消失提示框 -->
    <div class="toast-notice" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        let excelData = [];
        let periodsList = [];
        let fullDataMap = {
            category1: [], category2ByC1: {}, materialByC1C2: {}, specByC1C2Material: {},
            allCategory2: [], allMaterials: [], allSpecs: []
        };
        let lastFile = null;
        let currentRowData = null;
        let currentPrice = 0;

        window.onload = function () {
            loadLocalData();
            initContextMenu();
        };

        // 带计算过程的自动消失提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
            }, 3000);
        }

        function initContextMenu() {
            const contextMenu = document.getElementById('priceContextMenu');
            const tableBody = document.getElementById('tableBody');
            
            tableBody.addEventListener('contextmenu', function(e) {
                const target = e.target;
                if (target.classList.contains('price-cell')) {
                    e.preventDefault();
                    const row = target.closest('tr');
                    if (row) {
                        const cells = row.querySelectorAll('td');
                        currentRowData = {
                            category1: cells[0].textContent.trim(),
                            category2: cells[1].textContent.trim(),
                            materialName: cells[2].textContent.trim(),
                            specModel: cells[3].textContent.trim(),
                            unit: cells[4].textContent.trim()
                        };
                        const priceText = cells[5].textContent.trim();
                        currentPrice = priceText === "无数据" ? 0 : parseFloat(priceText) || 0;
                    }
                    
                    generateMultiplierMenu();
                    generateSteelPipeMenu();
                    generateUnitConvertMenu();
                    
                    contextMenu.style.display = 'block';
                    contextMenu.style.left = `${e.clientX}px`;
                    contextMenu.style.top = `${e.clientY}px`;
                    if (contextMenu.offsetLeft + contextMenu.offsetWidth > window.innerWidth) {
                        contextMenu.style.left = `${window.innerWidth - contextMenu.offsetWidth - 10}px`;
                    }
                    if (contextMenu.offsetTop + contextMenu.offsetHeight > window.innerHeight) {
                        contextMenu.style.top = `${window.innerHeight - contextMenu.offsetHeight - 10}px`;
                    }
                }
            });

            document.addEventListener('click', function() {
                document.getElementById('priceContextMenu').style.display = 'none';
            });

            document.getElementById('menuPriceTrend').addEventListener('click', function() {
                document.getElementById('priceContextMenu').style.display = 'none';
                if (currentRowData && excelData.length > 0) {
                    showPriceTrendData();
                } else {
                    showToast('暂无该材料的价格数据');
                }
            });
        }

        function selectAllPeriods() {
            const checkboxes = document.querySelectorAll('#periodContainer input[type="checkbox"]');
            checkboxes.forEach(checkbox => checkbox.checked = true);
            autoSearch();
        }

        function unselectAllPeriods() {
            const checkboxes = document.querySelectorAll('#periodContainer input[type="checkbox"]');
            checkboxes.forEach(checkbox => checkbox.checked = false);
            autoSearch();
        }

        // 生成乘系数菜单
        function generateMultiplierMenu() {
            const container = document.getElementById('multiplierMenuContainer');
            const divider1 = document.getElementById('menuDivider1');
            const category1 = currentRowData?.category1 || '';
            const validCategories = ['电线', '塑料绝缘电力电缆', '交联塑料绝缘电力电缆(低压)'];
            
            container.innerHTML = '';
            
            if (!validCategories.includes(category1) || currentPrice === 0) {
                divider1.style.display = 'none';
                return;
            }
            
            divider1.style.display = 'block';
            
            let multiplierConfig = [];
            if (category1 === '电线') {
                multiplierConfig = [
                    { name: 'ZR', rate: 1.08 },
                    { name: 'BYJ', rate: 1.12 },
                    { name: 'WDZ-BYJ', rate: 1.27 },
                    { name: 'WDZN-BYJ', rate: 1.42 }
                ];
            } else if (['塑料绝缘电力电缆', '交联塑料绝缘电力电缆(低压)'].includes(category1)) {
                multiplierConfig = [
                    { name: 'ZR', rate: 1.08 },
                    { name: 'WDZ', rate: 1.15 },
                    { name: 'WDZN（请选择NH）', rate: 1.15 }
                ];
            }
            
            multiplierConfig.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'contextmenu-item';
                menuItem.textContent = item.name;
                menuItem.onclick = function() {
                    calculateAndCopyMultiplier(item.rate, item.name);
                };
                container.appendChild(menuItem);
            });
        }

        // 生成无缝钢管换算菜单
        function generateSteelPipeMenu() {
            const container = document.getElementById('steelPipeMenuContainer');
            const divider = document.getElementById('pipeDivider');
            const materialName = currentRowData?.materialName || '';
            
            container.innerHTML = '';
            
            if (materialName !== '无缝钢管' || currentPrice === 0) {
                divider.style.display = 'none';
                return;
            }
            
            divider.style.display = 'block';
            
            const pipeConfigs = [
                { name: 'D89*4', fn: (p) => p/1000*(0.02466*4*(89-4)) },
                { name: 'D133*4', fn: (p) => p/1000*(0.02466*4*(133-4)) },
                { name: 'D159*4.5', fn: (p) => p/1000*(0.02466*4.5*(159-4.5)) },
                { name: 'D219*6', fn: (p) => p/1000*(0.02466*6*(219-6)) },
                { name: 'D273*7', fn: (p) => p/1000*(0.02466*7*(273-7)) },
                { name: 'D325*8', fn: (p) => p/1000*(0.02466*8*(325-8)) },
                { name: 'D377*10', fn: (p) => p/1000*(0.02466*10*(377-10)) },
                { name: 'D426*10', fn: (p) => p/1000*(0.02466*10*(426-10)) },
                { name: 'D480*10', fn: (p) => p/1000*(0.02466*10*(480-10)) },
                { name: 'D530*10', fn: (p) => p/1000*(0.02466*10*(530-10)) },
                { name: 'D630*10', fn: (p) => p/1000*(0.02466*10*(630-10)) }
            ];
            
            pipeConfigs.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'contextmenu-item';
                menuItem.textContent = item.name;
                menuItem.onclick = function() {
                    calculateSteelPipe(item.fn, item.name);
                };
                container.appendChild(menuItem);
            });
        }

        // 生成单位换算菜单（吨→千克）
        function generateUnitConvertMenu() {
            const container = document.getElementById('unitConvertMenuContainer');
            const divider = document.getElementById('unitConvertDivider');
            const unit = currentRowData?.unit || '';
            const validUnits = ['T', 't', '吨'];
            
            container.innerHTML = '';
            
            if (!validUnits.includes(unit) || currentPrice === 0) {
                divider.style.display = 'none';
                return;
            }
            
            divider.style.display = 'block';
            
            const menuItem = document.createElement('div');
            menuItem.className = 'contextmenu-item';
            menuItem.textContent = 'KG';
            menuItem.onclick = function() {
                convertToKg();
            };
            container.appendChild(menuItem);
        }

        // 计算系数并复制（带计算过程）
        function calculateAndCopyMultiplier(rate, name) {
            if (currentPrice === 0) {
                showToast('当前行无有效价格数据');
                return;
            }
            
            const result = (currentPrice * rate).toFixed(2);
            const calcText = `${currentPrice} × ${rate} = ${result}`;
            
            navigator.clipboard.writeText(result).then(() => {
                showToast(`已复制【${name}】：${result}\n计算过程：${calcText}`);
            }).catch(err => {
                showToast(`复制失败：${err.message}`);
            });
            
            document.getElementById('priceContextMenu').style.display = 'none';
        }

        // 无缝钢管换算（带计算过程）
        function calculateSteelPipe(calcFn, spec) {
            if (currentPrice === 0) {
                showToast('当前行无有效价格数据');
                return;
            }
            
            const result = calcFn(currentPrice).toFixed(2);
            const calcText = `${currentPrice} → ${spec} 换算 = ${result}`;
            
            navigator.clipboard.writeText(result).then(() => {
                showToast(`已复制【${spec}】：${result}\n计算过程：${calcText}`);
            }).catch(err => {
                showToast(`复制失败：${err.message}`);
            });
            
            document.getElementById('priceContextMenu').style.display = 'none';
        }

        // 吨转千克换算（带计算过程）
        function convertToKg() {
            if (currentPrice === 0) {
                showToast('当前行无有效价格数据');
                return;
            }
            
            const result = (currentPrice / 1000).toFixed(4);
            const calcText = `${currentPrice} ÷ 1000 = ${result}`;
            
            navigator.clipboard.writeText(result).then(() => {
                showToast(`已复制【KG】单价：${result}\n计算过程：${calcText}`);
            }).catch(err => {
                showToast(`复制失败：${err.message}`);
            });
            
            document.getElementById('priceContextMenu').style.display = 'none';
        }

        // 显示价格趋势数据（替换原来的图表展示）
        function showPriceTrendData() {
            const materialRow = excelData.find(row => 
                (row[1] || "").trim() === currentRowData.category1 &&
                (row[2] || "").trim() === currentRowData.category2 &&
                (row[3] || "").trim() === currentRowData.materialName &&
                (row[4] || "").trim() === currentRowData.specModel
            );

            if (!materialRow) {
                showToast('未找到该材料的完整价格数据');
                return;
            }

            const trendDataList = document.getElementById('trendDataList');
            const trendTitle = document.getElementById('trendTitle');
            trendTitle.textContent = `${currentRowData.materialName}(${currentRowData.specModel}) - 价格趋势`;
            
            trendDataList.innerHTML = '';
            
            const selectedPeriods = getSelectedPeriods();
            let hasValidData = false;
            periodsList.forEach((period, idx) => {
                const price = parseFloat(materialRow[6 + idx]);
                const priceDisplay = isNaN(price) ? "无数据" : price.toFixed(2);
                
                if (priceDisplay !== "无数据") {
                    hasValidData = true;
                }
                
                const li = document.createElement('li');
                li.className = 'trend-data-item';
                
                // 检查当前期是否在选中列表中
                const isSelected = selectedPeriods.includes(idx);
                const periodClass = isSelected ? 'trend-period trend-selected' : 'trend-period';
                
                li.innerHTML = `
                    <span class="${periodClass}">${period}</span>
                    <span class="trend-price">${priceDisplay}</span>
                `;
                trendDataList.appendChild(li);
            });

            if (!hasValidData) {
                const li = document.createElement('li');
                li.className = 'trend-data-item';
                li.style.textAlign = 'center';
                li.style.color = '#999';
                li.innerHTML = '无有效价格数据';
                trendDataList.appendChild(li);
            }

            document.getElementById('trendModal').style.display = 'flex';
        }

        // 关闭价格趋势浮窗
        function closeTrendModal() {
            document.getElementById('trendModal').style.display = 'none';
        }

        function loadLocalData() {
            const savedData = localStorage.getItem('priceData');
            const savedPeriods = localStorage.getItem('periodsList');
            const savedFullMap = localStorage.getItem('fullDataMap');
            if (savedData && savedPeriods) {
                excelData = JSON.parse(savedData);
                periodsList = JSON.parse(savedPeriods);
                if(savedFullMap) fullDataMap = JSON.parse(savedFullMap);
                refreshAllFilters();
                renderPeriods();
                document.getElementById('importStatus').textContent = "✅ 已加载本地数据";
            }
        }

        function refreshLocalData() {
            if (!lastFile) { document.getElementById('fileInput').click(); return; }
            document.getElementById('importStatus').textContent = "🔄 正在刷新数据...";
            importExcel({ target: { files: [lastFile] } });
        }

        function clearAllFilters() {
            document.getElementById('category1').value = '';
            document.getElementById('category2').value = '';
            document.getElementById('materialName').value = '';
            document.getElementById('specModel').value = '';
            document.getElementById('searchAll').value = '';
            refreshAllFilters();
        }

        function clearSelect(id) {
            if (id === 'searchAll') {
                document.getElementById('searchAll').value = '';
                autoSearch();
            } else {
                document.getElementById(id).value = "";
                if(id==='category1') updateCategory2Options();
                else if(id==='category2') updateMaterialNameOptions();
                else if(id==='materialName') updateSpecOptions();
                autoSearch();
            }
        }

        function refreshAllFilters() {
            buildFullDataMap();
            updateCategory1Options();
            updateCategory2Options();
            updateMaterialNameOptions();
            updateSpecOptions();
            autoSearch();
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            lastFile = file;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                    if (excelData.length < 2) { showToast("数据不能为空"); return; }
                    const headerRow = excelData[0];
                    periodsList = headerRow.slice(6);
                    localStorage.setItem('priceData', JSON.stringify(excelData));
                    localStorage.setItem('periodsList', JSON.stringify(periodsList));
                    refreshAllFilters();
                    renderPeriods(); // 强制渲染期数复选框
                    document.getElementById('importStatus').textContent = `✅ 导入成功！共${excelData.length - 1}条数据`;
                } catch (error) {
                    console.error(error);
                    showToast("Excel解析失败");
                    document.getElementById('importStatus').textContent = "❌ 解析失败";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderPeriods() {
            const container = document.getElementById('periodContainer');
            if (periodsList.length === 0) { container.innerHTML = '<div style="color:#999">请先导入数据</div>'; return; }
            let html = '';
            periodsList.forEach((p, i) => { html += `<div class="period-item"><input type="checkbox" id="p${i}" value="${i}" onchange="autoSearch()"><label for="p${i}">${p}</label></div>`; });
            container.innerHTML = html;
        }

        function buildFullDataMap() {
            const onlyInstall = document.getElementById('installFilter').checked;
            let data = excelData.slice(1);
            if(onlyInstall) data = data.filter(row => (row[0] || "").trim() === "安装专业");

            let map = { category1: [], category2ByC1: {}, materialByC1C2: {}, specByC1C2Material: {} };
            data.forEach(row => {
                const c1 = (row[1] || "").trim();
                const c2 = (row[2] || "").trim();
                const mat = (row[3] || "").trim();
                const spec = (row[4] || "").trim();
                if (!c1) return;

                if (!map.category1.includes(c1)) map.category1.push(c1);
                if (!map.category2ByC1[c1]) map.category2ByC1[c1] = [];
                if (c2 && !map.category2ByC1[c1].includes(c2)) map.category2ByC1[c1].push(c2);

                const k1 = `${c1}|${c2}`;
                if (!map.materialByC1C2[k1]) map.materialByC1C2[k1] = [];
                if (mat && !map.materialByC1C2[k1].includes(mat)) map.materialByC1C2[k1].push(mat);

                const k2 = `${c1}|${c2}|${mat}`;
                if (!map.specByC1C2Material[k2]) map.specByC1C2Material[k2] = [];
                if (spec && !map.specByC1C2Material[k2].includes(spec)) map.specByC1C2Material[k2].push(spec);
            });

            fullDataMap = map;
            fullDataMap.allCategory2 = [...new Set(Object.values(map.category2ByC1).flat())].filter(Boolean);
            fullDataMap.allMaterials = [...new Set(Object.values(map.materialByC1C2).flat())].filter(Boolean);
            fullDataMap.allSpecs = [...new Set(Object.values(map.specByC1C2Material).flat())].filter(Boolean);
        }

        function updateCategory1Options() {
            const el = document.getElementById('category1');
            el.innerHTML = '<option value="">全部</option>';
            fullDataMap.category1.forEach(v => { const opt = document.createElement('option'); opt.value=v; opt.textContent=v; el.appendChild(opt); });
        }

        function updateCategory2Options() {
            const c1 = document.getElementById('category1').value;
            const el = document.getElementById('category2');
            el.innerHTML = '<option value="">全部</option>';
            const list = c1 ? (fullDataMap.category2ByC1[c1] || []) : fullDataMap.allCategory2;
            list.forEach(v => { const opt = document.createElement('option'); opt.value=v; opt.textContent=v; el.appendChild(opt); });
            updateMaterialNameOptions();
        }

        function updateMaterialNameOptions() {
            const c1 = document.getElementById('category1').value;
            const c2 = document.getElementById('category2').value;
            const el = document.getElementById('materialName');
            el.innerHTML = '<option value="">全部</option>';
            const key = `${c1}|${c2}`;
            const list = (!c1) ? fullDataMap.allMaterials : (fullDataMap.materialByC1C2[key] || []);
            list.forEach(v => { const opt = document.createElement('option'); opt.value=v; opt.textContent=v; el.appendChild(opt); });
            updateSpecOptions();
        }

        function updateSpecOptions() {
            const c1 = document.getElementById('category1').value;
            const c2 = document.getElementById('category2').value;
            const mat = document.getElementById('materialName').value;
            const el = document.getElementById('specModel');
            el.innerHTML = '<option value="">全部</option>';
            const key = `${c1}|${c2}|${mat}`;
            const list = (!c1) ? fullDataMap.allSpecs : (fullDataMap.specByC1C2Material[key] || []);
            list.forEach(v => { const opt = document.createElement('option'); opt.value=v; opt.textContent=v; el.appendChild(opt); });
        }

        function getSelectedPeriods() {
            const arr = [];
            document.querySelectorAll('#periodContainer input:checked').forEach(cb => arr.push(parseInt(cb.value)));
            return arr;
        }

        function matchGlobalSearch(row, kw) { return !kw || row.join('|').toLowerCase().includes(kw.toLowerCase()); }

        let searchTimer;
        function autoSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => searchData(), 120);
        }

        function copyToClipboard(cell) {
            const text = cell.textContent.trim();
            if (text && text !== "无数据") {
                navigator.clipboard.writeText(text).then(() => {
                    const ori = cell.textContent;
                    cell.textContent = "✅ 已复制";
                    setTimeout(() => cell.textContent = ori, 1000);
                }).catch(() => showToast("复制失败"));
            }
        }

        function searchData() {
            const tbody = document.getElementById('tableBody');
            const $header = document.getElementById('avgHeader');
            $header.textContent = '价格';
            
            const selected = getSelectedPeriods();
            if (selected.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">请先选择期数</td></tr>';
                return;
            }

            if (excelData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">请先导入数据并进行查询</td></tr>';
                return;
            }
            
            const onlyInstall = document.getElementById('installFilter').checked;
            const c1 = document.getElementById('category1').value.trim();
            const c2 = document.getElementById('category2').value.trim();
            const mat = document.getElementById('materialName').value.trim();
            const spec = document.getElementById('specModel').value.trim();
            const kw = document.getElementById('searchAll').value.trim();

            $header.textContent = selected.length === 1 ? periodsList[selected[0]] : `选中期数均价(${selected.length}期)`;

            let rows = excelData.slice(1);
            if(onlyInstall) rows = rows.filter(row => (row[0] || "").trim() === "安装专业");

            rows = rows.filter(row => {
                const t1 = (row[1] || "").trim();
                const t2 = (row[2] || "").trim();
                const tm = (row[3] || "").trim();
                const ts = (row[4] || "").trim();
                if (c1 && t1 !== c1) return false;
                if (c2 && t2 !== c2) return false;
                if (mat && tm !== mat) return false;
                if (spec && ts !== spec) return false;
                if (!matchGlobalSearch(row, kw)) return false;
                return true;
            });

            if (rows.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">未找到数据</td></tr>'; 
                return; 
            }

            let html = '';
            rows.forEach(row => {
                let total = 0, cnt = 0;
                selected.forEach(idx => { const v = parseFloat(row[6 + idx]); if (!isNaN(v)) { total += v; cnt++; } });
                const val = cnt > 0 ? (total/cnt).toFixed(2) : "无数据";
                html += `<tr>
                    <td>${row[1] || ''}</td>
                    <td>${row[2] || ''}</td>
                    <td>${row[3] || ''}</td>
                    <td>${row[4] || ''}</td>
                    <td>${row[5] || ''}</td>
                    <td class="price-cell" ondblclick="copyToClipboard(this)">${val}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // 新增 fetchData 函数模拟数据加载
        function fetchData() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve("数据加载完成");
                }, 100);
            }).then(() => {
                renderPeriods(); // 在数据加载完成后强制渲染期数复选框
            });
        }
    </script>
</body>
</html>
