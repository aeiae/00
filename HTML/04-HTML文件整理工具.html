<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端固定为1280px宽度，直接显示桌面版，不缩放适配 -->
    <meta name="viewport" content="width=1280">
    <title>📦 HTML文件整理工具 - 优化版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text);
        }

        .description {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .description code {
            background: #f1f3f5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--primary-dark);
        }

        .drop-zone {
            border: 3px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fafc;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 33%, rgba(99, 102, 241, 0.1) 50%, transparent 67%);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .drop-zone.dragover::before {
            opacity: 1;
        }

        @keyframes shimmer {
            0% {
                transform: rotate(45deg) translateX(-100%);
            }
            100% {
                transform: rotate(45deg) translateX(100%);
            }
        }

        .drop-zone:hover {
            border-color: var(--primary-light);
            background: #f0f4ff;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background: #e0e7ff;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .drop-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .drop-text {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .drop-subtext {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            border-color: var(--primary-light);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            min-height: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.6;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid var(--primary);
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .status.warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid var(--warning);
        }

        .file-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .file-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            color: var(--primary);
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-light);
            font-size: 0.9rem;
            padding: 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .badge-info {
            background: #dbeafe;
            color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* 统计信息 */
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-light);
            flex-wrap: wrap;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 HTML文件整理工具</h1>
            <p class="subtitle">一键将HTML文件整理为文件夹结构</p>
        </header>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">🔄</div>
                <h2>XX.html → XX文件夹（index.html）</h2>
            </div>
            <p class="description">
                拖拽多个 <code>.html</code> 文件到下方区域，系统会为每个文件创建一个同名文件夹，并将文件移入其中重命名为 <code>index.html</code>。<br>
                <strong>同时会保留原始文件在"备份"文件夹中。</strong>
            </p>

            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">📄</div>
                <div class="drop-text">拖拽 .html 文件到这里</div>
                <div class="drop-subtext">或点击下方按钮选择文件</div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                    📂 选择文件
                </button>
                <button class="btn btn-primary" id="processBtn" disabled onclick="processFiles()">
                    ⚡ 生成并下载
                </button>
            </div>

            <input type="file" id="fileInput" multiple accept=".html,.htm" onchange="handleFileSelect(this)">

            <div class="file-list" id="fileList" style="display: none;">
                <!-- 文件列表将动态生成 -->
            </div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stats-item">📄 <span id="fileCount">0</span> 个文件</div>
                <div class="stats-item">📁 <span id="folderCount">0</span> 个文件夹</div>
            </div>

            <div class="status info" id="status">
                <span>ℹ️</span>
                <span>请拖拽 .html 文件或点击"选择文件"按钮</span>
            </div>
        </div>

        <footer>
            <p>💡 所有文件处理均在浏览器本地完成，不会上传到任何服务器</p>
            <p class="badge badge-info">纯前端实现 · 隐私安全 · 自动备份</p>
        </footer>
    </div>

    <script>
        // ================= 全局变量 =================
        let selectedFiles = [];

        // ================= 拖拽事件处理 =================
        function setupDropZone() {
            const zone = document.getElementById('dropZone');

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });

            zone.addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
        }

        setupDropZone();

        // ================= 文件选择处理 =================
        function handleFileSelect(input) {
            handleFiles(input.files);
        }

        function handleFiles(fileList) {
            // 过滤出 .html 文件
            selectedFiles = Array.from(fileList).filter(file => {
                const name = file.name.toLowerCase();
                return name.endsWith('.html') || name.endsWith('.htm');
            });

            if (selectedFiles.length === 0) {
                updateStatus('❌ 未选择任何 .html 文件，请选择有效的HTML文件', 'error');
                document.getElementById('processBtn').disabled = true;
                document.getElementById('fileList').style.display = 'none';
                document.getElementById('stats').style.display = 'none';
                return;
            }

            // 更新文件列表显示
            renderFileList();

            // 更新统计信息
            document.getElementById('fileCount').textContent = selectedFiles.length;
            document.getElementById('folderCount').textContent = selectedFiles.length;
            document.getElementById('stats').style.display = 'flex';

            updateStatus(`✅ 已选择 ${selectedFiles.length} 个HTML文件`, 'success');
            document.getElementById('processBtn').disabled = false;
        }

        // ================= 渲染文件列表 =================
        function renderFileList() {
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '';

            if (selectedFiles.length === 0) {
                listEl.style.display = 'none';
                return;
            }

            listEl.style.display = 'block';

            selectedFiles.slice(0, 15).forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<span class="file-icon">📄</span><span>${file.name}</span>`;
                listEl.appendChild(div);
            });

            if (selectedFiles.length > 15) {
                const more = document.createElement('div');
                more.className = 'file-item';
                more.innerHTML = `<span class="file-icon">➕</span><span>还有 ${selectedFiles.length - 15} 个文件...</span>`;
                listEl.appendChild(more);
            }
        }

        // ================= 处理文件 =================
        async function processFiles() {
            if (selectedFiles.length === 0) {
                updateStatus('❌ 请先选择文件', 'error');
                return;
            }

            const zip = new JSZip();
            let processedCount = 0;

            try {
                updateStatus('⏳ 正在处理文件...', 'info');
                document.getElementById('processBtn').disabled = true;

                // 1. 创建备份文件夹，存放原始文件
                const backupFolder = zip.folder('备份');
                selectedFiles.forEach(file => {
                    backupFolder.file(file.name, file);
                });

                // 2. 为每个文件创建文件夹，包含 index.html
                selectedFiles.forEach(file => {
                    const fileName = file.name;
                    // 移除扩展名
                    const nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.'));
                    // 创建文件夹
                    const folder = zip.folder(nameWithoutExt);
                    // 将文件放入文件夹并重命名为 index.html
                    folder.file('index.html', file);
                    processedCount++;
                });

                // 3. 生成ZIP文件
                const content = await zip.generateAsync({
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: { level: 9 }
                });

                // 4. 下载
                downloadBlob(content, "已处理HTML文件.zip");

                updateStatus(`✅ 完成！已处理 ${processedCount} 个文件<br>📦 压缩包包含：<br>- ${processedCount} 个文件夹（每个含 index.html）<br>- 1 个"备份"文件夹（含原始文件）`, 'success');

                // 5. 清空状态（延迟后重置）
                setTimeout(() => {
                    selectedFiles = [];
                    document.getElementById('fileList').style.display = 'none';
                    document.getElementById('stats').style.display = 'none';
                    document.getElementById('processBtn').disabled = true;
                    updateStatus('✅ 处理完成！请解压 ZIP 到目标目录', 'success');
                }, 3000);

            } catch (err) {
                updateStatus(`❌ 处理失败: ${err.message}`, 'error');
                document.getElementById('processBtn').disabled = false;
                console.error('处理错误:', err);
            }
        }

        // ================= 工具函数 =================
        function updateStatus(msg, type) {
            const el = document.getElementById('status');
            if (!el) return;

            // 支持HTML标签（如<br>）
            el.innerHTML = `<span>${getIconForType(type)}</span><span>${msg}</span>`;
            el.className = `status ${type}`;
        }

        function getIconForType(type) {
            const icons = { 'info': 'ℹ️', 'success': '✅', 'error': '❌', 'warning': '⚠️' };
            return icons[type] || 'ℹ️';
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 额外：如果用户通过input选择了文件但未触发change（罕见情况），确保状态更新
        document.getElementById('fileInput').addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                handleFileSelect(this);
            }
        });
    </script>
</body>
</html>
