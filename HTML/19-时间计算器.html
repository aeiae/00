<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563eb;
        }

        .result {
            margin-top: 20px;
            padding: 22px 18px;
            background-color: #eff6ff;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            color: #1e3a8a;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .result .day-tag {
            display: inline-block;
            padding: 3px 10px;
            background-color: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            font-size: 14px;
            font-weight: normal;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 20px;
            }

            .result {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>时间计算器</h1>

        <div class="form-group">
            <label for="startTime">起始时间</label>
            <input type="datetime-local" id="startTime" oninput="calculate()">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="hours">加几小时</label>
                <input type="number" id="hours" value="18" min="0" step="0.1" oninput="calculate()">
            </div>
            <div class="form-group">
                <label for="minutes">加几分钟</label>
                <input type="number" id="minutes" value="0" min="0" oninput="calculate()">
            </div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        // 页面加载自动填充当前时间并计算
        window.onload = function () {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('startTime').value = now.toISOString().slice(0, 16);
            calculate();
        };

        function calculate() {
            const startTimeStr = document.getElementById('startTime').value;
            const hours = parseFloat(document.getElementById('hours').value) || 0;
            const minutes = parseFloat(document.getElementById('minutes').value) || 0;

            if (!startTimeStr) {
                document.getElementById('result').textContent = '请选择起始时间';
                return;
            }

            const startDate = new Date(startTimeStr);
            const addMilliseconds = (hours * 60 + minutes) * 60 * 1000;
            const endDate = new Date(startDate.getTime() + addMilliseconds);

            // 计算天数差
            const startDay = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const endDay = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
            const dayDiff = Math.round((endDay - startDay) / (1000 * 60 * 60 * 24));

            // 格式化结果
            const year = endDate.getFullYear();
            const month = String(endDate.getMonth() + 1).padStart(2, '0');
            const day = String(endDate.getDate()).padStart(2, '0');
            const hour = String(endDate.getHours()).padStart(2, '0');
            const minute = String(endDate.getMinutes()).padStart(2, '0');

            let dayText = '';
            if (dayDiff === 0) {
                dayText = '当天';
            } else if (dayDiff === 1) {
                dayText = '次日';
            } else {
                dayText = dayDiff + '天后';
            }

            document.getElementById('result').innerHTML = 
                `${year}-${month}-${day} ${hour}:${minute}
                <span class="day-tag">${dayText}</span>`;
        }
    </script>
</body>
</html>
