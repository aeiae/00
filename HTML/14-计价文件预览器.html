<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计价数据预览器</title>
<style>
:root{
  --bg:#eef1f5; --panel:#fff; --line:#d5dbe2; --line2:#e6eaef;
  --bar:#2f4d75; --bar2:#3a5f8f;
  --pri:#3d6db5; --pri-d:#2f5a99; --pri-l:#e8f0fa;
  --txt:#333a42; --txt2:#6b7683; --txt3:#9aa4b0;
  --sumbg:#fdf8e4; --leafbg:#f0f8ec; --red:#d0342c; --zebra:#fdfae9;
  --matbg:#fbfaf3; --leafcat:#4d7a3a; --subcat:#7a5fa8; --matcat:#b0782a;
}
html[data-theme="dark"]{
  --bg:#1b1f25; --panel:#242933; --line:#38404c; --line2:#2d343e;
  --bar:#1f2c40; --bar2:#273849;
  --pri:#5b8ecb; --pri-d:#4a7ab5; --pri-l:#28313e;
  --txt:#d8dde4; --txt2:#96a1ad; --txt3:#69737f;
  --sumbg:#332e1c; --leafbg:#24301f; --red:#e07068; --zebra:#2a2c22;
  --matbg:#272b33; --leafcat:#789e63; --subcat:#9184b2; --matcat:#a08a5e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:12px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,132,150,.35);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,132,150,.6);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶栏 ===== */
#top{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,var(--bar2),var(--bar));color:#fff;flex:0 0 auto}
#top .crumb{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0}
#top .crumb .seg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#top .crumb svg{flex:0 0 auto;opacity:.9}
#top .sp{flex:1}
#top .app{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}

/* ===== 工具栏 ===== */
#tools{height:32px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.tbtn{height:23px;padding:0 9px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--txt);border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
.tbtn.acc{background:var(--pri);border-color:var(--pri);color:#fff}
.tbtn.acc:hover{background:var(--pri-d);color:#fff}
#tools .sp{flex:1}
#q{height:23px;width:170px;padding:0 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:11px}
#q:focus{outline:none;border-color:var(--pri)}

#main{display:flex;height:calc(100% - 34px - 32px - 24px)}

/* ===== 左侧：项目列表 ===== */
#nav{width:186px;flex:0 0 186px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:0 0 24px}
.pgrp{height:24px;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11px;font-weight:600;color:var(--txt2);background:var(--line2);position:sticky;top:0;z-index:2}
.pnode{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--line2);user-select:none}
.pnode:hover{background:var(--line2)}
.pnode.on{background:var(--pri-l);color:var(--pri)}
.pnode .lb{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pnode .pv{flex:0 0 auto;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
.pnode.on .pv{color:var(--pri)}
.padd{padding:6px 8px}
.padd button{width:100%;height:23px;border:1px dashed var(--line);border-radius:3px;color:var(--txt2);font-size:11px}
.padd button:hover{border-color:var(--pri);color:var(--pri)}
.pnode.drag{opacity:.4}
.pnode .grip{flex:0 0 auto;width:8px;color:var(--txt3);font-size:10px;letter-spacing:-1px;cursor:grab}
#dragline{position:fixed;left:0;width:186px;height:2px;background:var(--pri);z-index:95;display:none;pointer-events:none}
#dragline.on{display:block}
body.dragging{user-select:none;cursor:grabbing}

/* 右键菜单 */
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:172px;padding:3px;display:none}
.menu.on{display:block}
.menu .mi{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.menu .mi:hover{background:var(--pri-l);color:var(--pri)}
.menu .mi.dg:hover{background:#fdeaea;color:var(--red)}
.menu .mi .sub{font-size:10px;color:var(--txt3);margin-left:auto}
.menu hr{border:none;border-top:1px solid var(--line2);margin:3px 0}

/* ===== 右侧 ===== */
#pane-inner.fullh{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:4px 6px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow-x:auto}
.bar .bt{flex:0 0 auto;font-size:11px;color:var(--txt2);padding-right:4px}
.pc{flex:0 0 auto;height:21px;padding:0 9px;line-height:21px;border-radius:11px;font-size:11px;color:var(--txt2);border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.pc:hover{border-color:var(--pri);color:var(--pri)}
.pc.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
#pane-inner.fullh .gt-card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:100%;margin:0}
#pane-inner.fullh .gt-wrap{flex:1;min-height:0;max-height:none}

/* 分部分项：左侧目录树 + 右侧表格 */
.billwrap{display:flex;gap:8px;min-height:0}
.billtree{width:210px;flex:0 0 210px;background:var(--panel);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;overflow:hidden}
.billtree .th{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--pri-d);border-bottom:1px solid var(--line);background:var(--panel)}
.billtree .th .sp{flex:1}
.billtree .th .mini{font-size:10px;font-weight:400;color:var(--txt2)}
.billtree .tl{flex:1;min-height:0;overflow:auto}
.tn{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
.tn:hover{background:var(--line2)}
.tn.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.tn .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tn .amt{margin-left:auto;padding-left:6px;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
.tn.on .amt{color:var(--pri)}
.tn.root{font-weight:600;background:var(--line2)}
.tn .lv{flex:0 0 auto;font-size:10px;padding:0 4px;border-radius:7px;background:var(--pri-l);color:var(--pri);font-weight:400}
.pc.clr{border-style:dashed;color:var(--pri);border-color:var(--pri)}
.billmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#pane-inner.fullh .billwrap{flex:1;min-height:0}
#pane-inner.fullh .billmain{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
#pane-inner.fullh .billmain .gt-card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:100%;margin:0}
#pane-inner.fullh .billmain .gt-wrap{flex:1;min-height:0;max-height:none}

/* 表头排序 */
.gt thead th.srt{cursor:pointer}
.gt thead th.srt:hover{background:var(--pri-l)}
.gt th .ar{font-size:9px;color:var(--pri);margin-left:2px}
.card[data-act]{cursor:context-menu}
.blk[data-top]>h3{cursor:context-menu}
.blk[data-top]>h3 .n{color:var(--txt3);font-weight:400}

#work{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px}
.tab{height:25px;padding:0 14px;border-radius:3px;border:1px solid var(--line);font-size:12px;color:var(--txt);background:var(--panel);white-space:nowrap}
.tab:hover{border-color:var(--pri);color:var(--pri)}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
#pane{flex:1;overflow:auto;background:var(--bg);position:relative;padding:8px}
#status{height:24px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--line2);border-top:1px solid var(--line);font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden}
#status b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}

/* ===== 表格 ===== */
.gt-card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:0 auto;max-width:100%}
.gt-head{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.gt-head .tt{font-size:12px;font-weight:600;color:var(--pri-d)}
.gt-head .sp{flex:1}
.gt-head .mini{font-size:11px;color:var(--txt2)}
.gt-wrap{overflow:auto;max-height:calc(100vh - 210px)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}
.gt thead th{position:sticky;top:0;z-index:3;background:var(--panel);color:var(--pri);font-weight:600;text-align:center;height:26px;padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;user-select:none}
.gt thead th:last-child{border-right:none}
.gt td{height:24px;padding:0 6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt td:last-child{border-right:none}
.gt tbody tr:hover td{background:var(--pri-l)}
.gt tr.sum td{background:var(--sumbg);font-weight:700}
.gt tr.sum td.amt{color:var(--red)}
.gt tr.grp td{background:var(--panel);font-weight:600}
.gt tr.leaf td{background:var(--leafbg)}
.gt tr.sub td{background:var(--panel);color:var(--txt2)}
.gt tr.mat td{background:var(--matbg);color:var(--txt2)}
.gt tr.hid{display:none}
.gt td.cat{text-align:center;font-size:11px;color:var(--txt3)}
.gt tr.leaf td.cat{color:var(--leafcat)}
.gt tr.mat td.cat{color:var(--matcat)}
.gt tr.sub td.cat{color:var(--subcat)}
.gt .t-r{text-align:right;font-variant-numeric:tabular-nums}
.gt .t-c{text-align:center}
.gt .amt{color:var(--red)}
.gt .arw{display:inline-block;width:12px;color:var(--txt2);font-size:9px;cursor:pointer;user-select:none;text-align:center}
.gt .dep1{padding-left:20px}
.gt .dep2{padding-left:38px}
.gt .dep3{padding-left:56px}
.gt .dep4{padding-left:74px}
.gt .dep5{padding-left:92px}
.empty{padding:34px;text-align:center;color:var(--txt3);font-size:12px;line-height:2}

table.kv td{height:25px}
table.kv tbody tr:nth-child(odd) td{background:var(--zebra)}
table.kv tbody tr:hover td{background:var(--pri-l)}
table.kv .kn{width:34%;font-weight:400;color:var(--txt2)}
table.kv .vv{font-weight:600}
.inpf{width:88px;height:20px;border:1px solid var(--line);border-radius:2px;padding:0 4px;font-size:11px;background:var(--panel)}

/* 图表 */
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;flex:1;min-width:148px;padding:8px 10px}
.card .k{font-size:11px;color:var(--txt2)}
.card .v{font-size:17px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.card .s{font-size:10px;color:var(--txt3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:0 auto 8px}
.blk>h3{font-size:12px;font-weight:600;color:var(--pri-d);padding:6px 10px;border-bottom:1px solid var(--line2)}
.blk .bd{padding:10px}
.flexr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.lg .n{width:96px;overflow:hidden;text-overflow:ellipsis}
.lg .v{font-variant-numeric:tabular-nums;color:var(--txt2)}
.lg .p{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
.brow{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:5px}
.brow .n{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .b{flex:1;height:11px;background:var(--line2);border-radius:2px;overflow:hidden}
.brow .b i{display:block;height:100%;border-radius:2px}
.brow .v{width:100px;text-align:right;font-variant-numeric:tabular-nums}
.brow .p{width:46px;text-align:right;color:var(--txt2);font-variant-numeric:tabular-nums}
.note-p{font-size:12px;line-height:1.9;color:var(--txt);white-space:pre-wrap}

/* 弹窗 */
#mask{position:fixed;inset:0;background:rgba(20,28,38,.42);display:none;z-index:50;align-items:center;justify-content:center}
#mask.on{display:flex}
.dlg{background:var(--panel);border-radius:4px;width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h4{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line);color:var(--pri-d);flex:0 0 auto}
.dlg .bd{padding:12px 14px;font-size:12px;line-height:1.8;overflow:auto}
.dlg .ft{padding:9px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto}
.dlg code{background:var(--line2);padding:1px 5px;border-radius:2px;font-size:11px}
.dlg ol{margin:6px 0 6px 18px}
.dlg li{margin:3px 0}
.dlg .note{background:var(--pri-l);border-left:3px solid var(--pri);padding:7px 10px;margin:6px 0;border-radius:0 3px 3px 0}
.pbtn{height:27px;padding:0 14px;border-radius:3px;background:var(--pri);color:#fff;font-size:12px}
.pbtn.gh{background:transparent;border:1px solid var(--line);color:var(--txt)}
.imp{display:flex;gap:10px;min-height:320px}
.imp .side{width:150px;flex:0 0 auto;border-right:1px solid var(--line2);padding-right:8px}
.imp .side .it{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:3px;cursor:pointer;font-size:12px;color:var(--txt2)}
.imp .side .it:hover{background:var(--line2)}
.imp .side .it.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.imp .side .it .st{margin-left:auto;font-size:10px}
.imp .side .it .st.ok{color:#3d8b5f}
.imp .side .it .st.no{color:var(--txt3)}
.imp .main{flex:1;min-width:0;display:flex;flex-direction:column}
.imp textarea{flex:1;min-height:280px;width:100%;resize:none;border:1px solid var(--line);border-radius:3px;padding:8px;font:11px/1.6 Consolas,"Microsoft YaHei",monospace;background:var(--panel);white-space:pre;overflow:auto}
.imp textarea:focus{outline:none;border-color:var(--pri)}
.imp .tip{font-size:11px;color:var(--txt2);margin-bottom:6px}
.imp .res{font-size:11px;margin-top:6px;color:var(--pri)}

@media print{
  #top,#nav,#tabs,#tools,#status{display:none!important}
  #main{display:block;height:auto}
  #pane{overflow:visible;padding:0}
  .gt-wrap{max-height:none;overflow:visible}
  body{overflow:visible}
  .billwrap{display:block}
  .billtree{display:none}
  .bar{display:none}
}
</style>
</head>
<body>

<header id="top">
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <span class="app">计价数据预览器 · 粘贴即可看 · 本地运行</span>
</header>

<div id="tools">
  <button class="tbtn acc" id="bImp">粘贴数据</button>
  <button class="tbtn" id="bDemo">示例工程</button>
  <span style="width:1px;height:16px;background:var(--line)"></span>
  <button class="tbtn" id="bCsv">导出CSV</button>
  <button class="tbtn" id="bPrint">打印</button>
  <button class="tbtn" id="bHelp">格式说明</button>
  <span class="sp"></span>
  <input id="q" placeholder="在当前表中搜索…">
  <button class="tbtn" id="bTheme" title="切换深浅主题">主题</button>
</div>

<div id="main">
  <nav id="nav"></nav>
  <section id="work">
    <div id="tabs"></div>
    <div id="pane"></div>
    <div id="status"></div>
  </section>
</div>

<div class="menu" id="menu"></div>
<div id="dragline"></div>
<div id="mask"><div class="dlg" id="dlg"></div></div>

<script>
"use strict";
/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : null;
  if(v == null) return null;
  let s = String(v).trim().replace(/[,，\s￥¥$%]/g,'');
  if(!s || s === '—' || s === '-' || s === '－') return null;
  if(/^\(.*\)$/.test(s)) s = '-' + s.slice(1,-1);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmt(n, d){
  if(n == null || isNaN(n)) return '';
  const neg = n < 0, a = Math.abs(n);
  return (neg?'-':'') + a.toLocaleString('zh-CN',{minimumFractionDigits:d, maximumFractionDigits:d});
}
const money = n => fmt(n, 2);
const r2 = n => Math.round(n * 100) / 100;
/* 数量：最多 4 位小数，去掉多余的 0 */
function qf(n){
  if(n == null || isNaN(n)) return '';
  let s = n.toFixed(4);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, m => m);
}
function qfc(n){
  if(n == null || isNaN(n)) return '';
  const p = String(n).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
const qtyf = n => { const s = qf(n); return s ? qfc(s) : ''; };
function rmbUpper(n){
  if(n == null || isNaN(n)) return '';
  const CN = '零壹贰叁肆伍陆柒捌玖', DU = ['仟','佰','拾',''], GW = ['','万','亿'];
  let neg = n < 0; const t = Math.round(Math.abs(n) * 100);
  let y = Math.floor(t / 100), j = Math.floor(t % 100 / 10), f = t % 10;
  if(!y && !j && !f) return '零元整';
  let gs = String(y), groups = [];
  while(gs.length > 4){ groups.unshift(gs.slice(-4)); gs = gs.slice(0, -4); }
  groups.unshift(gs);
  let s = '';
  groups.forEach((g, gi) => {
    const nn = g.padStart(4, '0').split('').map(Number);
    let out = '', zero = false;
    nn.forEach((d, i) => {
      if(d === 0){ zero = true; }
      else { out += (zero && out ? '零' : '') + CN[d] + DU[i]; zero = false; }
    });
    if(out) s += out + GW[groups.length - 1 - gi];
  });
  s = s || '零';
  s += '元';
  if(!j && !f) s += '整';
  else { if(!j) s += '零'; else s += CN[j] + '角'; if(f) s += CN[f] + '分'; }
  return (neg ? '负' : '') + s;
}

/* =========================================================
   1. 表头定义 / 粘贴解析
   ========================================================= */
const H = {
  analysis: ['名称','内容'],
  overview: ['名称','内容'],
  bill:     ['编码','类别','名称','项目特征','规格型号','单位','工程量表达式','含量','工程量','单价','合价','综合单价','综合合价','单价构成文件','取费专业','人工费价格指数','机械费价格指数','管理费价格指数','备注'],

const norm = s => String(s == null ? '' : s).replace(/[\s:：()（）%]/g,'').toLowerCase();
/* 表头行 → 表类型：与该表标准表头做「前缀连续匹配」，取匹配最长者 */
function detectKind(row){
  let best = '';
  let bn = 0;
  Object.keys(H).forEach(k => {
    if(k === 'analysis' || k === 'overview') return;
    const h = H[k];
    let n = 0;
    while(n < h.length && n < row.length && norm(row[n]) === norm(h[n])) n++;
    if(n > bn){ bn = n; best = k; }
  });
  if(row.length >= 2 && norm(row[0]) === '名称' && norm(row[1]) === '内容' && bn < 2) return 'kv';
  return bn >= 3 ? best : '';
}
/* 名称/内容 两列表 → 造价分析 还是 工程概况 */
function kvKind(rows){
  const keys = rows.map(r => String(r[0] || '')).join('|');
  if(/工程总造价|分部分项工程费|措施项目费|规费|增值税|单方造价|其中/.test(keys)) return 'analysis';
  if(/合同号|工程名称|专业|编制|审核|编制依据/.test(keys)) return 'overview';
  return 'overview';
}
/* 行分割：Excel 复制的 TSV 中「行」用 \r\n 结束，而单元格内部的软换行是单独的 \n。
   所以只要文本里出现过 \r，就按 \r 断行，单元格内的 \n 原样保留（不丢项目特征里的换行）。 */
function splitLines(t){
  const s = String(t == null ? '' : t);
  let lines;
  if(s.indexOf('\r') >= 0){
    lines = s.replace(/\r\n/g, '\r').replace(/\n\r/g, '\r').split('\r');
  } else {
    lines = s.split('\n');
  }
  return lines.map(l => l.split('\t').map(c => String(c).trim()))
    .filter(l => l.some(c => c !== ''));
}
/* 单元格内换行 → 显示为 ↵ 记号（数据本身不丢，title / 导出都是原文） */
const nlMark = s => String(s == null ? '' : s).replace(/\r/g, '').replace(/\n/g, ' ↵ ');

/* 把一整段粘贴文本切成若干张表：{kind, head, rows} */
function parseClip(text){
  const lines = splitLines(text);
  if(!lines.length) return [];
  const out = [];
  let cur = null;
  const push = () => { if(cur && cur.rows.length) out.push(cur); cur = null; };
  let first = true;
  lines.forEach(l => {
    const k = detectKind(l);
    if(k){
      push();
      cur = { kind:k, head:l, rows:[] };
      first = false;
      return;
    }
    if(!cur){
      /* 没有表头就先攒着，等后面出现表头时丢弃；这里建一个"裸表" */
      cur = { kind:'?', head:[], rows:[l] };
      return;
    }
    cur.rows.push(l);
  });
  push();
  /* 裸表：尝试用标准表头补齐 */
  const res = [];
  out.forEach(t => {
    if(t.kind === '?'){
      const k2 = guessRawKind(t.rows);
      if(!k2) return;
      const t2 = { kind:k2, head:H[k2].slice(), rows:t.rows.filter(r => !sameHead(r, H[k2])) };
      res.push(t2);
    } else if(t.kind === 'kv'){
      const kk = kvKind(t.rows);
      res.push({ kind:kk, head:H[kk].slice(), rows:t.rows.filter(r => !(r[0] === '名称' && r[1] === '内容')) });
    } else res.push(t);
  });
  return res;
}
const sameHead = (r, h) => r.length >= 2 && norm(r[0]) === norm(h[0]) && norm(r[1]) === norm(h[1]);
function guessRawKind(rows){
  let best = '', bs = 0;
  Object.keys(H).forEach(k => {
    if(k === 'analysis' || k === 'overview') return;
    const h = H[k];
    let s = 0;
    rows.slice(0, 40).forEach(r => {
      if(r.length !== h.length && r.length !== h.length - 1) return;
      s++;
    });
    if(s > bs){ bs = s; best = k; }
  });
  return bs ? best : '';
}
/* 行 → 对象（按表头列名） */
function toObj(head, row){
  const m = {};
  head.forEach((c, i) => { m[c] = row[i] == null ? '' : row[i]; });
  return m;
}
function colMap(head){
  const m = {};
  H_ALL.forEach(k => {
    for(let i = 0; i < head.length; i++){
      if(norm(head[i]) === norm(k)){ m[k] = i; return; }
    }
  });
  return m;
}
const H_ALL = (function(){
  const s = {};
  Object.keys(H).forEach(k => H[k].forEach(c => { s[c] = 1; }));
  return Object.keys(s);
})();

/* 分部层级推断（支持到四级）：
   维护一个「剩余额度栈」——分部入栈并记下它还没被认领的金额，
   清单行按顺序扣减栈顶的剩余额度；某个分部额度扣完就出栈。
   这样兄弟分部、嵌套分部都能判断正确，不再依赖金额巧合。 */
function assignTree(rows){
  const stack = [], eps = 0.05;
  const rest = s => (s.length ? s[s.length - 1].remain : Infinity);
  rows.forEach(x => {
    if(x.cat === '部'){
      const a = num(x.total) != null ? num(x.total) : num(x.amount);
      while(stack.length && a != null && a > rest(stack) + eps) stack.pop();
      x._d = stack.length;
      if(stack.length && a != null) stack[stack.length - 1].remain = r2(stack[stack.length - 1].remain - a);
      stack.push({ x:x, remain:(a == null ? Infinity : a) });
    } else if(x.cat === '项'){
      const a = num(x.total) != null ? num(x.total) : num(x.amount);
      if(a != null && stack.length) stack[stack.length - 1].remain = r2(stack[stack.length - 1].remain - a);
    }
  });
  /* 保险：层级最多 4 级（相对根） */
  rows.forEach(x => { if(x.cat === '部' && x._d > 3) x._d = 3; });
}
const xhDepth = xh => {
  const s = String(xh == null ? '' : xh).trim();
  if(!s) return 0;
  const m = s.match(/^(\d+(?:\.\d+)*)/);
  if(!m) return 0;
  return m[1].split('.').length - 1;
};

/* 分部分项：部 / 项 / 定 / 主 四类 */
function rowsBill(t){
  const cm = colMap(t.head);
  const raw = [];
  t.rows.forEach(r => {
    const code  = (cm['编码'] != null ? r[cm['编码']] : '') || '';
    const cat   = String((cm['类别'] != null ? r[cm['类别']] : '') || '').trim();
    const name  = (cm['名称'] != null ? r[cm['名称']] : '') || '';
    raw.push({
      code: code, cat: cat, name: name,
      feat:  cm['项目特征'] != null ? r[cm['项目特征']] : '',
      spec:  cm['规格型号'] != null ? r[cm['规格型号']] : '',
      unit:  cm['单位'] != null ? r[cm['单位']] : '',
      expr:  cm['工程量表达式'] != null ? r[cm['工程量表达式']] : '',
      hl:    num(cm['含量'] != null ? r[cm['含量']] : ''),
      qty:   num(cm['工程量'] != null ? r[cm['工程量']] : ''),
      price: num(cm['单价'] != null ? r[cm['单价']] : ''),
      amount:num(cm['合价'] != null ? r[cm['合价']] : ''),
      up:    num(cm['综合单价'] != null ? r[cm['综合单价']] : ''),
      total: num(cm['综合合价'] != null ? r[cm['综合合价']] : ''),
      note:  cm['备注'] != null ? r[cm['备注']] : ''
    });
  });
  /* 分部行：类别=部 */
  const parts = raw.filter(x => x.cat === '部');
  parts.forEach(p => { p.amount = p.total != null ? p.total : p.amount; });
  assignTree(raw);
  const out = [];
  let curPartD = -1, curLeafD = -1, last = null, rootDone = false;
  raw.forEach(x => {
    if(x.cat === '部'){
      curPartD = x._d == null ? 0 : x._d;
      curLeafD = -1;
      out.push({ _cls:'grp', _dep:curPartD, _kids:1, c:x });
    } else if(!x.cat && !rootDone && /整个项目|合计/.test(x.name)){
      rootDone = true;
      out.push({ _cls:'sum', _dep:0, _kids:1, c:x });
    } else if(x.cat === '项'){
      curLeafD = curPartD + 1;
      out.push({ _cls:'leaf', _dep:curLeafD, _kids:1, c:x });
      last = 'leaf';
    } else if(x.cat === '定'){
      out.push({ _cls:'sub', _dep:(curLeafD < 0 ? 1 : curLeafD + 1), c:x });
    } else if(x.cat === '主'){
      out.push({ _cls:'mat', _dep:(curLeafD < 0 ? 1 : curLeafD + 1), c:x });
    } else {
      out.push({ _cls:'', _dep:(curLeafD < 0 ? 0 : curLeafD), c:x });
    }
  });
  /* 有「整个项目」根行时，其余整体下沉一级 */
  if(rootDone) out.forEach(r => { if(r._cls !== 'sum') r._dep = (r._dep || 0) + 1; });
  /* 可折叠标记 */
  for(let i = 0; i < out.length; i++) if(i + 1 < out.length && out[i + 1]._dep > out[i]._dep) out[i]._kids = 1;
  return out;
}
/* 措施项目 */
function rowsMeasure(t){
  const cm = colMap(t.head);
  const raw = t.rows.map(r => ({
    xh:    cm['序号'] != null ? r[cm['序号']] : '',
    cat:   String(cm['类别'] != null ? r[cm['类别']] : '').trim(),
    name:  cm['名称'] != null ? r[cm['名称']] : '',
    unit:  cm['单位'] != null ? r[cm['单位']] : '',
    qty:   num(cm['工程量'] != null ? r[cm['工程量']] : ''),
    mode:  cm['组价方式'] != null ? r[cm['组价方式']] : '',
    base:  cm['计算基数'] != null ? r[cm['计算基数']] : '',
    rate:  num(cm['费率(%)'] != null ? r[cm['费率(%)']] : ''),
    up:    num(cm['综合单价'] != null ? r[cm['综合单价']] : ''),
    total: num(cm['综合合价'] != null ? r[cm['综合合价']] : ''),
    mcat:  cm['措施类别'] != null ? r[cm['措施类别']] : '',
    note:  cm['备注'] != null ? r[cm['备注']] : ''
  }));
  /* 层级按广联达序号规则：一/二 → 01/02 → 清单编码 → 定额行 */
  const res = [];
  let lastD = 0, inSub = false;
  raw.forEach((x, i) => {
    const xh = String(x.xh || '').trim();
    const isQuota = !!x.cat && /-/.test(xh);          /* 定额行：类别非空且序号形如 7-6-HA1 */
    let d;
    if(isQuota) d = lastD + 1;
    else if(i === 0 || !/^[\d一二三四五六七八九十]/.test(xh)) d = 0;
    else if(/^[一二三四五六七八九十]+$/.test(xh)){ d = 1; inSub = false; }
    else if(/^\d{1,2}$/.test(xh)){ d = 2; inSub = true; }
    else if(/^\d{9,12}$/.test(xh)){ d = inSub ? 3 : 2; }
    else d = 2;
    if(!isQuota) lastD = d;
    res.push({ _cls:(d <= 1 ? 'sum' : 'grp'), _dep:d, c:x });
  });
  for(let i = 0; i < res.length; i++) if(i + 1 < res.length && res[i + 1]._dep > res[i]._dep) res[i]._kids = 1;
  return res;
}
/* 其他项目 / 费用汇总（按序号层级） */

    cat:   cm['费用类别'] != null ? r[cm['费用类别']] : '',
    nocomp:cm['不可竞争费'] != null ? r[cm['不可竞争费']] : '',
    notot: cm['不计入合价'] != null ? r[cm['不计入合价']] : '',
    note:  cm['备注'] != null ? r[cm['备注']] : ''
  }));
  const res = [];
  let base = 0;
  raw.forEach((x, i) => {
    let d;
    if(i === 0 && !/^[\d]/.test(String(x.xh).trim())){ d = 0; base = 1; }
    else d = xhDepth(x.xh) + 1;
    const root = (d <= 1);
    res.push({ _cls:root ? 'sum' : '', _dep:d, c:x });
  });
  for(let i = 0; i < res.length; i++) if(i + 1 < res.length && res[i + 1]._dep > res[i]._dep) res[i]._kids = 1;
  return res;
}

const isHeadRow = (r, head) => r.length >= 3 && head.length >= 3 &&
  norm(r[0]) === norm(head[0]) && norm(r[1]) === norm(head[1]) && norm(r[2]) === norm(head[2]);
/* 把解析出的表写入 DB（同类型多段会自动合并，重复的页表头行会被剔除） */
function applyTables(tabs, db){
  const byK = {};
  tabs.forEach(t => { (byK[t.kind] = byK[t.kind] || []).push(t); });
  let n = 0;
  Object.keys(byK).forEach(k => {
    const list = byK[k];
    if(k === 'analysis' || k === 'overview'){
      const m = new Map();
      list.forEach(t => rowsKv(t).forEach(x => { if(x.k) m.set(x.k, x.v); }));
      db[k] = Array.from(m.keys()).map(key => ({ k:key, v:m.get(key) }));
    } else {
      const head = list[0].head;
      const rows = [].concat.apply([], list.map(t => t.rows)).filter(r => !isHeadRow(r, head));
      const merged = { kind:k, head:head, rows:rows };
      if(k === 'bill') db.bill = rowsBill(merged);
      else if(k === 'measure') db.measure = rowsMeasure(merged);
      else if(k === 'other') db.other = rowsXh(merged, 'other');
      else if(k === 'fee') db.fee = rowsXh(merged, 'fee');
      else if(k === 'res') db.res = rowsRes(merged);
    }
    n++;
  });
  /* 工程名：概况表的「工程名称」 */
  const on = db.overview.find(x => x.k === '工程名称');
  db.meta.name = on ? on.v : '';
  return n;
}

function cellTxt(col, v, row){
  if(v == null || v === '') return '';
  if(col.t === 'n'){
    const n = num(v);
    if(n == null) return '';
    if(col.k === 'rate') return fmt(n, 2);
    if(col.k === 'qty' || col.k === 'hl') return qtyf(n);
    return money(n);
  }
  return String(v);
}

function rowsHtml(rows, cols){
  return rows.map((r, j) => {
    let s = '<tr class="' + (r._cls || '') + (r._hid ? ' hid' : '') + '" data-i="' + j + '">';
    cols.forEach(c => {
      const v = r.c[c.k];
      const cls = (c.t === 'n' ? 't-r' : (c.c ? 't-c' : '')) + (c.amt ? ' amt' : '') +
        (c.tree && !c.ni ? ' dep' + Math.min(r._dep || 0, 5) : '') + (c.k === 'cat' ? ' cat' : '');
      let txt = esc(nlMark(cellTxt(c, v, r)));
      if(c.tree) txt = '<span class="arw" data-a="' + j + '">' + (r._kids ? '▶' : '') + '</span>' + txt;
      const raw = cellTxt(c, v, r);
      s += '<td class="' + cls + '"' + (raw !== '' && (c.k === 'name' || c.k === 'feat' || c.k === 'spec' || c.k === 'base' || c.k === 'bdesc') ? ' title="' + esc(raw) + '"' : '') + '>' + txt + '</td>';
    });
    return s + '</tr>';
  }).join('');
}
function grid(cols, rows, opt){
  opt = opt || {};
  const totalW = cols.reduce((s, c) => s + c.w, 0);
  /* 宽度：按比例撑满容器，窄于 1000px 时才横向滚动 */
  let h = '<div class="gt-card"' + (totalW ? ' style="min-width:' + Math.min(totalW, 1000) + 'px"' : '') + '>';
  if(opt.title || opt.sub || opt.extra){
    h += '<div class="gt-head"><span class="tt">' + esc(opt.title || '') + '</span>' +
      (opt.sub ? '<span class="mini">' + esc(opt.sub) + '</span>' : '') + '<span class="sp"></span>' +
      (opt.extra ? '<span class="mini">' + esc(opt.extra) + '</span>' : '') + '</div>';
  }
  h += '<div class="gt-wrap" id="gtw"><table class="gt"><colgroup>' +
    cols.map(c => '<col style="width:' + c.w + 'px">').join('') + '</colgroup><thead><tr>' +
    cols.map(c => {
      if(!opt.sort) return '<th>' + esc(c.l) + '</th>';
      const on = SORT.k === c.k;
      return '<th class="srt" data-s="' + c.k + '" title="点击排序">' + esc(c.l) +
        (on ? '<span class="ar">' + (SORT.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead><tbody>';
  h += rowsHtml(rows, cols);
  h += '</tbody></table></div></div>';
  return h;
}
/* 过滤 + 折叠 */
function visible(rows, cols){
  const q = Q.trim().toLowerCase();
  let vis = rows.map(() => true);
  if(q){
    rows.forEach((r, i) => {
      let hit = false;
      for(let j = 0; j < cols.length && !hit; j++){
        const v = cellTxt(cols[j], r.c[cols[j].k], r);
        if(v && String(v).toLowerCase().indexOf(q) >= 0) hit = true;
      }
      vis[i] = hit;
    });
    for(let i = rows.length - 1; i >= 0; i--){
      if(!vis[i]) continue;
      let d = rows[i]._dep || 0;
      for(let j = i - 1; j >= 0; j--){
        if((rows[j]._dep || 0) < d){ vis[j] = true; d = rows[j]._dep || 0; }
      }
    }
  }
  const out = [];
  let hid = -1;
  rows.forEach((r, i) => {
    if(!vis[i]){ out.push(Object.assign({}, r, { _hid:1 })); return; }
    if(hid >= 0 && (r._dep || 0) <= hid) hid = -1;
    const o = Object.assign({}, r);
    if(hid >= 0) o._hid = 1;
    out.push(o);
    if(o._kids && COLL.has(i) && hid < 0) hid = r._dep || 0;
  });
  return out;
}

function donut(items, size){
  size = size || 132;
  const total = items.reduce((s, x) => s + Math.abs(x.v), 0) || 1;
  const R = size / 2, r = R * 0.6, cx = R, cy = R;
  let a = -Math.PI / 2, paths = '';
  items.forEach((x, i) => {
    if(!x.v) return;
    const ang = Math.abs(x.v) / total * Math.PI * 2;
    const a2 = a + ang;
    const big = ang > Math.PI ? 1 : 0;
    const p = (rr, aa) => (cx + rr * Math.cos(aa)).toFixed(2) + ',' + (cy + rr * Math.sin(aa)).toFixed(2);
    paths += '<path d="M' + p(R, a) + ' A' + R + ',' + R + ' 0 ' + big + ' 1 ' + p(R, a2) +
      ' L' + p(r, a2) + ' A' + r + ',' + r + ' 0 ' + big + ' 0 ' + p(r, a) + ' Z" fill="' + PAL[i % PAL.length] + '"><title>' + esc(x.n) + ' ' + money(x.v) + '</title></path>';
    a = a2;
  });
  return '<svg width="' + size + '" height="' + size + '" style="flex:0 0 auto">' + paths +
    '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="10" fill="var(--txt2)">合计</text>' +
    '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">' + money(items.reduce((s, x) => s + x.v, 0)) + '</text></svg>';
}

  '<span class="v">' + money(x.v) + '</span><span class="p">' + fmt(x.p, 1) + '%</span></div>').join('') + '</div>';

/* 分部分项：根行所在深度（有「整个项目」根行时为 1，否则 0） */
const billRootD = () => (DB.bill.length && DB.bill[0]._cls === 'sum' ? 1 : 0);
/* 分部最大层级（1~4） */
function billMaxLv(){
  const rd = billRootD();
  let m = 0;
  DB.bill.forEach(r => { if(r._cls === 'grp') m = Math.max(m, (r._dep || 0) - rd + 1); });
  return Math.min(Math.max(m, 1), 4);
}
/* 当前层级视图的列（可用表头右键自定义，按层级分别记忆） */
function billCols(){
  const d = DB.bcols || (DB.bcols = {});
  const L = curLvl();
  let keys = d[L];
  /* 默认：定额层级看单价/合价，其余层级（全部/一级~四级/清单）只看 9 列 */
  if(!keys) keys = (L === 'quota' ? QUOTA_KEYS : LVL_KEYS);
  return keys.map(k => BILL_COLS.find(c => c.k === k)).filter(Boolean);
}
/* 当前生效层级：目录节点单独设置的层级 > 顶部层级按钮 */
function curLvl(){
  if(SEL >= 0 && DB.blvl && DB.blvl[SEL]) return DB.blvl[SEL];
  return LVL;
}
const lvlName = k => ((LVL_TABS.find(t => t.k === k) || {}).l || '全部');
/* 取某节点的子树行（含自身） */
function subRows(i){
  const base = DB.bill[i];
  if(!base) return [];
  const d = base._dep || 0, out = [base];
  for(let j = i + 1; j < DB.bill.length; j++){
    if((DB.bill[j]._dep || 0) <= d) break;
    out.push(DB.bill[j]);
  }
  return out;
}
/* 行过滤：先取目录选中范围，再按层级过滤
   一级=仅一级分部；二级=一级+二级；三级=一+二+三；四级=一+二+三+四
   清单=分部行+清单行；定额=分部行+清单行+定额行+主材行 */
function billRows(){
  const rd = billRootD(), lv = curLvl();
  const pool = (SEL >= 0 && DB.bill[SEL]) ? subRows(SEL) : DB.bill;
  if(!lv) return pool;
  if(/^[1-4]$/.test(lv)){
    const max = rd + (+lv) - 1;
    return pool.filter(r => r._cls === 'grp' && (r._dep || 0) >= rd && (r._dep || 0) <= max);
  }
  if(lv === 'leaf')  return pool.filter(r => r._cls === 'grp' || r._cls === 'leaf');
  if(lv === 'quota') return pool.filter(r => r._cls === 'grp' || r._cls === 'leaf' ||
                                             r._cls === 'sub'  || r._cls === 'mat');
  return pool;
}
/* 左侧目录树：只显示分部（含根行），最多四级；右键可设置层级 */
function billTree(){
  const rows = DB.bill, rd = billRootD();
  const maxLv = billMaxLv();
  let h = '<div class="billtree"><div class="th"><span>分部目录</span><span class="sp"></span>' +
    '<span class="mini">' + maxLv + ' 级' + (SEL >= 0 && DB.blvl && DB.blvl[SEL] ? ' · ' + lvlName(DB.blvl[SEL]) : '') + '</span></div><div class="tl">';
  rows.forEach((r, i) => {
    const d = (r._dep || 0) - rd;
    if(r._cls === 'grp'){ if(d < 0 || d > 3) return; }
    else if(r._cls === 'sum'){ /* 根行 */ }
    else return;
    const amt = num(r.c.total) != null ? num(r.c.total) : num(r.c.amount);
    const lv = DB.blvl && DB.blvl[i];
    h += '<div class="tn' + (r._cls === 'sum' ? ' root' : '') + (SEL === i ? ' on' : '') + '" data-t="' + i + '" style="padding-left:' +
      (6 + Math.max(0, d) * 14) + 'px" title="' + esc(r.c.name || '') + '（右键设置层级）">' +
      '<span class="tx">' + esc(String(r.c.name || '')) + '</span>' +
      (lv ? '<span class="lv">' + lvlName(lv) + '</span>' : '') +
      (amt != null ? '<span class="amt">' + money(amt) + '</span>' : '') + '</div>';
  });
  return h + '</div></div>';
}

  let bar = '<div class="bar"><span class="bt">层级</span>' + LVL_TABS.map(t => {
      if(/^[1-4]$/.test(t.k) && +t.k > maxLv) return '';

      return '<span class="pc' + (on ? ' on' : '') + '" data-l="' + t.k + '">' + t.l + '</span>';
    }).join('') +
    (SEL >= 0 && DB.bill[SEL] ? '<span class="pc clr" data-l="__sel">仅「' + esc(String(DB.bill[SEL].c.name || '').slice(0, 8)) + '」· ' + lvlName(lv) + ' ✕</span>' : '') +
    '</div>';
  const rows = billRows();
  CUR_COLS = cols; VIEW_ROWS = rows;
  CUR_ROWS = visible(rows, cols);
  const nq = rows.filter(r => r._cls === 'leaf').length;

let LVL_SCOPE = 'one';   /* one=仅本节点  sub=本节点及下属  all=全部节点 */
function treeMenu(x, y, i){
  const m = $('#menu');
  if(!DB.blvl) DB.blvl = {};
  const nm = i >= 0 && DB.blvl ? String((DB.bill[i] || { c:{} }).c.name || '') : '';
  const cur = i >= 0 ? (DB.blvl[i] || '') : LVL;
  const scope = [
    { k:'one', l:'仅本节点' }, { k:'sub', l:'本节点及下属' }, { k:'all', l:'全部节点' }
  ];
  m.innerHTML =
    '<div class="mi" style="color:var(--txt3);cursor:default">' + esc(i >= 0 ? (nm || '分部') : '全部分部') + '</div><hr>' +
    '<div class="mi" style="color:var(--txt3);cursor:default">设置显示层级</div>' +
    LVL_TABS.map(t => '<div class="mi" data-l="' + t.k + '"><span>' + (cur === t.k ? '✓' : '　') + '</span>' + t.l + '</div>').join('') +
    '<hr><div class="mi" style="color:var(--txt3);cursor:default">应用到</div>' +
    scope.map(s => '<div class="mi" data-s="' + s.k + '"><span>' + (LVL_SCOPE === s.k ? '●' : '○') + '</span>' + s.l + '</div>').join('') +
    '<hr><div class="mi" data-l="__clear">清除层级设置</div>';
  m.style.left = Math.min(x, innerWidth - 190) + 'px';
  m.style.top = Math.min(y, innerHeight - 400) + 'px';
  m.classList.add('on');
  const targets = () => {
    if(LVL_SCOPE === 'all'){
      const a = [];
      DB.bill.forEach((r, j) => { if(r._cls === 'grp' || r._cls === 'sum') a.push(j); });
      return a;
    }
    if(LVL_SCOPE === 'sub' && i >= 0){
      const a = [];
      subRows(i).forEach(r => { const j = DB.bill.indexOf(r); if(j >= 0 && (r._cls === 'grp' || r._cls === 'sum')) a.push(j); });
      return a;
    }
    return i >= 0 ? [i] : [];
  };
  m.onclick = e => {
    const it = e.target.closest ? e.target.closest('.mi') : null;
    if(!it || !it.dataset) return;
    const lv = it.dataset.l, sc = it.dataset.s;
    if(sc){ LVL_SCOPE = sc; m.classList.remove('on'); treeMenu(x, y, i); return; }
    if(lv == null) return;
    m.classList.remove('on');
    if(lv === '__clear'){
      if(LVL_SCOPE === 'all') DB.blvl = {};
      else targets().forEach(j => { delete DB.blvl[j]; });
      if(i >= 0 && LVL_SCOPE === 'one') delete DB.blvl[i];
    } else {
      targets().forEach(j => { DB.blvl[j] = lv; });
      LVL = lv;
      if(i >= 0) SEL = i;
    }
    save(); render();
  };
}

let DRAG = { on:false, from:-1, moved:false, el:null, sy:0, timer:null };
function dropIndex(y){
  const ns = $$('#nav .pnode');
  for(let i = 0; i < ns.length; i++){
    const b = ns[i].getBoundingClientRect();
    if(y < b.top + b.height / 2) return i;
  }
  return ns.length;
}
function dropLine(y){
  const el = $('#dragline');
  if(!el) return;
  const i = dropIndex(y);
  const ns = $$('#nav .pnode');
  let top;
  if(i < ns.length) top = ns[i].getBoundingClientRect().top;
  else top = ns.length ? ns[ns.length - 1].getBoundingClientRect().bottom : 60;
  el.style.top = (top - 1) + 'px';
  el.classList.add('on');
}
document.addEventListener('pointermove', e => {
  if(!DRAG.timer) return;
  if(!DRAG.on){
    if(Math.abs(e.clientY - DRAG.sy) > 6){ clearTimeout(DRAG.timer); DRAG.timer = null; }
    return;
  }
  DRAG.moved = true;
  dropLine(e.clientY);
});
document.addEventListener('pointerup', e => {
  if(DRAG.timer){ clearTimeout(DRAG.timer); DRAG.timer = null; }
  if(!DRAG.on) return;
  DRAG.on = false;
  document.body.classList.remove('dragging');
  const dl = $('#dragline'); if(dl) dl.classList.remove('on');
  const to = dropIndex(e.clientY);
  if(to > -1 && to !== DRAG.from && to !== DRAG.from + 1){
    const it = PROJ.splice(DRAG.from, 1)[0];
    const t = to > DRAG.from ? to - 1 : to;
    PROJ.splice(t, 0, it);
    PIDX = t; DB = PROJ[PIDX].db; save();
    toast('已把「' + projName(PROJ[t], t) + '」移到第 ' + (t + 1) + ' 位');
  }

  setTimeout(() => { DRAG.moved = false; }, 60);
});

    else dbx = DB;
    const n = applyTables(tabs, dbx);
    if(IMP_TARGET < 0 || !PROJ[IMP_TARGET]){
      let nm = dbx.meta.name || '';

      const on = dbx.overview.find(x => x.k === '工程名称');
      if(!PROJ[IMP_TARGET].name && on) PROJ[IMP_TARGET].name = on.v;

    DB = PROJ[Math.max(PIDX, 0)].db;
    TAB = 'analysis'; PART = ''; SEL = -1; LVL = ''; COLL.clear(); SORT = { k:'', dir:1 };
    save(); render(); refreshSide();
    const m = {}; tabs.forEach(t => m[t.kind] = (m[t.kind] || 0) + t.rows.length);
    const s = Object.keys(m).map(k => KIND_LABEL[k] + ' ' + m[k] + ' 行').join(' · ');
    ta.value = '';
    $('#impres').innerHTML = '<span style="color:#3d8b5f">✓ 已导入 ' + n + ' 张表（' + esc(s) + '）— 可继续粘贴下一张，全部导完点「完成」</span>';
    ta.focus();
  };
  ta.oninput = () => {
    $('#impres').textContent = '正在解析…';
    clearTimeout(timer);
    timer = setTimeout(doAuto, 420);
  };

    if(IMP_TARGET >= 0 && PROJ[IMP_TARGET]){

/* ---------------- CSV 导出 ---------------- */
const csvEsc = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function csvBlock(cols, rows, title){
  if(!rows || !rows.length) return '';
  let s = '[' + title + ']\n' + cols.map(c => csvEsc(c.l)).join(',') + '\n';
  /* 数值列导出纯数字（不带千分位），避免 Excel 里变成文本 */
  rows.forEach(r => {
    s += cols.map(c => {
      const v = r.c[c.k];
      if(c.t === 'n'){ const n = num(v); return n == null ? '' : String(n); }
      return csvEsc(cellTxt(c, v, r));
    }).join(',') + '\n';
  });
  return s + '\n';
}
function kvBlock(list, title){
  if(!list || !list.length) return '';
  return '[' + title + ']\n名称,内容\n' + list.map(x => {
    const s = String(x.v == null ? '' : x.v).trim();
    const n = (/^[\d,，]+\.?\d*$/.test(s) ? num(s) : null);
    return csvEsc(x.k) + ',' + (n == null ? csvEsc(x.v) : String(n));
  }).join('\n') + '\n\n';
}
/* 某个项目的全部数据（七张表） */
function allCsv(db){
  const resRows = (db.res || []).map(r => ({ c: Object.assign({}, r.c, { rk:(RES_CATS.find(g => g.k === r._rk) || {}).l || '' }) }));
  return kvBlock(db.analysis, KIND_LABEL.analysis) +
    kvBlock(db.overview, KIND_LABEL.overview) +
    csvBlock(BILL_COLS, db.bill, KIND_LABEL.bill) +
    csvBlock(MEASURE_COLS, db.measure, KIND_LABEL.measure) +
    csvBlock(OTHER_COLS, db.other, KIND_LABEL.other) +
    csvBlock(RES_COLS.concat([C('rk','资源分类',70,'t')]), resRows, KIND_LABEL.res) +
    csvBlock(FEE_COLS, db.fee, KIND_LABEL.fee);
}
function download(name, text){
  const blob = new Blob(['\ufeff' + text], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click(); URL.revokeObjectURL(a.href);
}

function doDemo(){

  DB = d; TAB = 'analysis'; PART = ''; COLL.clear();
  save(); render();

}
