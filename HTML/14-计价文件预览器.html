/* ---------------- Excel 导出（零依赖：自己拼 XLSX） ----------------
   ZIP 用「不压缩(store)」方式打包，只需要 CRC32；内容是最精简的 SpreadsheetML。
   这样不用任何外部库，离线也能导出真正的 .xlsx（每个项目一个工作表）。 */
const CRCTAB = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCTAB[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);

}
function zipStore(files){

  let off = 0;
  files.forEach(f => {
    const nb = enc.encode(f.name), data = f.data, n = data.length, crc = crc32(data);
    const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, n, true); lv.setUint32(22, n, true);
    lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
    lh.set(nb, 30);
    chunks.push(lh, data);
    const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, n, true); cv.setUint32(24, n, true);
    cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, off, true);
    ch.set(nb, 46);
    cd.push(ch);

  });

  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);

function sheetXml(rows, widths){

  async function drawDonutBlock(title, items, sub, AX, ACW){

  /* 造价分析：与预览一致（卡片 + 环形图 + 图例 + 条形），按预览页宽自适应，非 A4，超高分页 */
  async function drawAnalysis(sec, m){

      if(md.qdTop.length) blocks.push({ h: 16 + md.qdTop.length * 16 + 8, fn: () => drawBarsBlock('清单综合合价 TOP' + md.tn + '（共 ' + md.qdCount + ' 条清单，合计 ' + money(md.qdSum) + ' 元）', md.qdTop, AX, ACW) });

      drawPh('造价分析' + (total > 1 ? '（' + (++pi) + '/' + total + '）' : ''), '工程：' + (meta.pname || '') + '　' + meta.date, ACW);

  /* 工程概况：画与预览「pv-ov」卡片一致的页面（标题带 + 标签/值双列 + 斑马纹），按内容自适应页高（非 A4） */
  async function drawOverview(sec, m){
    const items = sec.rows.map(r => ({ k:String(r.c.k == null ? '' : r.c.k), v:String(r.c.v == null ? '' : r.c.v) }));
    const OW = 760, M2 = 18, LW = 132, RP = 10, BAND = 28, topH = 30;
    const valW = OW - M2 * 2 - LW;
    /* 用独立度量上下文估算行高（不依赖当前页 cx，避免 newPage 之前 cx 未初始化） */
    const meas2 = document.createElement('canvas').getContext('2d');
    const wrap2 = (text, maxW) => {
      meas2.font = SIZE + 'px sans-serif';
      const out = []; text = String(text == null ? '' : text);
      text.split('\n').forEach(par => {
        if(par === ''){ out.push(''); return; }
        let line = '';
        for(const ch of par){
          const test = line + ch;
          if(meas2.measureText(test).width > maxW && line){ out.push(line); line = ch; }
          else line = test;
        }
        out.push(line);
      });
      return out;
    };
    const rhFor = v => Math.max(wrap2(v, valW - RP * 2).length * LH + 10, 26);
    const maxPage = 1500;
    let groups = [], cur = [], ch = topH + BAND;
    items.forEach(it => {
      const rh = rhFor(it.v);
      if(ch + rh > maxPage && cur.length){ groups.push(cur); cur = []; ch = BAND; }
      cur.push({ it, rh }); ch += rh;
    });
    if(cur.length) groups.push(cur);
    groups.forEach((g, gi) => {
      let total = BAND; g.forEach(o => total += o.rh);
      const OVH = topH + total + M2 + 6;
      newPage(OW, OVH); y = M2;
      cx.fillStyle = '#1b2430'; cx.font = 'bold 13px sans-serif';
      cx.fillText('工程概况' + (groups.length > 1 ? '（' + (gi + 1) + '/' + groups.length + '）' : ''), M2, y);
      cx.font = '9px sans-serif'; cx.fillStyle = '#5a6675';
      cx.fillText('工程：' + (meta.pname || '') + '　' + meta.date + '　共 ' + items.length + ' 项', M2, y + 16);
      y += topH;
      const cardY0 = y;
      cx.fillStyle = '#1f3a5f'; cx.fillRect(M2, y, OW - M2 * 2, BAND);
      cx.fillStyle = '#fff'; cx.textBaseline = 'middle';
      cx.font = 'bold 12px sans-serif'; cx.fillText('项目基本信息', M2 + 12, y + BAND / 2);
      cx.font = '9px sans-serif'; cx.textAlign = 'right';
      cx.fillText(items.length + ' 项', OW - M2 - 12, y + BAND / 2); cx.textAlign = 'left';
      cx.textBaseline = 'top';
      y += BAND;
      g.forEach((o, i) => {
        const rh = o.rh, ze = (i % 2 === 1);
        cx.fillStyle = ze ? '#eef2f7' : '#f3f6fa'; cx.fillRect(M2, y, LW, rh);
        cx.fillStyle = '#5a6675'; cx.font = '10px sans-serif'; cx.textBaseline = 'middle';
        cx.fillText(o.it.k, M2 + 10, y + rh / 2);
        cx.fillStyle = ze ? '#fbfcfe' : '#ffffff'; cx.fillRect(M2 + LW, y, valW, rh);
        cx.fillStyle = '#222a33'; cx.font = SIZE + 'px sans-serif';
        const ls = wrap(o.it.v, valW - RP * 2), th = ls.length * LH, ty = y + Math.max(5, (rh - th) / 2);
        ls.forEach((ln, ii) => cx.fillText(ln, M2 + LW + RP, ty + ii * LH));
        cx.strokeStyle = '#e6ebf1'; cx.lineWidth = 0.5;
        cx.beginPath();
        cx.moveTo(M2, y + rh); cx.lineTo(M2 + LW + valW, y + rh);
        cx.moveTo(M2 + LW, y); cx.lineTo(M2 + LW, y + rh);
        cx.stroke();
        cx.textBaseline = 'top';
        y += rh;
      });

  /* 优先：把「打印预览」里实际渲染的 DOM 逐节栅格化成图片，做到 PDF 与预览一模一样（自适应页宽/页高，非 A4）。
     若浏览器对 foreignObject 做了安全限制（toDataURL 抛异常），则回退到下面的纯 canvas 手绘。 */
  const styleText = (() => { const st = document.querySelector('style'); return st ? st.textContent : ''; })();
  const themeAttr = document.documentElement.getAttribute('data-theme') || '';
  const _origPV = PVKEY;
  const outline = [];
  for(let si = 0; si < sections.length; si++){
    const sec = sections[si];
    const startPage = pages.length;
    let ok = false;
    try{
      PVKEY = sec.key; renderPvBody();
      const el = document.querySelector('#pvBody').firstElementChild;
      if(el){
        let W = Math.ceil(el.getBoundingClientRect().width);
        let H = Math.ceil(el.getBoundingClientRect().height);
        if(W >= 40 && H >= 40){
          const xml = new XMLSerializer().serializeToString(el);
          const svg = '<?xml version="1.0" encoding="UTF-8"?>\n' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
            '<foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' +
            '<div xmlns="http://www.w3.org/1999/xhtml" data-theme="' + themeAttr + '" style="width:' + W + 'px;background:#fff;box-sizing:border-box">' +
            '<style><![CDATA[' + styleText + ']]></style>' + xml + '</div></foreignObject></svg>';
          const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
          const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('svg')); im.src = url; });
          const rcv = document.createElement('canvas');
          rcv.width = W * dpr; rcv.height = H * dpr;
          const rcx = rcv.getContext('2d');
          rcx.fillStyle = '#fff'; rcx.fillRect(0, 0, rcv.width, rcv.height);
          rcx.drawImage(img, 0, 0, rcv.width, rcv.height);
          rcv.toDataURL('image/jpeg', 0.92); // 预检：若被安全策略标记，这里会抛异常 → 走兜底
          pages.push({ cv: rcv, pw: W, ph: H });
          ok = true;
        }
      }
    }catch(e){ /* 落到 canvas 兜底绘制 */ }
    if(!ok){
      const m = measureSheet(sec);
      if(sec.key === 'analysis') await drawAnalysis(sec, m);
      else if(sec.key === 'overview') await drawOverview(sec, m);
      else drawTableSection(sec, m);
    }
    outline.push({ title: KIND_LABEL[sec.key] || sec.title, page: startPage });
  }
  PVKEY = _origPV; renderPvBody();
  const imgs = pages.map(p => {
    const d = p.cv.toDataURL('image/jpeg', 0.92);
    const b64 = d.slice(d.indexOf(',') + 1);
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return { bytes:u, w:p.cv.width, h:p.cv.height, pw:p.pw, ph:p.ph };
  });
  return pdfFromImages(imgs, outline);
}
/* PDF 字符串：UTF-16BE（带 BOM）十六进制，支持中文书签标题 */
function pdfText(s){
  let u = '﻿';
  for(const ch of String(s)){
    const cp = ch.codePointAt(0);
    if(cp <= 0xFFFF) u += String.fromCharCode(cp);
    else { u += String.fromCharCode(0xD800 + ((cp - 0x10000) >> 10)); u += String.fromCharCode(0xDC00 + ((cp - 0x10000) & 0x3FF)); }
  }
  let hex = '';
  for(let i = 0; i < u.length; i++) hex += ('00' + u.charCodeAt(i).toString(16)).slice(-2);
  return '<' + hex + '>';
}
function pdfFromImages(imgs, outline){
  outline = outline || [];
  const enc = new TextEncoder();
  const N = imgs.length;
  const M = outline.length;
  const O = 2 + 3 * N;               /* 现有最大对象号 */
  const OL_ROOT = O + 1;
  const olItems = []; for(let i = 0; i < M; i++) olItems.push(O + 2 + i);
  const objCount = O + 1 + M;        /* 含目录根 + 条目 */
  const parts = []; let len = 0; const off = {};
  const emit = s => {
    const u = (s instanceof Uint8Array) ? s : enc.encode(s);
    off[parts.length] = len; len += u.length; parts.push(u); return len - u.length;
  };
  emit(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  off[1] = emit('1 0 obj\n<< /Type /Catalog /Pages 2 0 R /Outlines ' + OL_ROOT + ' 0 R >>\nendobj\n');
  let kids = [];
  for(let i = 0; i < N; i++) kids.push((5 + i * 3) + ' 0 R');
  off[2] = emit('2 0 obj\n<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>\nendobj\n');
  for(let i = 0; i < N; i++){
    const cObj = 3 + i * 3, iObj = 4 + i * 3, pObj = 5 + i * 3;
    const pw = imgs[i].pw, ph = imgs[i].ph;
    const content = 'q\n' + pw.toFixed(2) + ' 0 0 ' + ph.toFixed(2) + ' 0 0 cm\n/Im0 Do\nQ\n';
    off[cObj] = emit(cObj + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');
    const dict = iObj + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imgs[i].w + ' /Height ' + imgs[i].h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + imgs[i].bytes.length + ' >>\nstream\n';
    off[iObj] = emit(dict);
    emit(imgs[i].bytes);
    emit('\nendstream\nendobj\n');
    off[pObj] = emit(pObj + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw.toFixed(2) + ' ' + ph.toFixed(2) + '] /Resources << /XObject << /Im0 ' + iObj + ' 0 R >> >> /Contents ' + cObj + ' 0 R >>\nendobj\n');
  }
  /* 书签（大纲）：7 张表各一条，指向对应起始页 */
  if(M){
    off[OL_ROOT] = emit(OL_ROOT + ' 0 obj\n<< /Type /Outlines /First ' + olItems[0] + ' 0 R /Last ' + olItems[M - 1] + ' 0 R /Count ' + M + ' >>\nendobj\n');
    olItems.forEach((obj, i) => {
      let d = obj + ' 0 obj\n<< /Title ' + pdfText(outline[i].title) + ' /Parent ' + OL_ROOT + ' 0 R';
      if(i > 0) d += ' /Prev ' + olItems[i - 1] + ' 0 R';
      if(i < M - 1) d += ' /Next ' + olItems[i + 1] + ' 0 R';
      const pobj = 5 + (outline[i].page | 0) * 3;
      d += ' /Dest [ ' + pobj + ' 0 R /XYZ null null null ]';
      d += ' >>\nendobj\n';
      off[obj] = emit(d);
    });
  }
  const xrefStart = len;
  let xref = 'xref\n0 ' + (objCount + 1) + '\n0000000000 65535 f \n';
  for(let n = 1; n <= objCount; n++){ const o = off[n] != null ? off[n] : 0; xref += ('0000000000' + o).slice(-10) + ' 00000 n \n'; }
  const trailer = 'trailer\n<< /Size ' + (objCount + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
  const all = new Uint8Array(len + enc.encode(xref).length + enc.encode(trailer).length);
  let p = 0;
  parts.forEach(u => { all.set(u, p); p += u.length; });
  const xe = enc.encode(xref); all.set(xe, p); p += xe.length;
  const te = enc.encode(trailer); all.set(te, p);
  return all;
}
/* 导出弹窗：只选项目，每个项目导出为一个工作表 */
function openExport(){
  if(!PROJ.length){ toast('还没有项目可导出'); return; }
  const ph = PROJ.map((p, i) =>
    '<label class="ckb"><input type="checkbox" data-p="1" value="' + i + '"' + (i === PIDX ? ' checked' : '') + '>' +
    '<span>' + esc(projName(p, i)) + '</span><span class="c">' + projRowCount(p.db) + ' 行</span></label>').join('');

    '<h4>导出 Excel</h4><div class="bd">' +

  const sel = () => box().filter(x => x.checked).map(x => +x.value);
  $('#exAll').onclick = () => box().forEach(x => { x.checked = true; });
  $('#exCancel').onclick = () => $('#mask').classList.remove('on');
  $('#exCsv').onclick = () => {
    const ps = sel();
    if(!ps.length){ toast('请至少勾选一个项目'); return; }
    let out = '', names = [];
    ps.forEach(i => {
      const p = PROJ[i]; if(!p) return;
      names.push(projName(p, i));
      if(ps.length > 1) out += '[项目：' + projName(p, i) + ']\n';
      out += allCsv(p.db);
    });
    download((ps.length > 1 ? '计价数据_' + ps.length + '个项目' : names[0]) + '.csv', out);
    $('#mask').classList.remove('on');
    toast('已导出 CSV：' + ps.length + ' 个项目');
  };
  $('#exOk').onclick = () => {
    const ps = sel();
    if(!ps.length){ toast('请至少勾选一个项目'); return; }
    const used = {}, sheets = [];
    ps.forEach(i => {
      const p = PROJ[i]; if(!p) return;
      let n = sheetNameOk(projName(p, i));
      if(used[n]){ used[n]++; n = sheetNameOk(n.slice(0, 27) + '(' + used[n] + ')'); }
      else used[n] = 1;
      sheets.push({ name:n, rows:dbSheetRows(p.db) });
    });
    let blob;
    try{ blob = buildXlsx(sheets); }
    catch(e){ toast('生成 Excel 失败：' + (e && e.message ? e.message : e)); return; }
    dlBlob((sheets.length > 1 ? '计价数据_' + sheets.length + '个项目' : sheets[0].name) + '.xlsx', blob);
    $('#mask').classList.remove('on');
    toast('已导出 ' + sheets.length + ' 个项目（每个项目一个工作表）');
  };
}

/* =========================================================
   9. 本地保存
   ========================================================= */
const LSKEY = 'gbq_paste_v1';
function save(){
  try{
    localStorage.setItem(LSKEY, JSON.stringify({ p:PROJ.map(p => ({ n:p.name, d:p.db })), i:PIDX }));
  }catch(e){}
}
function load(){
  try{
    const s = localStorage.getItem(LSKEY);
    if(!s) return false;
    const o = JSON.parse(s);
    if(!o.p || !o.p.length) return false;
    PROJ = o.p.map(x => ({ name:x.n, db:Object.assign(newDB(), x.d) }));
    PIDX = Math.min(o.i == null ? 0 : o.i, PROJ.length - 1);
    DB = PROJ[PIDX].db;
    return true;
  }catch(e){ return false; }
}

function doDemo(){
  const d = newDB();
  const tabs = parseClip(demoText());
  applyTables(tabs, d);
  const on = d.overview.find(x => x.k === '工程名称');
  PIDX = addProject(on ? on.v : '1#楼-安装', d);
  DB = d; TAB = 'analysis'; PART = ''; COLL.clear(); clearOpenSets();
  save(); render();
  toast('已载入示例工程');
}
