<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>计价数据预览器</title>
<style>
:root{
  --bg:#eef1f5; --panel:#fff; --line:#d5dbe2; --line2:#e6eaef;
  --bar:#2f4d75; --bar2:#3a5f8f;
  --pri:#3d6db5; --pri-d:#2f5a99; --pri-l:#e8f0fa;
  --txt:#333a42; --txt2:#6b7683; --txt3:#9aa4b0;
  --sumbg:#fdf8e4; --leafbg:#f0f8ec; --red:#d0342c; --zebra:#fdfae9;
  --matbg:#fbfaf3; --leafcat:#4d7a3a; --subcat:#7a5fa8; --matcat:#b0782a;
  /* 分部层级配色（一级~四级）：浅色模式用淡底 + 中饱和文字 */
  --lvc1:#3d6db5; --lvc2:#4f9770; --lvc3:#b8752a; --lvc4:#8a6fa8;
  --lvb1:#eef3fb; --lvb2:#ecf6f1; --lvb3:#fbf3e7; --lvb4:#f4f0fa;
}
html[data-theme="dark"]{
  --bg:#1b1f25; --panel:#242933; --line:#38404c; --line2:#2d343e;
  --bar:#1f2c40; --bar2:#273849;
  --pri:#5b8ecb; --pri-d:#4a7ab5; --pri-l:#28313e;
  --txt:#d8dde4; --txt2:#96a1ad; --txt3:#69737f;
  --sumbg:#332e1c; --leafbg:#24301f; --red:#e07068; --zebra:#2a2c22;
  --matbg:#272b33; --leafcat:#789e63; --subcat:#9184b2; --matcat:#a08a5e;
  /* 暗色：底色只加一点点透明度，文字用柔和不刺眼的中间调 */
  --lvc1:#8fb0dd; --lvc2:#84bca3; --lvc3:#cfa06e; --lvc4:#a897c4;
  --lvb1:rgba(143,176,221,.13); --lvb2:rgba(132,188,163,.13); --lvb3:rgba(207,160,110,.14); --lvb4:rgba(168,151,196,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:12px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,132,150,.35);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,132,150,.6);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶栏 ===== */
#top{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,var(--bar2),var(--bar));color:#fff;flex:0 0 auto}
#top .crumb{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0}
#top .crumb .seg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#top .crumb svg{flex:0 0 auto;opacity:.9}
/* 项目栏开关：顶部栏工程名右侧的小图标（上下双箭头）。
   默认不显底色，只在悬停时淡淡亮一下 —— 不抢顶栏视线、不突兀 */
#bNavTop{width:20px;height:20px;flex:0 0 auto;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:rgba(255,255,255,.55);cursor:pointer;padding:0;border:none;
  transition:background .15s,color .15s}
#bNavTop:hover{background:rgba(255,255,255,.14);color:#fff}
#bNavTop:active{background:rgba(255,255,255,.24)}
#bNavTop svg{width:11px;height:11px;display:block;transition:transform .18s ease}
#bNavTop.off{color:rgba(255,255,255,.38)}
#bNavTop.off svg{transform:rotate(180deg)}
#top .sp{flex:1}
#top .app{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}

/* ===== 工具栏 ===== */
#tools{height:32px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.tbtn{height:23px;padding:0 9px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--txt);border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
.tbtn.acc{background:var(--pri);border-color:var(--pri);color:#fff}
.tbtn.acc:hover{background:var(--pri-d);color:#fff}
#tools .sp{flex:1}
.qbox{position:relative;display:inline-flex;align-items:center}
#q{height:23px;width:170px;padding:0 20px 0 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:11px}
#q:focus{outline:none;border-color:var(--pri)}
.qx{position:absolute;right:3px;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;font-size:10px;color:var(--txt3);display:none}
.qx:hover{background:var(--line);color:var(--txt)}
.qx.on{display:block}

/* 页面内粘贴区（空数据时直接出现在页面上） */
.pzone{padding:14px;display:flex;flex-direction:column;gap:8px}
.pzone .pzt{font-size:12px;color:var(--txt2);line-height:1.9}
.pzone .pzt b{color:var(--pri-d)}
.pzone textarea{min-height:150px;width:100%;resize:vertical;border:1px dashed var(--line);border-radius:3px;padding:8px;font:11px/1.6 Consolas,"Microsoft YaHei",monospace;background:var(--panel);white-space:pre;overflow:auto}
.pzone textarea:focus{outline:none;border-color:var(--pri);border-style:solid}
.pzone .pzb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pzone .hz{font-size:11px;color:var(--txt3);margin-left:auto}
.pbtn.sm{height:23px;padding:0 10px;font-size:11px}
.pbtn.dg{background:var(--red);color:#fff}
.pbtn.dg:hover{filter:brightness(1.08)}

#main{display:flex;height:calc(100% - 34px - 32px - 24px)}

/* ===== 左侧：项目列表 ===== */
#nav{width:186px;flex:0 0 186px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:0 0 24px;position:relative}
#nav.hid,.billtree.hid{display:none}
.vrsz{position:absolute;top:0;right:0;width:5px;height:100%;cursor:col-resize;z-index:7}
.vrsz:hover{background:var(--pri);opacity:.35}
.tbtn.off{opacity:.5}
.pgrp{height:24px;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11px;font-weight:600;color:var(--txt2);background:var(--line2);position:sticky;top:0;z-index:2}
.pnode{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--line2);user-select:none}
.pnode:hover{background:var(--line2)}
.pnode.on{background:var(--pri-l);color:var(--pri)}
.pnode .lb{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pnode .pv{flex:0 0 auto;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
.pnode.on .pv{color:var(--pri)}
.padd{padding:6px 8px}
.padd button{width:100%;height:23px;border:1px dashed var(--line);border-radius:3px;color:var(--txt2);font-size:11px}
.padd button:hover{border-color:var(--pri);color:var(--pri)}
.pnode.drag{opacity:.4}
.pnode .grip{flex:0 0 auto;width:8px;color:var(--txt3);font-size:10px;letter-spacing:-1px;cursor:grab}
#dragline{position:fixed;left:0;width:186px;height:2px;background:var(--pri);z-index:95;display:none;pointer-events:none}
#dragline.on{display:block}
body.dragging{user-select:none;cursor:grabbing}

/* 右键菜单 */
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:172px;padding:3px;display:none}
.menu.on{display:block}
.menu .mi{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.menu .mi:hover{background:var(--pri-l);color:var(--pri)}
.menu .mi.dg:hover{background:#fdeaea;color:var(--red)}
.menu .mi .sub{font-size:10px;color:var(--txt3);margin-left:auto}
.menu hr{border:none;border-top:1px solid var(--line2);margin:3px 0}

/* ===== 右侧 ===== */
#pane-inner.fullh{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:4px 6px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow-x:auto}
.bar .bt{flex:0 0 auto;font-size:11px;color:var(--txt2);padding-right:4px}
.pc{flex:0 0 auto;height:21px;padding:0 9px;line-height:21px;border-radius:11px;font-size:11px;color:var(--txt2);border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.pc:hover{border-color:var(--pri);color:var(--pri)}
.pc.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
#pane-inner.fullh .gt-card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:100%;margin:0}
#pane-inner.fullh .gt-wrap{flex:1;min-height:0;max-height:none}

/* 分部分项：左侧目录树 + 右侧表格 */
.billwrap{display:flex;gap:8px;min-height:0}
.billtree{width:210px;flex:0 0 210px;background:var(--panel);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.billtree .th{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--pri-d);border-bottom:1px solid var(--line);background:var(--panel)}
.billtree .th .sp{flex:1}
.billtree .th .mini{font-size:10px;font-weight:400;color:var(--txt2)}
.billtree .tl{flex:1;min-height:0;overflow:auto}
/* 分部栏 收起 / 展开 按钮（「分部目录」标题栏最右侧）：无边框的低调小图标，悬停才显底 */
.tclp{width:18px;height:18px;flex:0 0 auto;padding:0;border:none;border-radius:3px;background:transparent;
  color:var(--txt3);display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;
  transition:background .15s,color .15s}
.tclp:hover{background:var(--line2);color:var(--pri)}
.tclp:active{background:var(--line)}
.tclp svg{width:10px;height:10px;display:block}
/* 分部栏收起后：一条窄竖条（顶部 » 图标 + 竖排「展开分部」），整条都可点，悬停变淡色 */
.billtree.col{width:22px;flex:0 0 22px;align-items:center;gap:5px;padding:6px 0;overflow:hidden;cursor:pointer;
  transition:background .15s}
.billtree.col:hover{background:var(--line2)}
.billtree.col:hover .tclp{color:var(--pri)}
.billtree.col .vt{writing-mode:vertical-rl;font-size:10px;color:var(--txt3);letter-spacing:1px;user-select:none;white-space:nowrap}
.billtree.col:hover .vt{color:var(--pri)}
.tn{display:flex;align-items:center;gap:4px;padding:4px 6px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
.tn:hover{background:var(--line2)}
.tn.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.tn .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tn .amt{margin-left:auto;padding-left:6px;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
.tn.on .amt{color:var(--pri)}
.tn.root{font-weight:600;background:var(--line2)}
.tn .lv{flex:0 0 auto;font-size:10px;padding:0 4px;border-radius:7px;background:var(--pri-l);color:var(--pri);font-weight:400}
/* 分部层级：左侧竖条 + 名称着色（不显示"一级/二级"文字） */
.tn.lv1{box-shadow:inset 3px 0 0 var(--lvc1)}
.tn.lv2{box-shadow:inset 3px 0 0 var(--lvc2)}
.tn.lv3{box-shadow:inset 3px 0 0 var(--lvc3)}
.tn.lv4{box-shadow:inset 3px 0 0 var(--lvc4)}
.tn.lv1 .tx{color:var(--lvc1)}
.tn.lv2 .tx{color:var(--lvc2)}
.tn.lv3 .tx{color:var(--lvc3)}
.tn.lv4 .tx{color:var(--lvc4)}
.tn.man .tx{font-weight:700}
/* 分部目录标题栏里的四个色块：点一下 = 把整棵分部目录「展开到」对应层级（一~四级）；
   当前正处在哪一档，对应色块会加一圈细细的描边 */
.lgdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:middle;
  cursor:pointer;opacity:.45;transition:opacity .12s,transform .12s,box-shadow .12s}
.lgdot:hover{opacity:1;transform:scale(1.18)}
.lgdot.on{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 3px currentColor}
.tn.man .lv{background:var(--pri);color:#fff}
.tn .ta{flex:0 0 auto;width:13px;text-align:center;font-size:9px;color:var(--txt2);cursor:pointer;user-select:none}
.tn .ta:hover{color:var(--pri)}
.tn .ta.on{color:var(--pri)}
.pc.clr{border-style:dashed;color:var(--pri);border-color:var(--pri)}
.billmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#pane-inner.fullh .billwrap{flex:1;min-height:0}
#pane-inner.fullh .billmain{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
#pane-inner.fullh .billmain .gt-card{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:100%;margin:0}
#pane-inner.fullh .billmain .gt-wrap{flex:1;min-height:0;max-height:none}

/* 表头排序 */
.gt thead th.srt{cursor:pointer}
.gt thead th.srt:hover{background:var(--pri-l)}
.gt th .ar{font-size:9px;color:var(--pri);margin-left:2px}
.card[data-act]{cursor:context-menu}
.blk[data-top]>h3{cursor:context-menu}
.blk[data-top]>h3 .n{color:var(--txt3);font-weight:400}

#work{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px}
.tab{height:25px;padding:0 14px;border-radius:3px;border:1px solid var(--line);font-size:12px;color:var(--txt);background:var(--panel);white-space:nowrap}
.tab:hover{border-color:var(--pri);color:var(--pri)}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
#pane{flex:1;overflow:auto;background:var(--bg);position:relative;padding:8px}
#status{height:24px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--line2);border-top:1px solid var(--line);font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden}
#status b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}

/* ===== 表格 ===== */
.gt-card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:0 auto;max-width:100%}
.gt-head{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.gt-head .tt{font-size:12px;font-weight:600;color:var(--pri-d)}
.gt-head .sp{flex:1}
.gt-head .mini{font-size:11px;color:var(--txt2)}
.gt-wrap{overflow:auto;max-height:calc(100vh - 210px)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}
.gt thead th{position:sticky;top:0;z-index:3;background:var(--panel);color:var(--pri);font-weight:600;text-align:center;height:26px;padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:visible;user-select:none}
.gt thead th .rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:4}
.gt thead th .rsz:hover{background:var(--pri);opacity:.35}
.gt td{height:var(--rh,24px);padding:0 6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 项目特征等列：按换行符真实多行显示 */
.gt td.wl{white-space:pre-line;height:auto;line-height:1.45;vertical-align:top;overflow:visible;word-break:break-all}
.gt tbody tr:hover td{background:var(--pri-l)}
.gt tr.sum td{background:var(--sumbg);font-weight:700}
.gt tr.sum td.amt{color:var(--red)}
.gt tr.grp td{background:var(--panel);font-weight:600}
.gt tr.leaf td{background:var(--leafbg)}
.gt tr.sub td{background:var(--panel);color:var(--txt2)}
.gt tr.mat td{background:var(--matbg);color:var(--txt2)}
.gt tr.hid{display:none}
/* 分部层级配色：整行淡底 + 名称列文字着色 */
.gt tr.lvd1 td{background:var(--lvb1)}
.gt tr.lvd2 td{background:var(--lvb2)}
.gt tr.lvd3 td{background:var(--lvb3)}
.gt tr.lvd4 td{background:var(--lvb4)}
.gt tr.lvd1 td.nm{color:var(--lvc1)}
.gt tr.lvd2 td.nm{color:var(--lvc2)}
.gt tr.lvd3 td.nm{color:var(--lvc3)}
.gt tr.lvd4 td.nm{color:var(--lvc4)}
.gt td.cat{text-align:center;font-size:11px;color:var(--txt3)}
.gt tr.leaf td.cat{color:var(--leafcat)}
.gt tr.mat td.cat{color:var(--matcat)}
.gt tr.sub td.cat{color:var(--subcat)}
.gt .t-r{text-align:right;font-variant-numeric:tabular-nums}
.gt .t-c{text-align:center}
.gt .amt{color:var(--red)}
.gt .arw{display:inline-block;width:12px;color:var(--txt2);font-size:10px;cursor:pointer;user-select:none;text-align:center}
.gt .arw:hover{color:var(--pri)}
.gt .arw.on{color:var(--pri)}
.gt tbody tr.grp{cursor:context-menu}
.gt .dep1{padding-left:20px}
.gt .dep2{padding-left:38px}
.gt .dep3{padding-left:56px}
.gt .dep4{padding-left:74px}
.gt .dep5{padding-left:92px}
.empty{padding:34px;text-align:center;color:var(--txt3);font-size:12px;line-height:2}

table.kv td{height:25px}
table.kv tbody tr:nth-child(odd) td{background:var(--zebra)}
table.kv tbody tr:hover td{background:var(--pri-l)}
table.kv .kn{width:34%;font-weight:400;color:var(--txt2)}
table.kv .vv{font-weight:600}
.inpf{width:88px;height:20px;border:1px solid var(--line);border-radius:2px;padding:0 4px;font-size:11px;background:var(--panel)}

/* 图表 */
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;flex:1;min-width:148px;padding:8px 10px}
.card .k{font-size:11px;color:var(--txt2)}
.card .v{font-size:17px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.card .s{font-size:10px;color:var(--txt3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:0 auto 8px}
.blk>h3{font-size:12px;font-weight:600;color:var(--pri-d);padding:6px 10px;border-bottom:1px solid var(--line2)}
.blk .bd{padding:10px}
.flexr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.lg .n{width:96px;overflow:hidden;text-overflow:ellipsis}
.lg .v{font-variant-numeric:tabular-nums;color:var(--txt2)}
.lg .p{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
.brow{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:5px}
.brow .n{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .b{flex:1;height:11px;background:var(--line2);border-radius:2px;overflow:hidden}
.brow .b i{display:block;height:100%;border-radius:2px}
.brow .v{width:100px;text-align:right;font-variant-numeric:tabular-nums}
.brow .p{width:46px;text-align:right;color:var(--txt2);font-variant-numeric:tabular-nums}
.note-p{font-size:12px;line-height:1.9;color:var(--txt);white-space:pre-wrap}
/* 导出/层级弹窗：复选列表 */
.ckb{display:flex;align-items:center;gap:6px;padding:4px 7px;font-size:12px;cursor:pointer;border-radius:3px;white-space:nowrap}
.ckb:hover{background:var(--line2)}
.ckb input{margin:0;flex:0 0 auto;cursor:pointer}
.ckb .c{flex:0 0 auto;color:var(--txt3);font-size:10px;font-variant-numeric:tabular-nums}
.cklist{display:flex;flex-wrap:wrap;gap:2px;max-height:210px;overflow:auto;padding:2px;border:1px solid var(--line2);border-radius:3px}
.cklist .ckb{width:calc(50% - 2px)}
.lvtb{width:100%;border-collapse:collapse;font-size:12px}

<script>
"use strict";
/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : null;
  if(v == null) return null;
  let s = String(v).trim().replace(/[,，\s￥¥$%]/g,'');
  if(!s || s === '—' || s === '-' || s === '－') return null;
  if(/^\(.*\)$/.test(s)) s = '-' + s.slice(1,-1);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmt(n, d){
  if(n == null || isNaN(n)) return '';
  const neg = n < 0, a = Math.abs(n);
  return (neg?'-':'') + a.toLocaleString('zh-CN',{minimumFractionDigits:d, maximumFractionDigits:d});
}
const money = n => fmt(n, 2);
const r2 = n => Math.round(n * 100) / 100;
/* 截断字符串（用于卡片/图例/条形名称，避免溢出） */
function trunc(s, n){
  s = String(s == null ? '' : s);
  if(n <= 0) return s;
  let out = '', w = 0;
  for(const ch of s){
    const cw = /[㐀-鿿豈-﫿＀-￯]/.test(ch) ? 1 : (ch === ' ' ? 0.5 : 0.55);
    if(w + cw > n) return out + '…';
    out += ch; w += cw;
  }
  return out;
}
/* 数量：最多 4 位小数，去掉多余的 0 */
function qf(n){
  if(n == null || isNaN(n)) return '';
  let s = n.toFixed(4);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, m => m);
}
function qfc(n){
  if(n == null || isNaN(n)) return '';
  const p = String(n).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
const qtyf = n => { const s = qf(n); return s ? qfc(s) : ''; };
function rmbUpper(n){
  if(n == null || isNaN(n)) return '';
  const CN = '零壹贰叁肆伍陆柒捌玖', DU = ['仟','佰','拾',''], GW = ['','万','亿'];
  let neg = n < 0; const t = Math.round(Math.abs(n) * 100);
  let y = Math.floor(t / 100), j = Math.floor(t % 100 / 10), f = t % 10;
  if(!y && !j && !f) return '零元整';
  let gs = String(y), groups = [];
  while(gs.length > 4){ groups.unshift(gs.slice(-4)); gs = gs.slice(0, -4); }
  groups.unshift(gs);
  let s = '';
  groups.forEach((g, gi) => {
    const nn = g.padStart(4, '0').split('').map(Number);
    let out = '', zero = false;
    nn.forEach((d, i) => {
      if(d === 0){ zero = true; }
      else { out += (zero && out ? '零' : '') + CN[d] + DU[i]; zero = false; }
    });
    if(out) s += out + GW[groups.length - 1 - gi];
  });
  s = s || '零';
  s += '元';
  if(!j && !f) s += '整';
  else { if(!j) s += '零'; else s += CN[j] + '角'; if(f) s += CN[f] + '分'; }
  return (neg ? '负' : '') + s;
}

/* =========================================================
   1. 表头定义 / 粘贴解析
   ========================================================= */
const H = {
  analysis: ['名称','内容'],
  overview: ['名称','内容'],
  bill:     ['编码','类别','名称','项目特征','规格型号','单位','工程量表达式','含量','工程量','单价','合价','综合单价','综合合价','单价构成文件','取费专业','人工费价格指数','机械费价格指数','管理费价格指数','备注'],
  measure:  ['序号','类别','名称','单位','工程量','组价方式','计算基数','费率(%)','综合单价','综合合价','人工费价格指数','机械费价格指数','管理费价格指数','取费专业','单价构成文件','措施类别','备注','局部汇总'],
  other:    ['序号','名称','计算基数','费率(%)','金额','费用类别','不可竞争费','不计入合价','备注'],
  res:      ['编码','类别','名称','规格型号','单位','数量','预算价','市场价','价格来源','市场价合计','价差','价差合计','供货方式','甲供数量','市场价锁定','输出标记','产地','厂家','是否暂估','二次分析','直接修改单价','质量等级','品牌','备注'],
  fee:      ['序号','费用代号','名称','计算基数','基数说明','费率(%)','金额','费用类别','备注','输出']
};
const KIND_LABEL = { analysis:'造价分析', overview:'工程概况', bill:'分部分项', measure:'措施项目', other:'其他项目', res:'人材机汇总', fee:'费用汇总' };
const KIND_ORDER = ['analysis','overview','bill','measure','other','res','fee'];

const norm = s => String(s == null ? '' : s).replace(/[\s:：()（）%]/g,'').toLowerCase();
/* 标准列名总表：所有表的标准列名（normalize 后）→ 标准写法 */
const CANON_ALL = (function(){
  const s = {};
  Object.keys(H).forEach(k => H[k].forEach(c => { s[norm(c)] = c; }));
  return s;
})();
/* 列名别名：广联达不同报表里同一列常叫不同名字，先折成标准列名再按「列名」对应。
   这样源数据多一列「序号」、少一列、或列顺序不一样，都不会整行错位 */
const COL_ALIAS = {
  '项目编码':'编码', '清单编码':'编码', '定额编号':'编码', '子目编号':'编码', '编号':'编码',
  '项目名称':'名称', '清单名称':'名称', '定额名称':'名称', '措施名称':'名称', '费用名称':'名称',
  '材料名称':'名称', '机械名称':'名称', '人工名称':'名称', '主材名称':'名称',
  '类型':'类别', '行类型':'类别', '类别名称':'类别',
  '项目特征描述':'项目特征', '特征描述':'项目特征', '项目特征及工作内容':'项目特征',
  '规格':'规格型号', '型号':'规格型号', '规格及型号':'规格型号',
  '计量单位':'单位',
  '计算式':'工程量表达式', '工程量计算式':'工程量表达式', '表达式':'工程量表达式',
  '定额含量':'含量',
  '工程数量':'工程量',
  '消耗量':'数量', '含量数量':'数量',
  '市场单价':'市场价', '预算单价':'预算价',
  '费用代码':'费用代号', '代号':'费用代号',
  '基数':'计算基数'
};
/* 表头单元格 → 标准列名（支持别名）；认不出返回 '' */
function canonOf(name){
  const n = norm(name);
  if(!n) return '';
  if(CANON_ALL[n]) return CANON_ALL[n];
  return COL_ALIAS[n] || '';
}
/* 两个表头单元格是否是同一列 */
const colEq = (a, b) => { const x = canonOf(a); return !!x && x === canonOf(b); };
/* 一行里命中了多少个该表的标准列名（不要求顺序） */
function headHit(row, kind){
  const h = H[kind] || [];
  let s = 0;
  h.forEach(name => {
    for(let i = 0; i < row.length; i++) if(colEq(row[i], name)){ s++; return; }
  });
  return s;
}
const looksLikeHeader = (row, kind) => !!row && headHit(row, kind) >= 3;

/* 表头行 → 表类型：
   ① 先看「前缀连续匹配」（列名对得上、顺序也一致，信号最强）；
   ② 再看「整行列名命中数」（容忍多出序号列 / 少列 / 列序不同 / 列名是别名）。
   命中数远大于前缀时以前者为准 —— 比如分部分项的表头前面多了一列「序号」，
   前缀匹配会断在第一个词上，但列名命中数仍然明显指向分部分项。 */
function detectKind(row){
  let best = '', bp = 0, bs = 0, bsc = 0;
  Object.keys(H).forEach(k => {
    if(k === 'analysis' || k === 'overview') return;
    const h = H[k];
    let p = 0;
    while(p < h.length && p < row.length && colEq(row[p], h[p])) p++;
    let s = 0;
    h.forEach(name => {
      for(let i = 0; i < row.length; i++) if(colEq(row[i], name)){ s++; return; }
    });
    const sc = s * 10 + p;
    if(sc > bsc){ bsc = sc; bp = p; bs = s; best = k; }
  });
  if(row.length >= 2 && norm(row[0]) === norm('名称') && norm(row[1]) === norm('内容') && bp < 2) return 'kv';
  if(!best) return '';
  if(bp >= 3) return best;                       /* 列名+顺序都对得上，直接用 */
  /* 前缀对不上：按列名命中数兜底（至少 4 个，且不超过标准列数的 1/3） */
  const need = Math.max(4, Math.min(6, Math.ceil((H[best] || []).length / 3)));
  return bs >= need ? best : '';
}
/* 名称/内容 两列表 → 造价分析 还是 工程概况 */
function kvKind(rows){
  const keys = rows.map(r => String(r[0] || '')).join('|');
  if(/工程总造价|分部分项工程费|措施项目费|规费|增值税|单方造价|其中/.test(keys)) return 'analysis';
  if(/合同号|工程名称|专业|编制|审核|编制依据/.test(keys)) return 'overview';
  return 'overview';
}
/* 行分割：Excel 复制的 TSV 中「行」用 \r\n 结束，而单元格内部的软换行是单独的 \n。
   所以只要文本里出现过 \r，就按 \r 断行，单元格内的 \n 原样保留（不丢项目特征里的换行）。 */
function splitLines(t){
  const s = String(t == null ? '' : t);
  let lines;
  if(s.indexOf('\r') >= 0){
    lines = s.replace(/\r\n/g, '\r').replace(/\n\r/g, '\r').split('\r');
  } else {
    lines = s.split('\n');
  }
  return lines.map(l => l.split('\t').map(c => String(c).trim()))
    .filter(l => l.some(c => c !== ''));
}
/* 纯 \n 文本（从网页/记事本复制，Excel 的 \r 行分隔丢失）时，
   把「1.名称:配管」这类没有 Tab 的续行合并回上一行，避免项目特征被切成多行。 */
function mergeWrapped(t){
  const s = String(t == null ? '' : t);
  if(s.indexOf('\r') >= 0 || s.indexOf('\t') < 0) return s;
  const MK = /^\s*(\d{1,2}\s*[.、．](?![0-9])|[①②③④⑤⑥⑦⑧⑨⑩]|（\s*\d{1,2}\s*）|\(\s*\d{1,2}\s*\)|[一二三四五六七八九十]{1,2}\s*[、.．])/;
  const ls = s.split('\n'), out = [];
  ls.forEach(l => {
    if(out.length && l.indexOf('\t') < 0 && MK.test(l)) out[out.length - 1] += ' ' + l;
    else out.push(l);
  });
  return out.join('\n');
}
/* 项目特征自动断行：单元格里已经没有换行时，按 1. 2. 3. / 1、2、3、 / ①②③ 等编号插换行 */
function featBreaks(v){
  let s = String(v == null ? '' : v);
  if(!s) return s;
  s = s.replace(/\r\n?/g, '\n');
  if(s.indexOf('\n') >= 0) return s;
  if(!/[.、．①-⑩]/.test(s)) return s;
  return s
    .replace(/\s*(?=[①②③④⑤⑥⑦⑧⑨⑩])/g, '\n')
    .replace(/\s+(?=\d{1,2}\s*[.、．](?![0-9]))/g, '\n')
    .replace(/\s+(?=[一二三四五六七八九十]{1,2}\s*[、](?![、]))/g, '\n')
    .replace(/^\n+/, '');
}
/* 单元格内换行 → 显示为 ↵ 记号（数据本身不丢，title / 导出都是原文） */
const nlMark = s => String(s == null ? '' : s).replace(/\r/g, '').replace(/\n/g, ' ↵ ');

/* 把一整段粘贴文本切成若干张表：{kind, head, rows} */
function parseClip(text){
  const lines = splitLines(mergeWrapped(text));
  if(!lines.length) return [];
  const out = [];
  let cur = null;
  const push = () => { if(cur && cur.rows.length) out.push(cur); cur = null; };
  let first = true;
  lines.forEach(l => {
    const k = detectKind(l);
    if(k){
      push();
      cur = { kind:k, head:l, rows:[] };
      first = false;
      return;
    }
    if(!cur){
      /* 没有表头就先攒着，等后面出现表头时丢弃；这里建一个"裸表" */
      cur = { kind:'?', head:[], rows:[l] };
      return;
    }
    cur.rows.push(l);
  });
  push();
  /* 裸表：优先看第一行是不是表头（按列名对应，最稳），其次再按列数猜 */
  const res = [];
  out.forEach(t => {
    if(t.kind === '?'){
      const k2 = guessRawKind(t.rows);
      if(!k2) return;
      /* 第一行带标准列名 → 直接拿它当表头，后面全按列名对应，绝不因多列/少列错位 */
      const t2 = looksLikeHeader(t.rows[0], k2)
        ? { kind:k2, head:t.rows[0], rows:t.rows.slice(1) }
        : { kind:k2, head:H[k2].slice(), rows:t.rows.filter(r => !sameHead(r, H[k2])) };
      res.push(t2);
    } else if(t.kind === 'kv'){
      const kk = kvKind(t.rows);
      res.push({ kind:kk, head:H[kk].slice(), rows:t.rows.filter(r => !(r[0] === '名称' && r[1] === '内容')) });
    } else res.push(t);
  });
  return res;
}
const sameHead = (r, h) => r.length >= 2 && norm(r[0]) === norm(h[0]) && norm(r[1]) === norm(h[1]);
function guessRawKind(rows){
  /* 第一行本身就像表头（带本表标准列名）→ 以它为准 */
  if(rows.length){
    const k0 = detectKind(rows[0]);
    if(k0 && k0 !== 'kv') return k0;
  }
  let best = '', bs = 0;
  Object.keys(H).forEach(k => {
    if(k === 'analysis' || k === 'overview') return;
    const h = H[k];
    let s = 0;
    rows.slice(0, 40).forEach(r => {
      if(r.length !== h.length && r.length !== h.length - 1) return;
      s++;
    });
    if(s > bs){ bs = s; best = k; }
  });
  return bs ? best : '';
}
/* 行 → 对象（按表头列名） */
function toObj(head, row){
  const m = {};
  head.forEach((c, i) => { m[c] = row[i] == null ? '' : row[i]; });
  return m;
}
/* 表头 → { 标准列名: 该列在这一行里的下标 }。
   全程按「列名」（含别名）对应，同名取第一次出现的那一列；
   源数据多一列「序号」、少一列或顺序不同，都不会让数据整行错位 */
function colMap(head){
  const m = {};
  for(let i = 0; i < head.length; i++){
    const k = canonOf(head[i]);
    if(k && m[k] == null) m[k] = i;
  }
  return m;
}

/* 分部层级推断（支持到四级）：
   维护一个「剩余额度栈」——分部入栈并记下它还没被认领的金额，
   清单行按顺序扣减栈顶的剩余额度；某个分部额度扣完就出栈。
   这样兄弟分部、嵌套分部都能判断正确，不再依赖金额巧合。 */
function assignTree(rows){
  const stack = [], eps = 0.05;
  const rest = s => (s.length ? s[s.length - 1].remain : Infinity);
  rows.forEach(x => {
    if(catCls(x.cat) === 'grp'){
      const a = num(x.total) != null ? num(x.total) : num(x.amount);
      while(stack.length && a != null && a > rest(stack) + eps) stack.pop();
      x._d = stack.length;
      if(stack.length && a != null) stack[stack.length - 1].remain = r2(stack[stack.length - 1].remain - a);
      stack.push({ x:x, remain:(a == null ? Infinity : a) });
    } else if(catCls(x.cat) === 'leaf'){
      const a = num(x.total) != null ? num(x.total) : num(x.amount);
      if(a != null && stack.length) stack[stack.length - 1].remain = r2(stack[stack.length - 1].remain - a);
    }
  });
  /* 保险：层级最多 4 级（相对根） */
  rows.forEach(x => { if(catCls(x.cat) === 'grp' && x._d > 3) x._d = 3; });
}
const xhDepth = xh => {
  const s = String(xh == null ? '' : xh).trim();
  if(!s) return 0;
  const m = s.match(/^(\d+(?:\.\d+)*)/);
  if(!m) return 0;
  return m[1].split('.').length - 1;
};

/* =========================================================
   2. 各表 → 行数据
   ========================================================= */
/* 分部分项：部 / 项 / 定 / 主 四类 */
/* 类别 → 行类型：部=分部；项、补项=清单；定、借、借换、换、补=定额；主、设=主材
   「补」（补充子目）与「补项」（补充清单）要分清 → 先判「补项」为清单，再判「补」为定额，
   所以下面判断顺序不能调换 */
/* 广联达导出里常带一行占位提示（名称为「自动提示:请输入清单简称」），
   导入分部分项时自动排除这一行 */
function isPlaceholderRow(name){
  return /^自动提示\s*[:：]\s*请输入清单简称$/.test(String(name == null ? '' : name).trim());
}
function catCls(cat){
  const x = String(cat == null ? '' : cat).trim();
  if(!x) return '';
  if(x === '部') return 'grp';
  if(x === '项' || x.indexOf('补项') >= 0 || /^补\s*项$/.test(x)) return 'leaf';
  if(x === '定' || x === '借' || x === '借换' || x === '换' ||
     x.indexOf('补子目') >= 0 || x.indexOf('补') >= 0) return 'sub';
  if(x === '主' || x === '设') return 'mat';
  if(/项$/.test(x)) return 'leaf';
  if(/子目|定|借|换|补/.test(x)) return 'sub';
  if(/主|设/.test(x)) return 'mat';
  return '';
}
function rowsBill(t){
  const cm = colMap(t.head);
  const raw = [];
  t.rows.forEach(r => {
    const code  = (cm['编码'] != null ? r[cm['编码']] : '') || '';
    const cat   = String((cm['类别'] != null ? r[cm['类别']] : '') || '').trim();
    const name  = (cm['名称'] != null ? r[cm['名称']] : '') || '';
    /* 占位提示行：「自动提示:请输入清单简称」→ 不导入 */
    if(isPlaceholderRow(name)) return;
    raw.push({
      code: code, cat: cat, name: name,
      feat:  featBreaks(cm['项目特征'] != null ? r[cm['项目特征']] : ''),
      spec:  cm['规格型号'] != null ? r[cm['规格型号']] : '',
      unit:  cm['单位'] != null ? r[cm['单位']] : '',
      expr:  cm['工程量表达式'] != null ? r[cm['工程量表达式']] : '',
      hl:    num(cm['含量'] != null ? r[cm['含量']] : ''),
      qty:   num(cm['工程量'] != null ? r[cm['工程量']] : ''),
      price: num(cm['单价'] != null ? r[cm['单价']] : ''),
      amount:num(cm['合价'] != null ? r[cm['合价']] : ''),
      up:    num(cm['综合单价'] != null ? r[cm['综合单价']] : ''),
      total: num(cm['综合合价'] != null ? r[cm['综合合价']] : ''),
      note:  cm['备注'] != null ? r[cm['备注']] : ''
    });
  });
  /* 分部行：类别=部 */
  const parts = raw.filter(x => catCls(x.cat) === 'grp');
  parts.forEach(p => { p.amount = p.total != null ? p.total : p.amount; });
  assignTree(raw);
  const out = [];
  let curPartD = -1, curLeafD = -1, last = null, rootDone = false;
  raw.forEach(x => {
    const kc = catCls(x.cat);
    if(kc === 'grp'){
      curPartD = x._d == null ? 0 : x._d;
      curLeafD = -1;
      out.push({ _cls:'grp', _dep:curPartD, _kids:1, c:x });
    } else if(!x.cat && !rootDone && /整个项目|合计/.test(x.name)){
      rootDone = true;
      out.push({ _cls:'sum', _dep:0, _kids:1, c:x });
    } else if(kc === 'leaf'){
      curLeafD = curPartD + 1;
      out.push({ _cls:'leaf', _dep:curLeafD, _kids:1, c:x });
      last = 'leaf';
    } else if(kc === 'sub'){
      out.push({ _cls:'sub', _dep:(curLeafD < 0 ? 1 : curLeafD + 1), c:x });
    } else if(kc === 'mat'){
      out.push({ _cls:'mat', _dep:(curLeafD < 0 ? 1 : curLeafD + 1), c:x });
    } else {
      out.push({ _cls:'', _dep:(curLeafD < 0 ? 0 : curLeafD), c:x });
    }
  });
  /* 有「整个项目」根行时，其余整体下沉一级 */
  if(rootDone) out.forEach(r => { if(r._cls !== 'sum') r._dep = (r._dep || 0) + 1; });
  /* 可折叠标记 */
  for(let i = 0; i < out.length; i++) if(i + 1 < out.length && out[i + 1]._dep > out[i]._dep) out[i]._kids = 1;
  return out;
}
/* 措施项目 */
function rowsMeasure(t){
  const cm = colMap(t.head);
  const raw = t.rows.map(r => ({
    xh:    cm['序号'] != null ? r[cm['序号']] : '',
    cat:   String(cm['类别'] != null ? r[cm['类别']] : '').trim(),
    name:  cm['名称'] != null ? r[cm['名称']] : '',
    unit:  cm['单位'] != null ? r[cm['单位']] : '',
    qty:   num(cm['工程量'] != null ? r[cm['工程量']] : ''),
    mode:  cm['组价方式'] != null ? r[cm['组价方式']] : '',
    base:  cm['计算基数'] != null ? r[cm['计算基数']] : '',
    rate:  num(cm['费率(%)'] != null ? r[cm['费率(%)']] : ''),
    up:    num(cm['综合单价'] != null ? r[cm['综合单价']] : ''),
    total: num(cm['综合合价'] != null ? r[cm['综合合价']] : ''),
    mcat:  cm['措施类别'] != null ? r[cm['措施类别']] : '',
    note:  cm['备注'] != null ? r[cm['备注']] : ''
  }));
  /* 层级按广联达序号规则：一/二 → 01/02 → 清单编码 → 定额行 */
  const res = [];
  let lastD = 0, inSub = false;
  raw.forEach((x, i) => {
    const xh = String(x.xh || '').trim();
    const isQuota = !!x.cat && /-/.test(xh);          /* 定额行：类别非空且序号形如 7-6-HA1 */
    let d;
    if(isQuota) d = lastD + 1;
    else if(i === 0 || !/^[\d一二三四五六七八九十]/.test(xh)) d = 0;
    else if(/^[一二三四五六七八九十]+$/.test(xh)){ d = 1; inSub = false; }
    else if(/^\d{1,2}$/.test(xh)){ d = 2; inSub = true; }
    else if(/^\d{9,12}$/.test(xh)){ d = inSub ? 3 : 2; }
    else d = 2;
    if(!isQuota) lastD = d;
    res.push({ _cls:(d <= 1 ? 'sum' : 'grp'), _dep:d, c:x });
  });
  for(let i = 0; i < res.length; i++) if(i + 1 < res.length && res[i + 1]._dep > res[i]._dep) res[i]._kids = 1;
  return res;
}
/* 其他项目 / 费用汇总（按序号层级） */
function rowsXh(t, kind){

}

    : '数据替换 已关：粘贴会合并到现有数据（保留原有、只补新增）');
  return IMP_REPLACE;
}
/* 三种粘贴窗口里的「数据替换」勾选框共用同一套接线 */
function bindImpReplace(box){
  if(!box || !box.querySelector) return;

/* 行表的基础标识（不含出现序号）：编码/序号优先 → 名称 */
function rowBaseKey(k, r){
  const c = (r && r.c) || {};
  const nm = 'n:' + String(c.name || '').trim();
  if(k === 'bill') return String(c.code || '').trim() || nm;
  if(k === 'res'){
    /* 人材机：同一材料会因单价/供货方式不同而合法地出现多次，
       编码相同但名称/规格不同就是不同的行 —— 名称+规格一起进键 */
    const code = String(c.code || '').trim();
    const spec = String(c.spec || '').trim();
    return (code || nm) + '|' + spec;
  }
  return String(c.xh || '').trim() || nm;
}
/* 去重键 = 基础标识 + 「同一键在本组行里的第 N 次出现」。
   这是关键：计价表里同一条定额（如 4-2-78）挂在多条清单下会合法地重复出现很多次，
   只按编码去重会把它们全部当成「已有」丢掉（合并导入时 12 条定额能丢成 2 条）。
   带上出现序号后：重复粘贴同一份数据仍然幂等（第 1 条对第 1 条、第 2 条对第 2 条…），
   而同编码的合法重复行一条都不会少。 */
function keyGroups(k, rows){
  const cnt = {};
  return rows.map(r => {
    const b = rowBaseKey(k, r);
    const n = (cnt[b] = (cnt[b] || 0) + 1);
    return b + '#' + n;
  });
}
/* 兼容入口：单行取键（不带出现序号，仅用于没有分组上下文的场合） */
function rowKeyOf(k, r){ return rowBaseKey(k, r); }
/* 合并：原有行全部保留，粘贴进来的行只补键还不存在的那些（不覆盖、不重复） */
function mergeRows(k, oldRows, newRows, stat){
  const seen = new Set(keyGroups(k, oldRows));
  const out = oldRows.slice();
  const nk = keyGroups(k, newRows);
  newRows.forEach((r, i) => {
    const key = nk[i];
    if(key && seen.has(key)){ stat.skipped++; return; }
    if(key) seen.add(key);
    out.push(r); stat.added++;
  });
  /* 原表带「整个项目 / 合计」根行时，新补的行整体下沉一级，层级才对得上 */
  if(stat.added && oldRows.length && oldRows[0] && oldRows[0]._cls === 'sum'){
    let mn = Infinity;
    for(let i = oldRows.length; i < out.length; i++) mn = Math.min(mn, out[i]._dep || 0);
    if(mn === 0) for(let i = oldRows.length; i < out.length; i++) out[i]._dep = (out[i]._dep || 0) + 1;
  }
  /* 重算可折叠标记（分部/清单/定额行前面的小箭头） */
  for(let i = 0; i < out.length; i++)
    out[i]._kids = (i + 1 < out.length && (out[i + 1]._dep || 0) > (out[i]._dep || 0)) ? 1 : 0;
  return out;
}
/* 把解析出的表写入 DB（同类型多段会自动合并，重复的页表头行会被剔除）
   replace：true=整表替换该表；false=合并到现有数据（默认跟「数据替换」勾选走） */
function applyTables(tabs, db, replace){
  if(replace == null) replace = IMP_REPLACE;
  const stat = { mode:(replace ? 'replace' : 'merge'), added:0, skipped:0, tables:0 };
  LAST_IMP_BAD = [];
  const byK = {};
  tabs.forEach(t => { (byK[t.kind] = byK[t.kind] || []).push(t); });
  let n = 0;
  Object.keys(byK).forEach(k => {
    const list = byK[k];
    if(k === 'analysis' || k === 'overview'){
      const m = new Map();
      if(!replace && Array.isArray(db[k])) db[k].forEach(x => { if(x.k) m.set(x.k, x.v); });
      list.forEach(t => rowsKv(t).forEach(x => {
        if(!x.k) return;
        if(!replace && m.has(x.k)){ stat.skipped++; return; }   /* 合并模式：原有条目不覆盖 */
        m.set(x.k, x.v); stat.added++;
      }));
      db[k] = Array.from(m.keys()).map(key => ({ k:key, v:m.get(key) }));
    } else {
      const head = list[0].head;
      const rows = [].concat.apply([], list.map(t => t.rows)).filter(r => !isHeadRow(r, head));
      const merged = { kind:k, head:head, rows:rows };
      let nw = null;
      if(k === 'bill') nw = rowsBill(merged);
      else if(k === 'measure') nw = rowsMeasure(merged);
      else if(k === 'other') nw = rowsXh(merged, 'other');
      else if(k === 'fee') nw = rowsXh(merged, 'fee');
      else if(k === 'res') nw = rowsRes(merged);
      if(!nw) return;
      /* 列名自检：这几张表都以「名称」为主列，如果连「名称」列都认不出来，
         说明表头对不上（列会整行错位）→ 宁可跳过也不灌进错位数据 */
      if(colMap(head)['名称'] == null){
        stat.bad = (stat.bad || 0) + 1;
        LAST_IMP_BAD.push(KIND_LABEL[k] || k);
        return;
      }
      db[k] = replace ? nw : mergeRows(k, db[k] || [], nw, stat);
    }
    n++;
  });
  /* 工程名：概况表的「工程名称」 */
  const on = db.overview.find(x => x.k === '工程名称');
  db.meta.name = on ? on.v : '';
  stat.tables = n;
  LAST_IMP_STAT = stat;
  return n;
}
/* 导入结果的统一说明（合并 / 替换都说得清楚） */
function impStatText(){
  const s = LAST_IMP_STAT || {};
  const tail = (LAST_IMP_BAD && LAST_IMP_BAD.length)
    ? '；有 ' + LAST_IMP_BAD.length + ' 张表（' + LAST_IMP_BAD.join('、') + '）表头没对上，已跳过（避免列错位）'
    : '';
  if(s.mode === 'replace') return '已整表替换 ' + s.tables + ' 张表（覆盖了原有数据）' + tail;
  const t = '已合并 ' + s.tables + ' 张表 · 新增 ' + (s.added || 0) + ' 行';
  return (s.skipped ? t + '，跳过 ' + s.skipped + ' 行已有（未覆盖；要覆盖请勾「数据替换」）' : t) + tail;
}

/* 过滤 + 折叠 */
function visible(rows, cols){
  const q = Q.trim().toLowerCase();
  let vis = rows.map(() => true);
  if(q){
    rows.forEach((r, i) => {
      let hit = false;
      for(let j = 0; j < cols.length && !hit; j++){
        const v = cellTxt(cols[j], r.c[cols[j].k], r);
        if(v && String(v).toLowerCase().indexOf(q) >= 0) hit = true;
      }
      vis[i] = hit;
    });
    for(let i = rows.length - 1; i >= 0; i--){
      if(!vis[i]) continue;
      let d = rows[i]._dep || 0;
      for(let j = i - 1; j >= 0; j--){
        if((rows[j]._dep || 0) < d){ vis[j] = true; d = rows[j]._dep || 0; }
      }
    }
  }
  /* 按当前行数组重建父子关系（层级视图 / 搜索过滤后也成立） */
  const n = rows.length, dep = new Array(n), par = new Array(n), kids = new Array(n);
  /* _edep：分部分项视图按「手动/自动层级」算出的有效深度，保证层级筛选后父子关系仍然正确 */
  for(let i = 0; i < n; i++){ dep[i] = rows[i]._edep != null ? rows[i]._edep : (rows[i]._dep || 0); par[i] = -1; kids[i] = 0; uid(rows[i]); }
  const st = [];
  for(let i = 0; i < n; i++){
    while(st.length && dep[st[st.length - 1]] >= dep[i]) st.pop();
    par[i] = st.length ? st[st.length - 1] : -1;
    st.push(i);
  }
  for(let i = 0; i < n; i++){ let p = par[i]; while(p >= 0){ kids[p] = 1; p = par[p]; } }
  const out = [];
  for(let i = 0; i < n; i++){
    const o = Object.assign({}, rows[i]);
    o._kids = kids[i] ? 1 : 0;
    if(!vis[i]){ o._hid = 1; out.push(o); continue; }
    let p = par[i];
    while(p >= 0){ if(COLL.has(uid(rows[p]))){ o._hid = 1; break; } p = par[p]; }
    out.push(o);
  }
  return out;
}

function donut(items, size){
  size = size || 132;
  const total = items.reduce((s, x) => s + Math.abs(x.v), 0) || 1;
  const R = size / 2, r = R * 0.6, cx = R, cy = R;
  let a = -Math.PI / 2, paths = '';
  items.forEach((x, i) => {
    if(!x.v) return;
    const ang = Math.abs(x.v) / total * Math.PI * 2;
    const a2 = a + ang;
    const big = ang > Math.PI ? 1 : 0;
    const p = (rr, aa) => (cx + rr * Math.cos(aa)).toFixed(2) + ',' + (cy + rr * Math.sin(aa)).toFixed(2);
    paths += '<path d="M' + p(R, a) + ' A' + R + ',' + R + ' 0 ' + big + ' 1 ' + p(R, a2) +
      ' L' + p(r, a2) + ' A' + r + ',' + r + ' 0 ' + big + ' 0 ' + p(r, a) + ' Z" fill="' + PAL[i % PAL.length] + '"><title>' + esc(x.n) + ' ' + money(x.v) + '</title></path>';
    a = a2;
  });
  return '<svg width="' + size + '" height="' + size + '" style="flex:0 0 auto">' + paths +
    '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="10" fill="var(--txt2)">合计</text>' +
    '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">' + money(items.reduce((s, x) => s + x.v, 0)) + '</text></svg>';
}
/* 同款环形图，但输出独立 SVG（带 xmlns、显式颜色），供 PDF 里当图片绘制 */

  items.forEach((x, i) => {

    const ang = Math.abs(x.v) / total * Math.PI * 2;
    const a2 = a + ang;
    const big = ang > Math.PI ? 1 : 0;
    const p = (rr, aa) => (cx + rr * Math.cos(aa)).toFixed(2) + ',' + (cy + rr * Math.sin(aa)).toFixed(2);
    paths += '<path d="M' + p(R, a) + ' A' + R + ',' + R + ' 0 ' + big + ' 1 ' + p(R, a2) +
      ' L' + p(r, a2) + ' A' + r + ',' + r + ' 0 ' + big + ' 0 ' + p(r, a) + ' Z" fill="' + PAL[i % PAL.length] + '"><title>' + esc(x.n) + ' ' + money(x.v) + '</title></path>';

/* 造价分析结构化数据：预览（HTML）与 PDF（canvas）共用，保证两边一致 */
function analysisModel(){
  const total = anVal('工程总造价(小写)') != null ? anVal('工程总造价(小写)') : feeVal('7');
  const upper = anRaw('工程总造价(大写)') || (total != null ? rmbUpper(total) : '');
  const A = anVal('分部分项工程费') != null ? anVal('分部分项工程费') : feeVal('1');
  const B = anVal('措施项目费') != null ? anVal('措施项目费') : feeVal('2');
  const Cc = anVal('其他项目费') != null ? anVal('其他项目费') : feeVal('3');
  const D = anVal('规费') != null ? anVal('规费') : feeVal('4');
  const F = anVal('增值税') != null ? anVal('增值税') : feeVal('6');
  const E = feeVal('5') != null ? feeVal('5') : (total != null && F != null ? r2(total - F) : null);
  const area = num(DB.area);
  const perCalc = (area && area > 0 && total != null) ? r2(total / area) : null;
  const cards = [
    { k:'工程总造价（小写）', v: total == null ? '—' : money(total), s:'元' },
    { k:'工程总造价（大写）', v: upper || '—', s: anRaw('工程总造价(大写)') ? '来自造价分析表' : '自动生成', big:true },
    { k:'单方造价', v: perCalc != null ? money(perCalc) : '请输入面积', s: area ? '元/m² · 建筑面积 ' + fmt(area, 2) + ' m²' : '元/m² · 右键输入面积', dim: perCalc == null },
    { k:'不含税工程造价', v: E == null ? '—' : money(E), s:'元' },
    { k:'增值税', v: F == null ? '—' : money(F), s:'税率 ' + (E ? fmt(F / E * 100, 2) : '—') + '%' }
  ];
  const comp = [
    { n:'分部分项工程费', v:A || 0 }, { n:'措施项目费', v:B || 0 }, { n:'其他项目费', v:Cc || 0 },
    { n:'规费', v:D || 0 }, { n:'增值税', v:F || 0 }
  ].filter(x => x.v);
  const ct = comp.reduce((s, x) => s + x.v, 0) || 1;
  comp.forEach(x => x.p = x.v / ct * 100);
  const nat = [
    { n:'人工费', v:anVal('其中:人工费') || 0 }, { n:'材料费', v:anVal('材料费') || 0 },
    { n:'机械费', v:anVal('机械费') || 0 }, { n:'主材费', v:anVal('主材费') || 0 },
    { n:'设备费', v:anVal('设备费') || 0 }, { n:'管理费', v:anVal('管理费') || 0 },
    { n:'利润', v:anVal('利润') || 0 }
  ];
  const natSum = nat.reduce((s, x) => s + x.v, 0);
  if(natSum) nat.forEach(x => x.p = x.v / natSum * 100);
  const plv = Math.min(Math.max(DB.partShow || 1, 1), billMaxLv());
  const pItems = partStat(plv);
  let partSum = 0;
  if(pItems.length){
    partSum = pItems.reduce((s, x) => s + x.v, 0) || 1;
    pItems.forEach(x => x.p = x.v / partSum * 100);
    pItems.sort((a, b) => b.v - a.v);
  }
  const tn = (DB.topn && DB.topn.qd) || 10;
  const qd = DB.bill.filter(r => r._cls === 'leaf' && num(r.c.total) != null)
    .map(r => ({ n:String(r.c.name || ''), v:num(r.c.total) })).sort((a, b) => b.v - a.v);
  let qdSum = 0;
  const qdTop = [];
  if(qd.length){
    const top = qd.slice(0, tn); qdSum = qd.reduce((s, x) => s + x.v, 0) || 1;
    top.forEach(x => { x.p = x.v / qdSum * 100; qdTop.push(x); });
  }
  const RK = [['lb', '人工', 'labor'], ['mt', '材料', 'material'], ['mc', '机械', 'machine']];
  const resGroups = [];
  RK.forEach(g => {
    const n = (DB.topn && DB.topn[g[0]]) || 5;
    const ms = DB.res.filter(r => r._rk === g[2])
      .map(r => ({ n:String(r.c.name || '') + (r.c.spec ? ' ' + r.c.spec : ''), v:num(r.c.amount) || 0 }))
      .filter(x => x.v).sort((a, b) => b.v - a.v);
    if(!ms.length) return;
    const top = ms.slice(0, n), s2 = ms.reduce((s, x) => s + x.v, 0) || 1;
    top.forEach(x => x.p = x.v / s2 * 100);
    resGroups.push({ key:g[0], label:g[1], n, top, count:ms.length, sum:r2(s2) });
  });
  return { total, upper, perCalc, area, E, F, A, cards, comp,
    nat:natSum ? nat : [], natSum:natSum ? r2(natSum) : 0,
    plv, pItems, partCount:pItems.length, partSum:r2(partSum),
    tn, qdTop, qdCount:qd.length, qdSum:r2(qdSum), resGroups };
}

  }

  }
  /* 人材机金额 TOP */
  m.resGroups.forEach(g => {

      '<div class="bd">' + barList(g.top, 170) + '</div></div>';

/* 分部分项：根行所在深度（有「整个项目」根行时为 1，否则 0） */
const billRootD = () => (DB.bill.length && DB.bill[0]._cls === 'sum' ? 1 : 0);
/* 分部最大层级（1~4） */
function billMaxLv(){
  let m = 1;
  DB.bill.forEach(r => { if(r._cls === 'grp') m = Math.max(m, partLevel(r)); });
  return Math.min(Math.max(m, 1), 4);
}
/* 分部所属层级：优先用手动设置（DB.plv[名称]），否则按自动缩进深度 */
function partLevel(r){
  const nm = String(r.c ? r.c.name : r.name || '').trim();
  const m = DB.plv && DB.plv[nm];
  if(m) return Math.min(Math.max(+m, 1), 4);
  const rd = billRootD();
  return Math.min(Math.max((r._dep || 0) - rd + 1, 1), 4);
}
const partManual = r => !!(DB.plv && DB.plv[String(r.c ? r.c.name : r.name || '').trim()]);
/* 分部路径（一级 › 二级 › …） */
function partPath(r){
  const L = partLevel(r), nm = String(r.c ? r.c.name : r.name || '');
  if(L <= 1) return nm;
  const i = DB.bill.indexOf(r);
  const st = [];
  for(let j = 0; j < i; j++){
    const p = DB.bill[j];
    if(p._cls !== 'grp') continue;
    const pl = partLevel(p);
    if(pl < L){ st[pl - 1] = String(p.c.name || ''); }
  }
  for(let k = 0; k < L - 1; k++) if(!st[k]) st[k] = '…';
  return st.slice(0, L - 1).join(' › ') + ' › ' + nm;
}
/* 当前层级视图的列（表头右键自定义，按层级分别记忆，全局生效） */
/* 列显示覆盖：xoff[ns] = 用户在该视图主动隐藏的列（默认不隐藏任何列） */
const xarr = (o, ns) => ((o && o[ns]) ? o[ns] : []);
const colOff = (ns, k) => xarr(GSET.xoff, ns).indexOf(k) >= 0;
function setColFlag(which, ns, k, on){
  const key = which === 'off' ? 'xoff' : 'xin';
  if(!GSET[key]) GSET[key] = {};
  let a = (GSET[key][ns] || []).slice(), i = a.indexOf(k);
  if(on && i < 0) a.push(k);
  if(!on && i >= 0) a.splice(i, 1);
  if(a.length) GSET[key][ns] = a; else delete GSET[key][ns];
  saveGS();
}
/* 分部分项某层级视图实际显示的列
   一级/二级/三级/四级/清单 → 简版列；全部 / 定额 / 清单里展开了定额 → 完整列 */
function billColsOf(ns){
  let L = ns.indexOf('|') >= 0 ? ns.slice(ns.indexOf('|') + 1) : ns;
  const exp = L.slice(-1) === '+';                 /* 清单层级里手动展开了定额 */
  if(exp) L = L.slice(0, -1);
  const wide = (L === 'quota' || L === '' || exp);
  let cols = gCols(ns, BILL_COLS, wide ? QUOTA_KEYS : LVL_KEYS);
  /* 完整列视图强制带上「项目特征」（表头右键可取消） */
  if(wide && !cols.some(c => c.k === 'feat') && !colOff(ns, 'feat')){
    const i = cols.findIndex(c => c.k === 'spec');
    cols.splice(i >= 0 ? i : Math.min(3, cols.length), 0, BILL_COLS.find(c => c.k === 'feat'));
  }
  const off = xarr(GSET.xoff, ns);
  if(off.length) cols = cols.filter(c => off.indexOf(c.k) < 0);
  return cols;
}
function billCols(){ return billColsOf(billNS()); }
/* 「定额」层级里哪些定额行被手动展开了（Set，存定额行 uid）——展开了才显示它下面的主材行。
   正向集合 = 默认收起，换数据 / 换工程后残留 uid 天然无害（与「清单」层级的 LEAF_OPEN 同一套思路） */
const QUOTA_OPEN = new Set();
const quotaOpenOn = r => QUOTA_OPEN.has(uid(r));
/* 清掉两套手动展开记录（换层级 / 换数据 / 换工程时调用） */
function clearOpenSets(){
  LEAF_OPEN.clear();
  QUOTA_OPEN.clear();
}
/* 当前生效层级（顶部层级按钮） */
function curLvl(){
  return LVL;
}
/* 切层级：进「清单」层级 = 展开到清单级 —— 清掉手动展开记录，
   定额 / 主材默认收起（要看定额就点那条清单行的箭头展开）。
   同一个层级里反复点选目录 / 重画、换数据，都不会影响这个规则，
   也不会动「分部目录」各分部的展开状态（分部只由点箭头控制） */
function setLvl(v){
  const changed = (LVL !== v);
  LVL = v;
  if(v === 'leaf' && changed) clearOpenSets();      /* 进「清单」层级 = 展开到清单级，两套手动展开都清空 */
  if(v === 'quota' && changed) QUOTA_OPEN.clear(); /* 进「定额」层级 = 主材行先收起，点定额行的箭头才看主材 */
}
/* 行是否处于「收起」状态。
   「清单」层级下的清单行单独用 LEAF_OPEN 判定（默认收起、只认手动展开），
   这样即便数据被替换（行对象全换新、没有历史折叠记录），层级筛选照样正确 */
function rowCollapsed(r){
  if(TAB === 'bill' && LVL === 'leaf' && r._cls === 'leaf') return !LEAF_OPEN.has(uid(r));
  if(TAB === 'bill' && LVL === 'quota' && r._cls === 'sub') return !QUOTA_OPEN.has(uid(r));
  return COLL.has(uid(r));
}
/* 清单层级里是否有清单行被手动展开（展开了就按「定额」那套列显示） */
function leafOpen(){
  if(curLvl() !== 'leaf') return false;
  for(let i = 0; i < DB.bill.length; i++){
    const r = DB.bill[i];
    if(r._cls === 'leaf' && LEAF_OPEN.has(uid(r))) return true;
  }
  return false;
}
const lvlName = k => ((LVL_TABS.find(t => t.k === k) || {}).l || '全部');
/* 有效深度：分部用（手动/自动）层级 partLevel，清单/定额/主材挂到最近分部下——
   手动改过分部层级后，层级筛选视图里的折叠/展开依然按真实父子关系工作。
   主材挂在其上一级「定额」下面 → 定额行的箭头可以收起/展开主材 */
function effDeps(rows){
  let curD = 0, hasSub = false;
  rows.forEach(r => {
    if(r._cls === 'sum'){ r._edep = 0; hasSub = false; }
    else if(r._cls === 'grp'){ curD = partLevel(r) || r._dep || 1; r._lv = curD; r._edep = curD; hasSub = false; }
    else if(r._cls === 'leaf'){ r._edep = curD + 1; hasSub = false; }
    else if(r._cls === 'sub'){ r._edep = curD + 2; hasSub = true; }
    else if(r._cls === 'mat'){ r._edep = hasSub ? curD + 3 : curD + 2; }
    else r._edep = curD + 1;
  });
  return rows;
}
/* 取某节点的子树行（含自身）：边界用「有效深度」，与目录树的分部父子关系一致，
   这样点选分部后显示的范围恰好就是目录里挂在它下面的那一支 */
function subRows(i, prepared){
  const base = DB.bill[i];
  if(!base) return [];
  if(!prepared) effDeps(DB.bill);
  const d = base._edep != null ? base._edep : (base._dep || 0);
  const out = [base];
  for(let j = i + 1; j < DB.bill.length; j++){
    const rj = DB.bill[j];
    const dj = rj._edep != null ? rj._edep : (rj._dep || 0);
    if(dj <= d) break;
    out.push(rj);
  }
  return out;
}
/* 在「分部目录」点了某个分部（或换了层级）之后，把这个分部范围里的分部行直接展开：
   数据区打开就是按所选层级展开好的，不用再点一次那行的箭头。
   只展开、不折叠 —— 范围之外的目录展开状态原样保留 */
function expandScope(i){
  if(TAB !== 'bill') return;
  if(i == null) i = SEL;
  if(!(i >= 0 && DB.bill[i])) return;
  effDeps(DB.bill);
  subRows(i, true).forEach(r => { if(r._cls === 'grp') COLL.delete(uid(r)); });
}
/* 「分部分项」数据表取行。
   行过滤：先取目录选中范围，再按层级过滤
   一级=仅一级分部；二级=一级+二级；三级=一+二+三；四级=一+二+三+四
   清单=分部行+清单行（清单行默认收起，点它的箭头才展开下面的定额+主材）
   定额=分部行+清单行+定额行（主材行默认收起，点那条定额行的箭头才显示它下面的主材）
   返回前给每行标 _haskid（有没有子行）—— 定额行据此决定要不要显示展开箭头：
   下面没有主材行的定额行不给箭头（传进来时已带 _haskid 的行，比如子行被收起的清单行，原样保留） */
function billRows(){
  const r = billRowsRaw();
  /* 标「有没有子行」——只在没标过的行上算。带 _haskid 的行是上一步（比如收起的清单行）传下来的，
     它的子行可能压根不在本次结果里，不能按本次结果重算，否则会被误判成「没子行、不该有箭头」 */
  for(let i = 0; i + 1 < r.length; i++){
    if(r[i]._haskid != null) continue;
    const d = r[i]._edep != null ? r[i]._edep : (r[i]._dep || 0);
    const dn = r[i + 1]._edep != null ? r[i + 1]._edep : (r[i + 1]._dep || 0);
    r[i]._haskid = dn > d ? 1 : 0;
  }
  return r;
}
function billRowsRaw(){
  effDeps(DB.bill);                                  /* 层级优先：先统一算好有效深度 */
  const lv = curLvl();
  const pool = (SEL >= 0 && DB.bill[SEL]) ? subRows(SEL, true) : DB.bill;
  if(!lv) return pool;
  if(/^[1-4]$/.test(lv)){
    const max = +lv;
    return pool.filter(r => r._cls === 'grp' && partLevel(r) <= max);
  }
  if(lv === 'leaf'){
    const out = [];
    let open = false, curLeaf = null;                /* 最近一个清单行是否被手动展开 */
    const push = r => {                              /* 清单行的子行单独记：子行被收起时也要知道它下面有东西 */
      if(curLeaf){
        const d = curLeaf._edep != null ? curLeaf._edep : (curLeaf._dep || 0);
        const dr = r._edep != null ? r._edep : (r._dep || 0);
        if(dr > d) curLeaf._haskid = 1; else if(curLeaf._haskid == null) curLeaf._haskid = 0;
      }
      out.push(r);
    };
    pool.forEach(r => {
      if(r._cls === 'grp'){ push(r); curLeaf = null; return; }
      if(r._cls === 'leaf'){ push(r); curLeaf = r; open = LEAF_OPEN.has(uid(r)); return; }
      if(r._cls === 'sub' || r._cls === 'mat'){ if(open) push(r); return; }
      push(r); curLeaf = null;
    });
    if(curLeaf && curLeaf._haskid == null) curLeaf._haskid = 0;
    return out;
  }
  if(lv === 'quota'){
    /* 定额层级：分部 + 清单 + 定额；主材行挂在它上面那条定额行下 —— 默认收起，
       点那条定额行的箭头展开才显示（QUOTA_OPEN），点别的定额行只影响那一条。
       箭头有无必须按「未过滤的 pool」判断（它下面到底有没有主材行）：
       主材被收起来时它在结果里不存在，若按结果相邻深度推会被误判成「没子行」→ 箭头凭空消失。 */
    const out = [];
    let open = false, curSub = null, curLeaf = null;
    const push = r => {
      if(curLeaf){
        const d = curLeaf._edep != null ? curLeaf._edep : (curLeaf._dep || 0);
        const dr = r._edep != null ? r._edep : (r._dep || 0);
        if(dr > d) curLeaf._haskid = 1; else if(curLeaf._haskid == null) curLeaf._haskid = 0;
      }
      out.push(r);
    };
    pool.forEach((r, i) => {
      if(r._cls === 'mat'){ if(open) push(r); return; }
      if(r._cls === 'sub'){
        /* 往下看 pool 里紧跟的行：是更深的主材行就说明这条定额确实有主材 → 给箭头 */
        const d = r._edep != null ? r._edep : (r._dep || 0);
        let has = 0;
        for(let j = i + 1; j < pool.length; j++){
          const rj = pool[j];
          const dj = rj._edep != null ? rj._edep : (rj._dep || 0);
          if(dj <= d) break;
          if(rj._cls === 'mat'){ has = 1; break; }
        }
        r._haskid = has;
        push(r); curSub = r; curLeaf = null; open = QUOTA_OPEN.has(uid(r)); return;
      }
      if(r._cls === 'leaf'){ push(r); curLeaf = r; curSub = null; open = false; return; }
      push(r); curLeaf = null; curSub = null;
      open = false;                         /* 分部 / 其他行：再往下的主材归新定额行管 */
    });
    if(curLeaf && curLeaf._haskid == null) curLeaf._haskid = 0;
    return out;
  }
  return pool;
}
/* 左侧目录树：按（手动/自动）层级缩进，右键可设置层级 */
const TCLP_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="17 6 12 12 17 18"></polyline><polyline points="11 6 6 12 11 18"></polyline></svg>';
const TCLP_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="7 6 12 12 7 18"></polyline><polyline points="13 6 18 12 13 18"></polyline></svg>';
/* 目录节点（分部 + 整个项目）与真实父子关系。
   「层级优先」：父子关系一律按 partLevel（手动设的层级优先于自动缩进）来算，
   目录树、层级筛选、点选分部的范围，三处共用同一套，保证彼此不打架 */
function billNodes(){
  const nodes = [];
  DB.bill.forEach((r, i) => {
    if(r._cls !== 'grp' && r._cls !== 'sum') return;
    nodes.push({ i:i, r:r, L:(r._cls === 'sum' ? 0 : partLevel(r)) });
  });
  const par = new Array(nodes.length).fill(-1), stk = [];
  for(let k = 0; k < nodes.length; k++){
    while(stk.length && nodes[stk[stk.length - 1]].L >= nodes[k].L) stk.pop();
    par[k] = stk.length ? stk[stk.length - 1] : -1;
    stk.push(k);
  }
  const kid = new Array(nodes.length).fill(0);
  par.forEach(p => { if(p >= 0) kid[p] = 1; });
  return { nodes:nodes, par:par, kid:kid };
}
/* 现在目录展开到了第几级（用来点亮标题栏对应的色块）；0 = 不在任何一个整齐的档位上 */
function treeExpandLv(){
  const T = billNodes();
  let maxL = 1;
  T.nodes.forEach(n => { if(n.L > maxL) maxL = n.L; });
  let best = 0;
  for(let n = 1; n <= Math.min(4, maxL); n++){
    let ok = true;
    for(let k = 0; k < T.nodes.length; k++){
      if(!T.kid[k]) continue;
      const cld = COLL.has(uid(T.nodes[k].r));
      if(T.nodes[k].L < n && cld){ ok = false; break; }       /* 该展开的却收着 */
      if(T.nodes[k].L >= n && !cld){ ok = false; break; }     /* 该收起的却开着 */
    }
    if(ok) best = n;
  }
  return best;
}
function billTree(){
  /* 收起后：只画一条窄竖条（顶部 » 按钮 + 竖排「展开分部」） */
  if(GSET.treehide){
    return '<div class="billtree col"><button class="tclp" id="bTreeClp" title="展开「分部目录」栏">' + TCLP_OUT +
      '</button><div class="vt">展开分部</div></div>';
  }
  const T = billNodes();
  const nodes = T.nodes, kid = T.kid;
  /* 仅当「自己或某个祖先」被折叠时才隐藏 → 手动折叠只影响点的那一个分支 */
  const hidden = new Array(nodes.length).fill(false);
  for(let k = 0; k < nodes.length; k++){
    const p = T.par[k];
    if(p >= 0 && (hidden[p] || COLL.has(uid(nodes[p].r)))) hidden[k] = true;
  }
  const curX = treeExpandLv();
  let h = '<div class="billtree"><div class="th"><span>分部目录</span>' +
    '<span style="display:inline-flex;gap:3px" title="点色块 = 展开到 一/二/三/四级">' + [1, 2, 3, 4].map(n =>
      '<i class="lgdot' + (curX === n ? ' on' : '') + '" data-elv="' + n + '" style="background:var(--lvc' + n +
      ');color:var(--lvc' + n + ')" title="展开到' + LVN[n] + '级（点一下：' + LVN[n] + '级及更深的分部收起）"></i>').join('') + '</span>' +
    '<span class="sp"></span>' +
    '<button class="tclp" id="bTreeClp" title="收起「分部目录」栏">' + TCLP_IN + '</button>' +
    '</div><div class="tl">';
  nodes.forEach((n, k) => {
    if(hidden[k]) return;
    const r = n.r, L = n.L;
    const cld = COLL.has(uid(r));
    const amt = num(r.c.total) != null ? num(r.c.total) : num(r.c.amount);
    const man = r._cls === 'grp' && partManual(r);
    h += '<div class="tn' + (r._cls === 'sum' ? ' root' : (man ? ' man' : '') + ' lv' + L) + (SEL === n.i ? ' on' : '') + '" data-t="' + n.i + '" style="padding-left:' +
      (6 + Math.max(0, L - 1) * 15) + 'px" title="' + esc(r.c.name || '') + (r._cls === 'grp' ? '（第 ' + L + ' 级分部 · 右键设层级 / 展开）' : '') + '">' +
      '<span class="ta' + (cld ? ' on' : '') + '" data-ta="' + n.i + '" title="' + (cld ? '已折叠，点开' : '点折叠') + '">' + (kid[k] ? (cld ? '▶' : '▼') : '') + '</span>' +
      '<span class="tx">' + esc(String(r.c.name || '')) + '</span>' +
      (amt != null ? '<span class="amt">' + money(amt) + '</span>' : '') + '</div>';
  });
  return h + '</div></div>';
}

function bindPane(){
  /* 切页签：只重置选中分区 / 排序，不动「分部目录」的展开折叠状态 */
  $$('#tabs .tab').forEach(b => b.onclick = () => { TAB = b.dataset.t; PART = ''; SEL = -1; SORT = { k:'', dir:1 }; render(); });
  /* 「分部目录」栏的 收起 / 展开 按钮（收起后那条窄竖条整条都可以点） */
  const tc = $('#pane #bTreeClp');
  if(tc) tc.onclick = e => { e.stopPropagation(); togglePanel('tree'); };
  const tcol = $('#pane .billtree.col');
  if(tcol) tcol.onclick = e => { e.stopPropagation(); togglePanel('tree'); };
  $$('#pane .arw').forEach(a => a.onclick = e => {
    e.stopPropagation();
    const u = a.dataset.a;
    if(!u) return;
    /* 「清单」层级下点清单行的箭头 = 展开 / 收起它下面的定额 / 主材（走 LEAF_OPEN）；
       「定额」层级下点定额行的箭头 = 展开 / 收起它下面的主材（走 QUOTA_OPEN）。
       两套都是正向集合（默认收起），换数据、换工程后不会牵连别的行 */
    const lr = (TAB === 'bill') ? DB.bill.find(x => uid(x) === u) : null;
    /* 主材行最底层，没有可展开的子行 —— 不参与任何折叠状态 */
    if(lr && lr._cls === 'mat') return;
    /* 下面没有主材行的定额行不带箭头，就算点到也不该把它做成「展开」状态 */
    const okSub = r => r && r._cls === 'sub' && (r._haskid != null ? r._haskid : r._kids);
    const kw = (TAB === 'bill' && LVL === 'leaf'  && lr && lr._cls === 'leaf') ? LEAF_OPEN
             : (TAB === 'bill' && LVL === 'quota' && okSub(lr))                ? QUOTA_OPEN : null;
    if(kw){
      if(kw.has(u)) kw.delete(u); else kw.add(u);
    } else if(COLL.has(u)) COLL.delete(u); else COLL.add(u);
    /* 清单层级里展开/收起定额：列会在「简版列 ↔ 完整列」之间切换 → 整页重画；
       定额层级里展开/收起主材：行集合变了，也要整页重画 */
    if(TAB === 'bill' && (curLvl() === 'leaf' || curLvl() === 'quota')){ render(); return; }
    const rows = VIEW_ROWS.length ? VIEW_ROWS : CUR_ROWS;
    CUR_ROWS = visible(rows, CUR_COLS);
    const tb = $('#pane table.gt tbody');
    if(tb){ tb.innerHTML = rowsHtml(CUR_ROWS, CUR_COLS, CUR_ARW); bindPane(); }
  });
  /* 分部分项：层级按钮（层级优先，点目录不清除层级） */
  $$('#pane .pc[data-l]').forEach(b => b.onclick = () => {
    const v = b.dataset.l;
    /* 只改层级 / 取消选中；不重置折叠状态，分部目录的展开完全跟手动点击走 */
    if(v === '__sel'){ SEL = -1; render(); return; }
    setLvl(v);
    if(SEL >= 0) expandScope(SEL);      /* 换层级后同样按新层级展开（切到「定额」时别被收起挡住） */
    render();
  });
  $$('#pane .tn[data-t]').forEach(b => b.onclick = () => {
    const i = +b.dataset.t;
    SEL = (SEL === i ? -1 : i);
    if(SEL >= 0) expandScope(SEL);      /* 点分部 = 清单里直接展开到所选层级，不用再点一次箭头 */
    render();                                                        /* 保留 LVL，层级优先 */
  });
  $$('#pane .tn[data-t]').forEach(b => b.oncontextmenu = e => {
    e.preventDefault();
    partNodeMenu(e.clientX, e.clientY, +b.dataset.t);
  });
  /* 目录节点的折叠箭头：与清单表共用折叠状态 */
  $$('#pane .tn .ta').forEach(a => a.onclick = e => {
    e.stopPropagation();
    const i = +a.dataset.ta, r = DB.bill[i];
    if(!r) return;
    const u = uid(r);
    if(COLL.has(u)) COLL.delete(u); else COLL.add(u);
    render();
  });
  /* 标题栏四个色块：点一下 = 展开到 一/二/三/四级 */
  $$('#pane .billtree .lgdot[data-elv]').forEach(d => d.onclick = e => {
    e.stopPropagation();
    expandToLv(+d.dataset.elv);
  });
  /* 清单里右键分部行：与左侧目录一样弹菜单（鼠标位置） */
  if(TAB === 'bill') $$('#pane table.gt tbody tr.grp').forEach(tr => tr.oncontextmenu = e => {
    e.preventDefault();
    const r = CUR_ROWS[+tr.dataset.i];
    if(!r || r._cls !== 'grp') return;
    let idx = -1;
    DB.bill.forEach((x, j) => { if(idx < 0 && (x === r || (x._uid && x._uid === r._uid))) idx = j; });
    partNodeMenu(e.clientX, e.clientY, idx);
  });
  /* 目录树空白区右键：展开到 N 级 / 批量设置层级 */
  const tl = $('#pane .billtree .tl');
  if(tl) tl.oncontextmenu = e => {
    if(e.target.closest && e.target.closest('.tn')) return;
    e.preventDefault();
    partTreeMenu(e.clientX, e.clientY);
  };
  $$('#pane .pc[data-r]').forEach(b => b.onclick = () => { RES_CUR = b.dataset.r; render(); });
  /* 表头排序 */
  $$('#pane th.srt').forEach(th => th.onclick = () => {
    const k = th.dataset.s;
    if(SORT.k === k) SORT.dir = -SORT.dir; else { SORT.k = k; SORT.dir = 1; }
    render();
  });
  /* 表头右键：显示列 / 行高（对所有工程生效） */
  $$('#pane table.gt thead th.thc').forEach(th => {
    th.oncontextmenu = e => {
      e.preventDefault();
      const tb = th.closest('table');
      thMenu(e.clientX, e.clientY, tb ? tb.dataset.ns : TAB);
    };
  });
  /* 列宽拖动 */
  $$('#pane table.gt thead th .rsz').forEach(rz => {
    rz.onmousedown = e => startResize(e, rz);
    rz.onclick = e => { e.stopPropagation(); return false; };
  });
  /* 单方造价：右键输入面积 */
  $$('#pane .card[data-act="area"]').forEach(c => {
    c.oncontextmenu = e => {
      e.preventDefault();
      const v = prompt('建筑面积（m²）', DB.area || '');
      if(v == null) return;
      DB.area = num(v) || 0; save(); render();
    };
  });
  /* TOP 数量：右键 */
  $$('#pane .blk[data-top] h3').forEach(hh => {
    hh.oncontextmenu = e => {
      e.preventDefault();
      topMenu(e.clientX, e.clientY, hh.parentNode.dataset.top);
    };
  });
  /* 分部构成显示层级：右键 */
  $$('#pane .blk[data-plv] h3').forEach(hh => {
    hh.oncontextmenu = e => { e.preventDefault(); partMenu(e.clientX, e.clientY); };
  });
  /* 页面内粘贴区（空数据时直接嵌在页面上） */
  $$('#pane .pzone').forEach(z => {
    const kind = z.dataset.k;
    const ta = z.querySelector('textarea');
    const mcb = z.querySelector('#pzMulti');
    const done = z.querySelector('#pzDone');
    const stat = z.querySelector('#pzStat');
    bindImpReplace(z);
    const isMulti = () => !!(mcb && mcb.checked);
    const showStat = () => {
      if(stat && ta) stat.textContent = '已贴 ' + ta.value.split(/\r?\n/).filter(l => l.trim() !== '').length + ' 行，可继续贴';
    };
    if(mcb) mcb.onchange = () => {
      if(done) done.style.display = mcb.checked ? '' : 'none';
      if(!mcb.checked && stat) stat.textContent = '';
      if(ta) ta.placeholder = mcb.checked
        ? '已勾选分次粘贴：每贴一段都会续到这里，全部贴完再点「完成合并导入」'
        : (HEAD_TIP[kind] || '');
    };
    const append = t => { if(!ta) return; zoneAppend(ta, t); showStat(); toast('已追加一段，继续贴下一段或点「完成合并导入」'); };
    if(ta) ta.onpaste = e => {
      e.preventDefault();
      const cd = e.clipboardData || window.clipboardData;
      const t = cd ? cd.getData('text') : '';
      if(!t || !t.trim()){ toast('剪贴板里没有文本'); return; }
      if(isMulti()){ append(t); return; }        /* 分次模式：只续文本，不识别 */
      ta.value = '';
      handlePasteText(kind, t);
    };
    const rb = z.querySelector('#pzRead');
    if(rb) rb.onclick = () => readClip(kind, isMulti() ? append : null);
    const wb = z.querySelector('#pzWin');
    if(wb) wb.onclick = () => openPasteBox(kind);
    if(done) done.onclick = () => {
      const v = ta ? ta.value : '';
      if(!v.trim()){ toast('框里还没有内容'); return; }
      handlePasteText(kind, v);
    };
    const ae = document.activeElement;
    if(ta && (!ae || ae.tagName === 'BODY')) setTimeout(() => ta.focus(), 30);
  });
}

/* 直接读剪贴板（https/localhost 才行，file:// 打不开就提示手动 Ctrl+V） */
function readClip(kind, append){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    toast('这个浏览器不允许直接读剪贴板，请在框里按 Ctrl+V');
    return;
  }
  navigator.clipboard.readText().then(t => {
    if(!t || !t.trim()){ toast('剪贴板里没有文本'); return; }
    if(append){ append(t); return; }
    handlePasteText(kind, t);
  }).catch(() => toast('读不到剪贴板，请在框里按 Ctrl+V'));
}
/* 追加一段到粘贴框（分多次贴大数据用），返回累计行数 */
function zoneAppend(ta, t){
  ta.value = ta.value ? ta.value.replace(/\s+$/, '') + '\n' + t : t;
  return ta.value.split(/\r?\n/).filter(l => l.trim() !== '').length;
}
/* 表头是否与该表对得上：返回解析出的表数组 */
function handlePasteText(kind, txt){
  const tabs = parseClip(txt);
  if(!tabs.length){ headBadDlg(kind, txt); return; }
  const hit = tabs.filter(t => t.kind === kind);
  if(hit.length){ importTabs(kind, hit); return; }
  mismatchDlg(kind, tabs, txt);
}
function importTabs(kind, tabs){
  if(PIDX < 0 || !PROJ[PIDX]){
    const d = newDB();
    PIDX = addProject('新项目 ' + (PROJ.length + 1), d);
    DB = d;
  }
  applyTables(tabs, DB);
  const on = DB.overview.find(x => x.k === '工程名称');
  if(on && on.v && /^新项目\s*\d*$/.test(PROJ[PIDX].name || '')) PROJ[PIDX].name = on.v;
  TAB = kind; PART = ''; SEL = -1; LVL = ''; COLL.clear(); clearOpenSets(); SORT = { k:'', dir:1 };
  save(); $('#mask').classList.remove('on'); render();
  toast('「' + KIND_LABEL[kind] + '」' + impStatText());
}
/* 强行按当前页表头解析（表头对不上但用户坚持要用） */
function forceTabs(kind, txt){
  const all = splitLines(mergeWrapped(txt));
  /* 第一行本身带标准列名（可能是报表样式的表头，或前面多了「序号」列）→ 就用它当表头，
     后面全部按「列名」对应，绝不会因为多一列 / 少一列把整行数据挪位 */
  if(all.length && looksLikeHeader(all[0], kind)) return [{ kind:kind, head:all[0], rows:all.slice(1) }];
  return [{ kind:kind, head:H[kind].slice(), rows:all.filter(r => !detectKind(r)) }];
}
function dlgBox(title, body, ft){
  $('#dlg').innerHTML = '<h4>' + esc(title) + '</h4><div class="bd">' + body + '</div>' +
    (ft ? '<div class="ft">' + ft + '</div>' : '');
  $('#mask').classList.add('on');
}
/* 表头完全没识别出来 */
function headBadDlg(kind, txt){
  const first = splitLines(txt)[0] || [];
  dlgBox('没认出表头',
    '<div class="note">这一段没找到「<b>' + esc(KIND_LABEL[kind]) + '</b>」的表头，所以没有导入。</div>' +
    '<p style="margin-top:6px">复制时请<b>连表头一行一起选中</b>（在广联达里从列名那行开始拖）。<br>' +
    '「' + esc(KIND_LABEL[kind]) + '」需要的表头是：</p>' +
    '<div style="background:var(--line2);padding:6px 8px;border-radius:3px;margin:6px 0;font-size:11px;white-space:pre-wrap">' +
      esc(HEAD_TIP[kind] || '') + '</div>' +
    (first.length ? '<p style="color:var(--txt2)">你贴进来的第一行是：<code>' + esc(first.slice(0, 8).join(' | ')) + '</code></p>' : ''),
    '<button class="pbtn gh" id="hzNo">取消</button>' +
    '<button class="pbtn gh" id="hzAll">打开大窗口自己选</button>' +
    '<button class="pbtn" id="hzYes">就按「' + esc(KIND_LABEL[kind]) + '」导入</button>');
  $('#hzNo').onclick = () => $('#mask').classList.remove('on');
  $('#hzAll').onclick = () => { $('#mask').classList.remove('on'); openImport(PIDX); };
  $('#hzYes').onclick = () => { $('#mask').classList.remove('on'); importTabs(kind, forceTabs(kind, txt)); };
}
/* 识别出来了，但不是当前这张表 */
function mismatchDlg(kind, tabs, txt){
  const other = tabs[0].kind;
  const ks = [];
  tabs.forEach(t => { if(ks.indexOf(t.kind) < 0) ks.push(t.kind); });
  dlgBox('表头对不上',
    '<div class="note">当前页面是「<b>' + esc(KIND_LABEL[kind]) + '</b>」，但贴进来的数据看起来是：<b>' +
      ks.map(k => esc(KIND_LABEL[k] || k)).join('、') + '</b>。<br>没有直接导入，怕把数据放错地方。</div>' +
    '<p style="margin-top:8px;color:var(--txt2)">识别到的表头：<code>' +
      esc((tabs[0].head || []).slice(0, 8).join(' | ')) + '</code></p>' +
    '<p style="margin-top:6px;color:var(--txt2)">「' + esc(KIND_LABEL[kind]) + '」需要的表头：<code>' +
      esc((HEAD_TIP[kind] || '').split('\t').slice(0, 8).join(' | ')) + '</code></p>',
    '<button class="pbtn gh" id="mmNo">取消</button>' +
    '<button class="pbtn gh" id="mmForce">就放到「' + esc(KIND_LABEL[kind]) + '」</button>' +
    '<button class="pbtn" id="mmGo">改导入到「' + esc(KIND_LABEL[other] || other) + '」</button>');
  $('#mmNo').onclick = () => $('#mask').classList.remove('on');
  $('#mmForce').onclick = () => { $('#mask').classList.remove('on'); importTabs(kind, forceTabs(kind, txt)); };
  $('#mmGo').onclick = () => {
    $('#mask').classList.remove('on');
    importTabs(other, tabs.filter(t => t.kind === other));
  };
}
/* 表格页标题栏的「粘贴数据」小窗口 */

    '<button class="pbtn gh" id="ptCancel">关闭</button>');
  bindImpReplace($('#dlg'));
  const ta = $('#pta');
  ta.dataset.k = kind;
  const mcb = $('#ptMulti'), done = $('#ptDone'), stat = $('#ptStat');
  const isMulti = () => !!(mcb && mcb.checked);
  const showStat = () => { if(stat) stat.textContent = '已贴 ' + ta.value.split(/\r?\n/).filter(l => l.trim() !== '').length + ' 行，可继续贴'; };
  if(mcb) mcb.onchange = () => {
    if(done) done.style.display = mcb.checked ? '' : 'none';
    if(!mcb.checked && stat) stat.textContent = '';
    ta.placeholder = mcb.checked ? '已勾选分次粘贴：每贴一段都会续到这里，全部贴完再点「完成合并导入」' : (HEAD_TIP[kind] || '');
  };
  const append = t => { zoneAppend(ta, t); showStat(); toast('已追加一段，继续贴下一段或点「完成合并导入」'); };
  setTimeout(() => ta.focus(), 30);
  ta.onpaste = e => {
    e.preventDefault();
    const cd = e.clipboardData || window.clipboardData;
    const t = cd ? cd.getData('text') : '';
    if(!t || !t.trim()){ toast('剪贴板里没有文本'); return; }
    if(isMulti()){ append(t); return; }
    ta.value = '';
    handlePasteText(kind, t);
  };
  if(done) done.onclick = () => {
    const v = ta.value;
    if(!v.trim()){ toast('框里还没有内容'); return; }
    handlePasteText(kind, v);
  };
  $('#ptRead').onclick = () => readClip(kind, isMulti() ? append : null);
  $('#ptCancel').onclick = () => $('#mask').classList.remove('on');
}
/* 表名 → 全部列 / 默认列 */
const ALL_COLS = { bill:BILL_COLS, measure:MEASURE_COLS, other:OTHER_COLS, res:RES_COLS, fee:FEE_COLS };
function allColsOf(ns){
  const base = ns.indexOf('|') >= 0 ? ns.split('|')[0] : ns;
  return ALL_COLS[base] || BILL_COLS;
}
/* 分部构成统计：显示到第 lv 级（有更细分部的父级不再单列，避免重复计数） */
function partStat(lv){
  const out = [];
  DB.bill.forEach(r => {

/* 竖向拖动条：工程项目栏 / 分部目录栏的宽度 */
function startVResize(e, el, key, min, max){
  e.preventDefault(); e.stopPropagation();
  const x0 = e.clientX, w0 = el.getBoundingClientRect().width || 200;
  let w = w0;
  document.body.style.cursor = 'col-resize';
  const mv = ev => {
    w = Math.min(max, Math.max(min, Math.round(w0 + ev.clientX - x0)));
    el.style.width = w + 'px'; el.style.flex = '0 0 ' + w + 'px';
  };
  const up = () => {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor = '';
    GSET[key] = w; saveGS();
  };
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
}

function startResize(e, rz){
  e.preventDefault(); e.stopPropagation();
  const th = rz.parentNode, tb = th.closest('table');

  const ns = tb.dataset.ns || TAB, k = rz.dataset.r;
  const col = tb.querySelector('colgroup col[data-k="' + k + '"]');

  const card = tb.closest('.gt-card');
  document.body.style.cursor = 'col-resize';
  const total = () => {
    let t = 0;
    tb.querySelectorAll('colgroup col').forEach(c => { t += parseFloat(c.style.width) || 0; });
    return t;
  };
  const mv = ev => {
    const w = Math.max(28, Math.round(w0 + ev.clientX - x0));
    col.style.width = w + 'px';
    const t = total();
    tb.style.minWidth = t + 'px';
    tb.style.width = t + 'px';          /* 表格宽度跟着列宽走，其余列不伸缩 */
    if(card) card.style.minWidth = t + 'px';
  };
  const up = ev => {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor = '';
    const w = Math.max(28, Math.round(w0 + ev.clientX - x0));
    if(!GSET.colw[ns]) GSET.colw[ns] = {};

}

/* ---------------- CSV 导出 ---------------- */
const csvEsc = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function csvBlock(cols, rows, title, text1, treeCols){
  if(!rows || !rows.length) return '';
  let s = '[' + title + ']\n' + cols.map(c => csvEsc(c.l)).join(',');
  if(treeCols) s += ',行类型,层级';
  s += '\n';
  /* 数值列导出纯数字（不带千分位），避免 Excel 里变成文本 */
  rows.forEach(r => {
    const cells = cols.map((c, ci) => {
      const v = r.c[c.k];
      if(c.t === 'n'){ const n = num(v); return n == null ? '' : String(n); }
      const t = cellTxt(c, v, r);
      /* 首列按文本导出：="00010101"，防止 Excel 把编码前面的 0 吃掉 */
      if(text1 && ci === 0 && t !== '' && /^0\d|^\d{6,}$/.test(String(t).trim()))
        return '"=""' + String(t).replace(/"/g, '""') + '"""';
      return csvEsc(t);
    });
    if(treeCols){ cells.push(csvEsc(r._cls || '')); cells.push(csvEsc(r._dep != null ? r._dep : '')); }
    s += cells.join(',') + '\n';
  });
  return s + '\n';
}
function kvBlock(list, title){
  if(!list || !list.length) return '';
  return '[' + title + ']\n名称,内容\n' + list.map(x => {
    const s = String(x.v == null ? '' : x.v).trim();
    const n = (/^[\d,，]+\.?\d*$/.test(s) ? num(s) : null);
    return csvEsc(x.k) + ',' + (n == null ? csvEsc(x.v) : String(n));
  }).join('\n') + '\n\n';
}
/* 按选择导出（tables: kind 数组，text1: 首列按文本） */
function buildCsv(db, tables, text1){
  const T = tables || KIND_ORDER.slice();
  let s = '';
  if(T.indexOf('analysis') >= 0) s += kvBlock(db.analysis, KIND_LABEL.analysis);
  if(T.indexOf('overview') >= 0) s += kvBlock(db.overview, KIND_LABEL.overview);
  if(T.indexOf('bill') >= 0){ const rows = billExportRows() || db.bill; s += csvBlock(BILL_COLS, rows, KIND_LABEL.bill, text1, true); }
  if(T.indexOf('measure') >= 0)  s += csvBlock(MEASURE_COLS, db.measure, KIND_LABEL.measure, text1, true);
  if(T.indexOf('other') >= 0)    s += csvBlock(OTHER_COLS, db.other, KIND_LABEL.other, text1, true);
  if(T.indexOf('res') >= 0){
    const rr = (db.res || []).map(r => ({ c: Object.assign({}, r.c, { rk:(RES_CATS.find(g => g.k === r._rk) || {}).l || '' }), _dep:r._dep, _cls:r._cls }));
    s += csvBlock(RES_COLS.concat([C('rk', '资源分类', 70, 't')]), rr, KIND_LABEL.res, text1, true);
  }
  if(T.indexOf('fee') >= 0)      s += csvBlock(FEE_COLS, db.fee, KIND_LABEL.fee, text1, true);
  return s;
}

/* ---------------- CSV 解析 / 导入（与导出格式互为逆操作） ---------------- */
/* 还原导出时为保留前导 0 加的 ="..." 文本前缀 */
function untextCell(v){
  v = String(v == null ? '' : v).trim();
  v = v.replace(/^"*="?/, '').replace(/"*"?$/, '');
  return v;
}
/* 把整段 CSV 解析成「逻辑记录」数组（每条记录 = 一个字段数组）。
   正确处理引号内的换行 / CRLF，避免分部分项「项目特征」等多行单元格被拆断，
   从而让「导出 CSV → 导入工程」能完整还原。 */
function parseCsvRecords(text){
  const recs = [], n = text.length;
  let row = [], field = '', q = false, i = 0;
  while(i < n){
    const ch = text[i];
    if(q){
      if(ch === '"'){
        if(text[i + 1] === '"'){ field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      if(ch === '\r'){ i++; continue; }            /* 引号内 CRLF 原样保留到字段 */
      field += ch; i++; continue;
    }
    if(ch === '"'){ q = true; i++; continue; }
    if(ch === ','){ row.push(field); field = ''; i++; continue; }
    if(ch === '\n'){ row.push(field); recs.push(row); row = []; field = ''; i++; continue; }
    if(ch === '\r'){ i++; continue; }
    field += ch; i++;
  }
  if(field !== '' || row.length){ row.push(field); recs.push(row); }
  return recs;
}
/* 把导出的 CSV 文本解析回一个 db 对象（七张表） */
function importCsvText(text){
  text = String(text).replace(/^﻿/, '');   /* 去掉 UTF-8 BOM，否则首段标题匹配不上 */
  const recs = parseCsvRecords(text);
  const db = newDB();
  const blocks = []; let cur = null;
  for(let ri = 0; ri < recs.length; ri++){
    const rec = recs[ri];
    /* 段标记：[表名] 单独成行（引号外、仅一个字段） */
    if(rec.length === 1){
      const m = /^\[(.+?)\]\s*$/.exec(rec[0].trim());
      if(m){ cur = { title:m[1], recs:[] }; blocks.push(cur); continue; }
    }
    if(!cur) continue;
    /* 跳过整段之间的空行（导出时每块尾部追加的空白行） */
    if(rec.length === 1 && rec[0].trim() === '') continue;
    if(rec.every(f => String(f).trim() === '')) continue;
    cur.recs.push(rec);
  }
  const labelToKind = {};
  Object.keys(KIND_LABEL).forEach(k => { labelToKind[KIND_LABEL[k]] = k; });
  const COLDEFS = {
    bill: BILL_COLS, measure: MEASURE_COLS, other: OTHER_COLS, fee: FEE_COLS,
    res: RES_COLS.concat([C('rk', '资源分类', 70, 't')])
  };
  blocks.forEach(b => {
    const kind = labelToKind[b.title];
    if(!kind || !b.recs.length) return;
    const header = b.recs[0] || [];            /* 第一行是列头 */
    const dataRecs = b.recs.slice(1);
    if(kind === 'analysis' || kind === 'overview'){
      const arr = dataRecs.filter(r => (r[0] || '').trim() !== '').map(r => ({
        k: untextCell(r[0] || ''), v: untextCell(r[1] || '')
      })).filter(x => x.k !== '');
      db[kind] = arr;
      return;
    }
    const defs = COLDEFS[kind];
    if(!defs) return;
    let idxCls = -1, idxDep = -1;
    header.forEach((h, i) => { if(h === '行类型') idxCls = i; else if(h === '层级') idxDep = i; });
    const rows = [];
    for(let r = 0; r < dataRecs.length; r++){
      const cells = dataRecs[r];
      const row = { c:{}, _cls:'', _dep:0 };
      header.forEach((h, ci) => {
