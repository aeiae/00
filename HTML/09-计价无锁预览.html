<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计价文件无锁预览工具</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --bar:#eef1f4; --line:#d9dfe6; --tx:#252b33; --tx2:#68737f;
  --accent:#1f6fb2; --accent-bg:#e6f0fa; --green:#eaf6e4; --green-line:#c9e6b8;
  --blue:#e2effa; --blue-line:#b9d8ef; --mauve:#a5449b; --orange:#e08a1e;
  --hover:#f3f8fd; --sel:#d9e9f7; --warn:#b26a19; --shadow:0 1px 3px rgba(20,30,40,.06);
  --tl:#e0a155;
}
html[data-theme="dark"]{
  --bg:#15191e; --panel:#1d2229; --bar:#252b33; --line:#39414b; --tx:#d7dee6; --tx2:#96a1ae;
  --accent:#6eabe3; --accent-bg:#24384b; --green:#25382a; --green-line:#3e5e44;
  --blue:#223547; --blue-line:#365773; --mauve:#d98fce; --orange:#e5a651;
  --hover:#28313b; --sel:#2b455d; --warn:#d7a167; --shadow:0 1px 3px rgba(0,0,0,.25);
  --tl:#9d7434;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}

/* title bar */
.title{height:32px;flex:none;display:flex;align-items:center;gap:9px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.title .logo{font-weight:600;color:var(--accent);font-size:12px;white-space:nowrap}
.title .file{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 10px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.mini{padding:1px 7px;font-size:11px}
.spacer{flex:1}
#search{width:190px;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:3px 8px;outline:none}
#search:focus{border-color:var(--accent)}
#levelSel{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:2px 4px;outline:none}

/* tabs */
.tabs{height:29px;flex:none;display:flex;align-items:flex-end;gap:3px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line)}
.tabs button{height:26px;min-width:86px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;color:var(--tx2)}
.tabs button.on{height:28px;color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}

/* main split + 可拖动列宽 */
.main{flex:1;min-height:0;display:flex}
.tree1{width:182px;flex:none;background:var(--panel);overflow:auto;overflow-x:hidden}
.tree2{width:200px;flex:none;background:var(--panel);overflow:auto;overflow-x:hidden}
.hsplit{width:5px;flex:none;cursor:ew-resize;background:var(--panel);border-right:1px solid var(--line);position:relative;touch-action:none;z-index:2}
.hsplit::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:1px;background:transparent}
.hsplit:hover,.hsplit.drag{background:var(--accent-bg)}
.hsplit:hover::after,.hsplit.drag::after{background:var(--accent)}
.tree-hd{position:sticky;top:0;background:var(--bar);color:var(--tx2);padding:5px 9px;border-bottom:1px solid var(--line);font-size:11px;z-index:1;display:flex;justify-content:space-between}
/* 目录树：橙色折角连接线 + 节点图标（参照广联达树样式） */
.tn{position:relative;display:flex;align-items:center;height:21px;padding-right:8px;white-space:nowrap;cursor:pointer;user-select:none}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--sel)}
.tn.on .nm{color:var(--accent);font-weight:600}
.tn .tv{position:absolute;width:1px;background:var(--tl);pointer-events:none}
.tn .tj{position:absolute;top:calc(50% - 6px);height:7px;border-left:1px solid var(--tl);border-bottom:1px solid var(--tl);border-bottom-left-radius:4px;pointer-events:none}
.tn .tg{flex:none;width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:#8d96a1}
.tn .tg.box{color:#2f6091}
.tn.on .tg{color:var(--accent)}
html[data-theme="dark"] .tn .tg{color:#8e99a5}
html[data-theme="dark"] .tn .tg.box{color:#9ec4e6}
.tn .ic{flex:none;width:15px;height:14px;display:flex;align-items:center;justify-content:center;margin-right:4px;color:#77828f}
.tn .ic.k{color:#2f6fa8}
html[data-theme="dark"] .tn .ic.k{color:#7fb1dc}
html[data-theme="dark"] .tn .ic{color:#9aa6b3}
.tn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tn .ct{flex:none;color:var(--tx2);font-size:11px;margin-left:5px}

.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;z-index:3;background:var(--bar);color:var(--tx);font-weight:600;text-align:left;padding:5px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px;background:var(--panel)}
tr.section td{background:var(--bar);font-weight:600;color:var(--tx)}
tr.section.sec1 td{background:#d8e3ef}
tr.section.sec2 td{background:#e6ecf3}
tr.section.sec3 td{background:#eef2f7}
tr.section.sec4 td{background:#f4f7fa}
html[data-theme="dark"] tr.section.sec1 td{background:#2b3d50}
html[data-theme="dark"] tr.section.sec2 td{background:#28323d}
html[data-theme="dark"] tr.section.sec3 td{background:#232c35}
html[data-theme="dark"] tr.section.sec4 td{background:#20272e}
tr.bill td{background:var(--green)}
tr.quota td{background:var(--blue)}
tr.material td{background:var(--panel);color:var(--mauve)}
td.seq{text-align:center;color:var(--tx2);padding-left:2px;padding-right:2px}
td.secname{font-weight:600}
td.multi{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;vertical-align:top}
tbody tr:hover td{filter:brightness(.97)}
tbody tr.picked td{box-shadow:inset 0 0 0 1px var(--accent)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.indent1{padding-left:24px}
td.indent2{padding-left:42px}
td.cat{text-align:center;color:var(--tx2)}
td.match{background:#fff3c4;color:#7a4a00}
html[data-theme="dark"] td.match{background:#4c3f1c;color:#f0d38a}
.tw{display:inline-block;width:11px;color:var(--tx2);cursor:pointer;text-align:center}
.feature{color:var(--tx2);font-size:11px}

/* detail pane */
.splitter{height:7px;flex:none;cursor:ns-resize;touch-action:none;background:var(--bar);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.splitter:hover{background:var(--accent-bg)}
.detail{height:41%;min-height:80px;flex:none;display:flex;flex-direction:column;background:var(--panel)}
.detail-hd{height:25px;flex:none;display:flex;align-items:center;gap:2px;background:var(--bar);border-bottom:1px solid var(--line);padding:0 6px}
.detail-hd button{border:1px solid transparent;background:none;color:var(--tx2);padding:2px 8px;font-size:11px}
.detail-hd button.on{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--accent);font-weight:600}
.detail-body{flex:1;min-height:0;overflow:auto}
.detail-body table{font-size:11px}
.detail-body th{top:0}
.detail-body td{padding:2px 7px}
.detail-body tr.material td{color:var(--mauve);background:rgba(165,68,155,.07)}
html[data-theme="dark"] .detail-body tr.material td{background:rgba(217,143,206,.12)}
.empty{padding:18px;color:var(--tx2);text-align:center}

/* status */
.status{height:22px;flex:none;display:flex;align-items:center;gap:10px;padding:0 9px;background:var(--bar);border-top:1px solid var(--line);color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden}
.status b{font-weight:600;color:var(--tx)}

/* drop / start */
.start{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.drop{width:min(620px,80vw);border:2px dashed var(--line);border-radius:12px;background:var(--panel);padding:44px 30px;text-align:center;box-shadow:var(--shadow)}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.drop h2{margin:0 0 8px;font-size:16px}
.drop p{color:var(--tx2);margin:5px 0}
.drop .big{margin-top:20px;padding:8px 22px;font-size:13px}
.bar-progress{height:5px;background:var(--bar);border-radius:3px;overflow:hidden;margin-top:18px;display:none}
.bar-progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s}
.msg{margin-top:10px;color:var(--tx2);min-height:16px}
.msg.err{color:#c0392b}
.convert{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.convert .bar-progress{display:block;width:340px}

/* cost analysis */
.cost-wrap{min-width:100%;width:max-content}
table.cost{font-size:11px;width:max-content}
table.cost th{background:#fde9cf;text-align:center;font-size:11px;line-height:1.3;padding:4px 5px;white-space:normal;color:var(--tx)}
html[data-theme="dark"] table.cost th{background:#4a3b2a}
table.cost td{padding:2px 6px;font-size:11px}
table.cost td.nm{font-weight:600;color:var(--tx)}
table.cost tr.cost-row:nth-child(even) td{background:#fffcf4}
html[data-theme="dark"] table.cost tr.cost-row:nth-child(even) td{background:#20242a}
table.cost tr.total td{background:#c9e3f3;font-weight:600}
html[data-theme="dark"] table.cost tr.total td{background:#27455a}
table.cost td.seq{width:40px}
table.cost .ord{color:var(--tx2)}
.cost-3cai{padding:10px 12px 16px;width:max-content;min-width:520px}
.cost-3cai-hd{font-weight:600;font-size:11px;margin-bottom:5px}
.cost-3cai table{width:420px;font-size:11px}
.cost-3cai th{background:var(--bar);text-align:center;padding:3px 6px}
.cost-3cai td{padding:2px 6px}
.cost-3cai .hint{margin-top:5px}

/* other items / resource summary / fee summary */
.hjbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;padding:4px 9px;background:var(--bar);border-bottom:1px solid var(--line);font-size:11px;color:var(--tx2);white-space:nowrap}
.hjbar label{cursor:pointer}
.hjbar b{color:var(--tx);font-weight:600}
.hjbar .hint{margin-left:auto}
th.mk{background:#fde9cf}
html[data-theme="dark"] th.mk{background:#4a3b2a}
td.mkcol{background:#fffdf7}
html[data-theme="dark"] td.mkcol{background:#242821}
td.material{color:var(--mauve)}

/* overview pages */
.cards{padding:12px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{font-size:12px;margin:0 0 9px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:5px 16px;color:var(--tx2)}
.kv b{color:var(--tx);font-weight:600}
.ov2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1100px){.ov2{grid-template-columns:1fr}}
.mono{font-family:Consolas,Monaco,monospace;font-size:11px}
.hint{color:var(--tx2);font-size:11px}
.warn{color:var(--warn)}

/* 新点（Epoint）加密容器识别面板 */
.epoint{flex:1;display:none;flex-direction:column;overflow:auto;padding:16px;gap:12px;background:var(--bg)}
.ep-hd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.ep-hd b{font-size:13px}
.ep-badge{flex:none;background:#e8f0fe;color:#1a4fa0;border:1px solid #bcd0f0;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
html[data-theme="dark"] .ep-badge{background:#243449;color:#a9c6ee;border-color:#38506e}
.ep-warn{background:#fff7e0;border:1px solid #f0d79a;color:#7a5a13;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.7}
html[data-theme="dark"] .ep-warn{background:#3a3020;border-color:#5c4a25;color:#e6cd92}
.ep-warn code{font-family:Consolas,Monaco,monospace;background:rgba(0,0,0,.05);border-radius:3px;padding:0 3px}
html[data-theme="dark"] .ep-warn code{background:rgba(255,255,255,.08)}
.ep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.ep-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.ep-card span{display:block;color:var(--tx2);font-size:11px}
.ep-card b{display:block;font-size:18px;font-weight:600;margin-top:4px;color:var(--accent)}
.ep-card i{display:block;font-style:normal;color:var(--tx2);font-size:10.5px;margin-top:3px}
.ep-line{font-size:11.5px;color:var(--tx2)}
.ep-line code{font-family:Consolas,Monaco,monospace;color:var(--tx)}
.ep-tbl{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:46vh;box-shadow:var(--shadow)}
.ep-tbl table{font-size:11.5px}
.ep-tbl th{position:sticky;top:0;background:var(--bar)}
.ep-tbl tr.ep-enc td{color:#9a5b12}
html[data-theme="dark"] .ep-tbl tr.ep-enc td{color:#e0b276}
.ep-tbl tr.ep-zip td{color:var(--tx2)}
.ep-tip{font-size:11.5px;color:var(--tx2);line-height:1.7;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.ep-actions{display:flex;gap:8px;padding-bottom:8px}

</style>
</head>
<body>
<div class="app">
  <div class="title">
    <span class="logo">计价无锁预览</span>
    <span class="file" id="fileName">未打开工程</span>
    <span class="spacer"></span>
    <select id="levelSel" title="显示层级">
      <option value="s1">一级分部</option>
      <option value="s2">二级分部</option>
      <option value="s3">三级分部</option>
      <option value="s4">四级分部</option>
      <option value="bill">清单</option>
      <option value="quota">定额</option>
      <option value="all" selected>全部</option>
    </select>
    <input id="search" placeholder="搜索清单 / 定额 / 人材机…">
    <button class="btn mini" id="exportBtn" title="把当前工程打包成可单独双击打开的快照 HTML">导出 HTML</button>
    <button class="btn mini" id="themeBtn">深色</button>
  </div>
  <div class="tabs" id="tabs" style="display:none"></div>
  <div class="start" id="startView">
    <div class="drop" id="dropZone">
      <h2>选择或拖入计价文件</h2>
      <p>全程在本机浏览器内只读解析，不启动计价软件、不占用原文件、不上传任何数据。</p>
      <p class="hint">广联达：.gbq7 / .gbq6（清单与定额模式均可读）&nbsp;·&nbsp;新点：.EYS11 / .emjyx（识别容器结构，加密数据段不破解）</p>
      <button class="btn primary big" id="pickBtn">选择计价文件</button>
      <input type="file" id="fileInput" accept=".gbq7,.gbq6,.gbq,.eys,.eys11,.een,.emjyx,.gc" hidden>
      <div class="msg" id="msg1"></div>
    </div>
  </div>
  <div class="convert" id="convertView" style="display:none">
    <h2 style="margin:0;font-size:14px">正在解析工程</h2>
    <div class="bar-progress" id="progressBar" style="display:block"></div>
    <div class="msg" id="msg2"></div>
    <div class="hint">首次解析 10~20 MB 工程约需数秒，请稍候</div>
  </div>
  <div class="epoint" id="epointView" style="display:none"></div>
  <div class="main" id="workView" style="display:none">
    <div class="tree1" id="tree1"></div>
    <div class="hsplit" id="hs1" title="拖动调整工程结构列宽（双击恢复默认）"></div>
    <div class="tree2" id="tree2"></div>
    <div class="hsplit" id="hs2" title="拖动调整分部 / 专业列宽（双击恢复默认）"></div>
    <div class="content">
      <div class="grid-wrap" id="grid"></div>
      <div class="splitter" id="splitter" title="拖动调整工料显示高度"></div>
      <div class="detail" id="detail">
        <div class="detail-hd">
          <button class="on" id="detailTitle">工料显示</button>
          <span class="spacer"></span>
          <span class="hint">点击定额行查看人材机组成</span>
        </div>
        <div class="detail-body" id="detailBody"><div class="empty">选中定额行后，在此显示人材机明细</div></div>
      </div>
    </div>
  </div>
  <div class="status">
    <span id="statusLeft">就绪 · 离线只读</span>
    <span class="spacer"></span>
    <span id="statusRight"></span>
  </div>
</div>
<script>
/* GBQ7 只读解析内核：ZIP -> GSP(Rijndael+zlib) -> 业务表。零依赖，浏览器/Node 均可运行。 */
(function (global) {
  'use strict';

  var TE = new TextEncoder();
  var TD_UTF8 = new TextDecoder('utf-8');
  var TD_UTF16 = new TextDecoder('utf-16le');

  function str(bytes) { return TD_UTF8.decode(bytes); }
  function u8(bytes) { return new Uint8Array(bytes); }
  function u32at(d, p) {
    if (p < 0 || p + 4 > d.length) throw new Error('Truncated integer');
    return (d[p] | (d[p + 1] << 8) | (d[p + 2] << 16) | (d[p + 3] << 24)) >>> 0;
  }
  function eq(d, off, arr) {
    if (off + arr.length > d.length) return false;
    for (var i = 0; i < arr.length; i++) if (d[off + i] !== arr[i]) return false;
    return true;
  }
  function findBytes(d, needle, from) {
    for (var i = from || 0; i <= d.length - needle.length; i++) if (eq(d, i, needle)) return i;
    return -1;
  }

  /* ---------- Rijndael 256-bit block / 256-bit key, encrypt only ---------- */
  var SBOX = [
    0x63,0x7c,0x77,0x7b,0xf2,0x6b,0x6f,0xc5,0x30,0x01,0x67,0x2b,0xfe,0xd7,0xab,0x76,

    0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
    0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
    0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
    0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
    0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,
    0x60,0x81,0x4f,0xdc,0x22,0x2a,0x90,0x88,0x46,0xee,0xb8,0x14,0xde,0x5e,0x0b,0xdb,
    0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,

        '<thead><tr><th>容器成员</th><th class="num">大小</th><th>状态</th></tr></thead><tbody>';
      info.members.forEach(function (m) {

        h += '<tr class="' + cls + '"><td title="' + esc(m.name) + '">' + esc(m.name) + '</td>' +

      '把导出的表或 XML 给我，我给工具加一条导入通道，按现在的页签样式直接核量核价。' +
      '加密数据段本身不做破解（密钥在加密锁/云授权里，绕过它属于破解软件授权）。</div>';

  function load(file) {
    if (isEpointName(file.name)) { loadEpoint(file); return; }
    if (!/\.(gbq[0-9]?|zip)$/i.test(file.name)) {
      showMsg('请选择广联达 .gbq7 / .gbq6，或新点 .EYS11 / .emjyx 计价文件', true);
      return;
    }
    $('startView').style.display = 'none';
    $('convertView').style.display = 'flex';
    $('workView').style.display = 'none';
    if ($('epointView')) $('epointView').style.display = 'none';
    showMsg('正在读取 ' + file.name + ' …');
    setProgress(2);
    S.t0 = Date.now();
    setTimeout(function () {
      window.GBQReader.readGBQ(file, function (text, p) {
        showMsg(text);
        setProgress(p);
      }).then(function (data) {
        applyData(data, file.name, { secs: ((Date.now() - S.t0) / 1000).toFixed(1) });
      }).catch(function (e) {
        // 扩展名不是新点、但内容是新点容器（ZIP 内含 xm.info）时，转到新点识别页
        window.GBQReader.readEpoint(file).then(function (info) {
          var isEpointZip = info.container === 'zip' && info.members.some(function (m) { return /(^|\/)xm\.info$/i.test(m.name); });
          if (isEpointZip) { renderEpoint(info); return; }
          showMsg('读取失败：' + (e.message || e), true);
          $('startView').style.display = 'flex';
          $('convertView').style.display = 'none';
        }).catch(function () {
          showMsg('读取失败：' + (e.message || e), true);
          $('startView').style.display = 'flex';
          $('convertView').style.display = 'none';
        });
      });
    }, 30);
  }

  // 解析完成 / 快照载入 共用：复位视图状态并渲染
  function applyData(data, name, opt) {
    opt = opt || {};
    S.data = data;
    S.fileName = name || data.project.name || '工程';
    S.snapshot = !!opt.snapshot;
    S.unit = 0;
    S.tab = 'fbfx';
    S.q = '';
    S.section = '';
    S.level = 'all';
    S.collapsed = {};
    S.picked = null; S.selKey = ''; S.costCollapsed = {}; S.csCollapsed = {};
    S.qtItem = ''; S.hjCat = -1;
    if ($('levelSel')) $('levelSel').value = 'all';
    if ($('search')) $('search').value = '';
    $('fileName').textContent = S.fileName + (opt.snapshot ? '（快照）' : '');
    $('fileName').title = S.fileName;
    chromeData(true);
    $('convertView').style.display = 'none';
    if ($('epointView')) $('epointView').style.display = 'none';
    $('tabs').style.display = 'flex';
    $('workView').style.display = 'flex';
    try { var dh = Number(localStorage.getItem('gbqDetailH')); if (dh > 0) setDetailHeight(dh); } catch (e) {}
    $('statusLeft').innerHTML = '已读取 <b>' + esc(data.project.name) + '</b> · ' + data.counts.units +
      ' 个单位工程 · 造价 <b>¥' + money(data.project.amount) + '</b>' +
      (data.partial ? ' · <span class="warn">部分表未解析</span>' : '');
    $('statusRight').textContent = (opt.secs ? '解析 ' + opt.secs + ' 秒 · ' : '') +
      (data.counts.bill_items ? '清单 ' + data.counts.bill_items + ' · 定额 ' + data.counts.quota_items
        : '定额模式 · 定额 ' + data.counts.quota_items) +
      ' · ' + (opt.snapshot ? '离线快照' : '离线只读') + (opt.time ? ' · ' + opt.time : '');
    renderTabs(); renderTrees(); renderGrid();
  }
  function setProgress(p) { $('progressBar').style.width = Math.max(0, Math.min(100, p)) + '%'; }
  function showMsg(text, err) {
    ['msg1', 'msg2'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.textContent = text;
      el.className = 'msg' + (err ? ' err' : '');
    });
  }

  /* ---------- 导出为独立 HTML 快照 ---------- */
  var B64CH = 0x8000;
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function bytesToB64(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i += B64CH) {
      s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + B64CH, u8.length)));
    }
    return btoa(s);
  }
  function b64ToBytes(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function throughStream(u8, stream) {
    var s = new Blob([u8]).stream().pipeThrough(stream);
    return new Response(s).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function gzipBytes(u8) { return throughStream(u8, new CompressionStream('gzip')); }
  function gunzipBytes(u8) { return throughStream(u8, new DecompressionStream('gzip')); }
  function safeFileName(s) {
    return String(s || '工程').replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || '工程';
  }

  // 用当前页面的克隆作外壳：清掉渲染结果，注入压缩数据，保持零外部依赖
  function buildSnapshotHtml(payload) {
    var root = document.documentElement.cloneNode(true);
    function q(sel) { return root.querySelector(sel); }
    var t = q('title');
    if (t) t.textContent = (payload.project || payload.name) + ' · GBQ7 预览快照';
    ['grid', 'detailBody', 'tree1', 'tree2', 'tabs'].forEach(function (id) {
      var el = q('#' + id);
      if (el) el.innerHTML = '';
    });
    var sv = q('#startView'); if (sv) sv.style.display = 'none';
    var ep = q('#epointView'); if (ep) { ep.innerHTML = ''; ep.style.display = 'none'; }
    var cv = q('#convertView'); if (cv) cv.style.display = 'flex';
    var wv = q('#workView'); if (wv) wv.style.display = 'none';
    var tb = q('#tabs'); if (tb) tb.style.display = 'none';
    var fn = q('#fileName'); if (fn) { fn.textContent = S.fileName + '（快照）'; fn.title = S.fileName; }
    // 快照是纯预览：不再保留「导出 HTML」入口
    var eb = q('#exportBtn'); if (eb && eb.parentNode) eb.parentNode.removeChild(eb);
    var m2 = q('#msg2'); if (m2) { m2.className = 'msg'; m2.textContent = '正在载入工程快照…'; }
    var pb = q('#progressBar'); if (pb) { pb.style.display = 'block'; pb.style.width = '55%'; }
    var sl = q('#statusLeft'); if (sl) sl.textContent = '本地快照 · 载入中…';
    var sr = q('#statusRight'); if (sr) sr.textContent = '';
    var olds = root.querySelectorAll('script[data-snapshot]');
    for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
    var sc = document.createElement('script');
    sc.setAttribute('data-snapshot', '1');
    sc.textContent = 'window.__GBQ_SNAPSHOT__=' + JSON.stringify(payload).replace(/</g, '\\u003c') + ';';
    var scripts = root.querySelectorAll('script');
    var last = scripts[scripts.length - 1];
    last.parentNode.insertBefore(sc, last);
    return '<!DOCTYPE html>\n' + root.outerHTML;
  }

  function exportHtml() {
    if (!S.data) { $('statusRight').textContent = '请先打开一个 GBQ7 工程再导出'; return; }
    var btn = $('exportBtn');
    if (!btn || btn.disabled) return;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '生成中…';
    $('statusRight').textContent = '正在压缩工程数据…';
    var json = JSON.stringify(S.data);
    gzipBytes(new TextEncoder().encode(json)).then(function (gz) {
      var d = new Date();
      var payload = {
        v: 1,
        name: S.fileName,
        project: S.data.project.name || S.fileName,
        amount: S.data.project.amount,
        units: S.data.units.length,
        time: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
          ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
        gz: bytesToB64(gz)
      };
      var html = buildSnapshotHtml(payload);
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = safeFileName(payload.project) + '-预览快照.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 5000);
      btn.disabled = false;
      btn.textContent = label;
      $('statusLeft').innerHTML = '已导出快照 <b>' + esc(a.download) + '</b> · ' + (blob.size / 1048576).toFixed(2) + ' MB';
      $('statusRight').textContent = '双击该文件即可离线查看，无需再选 GBQ7';
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = label;
      $('statusRight').textContent = '导出失败：' + (e.message || e);
    });
  }

  // 快照文件启动：直接解压内嵌数据并进入工作界面
  function bootSnapshot() {
    var snap = window.__GBQ_SNAPSHOT__;
    if (!snap || !snap.gz) return false;
    $('startView').style.display = 'none';
    $('convertView').style.display = 'flex';
    $('workView').style.display = 'none';
    showMsg('正在载入工程快照…');
    setProgress(45);
    gunzipBytes(b64ToBytes(snap.gz)).then(function (u8) {
      var data = JSON.parse(new TextDecoder().decode(u8));
      setProgress(100);
      applyData(data, snap.name || data.project.name, { snapshot: true, time: snap.time });
    }).catch(function (e) {
      showMsg('快照载入失败：' + (e.message || e) + '，可点下方重新选择 GBQ7 文件。', true);
      $('startView').style.display = 'flex';
      $('convertView').style.display = 'none';
    });
    return true;
  }

  function renderTabs() {
    var h = '';
    TABS.forEach(function (t) {
      h += '<button data-t="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
    });
    $('tabs').innerHTML = h;
    var bs = $('tabs').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) (function (b) {
      b.onclick = function () {
        S.tab = b.getAttribute('data-t');
        S.q = ''; if ($('search')) $('search').value = '';
        S.qtItem = ''; S.hjCat = -1;
        renderTabs(); renderTrees(); renderGrid();
      };
    })(bs[i]);
  }

  /* ---------- 目录树：图标 / 折角连接线 / 展开收起 ---------- */
  var TSTEP = 15;
  var ICON_SVG = {
    bld: '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M2.4 10.3V2.4h4.3v7.9"/><path d="M6.7 5.4h2.9v4.9"/><path d="M1.1 10.3h9.8"/><path d="M3.7 4.4h1.2M3.7 6.2h1.2M3.7 8h1.2M7.6 7.1h1.1M7.6 8.7h1.1"/></svg>',
    house: '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M1.5 6.2 6 2.1l4.5 4.1"/><path d="M2.7 6.1v4.2h6.6V6.1"/><path d="M5 10.3V7.8h2v2.5"/><circle cx="10.3" cy="9.7" r="1.1" fill="#e08a1e" stroke="none"/></svg>',
    doc: '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M3 1.6h3.9l2.1 2.1v6.7H3z"/><path d="M6.9 1.6v2.2h2.1"/><path d="M4.3 6h3.4M4.3 7.5h3.4M4.3 9h2.2"/></svg>',
    list: '<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M2.4 1.6h7.2v8.8H2.4z"/><path d="M4 4.1h1M6.1 4.1h2M4 6h1M6.1 6h2M4 7.9h1M6.1 7.9h2"/></svg>'
  };
  function expSvg(exp, box) {
    if (exp === undefined || exp === '') return '';
    if (box) {
      return '<svg viewBox="0 0 11 11" width="10" height="10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="10" height="10" rx="1.5"/>' +
        (exp === 'open' ? '<path d="M3 5.5h5"/>' : '<path d="M3 5.5h5M5.5 3v5"/>') + '</svg>';
    }
    return exp === 'open'
      ? '<svg viewBox="0 0 10 10" width="9" height="9"><path d="M2 3.4h6L5 7.3z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 10 10" width="9" height="9"><path d="M3.6 2l2.9 3-2.9 3z" fill="currentColor"/></svg>';
  }
  // 一行树节点：左侧橙色折角连接线（竖线 + 圆角横线），后接展开符 / 图标 / 名称
  function treeRow(o) {
    var depth = o.depth || 0, pad = 6 + depth * TSTEP, x = pad - 8, h = '';
    if (depth > 0) {
      // 来自父级的主干：末位只画到本行中线，其余贯通
      h += '<i class="tv" style="left:' + x + 'px;' + (o.last ? 'top:0;height:calc(50% + 1px)' : 'top:0;bottom:0') + '"></i>';
      // 本行接入线：有展开符时只连到方框左边，叶子连到图标左边
      h += '<i class="tj" style="left:' + x + 'px;width:' + (o.exp ? 8 : 22) + 'px"></i>';
    }
    h += '<span class="tg' + (o.box ? ' box' : '') + '"' + (o.tg ? ' data-tg="' + esc(o.tg) + '"' : '') + '>' + expSvg(o.exp, o.box) + '</span>';
    h += '<span class="ic ' + (o.iconCls || 'd') + '">' + (ICON_SVG[o.icon] || ICON_SVG.doc) + '</span>';
    h += '<span class="nm">' + esc(o.name) + '</span>';
    if (o.count !== undefined && o.count !== null && o.count !== '' && o.count !== 0) h += '<span class="ct">(' + esc(o.count) + ')</span>';
    if (o.exp) h += '<i class="tv" style="left:' + (pad + 7) + 'px;top:calc(50% + 6px);bottom:0"></i>';
    return '<div class="tn' + (o.on ? ' on' : '') + '" style="padding-left:' + pad + 'px"' + (o.attrs || '') + ' title="' +
      esc(o.title === undefined ? o.name : o.title) + '">' + h + '</div>';
  }
  function toggleTree(k) {
    if (!k) return;
    if (k === 'root') S.secCol.root = !S.secCol.root;
    else if (k.charAt(0) === 's') S.secCol[k] = !S.secCol[k];
    else S.treeCol[k] = !S.treeCol[k];
    renderTrees();
  }
  function selectUnit(idx) {
    S.unit = idx; S.section = ''; S.picked = null; S.collapsed = {};
    renderTrees(); renderGrid();
  }
  function bindTreeClicks() {
    ['tree1', 'tree2'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener('click', function (e) {
        var t = e.target;
        var tg = t.closest ? t.closest('.tg') : null;
        var row = t.closest ? t.closest('.tn') : null;
        if (tg && tg.getAttribute('data-tg')) { toggleTree(tg.getAttribute('data-tg')); return; }
        if (!row) return;
        if (row.hasAttribute('data-u')) return selectUnit(Number(row.getAttribute('data-u')));
        if (row.hasAttribute('data-s')) { S.section = row.getAttribute('data-s'); renderTrees(); renderGrid(); return; }
        if (row.hasAttribute('data-q')) { S.qtItem = row.getAttribute('data-q'); renderTrees(); renderGrid(); return; }
        if (row.hasAttribute('data-h')) { S.hjCat = Number(row.getAttribute('data-h')); renderTrees(); renderGrid(); return; }
        var g = row.querySelector('.tg[data-tg]');
        if (g) toggleTree(g.getAttribute('data-tg'));
      });
    });
  }

  function renderTrees() {
    var d = S.data;
    var h = '<div class="tree-hd"><span>工程结构</span><span>' + d.counts.units + '</span></div>';
    var nodes = d.project.hierarchy, children = {};
    nodes.forEach(function (n) { var k = String(n.pid); (children[k] = children[k] || []).push(n); });
    function walk(pid, depth) {
      var arr = children[String(pid)] || [];
      arr.forEach(function (n, i) {
        var isUnit = n.type === 2, idx = -1;
        if (isUnit) {
          for (var j = 0; j < d.units.length; j++) if (String(d.units[j].file_id) === String(n.id)) { idx = j; break; }
        }
        var kids = isUnit ? [] : (children[String(n.id)] || []);
        var key = 'h' + n.id, open = !S.treeCol[key];
        h += treeRow({
          depth: depth, last: i === arr.length - 1,
          exp: kids.length ? (open ? 'open' : 'closed') : undefined, tg: kids.length ? key : '', box: false,
          icon: isUnit ? 'house' : 'bld', iconCls: 'k', name: n.name,
          on: isUnit && idx === S.unit,
          attrs: idx >= 0 ? ' data-u="' + idx + '"' : '',
          title: n.name + (n.code ? ' · ' + n.code : '')
        });
        if (kids.length && open) walk(n.id, depth + 1);
      });
    }
    walk(null, 0);
    $('tree1').innerHTML = h;

    var show2 = S.tab === 'fbfx' || S.tab === 'qt' || S.tab === 'hj';
    $('tree2').style.display = show2 ? '' : 'none';
    syncColVis();
    if (!show2) return;
    var u = unit();
    if (S.tab === 'qt') { renderOtherTree(u); return; }
    if (S.tab === 'hj') { renderResCatTree(u); return; }

    var qMode = u && (u.mode === 'quota' || (!((u.sections || []).length) && (u.norm_sections || []).length));
    var secs = u ? ((qMode ? u.norm_sections : u.sections) || []) : [];
    var byId = {}, billsBySec = {};
    secs.forEach(function (s) { byId[s.id] = s; });
    if (u && qMode) u.quota_items.forEach(function (q) {
      if (q.namespace !== 'FBFX') return;
      var sid = q.section_id === null || q.section_id === undefined ? 0 : q.section_id;
      (billsBySec[sid] = billsBySec[sid] || []).push(q);
    });
    else if (u) u.bill_items.forEach(function (b) {
      if (b.namespace !== 'FBFX') return;
      var sid = b.section_id === null || b.section_id === undefined ? 0 : b.section_id;
      (billsBySec[sid] = billsBySec[sid] || []).push(b);
    });
    function subtreeCount(id) {
      var n = (billsBySec[id] || []).length;
      secs.forEach(function (s) {
        if (String(s.path || '').indexOf(String(byId[id] ? byId[id].path : '') + '\\') === 0 && s.id !== id) n += (billsBySec[s.id] || []).length;
      });
      return n;
    }
    var total = u ? (qMode ? u.quota_items.filter(function (q) { return q.namespace === 'FBFX'; })
      : u.bill_items.filter(function (b) { return b.namespace === 'FBFX'; })).length : 0;
    var h2 = '<div class="tree-hd"><span>分部 / 专业</span><span>' + total + '</span></div>';
    var childMap = {};
    secs.forEach(function (s) {
      var k = String(s.pid === null || s.pid === undefined ? -1 : s.pid);
      (childMap[k] = childMap[k] || []).push(s);
    });
    var rootOpen = !S.secCol.root;
    h2 += treeRow({
      depth: 0, last: true, exp: secs.length ? (rootOpen ? 'open' : 'closed') : undefined,
      tg: secs.length ? 'root' : '', box: true, icon: 'list', iconCls: 'd',
      name: '全部分部分项', count: total, on: S.section === '',
      attrs: ' data-s=""', title: '全部分部分项'
    });
    function walkSec(pid, depth) {
      var arr = childMap[String(pid)] || [];
      arr.forEach(function (s, i) {
        if (s.id === 0 && pid === -1) return; // 根节点另作“全部分部分项”
        var kids = childMap[String(s.id)] || [], key = 's' + s.id, open = !S.secCol[key];
        h2 += treeRow({
          depth: depth, last: i === arr.length - 1,
          exp: kids.length ? (open ? 'open' : 'closed') : undefined, tg: kids.length ? key : '', box: true,
          icon: 'doc', iconCls: 'd', name: s.name, count: subtreeCount(s.id) || '',
          on: S.section === String(s.id), attrs: ' data-s="' + esc(s.id) + '"', title: s.name
        });
        if (kids.length && open) walkSec(s.id, depth + 1);
      });
    }
    if (rootOpen) walkSec(0, 1);
    $('tree2').innerHTML = h2;
  }

  // 其他项目树：OtherItemTitle 分组 + OtherItem 明细（按原生分类）
  function renderOtherTree(u) {
    var titles = u ? (u.other_titles || []) : [], items = u ? (u.other_items || []) : [];
    var h = '<div class="tree-hd"><span>其他项目</span><span>' + items.length + '</span></div>';
    h += treeRow({ depth: 0, last: true, icon: 'list', iconCls: 'd', name: '全部', count: items.length,
      on: S.qtItem === '', attrs: ' data-q=""', title: '全部' });
    var childMap = {};
    titles.forEach(function (t) {
      var k = String(t.pid === null || t.pid === undefined ? -1 : t.pid);
      (childMap[k] = childMap[k] || []).push(t);
    });
    function walk(pid, depth) {
      var arr = childMap[String(pid)] || [];
      arr.forEach(function (t, i) {
        h += treeRow({ depth: depth, last: i === arr.length - 1, icon: 'doc', iconCls: 'd', name: t.name,
          on: S.qtItem === 't' + t.id, attrs: ' data-q="t' + esc(t.id) + '"', title: t.name });
        items.forEach(function (it) {
          if (String(it.title_id) !== String(t.id)) return;
          h += treeRow({ depth: depth + 1, last: false, icon: 'doc', iconCls: 'd', name: it.name,
            on: S.qtItem === 'i' + it.id, attrs: ' data-q="i' + esc(it.id) + '"', title: it.name });
        });
        walk(t.id, depth + 1);
      });
    }
    walk(-1, 1);
    // 无标题归属的明细
    items.forEach(function (it) {
      if (titles.some(function (t) { return String(t.id) === String(it.title_id); })) return;
      h += treeRow({ depth: 1, last: false, icon: 'doc', iconCls: 'd', name: it.name,
        on: S.qtItem === 'i' + it.id, attrs: ' data-q="i' + esc(it.id) + '"', title: it.name });
    });
    $('tree2').innerHTML = h;
  }

  // 人材机汇总：只保留 人工表/材料表/机械表/设备表/主材表 五张原生表
  var RES_TABLES = [
    { id: 1, name: '人工表', cost: 1 },
    { id: 2, name: '材料表', cost: 2 },
    { id: 3, name: '机械表', cost: 3 },
    { id: 4, name: '设备表', cost: 4 },
    { id: 5, name: '主材表', cost: 5 }
  ];
  function resTableOf(c) {
    if (!c) return null;
    for (var i = 0; i < RES_TABLES.length; i++) if (String(RES_TABLES[i].id) === String(c.id)) return RES_TABLES[i];
    return null;
  }
  function resInTable(tbl, r) { return Number(r.cost_type) === tbl.cost; }
  function renderResCatTree(u) {
    var cats = u ? (u.resource_categories || []) : [];
    var all = u ? u.resources.length : 0;
    var h = '<div class="tree-hd"><span>人材机分类</span><span>' + all + '</span></div>';
    h += treeRow({ depth: 0, last: true, icon: 'list', iconCls: 'd', name: '所有人材机', count: all,
      on: S.hjCat === -1, attrs: ' data-h="-1"', title: '所有人材机' });
    RES_TABLES.forEach(function (t, i) {
      var c = cats.filter(function (x) { return String(x.id) === String(t.id); })[0];
      var n = u ? u.resources.filter(function (r) { return resInTable(t, r); }).length : 0;
      h += treeRow({ depth: 1, last: i === RES_TABLES.length - 1, icon: 'doc', iconCls: 'd',
        name: c && c.name ? c.name : t.name, count: n,
        on: String(S.hjCat) === String(t.id), attrs: ' data-h="' + t.id + '"', title: t.name });
    });
    $('tree2').innerHTML = h;
  }
  function catMatch(c, r) {
    if (!c) return true;
    if (c.cost_types && c.cost_types.length && c.cost_types.indexOf(Number(r.cost_type)) < 0) return false;
    if (c.mix_types && c.mix_types.length && c.mix_types.indexOf(Number(r.swc_id)) < 0) return false;
    if (c.supply_types && c.supply_types.length && c.supply_types.indexOf(Number(r.supply_type)) < 0) return false;
    return true;
  }

  function tableHead(cols) {
    var h = '<thead><tr>';
    cols.forEach(function (c) { h += '<th class="' + (c[2] === 'n' ? 'num' : '') + '">' + esc(c[0]) + '</th>'; });
    return h + '</tr></thead>';
  }

  // 按原生层级展开：整个项目 → 一/二/三/四级分部 → 清单 → 定额 → 主材
  // 定额模式（无清单）用 NormItemTitle 作分部，定额行直接挂在分部下
  function buildFbfx() {
    var u = unit(), out = [];
    if (!u) return out;
    var quotaMode = u.mode === 'quota' || (!((u.sections || []).length) && (u.norm_sections || []).length);
    var secs = (quotaMode ? u.norm_sections : u.sections) || [], map = {};
    secs.forEach(function (s) { map[s.id] = s; });
    var qBy = {}, rBy = {}, uBy = {};
    u.quota_items.forEach(function (q) { (qBy[q.parent_id] = qBy[q.parent_id] || []).push(q); });
    u.resources.forEach(function (r) { rBy[r.id] = r; });
    u.resource_usage.forEach(function (x) { (uBy[x.norm_id] = uBy[x.norm_id] || []).push(x); });
    var maxSec = LEVELS[S.level] || 9, maxRow = MAXROW[S.level] === undefined ? 3 : MAXROW[S.level];
    var filterId = S.section === '' ? null : Number(S.section), allowed = null;
    if (filterId !== null) {
      allowed = {};
      var fpath = map[filterId] ? String(map[filterId].path || '') : '';
      secs.forEach(function (s) {
        if (s.id === filterId || (fpath && String(s.path || '').indexOf(fpath + '\\') === 0)) allowed[s.id] = 1;
      });
    }
    var ql = S.q ? S.q.toLowerCase() : '';
    function has(v) { return ql && String(v === null || v === undefined ? '' : v).toLowerCase().indexOf(ql) >= 0; }
    function billText(b) { return String(b.code || '') + ' ' + String(b.name || '') + ' ' + String(b.description || ''); }
    function quotaText(q) { return String(q.code || '') + ' ' + String(q.name || ''); }
    function matText(r) { return String(r.code || '') + ' ' + String(r.name || '') + ' ' + String(r.spec || ''); }
    function matsOf(q) {
      var a = [];
      (uBy[q.id] || []).forEach(function (x) {
        var r = rBy[x.resource_id] || {};
        if (Number(r.cost_type) === 5) a.push({ x: x, r: r }); // 5 = 主材
      });
      return a;
    }
    var serial = 0;
    function emitSection(s, depth) {
      if (allowed && !allowed[s.id]) return;
      out.push({ kind: 'section', row: s, depth: depth, code: depth === 0 ? '' : 'B' + depth });
      if (S.collapsed['s' + s.id]) return;
      if (depth < maxSec) secs.forEach(function (child) { if (child.pid === s.id) emitSection(child, depth + 1); });
      if (maxRow < 1) return;
      if (quotaMode) {
        u.quota_items.forEach(function (q) {
          if (q.namespace !== 'FBFX') return;
          var qsid = q.section_id === null || q.section_id === undefined ? 0 : q.section_id;
          if (String(qsid) !== String(s.id)) return;
          var ms = matsOf(q), qh = ql && has(quotaText(q)), mh = false;
          ms.forEach(function (m) { if (has(matText(m.r))) mh = true; });
          if (ql && !qh && !mh) return;
          out.push({ kind: 'quota', row: q, bill: null, flat: true, no: ++serial });
          if (maxRow < 2 || S.collapsed['q' + q.id]) return;
          ms.forEach(function (m) {
            if (ql && !qh && !has(matText(m.r))) return;
            out.push({ kind: 'material', row: m.x, res: m.r, quota: q, no: ++serial });
          });
        });
        return;
      }
      u.bill_items.forEach(function (b) {
        if (b.namespace !== 'FBFX') return; // 单价措施单列在“措施项目”页签
        var sid = b.section_id === null || b.section_id === undefined ? 0 : b.section_id;
        if (sid !== s.id) return;
        var billHit = !ql || has(billText(b)), quotaHit = false, qList = [];
        (qBy[b.id] || []).forEach(function (q) {
          var ms = matsOf(q), qh = ql && has(quotaText(q)), mh = false;
          ms.forEach(function (m) { if (has(matText(m.r))) mh = true; });
          if (qh || mh) quotaHit = true;
          qList.push({ q: q, ms: ms, qh: qh, mh: mh });
        });
        if (ql && !billHit && !quotaHit) return;
        out.push({ kind: 'bill', row: b, no: ++serial });
        if (S.collapsed['b' + b.id] || maxRow < 2) return;
        qList.forEach(function (it) {
          if (ql && !billHit && !it.qh && !it.mh) return;
          out.push({ kind: 'quota', row: it.q, bill: b, no: ++serial });
          if (maxRow < 3 || S.collapsed['q' + it.q.id]) return;
          it.ms.forEach(function (m) {
            if (ql && !billHit && !it.qh && !has(matText(m.r))) return;
            out.push({ kind: 'material', row: m.x, res: m.r, quota: it.q, no: ++serial });
          });
        });
      });
    }
    var root = null;
    secs.forEach(function (s) {
      if (s.pid === null || s.pid === undefined || s.id === 0) { if (!root || s.id === 0) root = s; }
    });
    var startNode = root, startDepth = 0;
    if (filterId !== null && map[filterId]) {
      startNode = map[filterId];
      startDepth = 1;
      var cur = startNode, guard = 0;
      while (cur && cur.pid !== null && cur.pid !== undefined && cur.pid !== 0 && guard++ < 20) {
        startDepth++; cur = map[cur.pid];
      }
    }
    if (startNode) emitSection(startNode, startDepth);
    if (!out.length) { // 无原生分部表时回退
      if (quotaMode) {
        u.quota_items.forEach(function (q) {
          if (q.namespace !== 'FBFX') return;
          if (ql && !has(quotaText(q))) return;
          out.push({ kind: 'quota', row: q, bill: null, flat: true, no: ++serial });
        });
      } else u.bill_items.forEach(function (b) {
        if (b.namespace !== 'FBFX') return;
        if (ql && !has(billText(b))) return;
        out.push({ kind: 'bill', row: b, no: ++serial });
      });
    }
    return out;
  }

  function renderFbfx() {
    var cols = [
      ['序号', 'no'], ['编码', 'code'], ['类别', 'cat'], ['名称', 'name'], ['项目特征', 'feature'],
      ['是否需要评审', 'review'], ['单位', 'unit'], ['工程量表达式', 'expr'],
      ['含量', 'ratio'], ['工程量', 'qty', 'n'], ['单价', 'price', 'n'], ['合价', 'amount', 'n']
    ];
    var rows = buildFbfx();
    var widths = [36, 112, 40, 190, 210, 52, 48, 92, 58, 82, 82, 92];
    var h = '<table><colgroup>' + widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup>' +
      tableHead(cols) + '<tbody>';
    rows.forEach(function (r, i) {
      var k = r.kind, b = r.row;
      if (k === 'section') {
        var tw = '<span class="tw" data-exp="s' + b.id + '">' + (S.collapsed['s' + b.id] ? '▸' : '▾') + '</span>';
        h += '<tr class="section sec' + r.depth + '" data-i="' + i + '">' +
          '<td class="seq"></td><td title="' + esc(r.code) + '">' + tw + esc(r.code) + '</td>' +
          cell('部', 'cat') + cell(b.name, 'secname', b.name) +
          cell('') + cell('') + cell('') + cell('') + cell('') + cell('') + cell('') + cell('') + '</tr>';
        return;
      }
      var ind = k === 'bill' ? '' : k === 'quota' ? (r.flat ? '' : ' indent1') : ' indent2';
      var code = k === 'material' ? (r.res.code || r.row.resource_code) : b.code;
      var cat = k === 'bill' ? '项' : k === 'quota' ? '定' : '主';
      var name = k === 'material' ? (r.res.name || r.row.resource_name) : b.name;
      var feat = k === 'bill' ? b.description : k === 'material' ? (r.res.spec || '') : '';
      var unitName = k === 'material' ? (r.res.unit || r.row.resource_unit) : b.unit;
      var expr = (b.quantity_expression && b.quantity_expression.expression) || '';
      var ratio = k === 'material' ? r.row.usage : '';
      var qty = k === 'material' ? r.row.qty : b.qty;
      var price = k === 'material' ? r.res.market_rate : b.price;
      var amount = k === 'material' ? product(r.row.qty, r.res.market_rate) : b.amount;
      var tw = k === 'bill' ? '<span class="tw" data-exp="b' + b.id + '">' + (S.collapsed['b' + b.id] ? '▸' : '▾') + '</span>' :
        k === 'quota' ? '<span class="tw" data-exp="q' + b.id + '">' + (S.collapsed['q' + b.id] ? '▸' : '▾') + '</span>' : '';
      var selKey = k === 'quota' ? 'q' + b.id : k === 'material' ? 'm' + r.row.id : '';
      h += '<tr class="' + k + (selKey && S.selKey === selKey ? ' picked' : '') + '" data-i="' + i + '">' +
        '<td class="seq">' + (r.no || '') + '</td>' +
        '<td class="' + ind + '" title="' + esc(code) + '"' + (match(code) ? ' style="background:#fff3c4"' : '') + '>' + tw + esc(code || '') + '</td>' +
        cell(cat, 'cat') + cell(name, ind, name) +
        cell(feat, 'feature', feat) + cell('') + cell(unitName) + cell(expr) + cell(ratio) +
        num(qty) + num(price) + num(amount) + '</tr>';
    });
    h += '</tbody></table>';
    $('grid').innerHTML = h;
    var trs = $('grid').querySelectorAll('tr[data-i]');
    for (var i = 0; i < trs.length; i++) (function (el) {
      el.onclick = function (e) {
        var idx = Number(el.getAttribute('data-i')), item = rows[idx];
        if (!item) return;
        if (e.target && e.target.getAttribute && e.target.getAttribute('data-exp') !== null) {
          S.collapsed[e.target.getAttribute('data-exp')] = !S.collapsed[e.target.getAttribute('data-exp')];
          renderFbfx(); return;
        }
        if (item.kind === 'section') { S.section = String(item.row.id); S.picked = null; S.selKey = ''; renderTrees(); renderGrid(); }
        else if (item.kind === 'quota') { S.picked = item.row; S.selKey = 'q' + item.row.id; renderFbfx(); renderDetail(item.row); }
        else if (item.kind === 'material' && item.quota) { S.picked = item.quota; S.selKey = 'm' + item.row.id; renderFbfx(); renderDetail(item.quota); }
        else if (item.kind === 'bill') { S.picked = null; S.selKey = ''; renderFbfx(); }
      };
    })(trs[i]);
    $('detail').style.display = '';
    if ($('splitter')) $('splitter').style.display = '';
    if (S.picked) renderDetail(S.picked); else renderDetail(null);
  }

  function product(a, b) {
    var x = Number(a), y = Number(b);
    return isFinite(x) && isFinite(y) ? (x * y).toFixed(2) : '';
  }
  function kindOf(res) {
    if (Number(res.cost_type) === 5) return '主';
    var code = String(res.code || '');
    if (code.slice(0, 2) === '00') return '人';
    if (/机|机械|设备/.test(String(res.name || ''))) return '机';
    return '材';
  }
  function renderDetail(q) {
    if (!q) {
      $('detailBody').innerHTML = '<div class="empty">选中定额行后，在此显示人材机明细</div>';
      return;
    }
    var u = unit();
    var resMap = {}, usages = [];
    u.resources.forEach(function (r) { resMap[r.id] = r; });
    u.resource_usage.forEach(function (x) { if (x.norm_id === q.id) usages.push(x); });
    // 项目级资源兜底
    S.data.bid_resources.forEach(function (r) { resMap['bid_' + r.id] = r; });
    var cols = ['编码', '类别', '名称', '规格及型号', '单位', '特征率', '含量', '数量', '定额价', '市场价', '合价', '是否暂估', '锁定数量', '是否计价', '原始含量'];
    var widths = [85, 38, 130, 110, 48, 48, 52, 66, 66, 66, 82, 58, 58, 58, 58];
    var h = '<table><colgroup>' + widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup>' +
      tableHead(cols.map(function (c) { return [c, '']; })) + '<tbody>';
    usages.forEach(function (x) {
      var r = resMap[x.resource_id] || {};
      var isMain = Number(r.cost_type) === 5;
      h += '<tr' + (isMain ? ' class="material"' : '') + '>' + cell(r.code) + cell(kindOf(r), 'cat') + cell(r.name) + cell(r.spec) + cell(r.unit) + cell('') +
        cell(x.usage) + cell(x.qty) + cell(r.budget_rate) + cell(r.market_rate) + cell(product(x.qty, r.market_rate)) +
        cell('') + cell('') + cell(r.is_referred ? '是' : '') + cell(x.usage) + '</tr>';
    });
    h += '</tbody></table>';
    $('detailBody').innerHTML = h;
    $('detailTitle').textContent = '工料显示 — 定额 ' + (q.code || '') + ' ' + (q.name || '') + '（' + usages.length + ' 条）';
  }

  function simpleGrid(cols, rows) {
    var h = '<table>' + tableHead(cols) + '<tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      cols.forEach(function (c) {
        var v = r[c[1]];
        h += c[2] === 'n' ? num(v) : cell(v);
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    $('grid').innerHTML = h;
    $('detail').style.display = 'none';
    if ($('splitter')) $('splitter').style.display = 'none';
  }
  function filtered(rows, keys) {
    if (!S.q) return rows;
    var q = S.q.toLowerCase();
    return rows.filter(function (r) {
      return keys.some(function (k) { return String(r[k] === null || r[k] === undefined ? '' : r[k]).toLowerCase().indexOf(q) >= 0; });
    });
  }

  // 造价分析：按参考图的多级造价汇总表 + 三材汇总总表
  function renderCost() {
    var d = S.data, total = Number(d.project.amount) || 0;
    var nodes = d.project.hierarchy || [], kids = {};
    nodes.forEach(function (n) {
      var k = String(n.pid === null || n.pid === undefined ? -1 : n.pid);
      (kids[k] = kids[k] || []).push(n);
    });
    var unitByFid = {};
    d.units.forEach(function (u) { unitByFid[u.file_id] = u; });
    function feeSum(u, re) {
      if (!u) return 0;
      var s = 0;
      u.fees.forEach(function (f) { if (re.test(String(f.name || ''))) s += Number(f.amount || 0); });
      return s;
    }
    function feesOf(n, memo) {
      if (memo[n.id]) return memo[n.id];
      var f = { fbfx: 0, cs: 0, aqw: 0, other: 0, gui: 0, tax: 0 }, child = kids[String(n.id)] || [];
      if (child.length) {
        child.forEach(function (c) {
          var x = feesOf(c, memo);
          Object.keys(f).forEach(function (k) { f[k] += x[k]; });
        });
      } else {
        var u = unitByFid[n.id];
        if (u) {
          f.fbfx = feeSum(u, /^分部分项工程$/);
          f.cs = feeSum(u, /^措施项目$/);
          f.aqw = feeSum(u, /安全文明施工费/);
          f.other = feeSum(u, /^其他项目$/);
          f.gui = feeSum(u, /^规费$/);
          f.tax = feeSum(u, /^增值税$/);
        }

      $('detail').style.display = 'none';
      if ($('splitter')) $('splitter').style.display = 'none';
      return;
    }
    if (S.tab === 'fbfx') { renderFbfx(); return; }
    if (S.tab === 'csxm') { renderCsxm(); return; }
    if (S.tab === 'qt') { renderQt(); return; }
    if (S.tab === 'hj') { renderHj(); return; }
    if (S.tab === 'fee') { renderFee(); return; }
  }

  start();
  bootSnapshot();
  // 便于自动化验证：导出 html 字符串而不触发下载
  window.GBQUI = {
    buildSnapshot: function () {
      return gzipBytes(new TextEncoder().encode(JSON.stringify(S.data))).then(function (gz) {
        return buildSnapshotHtml({ v: 1, name: S.fileName, project: S.data.project.name,
          amount: S.data.project.amount, units: S.data.units.length, time: '2026-11-21 09:56',
          gz: bytesToB64(gz) });
      });
    },
    state: function () { return S; }
  };
})();

</script>
</body>
