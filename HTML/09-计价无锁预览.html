  // 造价分析：按参考图的多级造价汇总表 + 三材汇总总表
  function renderCost() {
    var d = S.data, total = Number(d.project.amount) || 0;
    var nodes = d.project.hierarchy || [], kids = {};
    nodes.forEach(function (n) {
      var k = String(n.pid === null || n.pid === undefined ? -1 : n.pid);
      (kids[k] = kids[k] || []).push(n);
    });
    var unitByFid = {};
    d.units.forEach(function (u) { unitByFid[u.file_id] = u; });
    function feeSum(u, re) {
      if (!u) return 0;
      var s = 0;
      u.fees.forEach(function (f) { if (re.test(String(f.name || ''))) s += Number(f.amount || 0); });
      return s;
    }
    function feesOf(n, memo) {
      if (memo[n.id]) return memo[n.id];
      var f = { fbfx: 0, cs: 0, aqw: 0, other: 0, gui: 0, tax: 0 }, child = kids[String(n.id)] || [];
      if (child.length) {
        child.forEach(function (c) {
          var x = feesOf(c, memo);
          Object.keys(f).forEach(function (k) { f[k] += x[k]; });
        });
      } else {
        var u = unitByFid[n.id];
        if (u) {
          f.fbfx = feeSum(u, /^分部分项工程$/);
          f.cs = feeSum(u, /^措施项目$/);
          f.aqw = feeSum(u, /安全文明施工费/);
          f.other = feeSum(u, /^其他项目$/);
          f.gui = feeSum(u, /^规费$/);
          f.tax = feeSum(u, /^增值税$/);
        }
      }
      memo[n.id] = f;
      return f;
    }
    var memo = {}, widths = [40, 176, 100, 168, 94, 118, 90, 82, 78, 80, 90, 92, 112];
    var h = '<div class="cost-wrap"><table class="cost"><colgroup>' +
      widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') +
      '</colgroup><thead><tr>' +
      '<th rowspan="2">序号</th><th rowspan="2">名称</th><th rowspan="2">金额</th>' +
      '<th rowspan="2" class="evalb">评标报价<br>（不含规费、税金、安全文明费、<br>暂列金额与专业工程暂估价）</th>' +
      '<th colspan="1">分部分项</th><th colspan="2">措施项目</th><th colspan="1">其他项目</th>' +
      '<th rowspan="2">规费</th><th rowspan="2">增值税</th><th rowspan="2">占造价比例(%)</th>' +
      '<th rowspan="2">工程规模<br>(m2或m)</th><th rowspan="2">单位造价<br>(元/m2或元/m)</th></tr><tr>' +
      '<th>分部分项工程费</th><th>措施费(不含安全文明措施费)</th><th>措施项目费</th><th>其他项目费</th>' +
      '</tr></thead><tbody>';
    // 合计取项目根节点（父节点金额已含子节点，不能逐行累加）
    var rootNode = null;
    nodes.forEach(function (n) { if (n.type === 0 && (n.pid === null || n.pid === undefined)) rootNode = n; });
    var rf = rootNode ? feesOf(rootNode, memo) : { fbfx: 0, cs: 0, aqw: 0, other: 0, gui: 0, tax: 0 };
    var tot = { amount: total, evalBid: total - rf.gui - rf.tax - rf.aqw, fbfx: rf.fbfx,
      csNo: rf.cs - rf.aqw, cs: rf.cs, other: rf.other, gui: rf.gui, tax: rf.tax };
    function walk(n, depth, seq) {
      var f = feesOf(n, memo), amt = Number(n.amount || 0);
      var evalBid = amt - f.gui - f.tax - f.aqw;
      var child = kids[String(n.id)] || [];
      var caret = child.length ? '<span class="tw" data-cost="' + n.id + '">' + (S.costCollapsed[n.id] ? CARET_CLOSED : CARET_OPEN) + '</span>' : '';
      h += '<tr class="cost-row"><td class="seq">' + caret + (depth ? '<span class="ord">' + seq + '</span>' : '') + '</td>' +
        '<td class="nm" style="padding-left:' + (6 + depth * 16) + 'px">' + esc(n.name) + '</td>' +
        '<td class="num">' + money(amt) + '</td><td class="num evalb">' + money(evalBid) + '</td>' +
        '<td class="num">' + money(f.fbfx) + '</td><td class="num">' + money(f.cs - f.aqw) + '</td>' +
        '<td class="num">' + money(f.cs) + '</td><td class="num">' + money(f.other) + '</td>' +
        '<td class="num">' + money(f.gui) + '</td><td class="num">' + money(f.tax) + '</td>' +
        '<td class="num">' + (total ? (amt / total * 100).toFixed(2) : '0.00') + '</td>' +
        '<td class="num">—</td><td class="num">—</td></tr>';
      if (!S.costCollapsed[n.id]) child.forEach(function (c, i) {
        walk(c, depth + 1, depth === 0 ? String(i + 1) : seq + '.' + (i + 1));
      });
    }
    // 顶层行：常规是项目根（pid=0 的子节点）；单工程另存时根节点 pid 为空，需要按根 id 再取一层
    var top = kids['0'] || [];
    if (!top.length) {
      var rootN = nodes.filter(function (n) { return n.pid === null || n.pid === undefined; })[0];
      if (rootN) top = kids[String(rootN.id)] || [rootN];
    }
    top.forEach(function (r, i) { if (r.type !== 0) walk(r, 0, String(i + 1)); });
    h += '<tr class="total"><td></td><td class="nm">合计</td><td class="num">' + money(tot.amount) + '</td>' +
      '<td class="num evalb">' + money(tot.evalBid) + '</td><td class="num">' + money(tot.fbfx) + '</td>' +
      '<td class="num">' + money(tot.csNo) + '</td><td class="num">' + money(tot.cs) + '</td>' +
      '<td class="num">' + money(tot.other) + '</td><td class="num">' + money(tot.gui) + '</td>' +
      '<td class="num">' + money(tot.tax) + '</td><td class="num">100.00</td><td class="num">—</td><td class="num">—</td></tr>';
    h += '</tbody></table></div>';
    var steel = 0, cement = 0, wood = 0;
    d.units.forEach(function (u) {
      u.resources.forEach(function (r) {
        var nm = String(r.name || ''), un = String(r.unit || ''), q = Number(r.qty || 0);
        if (/钢筋|螺纹钢/.test(nm)) steel += (un === 't' ? q : q / 1000);
        else if (nm === '水泥') cement += (un === 't' ? q : q / 1000);
        else if (/木材|木方/.test(nm)) wood += q;
      });
    });
    h += '<div class="cost-3cai"><div class="cost-3cai-hd">三材汇总总表</div>' +
      '<table><thead><tr><th>序号</th><th>材料</th><th>名称</th><th>单位</th><th>数量</th></tr></thead><tbody>' +
      '<tr><td>1</td><td>钢材</td><td>钢筋</td><td>t</td><td class="num">' + money(steel) + '</td></tr>' +
      '<tr><td>2</td><td>水泥</td><td>水泥</td><td>t</td><td class="num">' + money(cement) + '</td></tr>' +
      '<tr><td>3</td><td>木材</td><td>木材</td><td>m3</td><td class="num">' + money(wood) + '</td></tr>' +
      '</tbody></table><div class="hint">三材按各单位工程资源汇总，钢筋/水泥由 kg 折算为 t；工程规模与原文件图纸信息关联，此处留空。</div></div>';
    $('grid').innerHTML = h;
    var ct = $('grid').querySelectorAll('[data-cost]');
    for (var i = 0; i < ct.length; i++) (function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var id = Number(el.getAttribute('data-cost'));
        S.costCollapsed[id] = !S.costCollapsed[id];
        renderCost();
      };
    })(ct[i]);
  }

      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'];
    var files = [], sheetTags = [];
    sheets.forEach(function (s, i) {
      var n = i + 1;
      ct.push('<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
      rels.push('<Relationship Id="rId' + n + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + n + '.xml"/>');
      sheetTags.push('<sheet name="' + xlEsc(s.name) + '" sheetId="' + n + '" r:id="rId' + n + '"/>');
      files.push({ name: 'xl/worksheets/sheet' + n + '.xml', text: xlSheetXml(s) });
    });
    var sid = 'rId' + (sheets.length + 1);
    rels.push('<Relationship Id="' + sid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>');
    rels.push('</Relationships>');
    ct.push('</Types>');
    var wb = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">',
      '<bookViews><workbookView xWindow="0" yWindow="0" windowWidth="22000" windowHeight="13000"/></bookViews>',
      '<sheets>' + sheetTags.join('') + '</sheets></workbook>'].join('');
    return [
      { name: '[Content_Types].xml', text: ct.join('') },
      { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
      { name: 'xl/workbook.xml', text: wb },
      { name: 'xl/_rels/workbook.xml.rels', text: rels.join('') },
      { name: 'xl/styles.xml', text: XL_STYLES }
    ].concat(files);
  }

  var XL_CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function xlCrc(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = XL_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // 最小 ZIP：store 或 deflate-raw（浏览器自带压缩，无外部库）
  function xlZip(entries) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0;
    var d = new Date();
    var dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    var dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    entries.forEach(function (e) {
      var name = enc.encode(e.name), crc = e.crc, csize = e.data.length, usize = e.size;
      var lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, e.method, true); lv.setUint16(10, dt, true); lv.setUint16(12, dd, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, csize, true); lv.setUint32(22, usize, true);
      lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
      lh.set(name, 30);
      var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, e.method, true); cv.setUint16(12, dt, true); cv.setUint16(14, dd, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, csize, true); cv.setUint32(24, usize, true);
      cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
      ch.set(name, 46);
      parts.push(lh, e.data);
      central.push(ch);
      offset += lh.length + csize;
    });
    var cdSize = 0;
    central.forEach(function (c) { cdSize += c.length; });
    var eo = new Uint8Array(22), ev = new DataView(eo.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eo]), {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
  }
  function xlDeflate(u8) {
    if (typeof CompressionStream === 'undefined') return Promise.resolve(null);
    try {
      return throughStream(u8, new CompressionStream('deflate-raw')).then(function (c) {
        return c;
      }, function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function xlBuild(sheets) {
    var enc = new TextEncoder();
    return Promise.all(xlFiles(sheets).map(function (f) {
      var raw = enc.encode(f.text), crc = xlCrc(raw), usize = raw.length;
      return xlDeflate(raw).then(function (c) {
        var useDef = !!(c && c.length && c.length < usize);
        return { name: f.name, data: useDef ? c : raw, method: useDef ? 8 : 0, crc: crc, size: usize };
      });
    })).then(function (entries) { return xlZip(entries); });
  }
  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 5000);
  }

  function openXlsxDlg() {
    if (!S.data) { $('statusRight').textContent = '请先打开一个工程再导出清单'; return; }
    XL.sel = {};
    (S.data.units || []).forEach(function (u, i) { XL.sel[i] = true; });
    $('xlsxMsg').className = 'msg';
    $('xlsxMsg').textContent = '';
    $('xlsxMask').style.display = 'flex';
    renderXlsxList();
  }
  function closeXlsxDlg() { $('xlsxMask').style.display = 'none'; }

  function renderXlsxList() {
    var units = (S.data && S.data.units) || [];
    var box = $('xlsxList');
    if (!units.length) { box.innerHTML = '<div class="empty">没有可导出的单位工程</div>'; syncXlsxBar(); return; }
    var h = '';
    units.forEach(function (u, i) {
      h += '<label class="unit-row"><input type="checkbox" data-i="' + i + '"' + (XL.sel[i] ? ' checked' : '') + '>' +
        '<span class="un" title="' + esc(unitLabel(u, XL.pre) || ('单位工程 ' + (i + 1))) + '">' + esc(unitLabel(u, XL.pre) || ('单位工程 ' + (i + 1))) + '</span>' +
        '<span class="uc">' + unitRowCount(u) + ' 项</span>' +
        '<span class="um">¥' + money(u.amount) + '</span></label>';
    });
    box.innerHTML = h;
    box.onchange = function (e) {
      var t = e.target;
      if (!t || t.type !== 'checkbox') return;
      XL.sel[t.getAttribute('data-i')] = t.checked;
      syncXlsxBar();
    };
    syncXlsxBar();
  }
  function syncXlsxBar() {
    var units = (S.data && S.data.units) || [], n = 0, rows = 0;
    units.forEach(function (u, i) { if (XL.sel[i]) { n++; rows += unitRowCount(u); } });
    $('xlsxCnt').textContent = '已选 ' + n + ' / ' + units.length + ' 个单位工程 · ' + rows + ' 条清单';
    var all = $('xlsxAll');
    if (all) { all.checked = n > 0 && n === units.length; all.indeterminate = n > 0 && n < units.length; }
    var go = $('xlsxGo');
    if (go) go.disabled = !n;
  }

  function doExportXlsx() {
    var units = (S.data && S.data.units) || [], picked = [];
    units.forEach(function (u, i) { if (XL.sel[i]) picked.push(u); });
    if (!picked.length) {
      $('xlsxMsg').className = 'msg err';
      $('xlsxMsg').textContent = '请至少勾选一个单位工程';
      return;
    }
    if (XL.busy) return;
    var btn = $('xlsxGo'), label = btn.textContent;
    XL.busy = true; btn.disabled = true; btn.textContent = '生成中…';
    $('xlsxMsg').className = 'msg';
    $('xlsxMsg').textContent = '正在生成 Excel…';
    var used = {}, sheets = [], totalRows = 0;
    picked.forEach(function (u, i) {
      var d = xlSheet(u);
      totalRows += d.rows.length;
      sheets.push({
        name: xlSheetName(u.name, used),
        title: (unitLabel(u, XL.pre) || ('单位工程 ' + (i + 1))) + (d.quota ? ' · 定额清单' : ' · 分部分项工程量清单'),
        rows: d.rows, total: d.total, first: i === 0
      });
      $('xlsxMsg').textContent = '正在生成 Excel… ' + (i + 1) + '/' + picked.length;
    });
    xlBuild(sheets).then(function (blob) {
      var fn = safeFileName((S.data.project && S.data.project.name) || S.fileName) + '-清单.xlsx';
      saveBlob(blob, fn);
      XL.busy = false; btn.disabled = false; btn.textContent = label;
      $('xlsxMsg').textContent = '已导出 ' + fn;
      $('statusLeft').innerHTML = '已导出清单 <b>' + esc(fn) + '</b> · ' + sheets.length + ' 个工作表 · ' + totalRows + ' 条';
      $('statusRight').textContent = (blob.size / 1024).toFixed(0) + ' KB';
      setTimeout(closeXlsxDlg, 700);
    }).catch(function (e) {
      XL.busy = false; btn.disabled = false; btn.textContent = label;
      $('xlsxMsg').className = 'msg err';
      $('xlsxMsg').textContent = '生成失败：' + ((e && e.message) || e);
    });
  }

  /* ============ 右键「深色 / 浅色」按钮：设置清单行 / 定额行底色（记住上次选择） ============ */
  var ROWC = { bill: '', quota: '' };
  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return /^#[0-9a-f]{6}$/i.test(v) ? v : fallback;
  }
  // 按底色亮度挑深 / 浅文字，避免自定义浅色底在深色主题下看不见
  function txOn(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '';
    var n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255) > 0.55 ? '#1a1f26' : '#eef3f9';
  }
  function applyRowColors() {
    var root = document.documentElement;
    if (ROWC.bill) {
      root.style.setProperty('--rowbill', ROWC.bill);
      root.style.setProperty('--rowbill-tx', txOn(ROWC.bill));
      root.setAttribute('data-rowc-bill', '1');
    } else {
      root.style.removeProperty('--rowbill'); root.style.removeProperty('--rowbill-tx');
      root.removeAttribute('data-rowc-bill');
    }
    if (ROWC.quota) {
      root.style.setProperty('--rowquota', ROWC.quota);
      root.style.setProperty('--rowquota-tx', txOn(ROWC.quota));
      root.setAttribute('data-rowc-quota', '1');
    } else {
      root.style.removeProperty('--rowquota'); root.style.removeProperty('--rowquota-tx');
      root.removeAttribute('data-rowc-quota');
    }
  }
  function saveRowColors() {
    try { localStorage.setItem('gbqRowColors', JSON.stringify({ bill: ROWC.bill, quota: ROWC.quota })); } catch (e) {}
  }
  function initRowColors() {
    try {
      var v = JSON.parse(localStorage.getItem('gbqRowColors') || '{}');
      ROWC.bill = /^#[0-9a-f]{6}$/i.test(v.bill || '') ? v.bill : '';
      ROWC.quota = /^#[0-9a-f]{6}$/i.test(v.quota || '') ? v.quota : '';
    } catch (e) {}
    applyRowColors();
    var m = $('themeMenu'), btn = $('themeBtn');
    if (!m || !btn) return;
    var cb = $('colBill'), cq = $('colQuota');
    function syncInputs() {
      if (cb) cb.value = ROWC.bill || cssVar('--green', '#f2f9ee');
      if (cq) cq.value = ROWC.quota || cssVar('--blue', '#eef5fd');
    }
    function close() { m.style.display = 'none'; }
    btn.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      syncInputs();
      m.style.display = 'block';
      var r = m.getBoundingClientRect();
      m.style.left = Math.max(8, Math.min(e.clientX, innerWidth - r.width - 8)) + 'px';
      m.style.top = Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px';
    });
    document.addEventListener('pointerdown', function (e) {
      if (m.style.display !== 'none' && !m.contains(e.target) && e.target !== btn) close();
    }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    if (cb) cb.oninput = function () { ROWC.bill = this.value; applyRowColors(); saveRowColors(); };
    if (cq) cq.oninput = function () { ROWC.quota = this.value; applyRowColors(); saveRowColors(); };
    if ($('colReset')) $('colReset').onclick = function () {
      ROWC.bill = ''; ROWC.quota = ''; applyRowColors(); saveRowColors(); syncInputs();
    };
    // 切换深/浅色后，未自定义的一侧跟随主题；已自定义的保持
    if ($('themeBtn')) $('themeBtn').addEventListener('click', function () { setTimeout(applyRowColors, 0); });
  }

  start();
  initRowColors();
  bootSnapshot();
  // 便于自动化验证：导出 html 字符串而不触发下载
  window.GBQUI = {
    buildSnapshot: function () {
      return gzipBytes(new TextEncoder().encode(JSON.stringify(S.data))).then(function (gz) {
        return buildSnapshotHtml({ v: 1, name: S.fileName, project: S.data.project.name,
          amount: S.data.project.amount, units: S.data.units.length, time: '2026-11-21 09:56',
          gz: bytesToB64(gz) });
      });
    },
    state: function () { return S; }
  };
})();

</script>
