<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计价无锁预览</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --bar:#f7f9fb; --line:#e2e7ed; --line2:#eef1f5;
  --tx:#1d2530; --tx2:#68758a; --tx3:#9aa6b6;
  --accent:#2563a8; --accent-bg:#eaf2fb; --sel:#e8f1fb; --hover:#f4f7fb; --selrow:#d7e7f8;
  --green:#f2f9ee; --green-line:#d6e9c9; --blue:#eef5fd; --blue-line:#cfe1f4;
  --mauve:#9d3f95; --orange:#c67c12; --warn:#a8620f;
  --chip:rgba(18,28,42,.05); --guide:rgba(18,28,42,.11); --shadow:0 1px 2px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
  --bg:#0f1419; --panel:#161c23; --bar:#1c232b; --line:#2a333d; --line2:#222a33;
  --tx:#dce4ee; --tx2:#98a5b4; --tx3:#6d7a8a;
  --accent:#74b0e4; --accent-bg:#1d3244; --sel:#1b2b3b; --hover:#1e262f; --selrow:#22415c;
  --green:#1d2b22; --green-line:#2f4a37; --blue:#1a2836; --blue-line:#2c465f;
  --mauve:#e2a0d8; --orange:#e0a85c; --warn:#dda96b;
  --chip:rgba(255,255,255,.07); --guide:rgba(255,255,255,.13); --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
input[type=checkbox]{width:13px;height:13px;accent-color:var(--accent);vertical-align:-2px;cursor:pointer}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(18,28,42,.18);border:3px solid transparent;border-radius:8px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(18,28,42,.32);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:padding-box}
html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:padding-box}

/* title bar */
.title{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.title .logo{flex:none;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--tx);font-size:12.5px;letter-spacing:.01em;white-space:nowrap}
.title .logo .mark{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;
  background:linear-gradient(140deg,#3f86c9,#1f5c99);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(16,40,70,.25)}
.title .file{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;height:22px;padding:0 9px;
  color:var(--tx2);font-size:11.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--chip);border-radius:7px}
.btn{display:inline-flex;flex:none;align-items:center;justify-content:center;gap:4px;height:26px;background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:0 11px;line-height:1;white-space:nowrap;font-size:11.5px;color:var(--tx2);transition:background .15s,border-color .15s,color .15s}
.btn svg{flex:none}
.btn:hover{background:var(--hover);color:var(--tx)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(37,99,168,.28)}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.mini{height:26px;padding:0 10px;font-size:11.5px}
#detailBtn.on{background:var(--accent-bg);border-color:rgba(37,99,168,.32);color:var(--accent);font-weight:600}
#detailBtn.on:hover{background:var(--accent-bg);color:var(--accent)}
html[data-theme="dark"] #detailBtn.on{border-color:rgba(116,176,228,.4)}
.spacer{flex:1}
.searchbox{position:relative;flex:0 1 198px;min-width:118px;display:flex;align-items:center}
.searchbox .si{position:absolute;left:8px;display:flex;color:var(--tx3);pointer-events:none}
#search{width:100%;height:26px;line-height:24px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  padding:0 9px 0 26px;outline:none;font-size:11.5px;transition:border-color .15s,box-shadow .15s}
#search::placeholder{color:var(--tx3)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
/* 显示层级：自定义下拉（原生 select 的标签在部分浏览器无法保证文字水平/垂直居中） */
.lvwrap{position:relative;flex:none;display:inline-flex}
#levelSel{position:relative;display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:76px;
  padding:0 15px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--tx2);
  font-size:11.5px;line-height:1;white-space:nowrap;outline:none;
  transition:background .15s,border-color .15s,box-shadow .15s,color .15s}
#levelSel .tx{display:block;line-height:1;text-align:center}
#levelSel .car{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--tx3);transition:transform .15s,color .15s}
#levelSel:hover{background:var(--hover);color:var(--tx)}
#levelSel[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);color:var(--accent)}
#levelSel[aria-expanded="true"] .car{transform:translateY(-50%) rotate(180deg);color:var(--accent)}
.lvmenu{position:absolute;top:31px;right:0;z-index:90;min-width:100%;padding:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(16,24,40,.18)}
.lvmenu button{display:flex;align-items:center;gap:5px;width:100%;height:26px;padding:0 8px;border:0;border-radius:5px;
  background:none;color:var(--tx2);font-size:11.5px;line-height:1;white-space:nowrap;text-align:left}
.lvmenu button:hover{background:var(--hover);color:var(--tx)}
.lvmenu button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.lvmenu button::before{content:'✓';flex:none;width:9px;font-size:10px;line-height:1;color:var(--accent);visibility:hidden}
.lvmenu button.on::before{visibility:visible}

/* tabs */
.tabs{height:36px;flex:none;display:flex;align-items:stretch;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.tabs button{position:relative;height:36px;padding:0 12px;background:none;border:0;color:var(--tx2);font-size:12px;white-space:nowrap;transition:color .15s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs button.on::after{content:'';position:absolute;left:9px;right:9px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--accent)}


/* main split + 可拖动列宽 */
.main{flex:1;min-height:0;display:flex;background:var(--panel)}
.tree1,.tree2{flex:none;background:var(--panel);overflow:auto;overflow-x:hidden;padding-bottom:10px}
.tree1{width:216px}
.tree2{width:214px}
.hsplit{width:6px;flex:none;cursor:ew-resize;position:relative;touch-action:none;z-index:2;background:var(--panel)}
.hsplit::before{content:'';position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--line);transition:background .12s}
.hsplit:hover,.hsplit.drag{background:var(--accent-bg)}
.hsplit:hover::before,.hsplit.drag::before{background:var(--accent)}
.tree-hd{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px 10px 7px;background:var(--panel);border-bottom:1px solid var(--line2);
  font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.02em}
.tree-hd .cnt{flex:none;font-weight:500;font-size:10.5px;color:var(--tx2);background:var(--chip);
  border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
/* 目录树：层级导引线 + 展开箭头 + 类型图标 + 计数胶囊 */
.tn{position:relative;display:flex;align-items:center;height:27px;margin:1px 6px 0 5px;padding-right:6px;
  border-radius:6px;white-space:nowrap;cursor:pointer;user-select:none;color:var(--tx)}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--sel)}
.tn.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.tn.on .nm{color:var(--accent);font-weight:600}
.tn .gd{position:absolute;top:0;bottom:0;width:1px;background:var(--guide);pointer-events:none}
.tn .tg{flex:none;width:16px;height:16px;margin-right:1px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--tx3);transition:background .12s,color .12s}
.tn .tg svg{transition:transform .14s ease}
.tn .tg.open svg{transform:rotate(90deg)}
.tn .tg[data-tg]{cursor:pointer}
.tn .tg[data-tg]:hover{background:var(--chip);color:var(--tx)}
.tn .ic{flex:none;width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  margin:0 7px 0 1px;color:var(--tx3);background:var(--chip)}
.tn .ic.k{color:#2f6fa8;background:rgba(47,111,168,.10)}
.tn .ic.u{color:#b57a1c;background:rgba(181,122,28,.12)}
.tn .ic.s{color:#4a5f76;background:rgba(74,95,118,.11)}
html[data-theme="dark"] .tn .ic.k{color:#88b7e3;background:rgba(136,183,227,.13)}
html[data-theme="dark"] .tn .ic.u{color:#e3b274;background:rgba(227,178,116,.13)}
html[data-theme="dark"] .tn .ic.s{color:#a9b9c9;background:rgba(255,255,255,.06)}
.tn.on .ic{background:rgba(37,99,168,.13);color:var(--accent)}
html[data-theme="dark"] .tn.on .ic{background:rgba(116,176,228,.16);color:#a8cdea}
.tn .ic.d{color:var(--tx3);background:transparent;margin-right:6px}
.tn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tn .ct{flex:none;margin-left:auto;font-size:10px;line-height:14px;color:var(--tx2);background:var(--chip);
  border-radius:99px;padding:0 6px;font-variant-numeric:tabular-nums}
.tn.on .ct{background:rgba(37,99,168,.14);color:var(--accent)}
html[data-theme="dark"] .tn.on .ct{background:rgba(116,176,228,.18)}

.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;z-index:3;background:var(--panel);color:var(--tx2);font-size:11px;font-weight:600;letter-spacing:.02em;
  text-align:center;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px;background:var(--panel)}
tr.section td{background:#f3f7fb;font-weight:600;color:var(--tx)}
tr.section.sec1 td{background:#eef4fa}
tr.section.sec2 td{background:#f4f8fb}
tr.section.sec3 td{background:#f8fafc}
tr.section.sec4 td{background:#fbfcfe}
tr.section.sec1 td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
html[data-theme="dark"] tr.section td{background:#1b232c}
html[data-theme="dark"] tr.section.sec1 td{background:#1c2733}
html[data-theme="dark"] tr.section.sec2 td{background:#19212a}
html[data-theme="dark"] tr.section.sec3 td{background:#171e26}
html[data-theme="dark"] tr.section.sec4 td{background:#161c23}
tr.bill td{background:var(--rowbill,var(--green))}
tr.quota td{background:var(--rowquota,var(--blue))}
/* 自定义行底色时，按亮度统一该行文字色（含项目特征），保证对比度 */
html[data-rowc-bill] tr.bill td{color:var(--rowbill-tx)}
html[data-rowc-quota] tr.quota td{color:var(--rowquota-tx)}
tr.material td{background:var(--panel);color:var(--mauve)}
td.seq{text-align:center;color:var(--tx3);padding-left:2px;padding-right:2px;font-variant-numeric:tabular-nums}
td.secname{font-weight:600}
td.multi{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;vertical-align:top}
tbody tr.hide{display:none}
tbody tr:hover td{filter:brightness(.975)}
/* 选中行整行一块高亮：外框 + 左强调条，内部不再画单元格分割线 */
tbody tr.picked td{background:var(--selrow);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
tbody tr.picked td:first-child{box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent),inset 2px 0 0 var(--accent)}
tbody tr.picked td:last-child{box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent),inset -1px 0 0 var(--accent)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.cat{text-align:center;color:var(--tx2)}
td.match{background:#fff3c4;color:#7a4a00}
html[data-theme="dark"] td.match{background:#4c3f1c;color:#f0d38a}
.tw{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:3px;border-radius:4px;
  color:var(--tx2);cursor:pointer;vertical-align:-2px;transition:background .1s,color .1s,transform .1s}
.tw svg{display:block;pointer-events:none}
.tw:hover{background:var(--chip);color:var(--tx)}
.tw:active{transform:scale(.86)}
.tw.ph{visibility:hidden;cursor:inherit}
.tw.ph:hover{background:transparent}
.feature{color:#141a21;font-size:11px}
html[data-theme="dark"] .feature{color:#dbe4ef}
tr.section td{cursor:default}

/* detail pane */
.splitter{height:8px;flex:none;cursor:ns-resize;touch-action:none;position:relative;background:var(--panel)}
.splitter::before{content:'';position:absolute;left:0;right:0;top:3px;height:1px;background:var(--line);transition:background .12s}
.splitter:hover::before{background:var(--accent)}
.splitter:hover{background:var(--accent-bg)}
.detail{height:41%;min-height:80px;flex:none;display:flex;flex-direction:column;background:var(--panel)}
.detail-hd{height:31px;flex:none;display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line2);padding:0 10px}
.detail-hd button{flex:0 1 auto;min-width:0;border:0;background:var(--accent-bg);color:var(--accent);padding:4px 10px;border-radius:6px;
  font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.detail-hd .hint{flex:none;white-space:nowrap;color:var(--tx3);font-size:10.5px}
.detail-hd button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
/* 一个清单下有多个定额时，用标签切换 */
.dq-tabs{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;padding:2px 0}
.dq-tabs::-webkit-scrollbar{height:0}
.dq .t{max-width:148px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dq{flex:none;display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--tx2);font-size:10.5px;white-space:nowrap;transition:all .12s}
.dq:hover{background:var(--hover);color:var(--tx)}
.dq.on{background:var(--accent-bg);border-color:rgba(37,99,168,.32);color:var(--accent);font-weight:600}
html[data-theme="dark"] .dq.on{border-color:rgba(116,176,228,.4)}
.dq .n{font-size:9.5px;line-height:13px;padding:0 5px;border-radius:9px;background:var(--chip);color:inherit;font-variant-numeric:tabular-nums}
.dq.on .n{background:rgba(37,99,168,.16)}
html[data-theme="dark"] .dq.on .n{background:rgba(116,176,228,.2)}
.detail-body{flex:1;min-height:0;overflow:auto}
.detail-body table{font-size:11px}
.detail-body th{top:0}
.detail-body td{padding:3px 8px}
.detail-body tr.material td{color:var(--mauve);background:rgba(157,63,149,.05)}
html[data-theme="dark"] .detail-body tr.material td{background:rgba(226,160,216,.10)}
.empty{padding:22px;color:var(--tx3);text-align:center;font-size:11.5px}

/* status */
.status{height:26px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden}
.status b{font-weight:600;color:var(--tx)}

/* drop / start */
.start{flex:1;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 380px at 50% -10%,var(--accent-bg),var(--bg) 72%)}
.drop{width:min(640px,84vw);border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:38px 34px;text-align:center;box-shadow:0 14px 36px -16px rgba(16,24,40,.22),0 1px 2px rgba(16,24,40,.05)}
.drop.over{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg),0 14px 36px -16px rgba(16,24,40,.22)}
.drop .di{width:46px;height:46px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:13px;
  background:linear-gradient(140deg,#3f86c9,#1f5c99);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -6px rgba(31,92,153,.55)}
.drop h2{margin:0 0 8px;font-size:17px;letter-spacing:.01em;font-weight:600}
.drop p{color:var(--tx2);margin:6px 0;line-height:1.7;font-size:11.5px}
.drop .big{margin-top:22px;height:34px;padding:0 24px;font-size:12.5px;border-radius:8px}
.drop .hint{font-size:11px}
.bar-progress{height:5px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:18px;display:none}
.bar-progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s}
.msg{margin-top:10px;color:var(--tx2);min-height:16px;font-size:11.5px}
.msg.err{color:#c0392b}
.convert{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.convert .bar-progress{display:block;width:340px}

/* cost analysis */
.cost-wrap{min-width:100%;width:max-content}
table.cost{font-size:11px;width:max-content}
table.cost th{background:var(--bar);text-align:center;font-size:11px;line-height:1.35;padding:6px;white-space:normal;color:var(--tx2);font-weight:600}
table.cost td{padding:3px 7px;font-size:11px}
table.cost td.nm{font-weight:600;color:var(--tx)}
table.cost tr.cost-row:nth-child(even) td:not(.evalb){background:#fafbfd}
html[data-theme="dark"] table.cost tr.cost-row:nth-child(even) td:not(.evalb){background:#1a2028}
table.cost th.evalb{background:var(--accent-bg);color:var(--accent)}
table.cost td.evalb{background:rgba(37,99,168,.05)}
table.cost tr.total td.evalb{background:rgba(37,99,168,.12)}
html[data-theme="dark"] table.cost th.evalb{background:#1d3244;color:#9cc6e9}
html[data-theme="dark"] table.cost td.evalb{background:rgba(116,176,228,.07)}
html[data-theme="dark"] table.cost tr.total td.evalb{background:rgba(116,176,228,.15)}
table.cost tr.total td{background:var(--accent-bg);font-weight:600;color:var(--tx)}
html[data-theme="dark"] table.cost tr.total td{background:#1d3244}
table.cost td.seq{width:40px}
table.cost .ord{color:var(--tx2)}
.cost-3cai{padding:10px 12px 16px;width:max-content;min-width:520px}
.cost-3cai-hd{font-weight:600;font-size:11px;margin-bottom:5px}
.cost-3cai table{width:420px;font-size:11px}
.cost-3cai th{background:var(--bar);text-align:center;padding:3px 6px}
.cost-3cai td{padding:2px 6px}
.cost-3cai .hint{margin-top:5px}

/* other items / resource summary / fee summary */
.hjbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;height:31px;padding:0 10px;
  background:var(--bar);border-bottom:1px solid var(--line);font-size:11px;color:var(--tx2);white-space:nowrap}
.hjbar label{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.hjbar b{color:var(--tx);font-weight:600}
.hjbar .hint{margin-left:auto}
th.mk{background:var(--accent-bg);color:var(--accent)}
html[data-theme="dark"] th.mk{background:#1d3244;color:#9cc6e9}
td.mkcol{background:rgba(37,99,168,.03)}
html[data-theme="dark"] td.mkcol{background:rgba(116,176,228,.05)}
td.material{color:var(--mauve)}

/* overview pages */
.cards{padding:12px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:12px;margin:0 0 9px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:5px 16px;color:var(--tx2)}
.kv b{color:var(--tx);font-weight:600}
.ov2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1100px){.ov2{grid-template-columns:1fr}}
.mono{font-family:Consolas,Monaco,monospace;font-size:11px}
.hint{color:var(--tx2);font-size:11px}
.warn{color:var(--warn)}

/* 新点（Epoint）加密容器识别面板 */
.epoint{flex:1;display:none;flex-direction:column;overflow:auto;padding:16px;gap:12px;background:var(--bg)}
.ep-hd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.ep-hd b{font-size:13px}
.ep-badge{flex:none;background:var(--accent-bg);color:var(--accent);border:1px solid transparent;border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
html[data-theme="dark"] .ep-badge{background:#1d3244;color:#9cc6e9}
.ep-warn{background:#fdf8ec;border:1px solid #eee0bd;color:#6f5714;border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.75}
html[data-theme="dark"] .ep-warn{background:#3a3020;border-color:#5c4a25;color:#e6cd92}
.ep-warn code{font-family:Consolas,Monaco,monospace;background:rgba(0,0,0,.05);border-radius:3px;padding:0 3px}
html[data-theme="dark"] .ep-warn code{background:rgba(255,255,255,.08)}
.ep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.ep-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.ep-card span{display:block;color:var(--tx2);font-size:11px}
.ep-card b{display:block;font-size:18px;font-weight:600;margin-top:4px;color:var(--accent)}
.ep-card i{display:block;font-style:normal;color:var(--tx2);font-size:10.5px;margin-top:3px}
.ep-line{font-size:11.5px;color:var(--tx2)}
.ep-line code{font-family:Consolas,Monaco,monospace;color:var(--tx)}
.ep-tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:46vh;box-shadow:var(--shadow)}
.ep-tbl table{font-size:11.5px}
.ep-tbl th{position:sticky;top:0;background:var(--bar)}
.ep-tbl tr.ep-enc td{color:#9a5b12}
html[data-theme="dark"] .ep-tbl tr.ep-enc td{color:#e0b276}
.ep-tbl tr.ep-zip td{color:var(--tx2)}
.ep-tip{font-size:11.5px;color:var(--tx2);line-height:1.75;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 13px}
.ep-actions{display:flex;gap:8px;padding-bottom:8px}

/* 导出清单弹窗 */
.mask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(15,22,32,.26)}
.dlg{width:max-content;min-width:min(560px,94vw);max-width:min(920px,94vw);max-height:80vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 64px -26px rgba(16,24,40,.5),0 2px 6px rgba(16,24,40,.08)}
.dlg-hd{display:flex;align-items:baseline;gap:9px;padding:12px 14px 11px;border-bottom:1px solid var(--line2);min-width:0}
.dlg-hd b{font-size:12.5px;font-weight:600;flex:none}
.dlg-tip{font-size:11px;color:var(--tx3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--bar);
  border-bottom:1px solid var(--line2);font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;min-width:0}
.dlg-bar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;flex:none}
.dlg-bar .hint{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dlg-body{flex:1;min-height:0;overflow:auto;padding:5px 8px 8px}
.dlg-ft{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line2);min-width:0}
.dlg-ft .msg{margin:0;font-size:11px;min-height:0;flex:1 1 auto;width:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg-ft .btn{flex:none}
.unit-row{display:flex;align-items:center;gap:8px;min-height:29px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--tx)}
.unit-row:hover{background:var(--hover)}
.unit-row input{flex:none;margin:0}
.unit-row .un{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.unit-row .uc{flex:none;font-size:10.5px;color:var(--tx2);background:var(--chip);border-radius:99px;padding:1px 7px}
.unit-row .um{flex:none;width:104px;text-align:right;font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}

/* 右键「深色 / 浅色」按钮：行背景色设置 */
.cmenu{position:fixed;z-index:70;min-width:186px;display:none;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:6px;box-shadow:0 18px 44px -20px rgba(16,24,40,.5),0 2px 6px rgba(16,24,40,.1)}
.cmenu-hd{padding:3px 7px 6px;font-size:10.5px;color:var(--tx3)}
.crow{display:flex;align-items:center;gap:8px;height:30px;padding:0 7px;border-radius:7px;font-size:11.5px;color:var(--tx);cursor:pointer}
.crow:hover{background:var(--hover)}
.crow span{flex:1}
.crow input[type=color]{flex:none;width:26px;height:20px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.crow input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.cmenu-ft{display:flex;gap:6px;padding:4px 7px 2px;border-top:1px solid var(--line2);margin-top:4px}
.cmenu-ft .btn{height:24px;font-size:11px;flex:1}

</style>
</head>
<body>
<div class="app">
  <div class="title">
    <span class="logo"><i class="mark"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.1" y="7.3" width="9.8" height="6.5" rx="1.7"/><path d="M5.6 7.3V5.2a2.4 2.4 0 0 1 4.7-.6"/></svg></i>计价无锁预览</span>
    <span class="file" id="fileName">未打开工程</span>
    <span class="spacer"></span>
    <span class="lvwrap" id="levelWrap"><button type="button" id="levelSel" title="显示层级：默认展开到该级，箭头可随时手动展开 / 折叠" aria-haspopup="true" aria-expanded="false"><span class="tx" id="levelTx">全部</span><svg class="car" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.3 4 5 6.7 7.7 4"/></svg></button>
      <div class="lvmenu" id="levelMenu" style="display:none">
        <button type="button" data-v="s1">一级分部</button>
        <button type="button" data-v="s2">二级分部</button>
        <button type="button" data-v="s3">三级分部</button>
        <button type="button" data-v="s4">四级分部</button>
        <button type="button" data-v="bill">清单</button>
        <button type="button" data-v="quota">定额</button>
        <button type="button" data-v="all">全部</button>
      </div></span>
    <span class="searchbox"><span class="si"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7.1" cy="7.1" r="4.3"/><path d="m10.4 10.4 3 3"/></svg></span>
      <input id="search" placeholder="搜索清单 / 定额 / 人材机…"></span>
    <button class="btn mini" id="detailBtn" aria-pressed="true" title="显示 / 隐藏工料机窗口"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="2.6" width="12" height="10.8" rx="2"/><path d="M2 9.5h12"/><path d="M4.5 11.9h3"/></svg>工料机</button>
    <button class="btn mini" id="exportBtn" title="把当前工程打包成可单独双击打开的快照 HTML">导出 HTML</button>
    <button class="btn mini" id="xlsxBtn" title="勾选需要的单位工程，导出 Excel 清单（每个单位工程一个工作表）">导出清单</button>
    <button class="btn mini" id="themeBtn">深色</button>
  </div>
  <div class="tabs" id="tabs" style="display:none"></div>
  <div class="start" id="startView">
    <div class="drop" id="dropZone">
      <div class="di"><svg viewBox="0 0 16 16" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.1" y="7.3" width="9.8" height="6.5" rx="1.7"/><path d="M5.6 7.3V5.2a2.4 2.4 0 0 1 4.7-.6"/></svg></div>
      <h2>选择或拖入计价文件</h2>
      <p>全程在本机浏览器内只读解析，不启动计价软件、不占用原文件、不上传任何数据。</p>
      <p class="hint">广联达：.GBQ7 / .GBQ6（清单与定额模式均可读）&nbsp;·&nbsp;新点：.EYS11 / .emjyx（开发中......）</p>
      <button class="btn primary big" id="pickBtn">选择计价文件</button>
      <input type="file" id="fileInput" accept=".gbq7,.gbq6,.gbq,.eys,.eys11,.een,.emjyx,.gc" hidden>
      <div class="msg" id="msg1"></div>
    </div>
  </div>
  <div class="convert" id="convertView" style="display:none">
    <h2 style="margin:0;font-size:14px">正在解析工程</h2>
    <div class="bar-progress" id="progressBar" style="display:block"></div>
    <div class="msg" id="msg2"></div>
    <div class="hint">首次解析 10~20 MB 工程约需数秒，请稍候</div>
  </div>
  <div class="epoint" id="epointView" style="display:none"></div>
  <div class="main" id="workView" style="display:none">
    <div class="tree1" id="tree1"></div>
    <div class="hsplit" id="hs1" title="拖动调整工程结构列宽（双击恢复默认）"></div>
    <div class="tree2" id="tree2"></div>

    <div class="content">

      <div class="splitter" id="splitter" title="拖动调整工料显示高度"></div>

          <button class="on" id="detailTitle">工料显示</button>
          <div class="dq-tabs" id="detailTabs"></div>
          <span class="spacer"></span>
          <span class="hint" id="detailHint">点击清单 / 定额行查看人材机组成</span>
        </div>
        <div class="detail-body" id="detailBody"><div class="empty">选中定额行后，在此显示人材机明细</div></div>
      </div>
    </div>
  </div>
  <div class="status">
    <span id="statusLeft">就绪 · 离线只读</span>
    <span class="spacer"></span>
    <span id="statusRight"></span>
  </div>

    <div class="cmenu-hd">行背景色（右键「深色 / 浅色」按钮）</div>
    <label class="crow"><span>清单行底色</span><input type="color" id="colBill"></label>
    <label class="crow"><span>定额行底色</span><input type="color" id="colQuota"></label>
    <div class="cmenu-ft"><button class="btn mini" id="colReset">恢复默认</button></div>
  </div>
  <div class="mask" id="xlsxMask" style="display:none">
    <div class="dlg" role="dialog" aria-label="导出清单">
      <div class="dlg-hd"><b>导出清单</b><span class="dlg-tip" id="xlsxTip">勾选需要的单位工程，每个单位工程一个工作表</span></div>

        <button class="btn mini primary" id="xlsxGo">导出 Excel</button>
      </div>
    </div>
  </div>
</div>
<script>
/* GBQ7 只读解析内核：ZIP -> GSP(Rijndael+zlib) -> 业务表。零依赖，浏览器/Node 均可运行。 */
(function (global) {
  'use strict';

  var TE = new TextEncoder();
  var TD_UTF8 = new TextDecoder('utf-8');
  var TD_UTF16 = new TextDecoder('utf-16le');

  function u32at(d, p) {
    if (p < 0 || p + 4 > d.length) throw new Error('Truncated integer');
    return (d[p] | (d[p + 1] << 8) | (d[p + 2] << 16) | (d[p + 3] << 24)) >>> 0;
  }

  }

    for (var i = from || 0; i <= d.length - needle.length; i++) if (eq(d, i, needle)) return i;
    return -1;

    0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,

    0xe1,0xf8,0x98,0x11,0x69,0xd9,0x8e,0x94,0x9b,0x1e,0x87,0xe9,0xce,0x55,0x28,0xdf,
    0x8c,0xa1,0x89,0x0d,0xbf,0xe6,0x42,0x68,0x41,0x99,0x2d,0x0f,0xb0,0x54,0xbb,0x16

  var ALOG = [1], LOG = new Array(256).fill(0);
  for (var i = 0; i < 255; i++) {
    var j = (ALOG[ALOG.length - 1] << 1) ^ ALOG[ALOG.length - 1];

    if (!a || !b) return 0;

  }

    var s = SBOX[i];

  function Rijndael256(key) {
    var kc = 8, bc = 8, rounds = 14, total = (rounds + 1) * bc;
    var Ke = [];
    for (var r = 0; r <= rounds; r++) Ke.push(new Array(bc).fill(0));
    var tk = [];
    for (i = 0; i < kc; i++) {
      tk[i] = ((key[i * 4] << 24) | (key[i * 4 + 1] << 16) | (key[i * 4 + 2] << 8) | key[i * 4 + 3]) >>> 0;
    }
    var t = 0, j = 0;
    while (j < kc && t < total) { Ke[(t / bc) | 0][t % bc] = tk[j]; j++; t++; }
    var rp = 0;
    while (t < total) {
      var tt = tk[kc - 1];
      tk[0] = (tk[0] ^ ((SBOX[(tt >>> 16) & 255] << 24) ^ (SBOX[(tt >>> 8) & 255] << 16) ^
        (SBOX[tt & 255] << 8) ^ SBOX[(tt >>> 24) & 255] ^ (RCON[rp] << 24))) >>> 0;
      rp++;
      for (i = 1; i < kc / 2; i++) tk[i] = (tk[i] ^ tk[i - 1]) >>> 0;
      var t2 = tk[kc / 2 - 1];
      tk[kc / 2] = (tk[kc / 2] ^ (SBOX[t2 & 255] ^ (SBOX[(t2 >>> 8) & 255] << 8) ^
        (SBOX[(t2 >>> 16) & 255] << 16) ^ (SBOX[(t2 >>> 24) & 255] << 24))) >>> 0;
      for (i = kc / 2 + 1; i < kc; i++) tk[i] = (tk[i] ^ tk[i - 1]) >>> 0;

  Rijndael256.prototype.encrypt = function (source) {
    if (source.length !== 32) throw new Error('Rijndael block must be 32 bytes');
    var bc = 8, s1 = 1, s2 = 3, s3 = 4, Ke = this.Ke, rounds = 14;
    var t = [];
    for (var i = 0; i < bc; i++) {
      t[i] = (((source[i * 4] << 24) | (source[i * 4 + 1] << 16) |
        (source[i * 4 + 2] << 8) | source[i * 4 + 3]) ^ Ke[0][i]) >>> 0;
    }
    for (var r = 1; r < rounds; r++) {
      var a = new Array(bc);
      for (i = 0; i < bc; i++) {
        a[i] = (T[(t[i] >>> 24) & 255][0] ^ T[(t[(i + s1) % bc] >>> 16) & 255][1] ^
          T[(t[(i + s2) % bc] >>> 8) & 255][2] ^ T[t[(i + s3) % bc] & 255][3] ^ Ke[r][i]) >>> 0;
      }

    }

    for (i = 0; i < bc; i++) {
      var tt = Ke[rounds][i];
      out[i * 4] = (SBOX[(t[i] >>> 24) & 255] ^ (tt >>> 24)) & 255;
      out[i * 4 + 1] = (SBOX[(t[(i + s1) % bc] >>> 16) & 255] ^ (tt >>> 16)) & 255;
      out[i * 4 + 2] = (SBOX[(t[(i + s2) % bc] >>> 8) & 255] ^ (tt >>> 8)) & 255;
      out[i * 4 + 3] = (SBOX[t[(i + s3) % bc] & 255] ^ tt) & 255;
    }
    return out;
  };

  /* ---------- decompression ---------- */

    if (/\.emjyx$/i.test(name)) return { code: 'EMJYX', label: '新点电子标书（emjyx）' };

      } catch (err) {}

    $('tabs').style.display = 'none';
    $('convertView').style.display = 'flex';
    showMsg('正在识别新点文件 ' + file.name + ' …');
    setProgress(30);
    window.GBQReader.readEpoint(file).then(function (info) {
      setProgress(100);
      renderEpoint(info);
    }).catch(function (e) {
      showMsg('读取失败：' + (e && e.message ? e.message : e), true);
    });
  }
  function renderEpoint(info) {
    function mb(n) { return (n / 1048576).toFixed(2) + ' MB'; }
    var st = info.stats || {};
    var h = '<div class="ep">';
    h += '<div class="ep-hd"><span class="ep-badge">新点</span><div><b>' + esc(info.name) + '</b>' +
      '<div class="hint">' + esc(info.label) + ' · ' + (info.container === 'zip' ? 'ZIP 容器（外壳可读）' : '单一加密数据段') +
      ' · ' + mb(info.size) + '</div></div></div>';
    h += '<div class="ep-warn"><b>数据段无法离线解密</b>：新点的 <code>xm.info</code> 与各单位工程 <code>*.gc</code> 是' +
      '「分组密码 + 授权校验」两段结构 —— 密文由新点原生模块 <code>FileEncrypt.dll</code> 处理，密钥由授权模块 ' +
      '<code>EP_WPF_ZJ（加密锁 / 云授权）</code> 通过 <code>SetKey</code> 下发，<b>密文文件里不含密钥</b>' +
      '（首字节 <code>0x01</code>、尾部固定 <code>00 01 01</code>、熵值 ' + (info.entropy || '≈8.0') + '）。' +
      '因此 <b>清单 / 定额 / 人材机 / 费用明细无法在本工具内显示</b>，这是文件本身的授权限制，不是解析失败。' +
      '下面列出外壳里可读的全部结构。</div>';
    h += '<div class="ep-cards">';
    function card(k, v, note) { return '<div class="ep-card"><span>' + esc(k) + '</span><b>' + esc(v) + '</b>' + (note ? '<i>' + esc(note) + '</i>' : '') + '</div>'; }
    if (info.container === 'zip') {
      h += card('单位工程', st.units || 0, '*.gc 单位工程文件');
      h += card('加密数据段', st.encrypted_members || 0, '含 xm.info 主数据 · ' + mb(st.encrypted_bytes || 0));
      h += card('明文成员', st.plain_members || 0, '元数据 / 配置');
      h += card('报表模板', st.report_templates || 0, 'Report.zip 内 .repcfg');
    } else {
      h += card('文件大小', mb(info.size), '整体加密');
      h += card('文件头', info.head, 'hex');
      h += card('熵值', info.entropy, '接近 8.0 即密文');
    }
    h += '</div>';
    if (st.project_gid) h += '<div class="ep-line">工程 GID：<code>' + esc(st.project_gid) + '</code></div>';
    if (info.members && info.members.length) {
      h += '<div class="ep-tbl"><table><colgroup><col style="width:auto"><col style="width:110px"><col style="width:150px"></colgroup>' +
        '<thead><tr><th>容器成员</th><th class="num">大小</th><th>状态</th></tr></thead><tbody>';
      info.members.forEach(function (m) {
        var cls = m.state === 'encrypted' ? 'ep-enc' : m.state === 'zip' ? 'ep-zip' : '';
        h += '<tr class="' + cls + '"><td title="' + esc(m.name) + '">' + esc(m.name) + '</td>' +
          '<td class="num">' + (m.size >= 1048576 ? mb(m.size) : (m.size / 1024).toFixed(1) + ' KB') + '</td>' +
          '<td>' + esc(m.note) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<div class="ep-tip"><b>想核清单与定额，走导出通道即可。</b>新点自身支持「导出 Excel」与 XML 接口' +
      '（其导入过滤器为 <code>*.xml;*.jstbx;*.jskzx</code>）：在新点里打开工程 → 导出分部分项 / 措施项目 / 人材机 / 费用汇总，' +
      '把导出的表或 XML 给我，我给工具加一条导入通道，按现在的页签样式直接核量核价。' +
      '加密数据段本身不做破解（密钥在加密锁/云授权里，绕过它属于破解软件授权）。</div>';
    h += '<div class="ep-actions"><button class="btn primary" id="epAgain">选择其它文件</button></div>';
    h += '</div>';
    chromeData(false);
    $('fileName').textContent = info.name;
    $('fileName').title = info.name;
    var box = $('epointView');
    box.innerHTML = h;
    box.style.display = 'flex';
    $('convertView').style.display = 'none';
    $('statusLeft').innerHTML = '已识别 <b>' + esc(info.name) + '</b> · ' + esc(info.label) + ' · 加密数据段仅识别不解析';
    $('statusRight').textContent = '离线只读 · 未解密 · 未修改原文件';
    var again = $('epAgain');
    if (again) again.onclick = function () {
      box.style.display = 'none';
      chromeData(false);
      $('fileName').textContent = '未打开工程';
      $('fileName').title = '';
      $('startView').style.display = 'flex';
      $('statusLeft').textContent = '就绪 · 离线只读';
      $('statusRight').textContent = '';
    };
  }

  function load(file) {
    if (isEpointName(file.name)) { loadEpoint(file); return; }
    if (!/\.(gbq[0-9]?|zip)$/i.test(file.name)) {
      showMsg('请选择广联达 .gbq7 / .gbq6，或新点 .EYS11 / .emjyx 计价文件', true);
      return;
    }
    $('startView').style.display = 'none';
    $('convertView').style.display = 'flex';
    $('workView').style.display = 'none';
    if ($('epointView')) $('epointView').style.display = 'none';
    showMsg('正在读取 ' + file.name + ' …');
    setProgress(2);
    S.t0 = Date.now();
    setTimeout(function () {
      window.GBQReader.readGBQ(file, function (text, p) {
        showMsg(text);
        setProgress(p);
      }).then(function (data) {
        applyData(data, file.name, { secs: ((Date.now() - S.t0) / 1000).toFixed(1) });
      }).catch(function (e) {
        // 扩展名不是新点、但内容是新点容器（ZIP 内含 xm.info）时，转到新点识别页
        window.GBQReader.readEpoint(file).then(function (info) {
          var isEpointZip = info.container === 'zip' && info.members.some(function (m) { return /(^|\/)xm\.info$/i.test(m.name); });
          if (isEpointZip) { renderEpoint(info); return; }
          showMsg('读取失败：' + (e.message || e), true);
          $('startView').style.display = 'flex';
          $('convertView').style.display = 'none';
        }).catch(function () {
          showMsg('读取失败：' + (e.message || e), true);
          $('startView').style.display = 'flex';
          $('convertView').style.display = 'none';
        });
      });
    }, 30);
  }

  // 解析完成 / 快照载入 共用：复位视图状态并渲染
  function applyData(data, name, opt) {
    opt = opt || {};
    S.data = data;
    S.fileName = name || data.project.name || '工程';
    S.snapshot = !!opt.snapshot;
    S.unit = 0;
    S.tab = 'fbfx';
    S.q = '';
    S.section = '';
    S.level = 'all';
    S.collapsed = {};
    S.picked = null; S.selKey = ''; S.costCollapsed = {}; S.csCollapsed = {};
    S.qtItem = ''; S.hjCat = -1;
    setLevel('all', true);
    if ($('search')) $('search').value = '';
    $('fileName').textContent = S.fileName + (opt.snapshot ? '（快照）' : '');
    $('fileName').title = S.fileName;
    chromeData(true);
    $('convertView').style.display = 'none';
    if ($('epointView')) $('epointView').style.display = 'none';
    $('tabs').style.display = 'flex';
    $('workView').style.display = 'flex';
    try { var dh = Number(localStorage.getItem('gbqDetailH')); if (dh > 0) setDetailHeight(dh); } catch (e) {}
    $('statusLeft').innerHTML = '已读取 <b>' + esc(data.project.name) + '</b> · ' + data.counts.units +
      ' 个单位工程 · 造价 <b>¥' + money(data.project.amount) + '</b>' +
      (data.partial ? ' · <span class="warn">部分表未解析</span>' : '');
    $('statusRight').textContent = (opt.secs ? '解析 ' + opt.secs + ' 秒 · ' : '') +
      (data.counts.bill_items ? '清单 ' + data.counts.bill_items + ' · 定额 ' + data.counts.quota_items
        : '定额模式 · 定额 ' + data.counts.quota_items) +
      ' · ' + (opt.snapshot ? '离线快照' : '离线只读') + (opt.time ? ' · ' + opt.time : '');
    renderTabs(); renderTrees(); renderGrid();
  }
  function setProgress(p) { $('progressBar').style.width = Math.max(0, Math.min(100, p)) + '%'; }
  function showMsg(text, err) {
    ['msg1', 'msg2'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.textContent = text;
      el.className = 'msg' + (err ? ' err' : '');
    });
  }

  /* ---------- 导出为独立 HTML 快照 ---------- */
  var B64CH = 0x8000;
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function bytesToB64(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i += B64CH) {
      s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + B64CH, u8.length)));
    }
    return btoa(s);
  }
  function b64ToBytes(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function throughStream(u8, stream) {
    var s = new Blob([u8]).stream().pipeThrough(stream);
    return new Response(s).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function gzipBytes(u8) { return throughStream(u8, new CompressionStream('gzip')); }
  function gunzipBytes(u8) { return throughStream(u8, new DecompressionStream('gzip')); }
  function safeFileName(s) {
    return String(s || '工程').replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || '工程';
  }

  // 用当前页面的克隆作外壳：清掉渲染结果，注入压缩数据，保持零外部依赖
  function buildSnapshotHtml(payload) {
    var root = document.documentElement.cloneNode(true);
    function q(sel) { return root.querySelector(sel); }
    var t = q('title');
    if (t) t.textContent = (payload.project || payload.name) + ' · GBQ7 预览快照';
    ['grid', 'detailBody', 'tree1', 'tree2', 'tabs'].forEach(function (id) {
      var el = q('#' + id);
      if (el) el.innerHTML = '';
    });
    var sv = q('#startView'); if (sv) sv.style.display = 'none';
    var xm = q('#xlsxMask'); if (xm) xm.style.display = 'none';
    var ep = q('#epointView'); if (ep) { ep.innerHTML = ''; ep.style.display = 'none'; }
    var cv = q('#convertView'); if (cv) cv.style.display = 'flex';
    var wv = q('#workView'); if (wv) wv.style.display = 'none';
    var tb = q('#tabs'); if (tb) tb.style.display = 'none';
    var fn = q('#fileName'); if (fn) { fn.textContent = S.fileName + '（快照）'; fn.title = S.fileName; }
    // 快照是纯预览：不再保留「导出 HTML」入口
    var eb = q('#exportBtn'); if (eb && eb.parentNode) eb.parentNode.removeChild(eb);
    var m2 = q('#msg2'); if (m2) { m2.className = 'msg'; m2.textContent = '正在载入工程快照…'; }
    var pb = q('#progressBar'); if (pb) { pb.style.display = 'block'; pb.style.width = '55%'; }
    var sl = q('#statusLeft'); if (sl) sl.textContent = '本地快照 · 载入中…';
    var sr = q('#statusRight'); if (sr) sr.textContent = '';
    var olds = root.querySelectorAll('script[data-snapshot]');
    for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
    var sc = document.createElement('script');
    sc.setAttribute('data-snapshot', '1');
    sc.textContent = 'window.__GBQ_SNAPSHOT__=' + JSON.stringify(payload).replace(/</g, '\\u003c') + ';';
    var scripts = root.querySelectorAll('script');
    var last = scripts[scripts.length - 1];
    last.parentNode.insertBefore(sc, last);
    return '<!DOCTYPE html>\n' + root.outerHTML;
  }

  function exportHtml() {
    if (!S.data) { $('statusRight').textContent = '请先打开一个 GBQ7 工程再导出'; return; }
    var btn = $('exportBtn');
    if (!btn || btn.disabled) return;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '生成中…';
    $('statusRight').textContent = '正在压缩工程数据…';
    var json = JSON.stringify(S.data);
    gzipBytes(new TextEncoder().encode(json)).then(function (gz) {
      var d = new Date();
      var payload = {
        v: 1,
        name: S.fileName,
        project: S.data.project.name || S.fileName,
        amount: S.data.project.amount,
        units: S.data.units.length,
        time: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
          ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
        gz: bytesToB64(gz)
      };
      var html = buildSnapshotHtml(payload);
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = safeFileName(payload.project) + '-预览快照.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 5000);
      btn.disabled = false;
      btn.textContent = label;
      $('statusLeft').innerHTML = '已导出快照 <b>' + esc(a.download) + '</b> · ' + (blob.size / 1048576).toFixed(2) + ' MB';
      $('statusRight').textContent = '双击该文件即可离线查看，无需再选 GBQ7';
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = label;
      $('statusRight').textContent = '导出失败：' + (e.message || e);
    });
  }

  // 快照文件启动：直接解压内嵌数据并进入工作界面
  function bootSnapshot() {
    var snap = window.__GBQ_SNAPSHOT__;
    if (!snap || !snap.gz) return false;
    $('startView').style.display = 'none';
    $('convertView').style.display = 'flex';
    $('workView').style.display = 'none';
    showMsg('正在载入工程快照…');
    setProgress(45);
    gunzipBytes(b64ToBytes(snap.gz)).then(function (u8) {
      var data = JSON.parse(new TextDecoder().decode(u8));
      setProgress(100);
      applyData(data, snap.name || data.project.name, { snapshot: true, time: snap.time });
    }).catch(function (e) {
      showMsg('快照载入失败：' + (e.message || e) + '，可点下方重新选择 GBQ7 文件。', true);
      $('startView').style.display = 'flex';
      $('convertView').style.display = 'none';
    });
    return true;
  }

  function renderTabs() {
    var h = '';
    TABS.forEach(function (t) {
      h += '<button data-t="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
    });
    $('tabs').innerHTML = h;
    var bs = $('tabs').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) (function (b) {
      b.onclick = function () {
        S.tab = b.getAttribute('data-t');
        S.q = ''; if ($('search')) $('search').value = '';
        S.qtItem = ''; S.hjCat = -1;
        renderTabs(); renderTrees(); renderGrid();
      };
    })(bs[i]);
  }

  /* ---------- 目录树：缩进 + 展开箭头 + 类型图标 + 层级导引线 ---------- */
  var TSTEP = 14, TPAD = 9;
  var ICON_SVG = {
    bld: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M2.6 13.4V3.3a.8.8 0 0 1 .8-.8h4.9a.8.8 0 0 1 .8.8v10.1"/><path d="M9.1 7.6h3.2a.8.8 0 0 1 .8.8v5"/><path d="M1.5 13.4h13"/><path d="M4.5 5.3h1.7M4.5 7.5h1.7M4.5 9.7h1.7M11 9.4h.9M11 11.3h.9"/></svg>',
    house: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M2.3 7.7 8 2.9l5.7 4.8"/><path d="M3.8 7.5v6h8.4v-6"/><path d="M6.6 13.5v-3h2.8v3"/></svg>',
    folder: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M1.9 5.3a.9.9 0 0 1 .9-.9h2.9l1.3 1.5h6.2a.9.9 0 0 1 .9.9v5.5a.9.9 0 0 1-.9.9H2.8a.9.9 0 0 1-.9-.9z"/></svg>',
    doc: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M4 2.6h4.6l3.4 3.3v7.5H4z"/><path d="M8.6 2.6v3.3h3.4"/><path d="M6 8.6h4M6 10.9h4"/></svg>',
    list: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"><path d="M8 2.5 2.4 5.3 8 8.1l5.6-2.8z"/><path d="M2.4 9.6 8 12.4l5.6-2.8"/></svg>'
  };
  var CHEV = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 3.7 10.6 8l-4.3 4.3"/></svg>';
  // 表格行内的展开箭头（比字符 ▾ / ▸ 更锐利）
  var CARET_OPEN = '<svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)"><path d="M4.6 2.5 8.1 6l-3.5 3.5"/></svg>';
  var CARET_CLOSED = '<svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 2.5 8.1 6l-3.5 3.5"/></svg>';
  // 一行树节点：层级导引线 → 展开箭头 → 类型图标 → 名称 → 计数
  function treeRow(o) {
    var depth = o.depth || 0, pad = TPAD + depth * TSTEP, h = '', guides = o.guides || [];
    for (var d = 0; d < depth; d++) {
      // guides[k] = 第 k 层节点后面还有兄弟。缩进 d 的竖线要穿过「下一层子节点」的子树，
      // 因此当 guides[d+1] 为真、或 d 就是父级那一层时，才继续往下画。
      if (d === depth - 1 || guides[d + 1]) h += '<i class="gd" style="left:' + (TPAD + d * TSTEP + 8) + 'px"></i>';
    }
    var open = o.exp === 'open';
    h += '<span class="tg' + (open ? ' open' : '') + '"' + (o.tg ? ' data-tg="' + esc(o.tg) + '"' : '') + '>' +
      (o.exp ? CHEV : '') + '</span>';
    h += '<span class="ic ' + (o.iconCls || 'd') + '">' + (ICON_SVG[o.icon] || ICON_SVG.doc) + '</span>';
    h += '<span class="nm">' + esc(o.name) + '</span>';
    if (o.count !== undefined && o.count !== null && o.count !== '' && o.count !== 0) h += '<span class="ct">' + esc(o.count) + '</span>';
    return '<div class="tn' + (o.on ? ' on' : '') + '" style="padding-left:' + pad + 'px"' + (o.attrs || '') + ' title="' +
      esc(o.title === undefined ? o.name : o.title) + '">' + h + '</div>';
  }
  function toggleTree(k) {
    if (!k) return;
    if (k === 'root') S.secCol.root = !S.secCol.root;
    else if (k.charAt(0) === 's') S.secCol[k] = !S.secCol[k];
    else S.treeCol[k] = !S.treeCol[k];
    renderTrees();
  }
  function selectUnit(idx) {
    S.unit = idx; S.section = ''; S.picked = null; S.collapsed = {};
    renderTrees(); renderGrid();
  }
  function bindTreeClicks() {
    ['tree1', 'tree2'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener('click', function (e) {
        var t = e.target;
        var tg = t.closest ? t.closest('.tg') : null;
        var row = t.closest ? t.closest('.tn') : null;
        if (tg && tg.getAttribute('data-tg')) { toggleTree(tg.getAttribute('data-tg')); return; }
        if (!row) return;
        if (row.hasAttribute('data-u')) return selectUnit(Number(row.getAttribute('data-u')));
        if (row.hasAttribute('data-s')) {
          S.section = row.getAttribute('data-s');
          S.collapsed['s' + S.section] = false; // 跳转后该分部显式展开，不会只剩一个没有内容的箭头
          renderTrees(); renderGrid(); return;
        }
        if (row.hasAttribute('data-q')) { S.qtItem = row.getAttribute('data-q'); renderTrees(); renderGrid(); return; }
        if (row.hasAttribute('data-h')) { S.hjCat = Number(row.getAttribute('data-h')); renderTrees(); renderGrid(); return; }
        var g = row.querySelector('.tg[data-tg]');
        if (g) toggleTree(g.getAttribute('data-tg'));
      });
    });
  }

  function renderTrees() {
    var d = S.data;
    var h = '<div class="tree-hd"><span>工程结构</span><span class="cnt">' + d.counts.units + '</span></div>';
    var nodes = d.project.hierarchy, children = {};
    nodes.forEach(function (n) { var k = String(n.pid); (children[k] = children[k] || []).push(n); });
    function walk(pid, depth, guides) {
      var arr = children[String(pid)] || [];
      arr.forEach(function (n, i) {
        var isUnit = n.type === 2, idx = -1;
        if (isUnit) {
          for (var j = 0; j < d.units.length; j++) if (String(d.units[j].file_id) === String(n.id)) { idx = j; break; }
        }
        var kids = isUnit ? [] : (children[String(n.id)] || []);
        var key = 'h' + n.id, open = !S.treeCol[key];
        h += treeRow({
          depth: depth, guides: guides,
          exp: kids.length ? (open ? 'open' : 'closed') : undefined, tg: kids.length ? key : '',
          icon: isUnit ? 'house' : 'bld', iconCls: isUnit ? 'u' : 'k', name: n.name,
          on: isUnit && idx === S.unit,
          attrs: idx >= 0 ? ' data-u="' + idx + '"' : '',
          title: n.name + (n.code ? ' · ' + n.code : '')
        });
        if (kids.length && open) walk(n.id, depth + 1, guides.concat([i < arr.length - 1]));
      });
    }
    walk(null, 0, []);
    $('tree1').innerHTML = h;

    var show2 = S.tab === 'fbfx' || S.tab === 'qt' || S.tab === 'hj';
    $('tree2').style.display = show2 ? '' : 'none';
    syncColVis();
    if (!show2) return;
    var u = unit();
    if (S.tab === 'qt') { renderOtherTree(u); return; }
    if (S.tab === 'hj') { renderResCatTree(u); return; }

    var qMode = u && (u.mode === 'quota' || (!((u.sections || []).length) && (u.norm_sections || []).length));
    var secs = u ? ((qMode ? u.norm_sections : u.sections) || []) : [];
    var byId = {}, billsBySec = {};
    secs.forEach(function (s) { byId[s.id] = s; });
    if (u && qMode) u.quota_items.forEach(function (q) {
      if (q.namespace !== 'FBFX') return;
      var sid = q.section_id === null || q.section_id === undefined ? 0 : q.section_id;
      (billsBySec[sid] = billsBySec[sid] || []).push(q);
    });
    else if (u) u.bill_items.forEach(function (b) {
      if (b.namespace !== 'FBFX') return;
      var sid = b.section_id === null || b.section_id === undefined ? 0 : b.section_id;
      (billsBySec[sid] = billsBySec[sid] || []).push(b);
    });
    function subtreeCount(id) {
      var n = (billsBySec[id] || []).length;
      secs.forEach(function (s) {
        if (String(s.path || '').indexOf(String(byId[id] ? byId[id].path : '') + '\\') === 0 && s.id !== id) n += (billsBySec[s.id] || []).length;
      });
      return n;
    }
    var total = u ? (qMode ? u.quota_items.filter(function (q) { return q.namespace === 'FBFX'; })
      : u.bill_items.filter(function (b) { return b.namespace === 'FBFX'; })).length : 0;
    var h2 = '<div class="tree-hd"><span>分部 / 专业</span><span class="cnt">' + total + '</span></div>';
    var childMap = {};
    secs.forEach(function (s) {
      var k = String(s.pid === null || s.pid === undefined ? -1 : s.pid);
      (childMap[k] = childMap[k] || []).push(s);
    });
    var rootOpen = !S.secCol.root;
    h2 += treeRow({
      depth: 0, guides: [], exp: secs.length ? (rootOpen ? 'open' : 'closed') : undefined,
      tg: secs.length ? 'root' : '', icon: 'list', iconCls: 's',
      name: '全部分部分项', count: total, on: S.section === '',
      attrs: ' data-s=""', title: '全部分部分项'
    });
    function walkSec(pid, depth, guides) {
      var arr = childMap[String(pid)] || [];
      arr.forEach(function (s, i) {
        if (s.id === 0 && pid === -1) return; // 根节点另作“全部分部分项”
        var kids = childMap[String(s.id)] || [], key = 's' + s.id, open = !S.secCol[key];
        h2 += treeRow({
          depth: depth, guides: guides,
          exp: kids.length ? (open ? 'open' : 'closed') : undefined, tg: kids.length ? key : '',
          icon: 'folder', iconCls: 's', name: s.name, count: subtreeCount(s.id) || '',
          on: S.section === String(s.id), attrs: ' data-s="' + esc(s.id) + '"', title: s.name
        });
        if (kids.length && open) walkSec(s.id, depth + 1, guides.concat([i < arr.length - 1]));
      });
    }
    if (rootOpen) walkSec(0, 1, [false]);
    $('tree2').innerHTML = h2;
  }

  // 其他项目树：OtherItemTitle 分组 + OtherItem 明细（按原生分类）
  function renderOtherTree(u) {
    var titles = u ? (u.other_titles || []) : [], items = u ? (u.other_items || []) : [];
    var h = '<div class="tree-hd"><span>其他项目</span><span class="cnt">' + items.length + '</span></div>';
    h += treeRow({ depth: 0, guides: [], icon: 'list', iconCls: 's', name: '全部', count: items.length,
      on: S.qtItem === '', attrs: ' data-q=""', title: '全部' });
    var childMap = {};
    titles.forEach(function (t) {
      var k = String(t.pid === null || t.pid === undefined ? -1 : t.pid);
      (childMap[k] = childMap[k] || []).push(t);
    });
    function walk(pid, depth, guides) {
      var arr = childMap[String(pid)] || [];
      arr.forEach(function (t, i) {
        var more = i < arr.length - 1;
        var kids = items.filter(function (it) { return String(it.title_id) === String(t.id); });
        h += treeRow({ depth: depth, guides: guides, icon: 'folder', iconCls: 's', name: t.name,
          count: kids.length || '', on: S.qtItem === 't' + t.id, attrs: ' data-q="t' + esc(t.id) + '"', title: t.name });
        items.forEach(function (it) {
          if (String(it.title_id) !== String(t.id)) return;
          h += treeRow({ depth: depth + 1, guides: guides.concat([more]), icon: 'doc', iconCls: 'd', name: it.name,
            on: S.qtItem === 'i' + it.id, attrs: ' data-q="i' + esc(it.id) + '"', title: it.name });
        });
        walk(t.id, depth + 1, guides.concat([more]));
      });
    }
    walk(-1, 1, [false]);
    // 无标题归属的明细
    items.forEach(function (it) {
      if (titles.some(function (t) { return String(t.id) === String(it.title_id); })) return;
      h += treeRow({ depth: 1, guides: [false], icon: 'doc', iconCls: 'd', name: it.name,
        on: S.qtItem === 'i' + it.id, attrs: ' data-q="i' + esc(it.id) + '"', title: it.name });
    });
    $('tree2').innerHTML = h;
  }

  // 人材机汇总：只保留 人工表/材料表/机械表/设备表/主材表 五张原生表
  var RES_TABLES = [
    { id: 1, name: '人工表', cost: 1 },
    { id: 2, name: '材料表', cost: 2 },
    { id: 3, name: '机械表', cost: 3 },
    { id: 4, name: '设备表', cost: 4 },
    { id: 5, name: '主材表', cost: 5 }
  ];
  function resTableOf(c) {
    if (!c) return null;
    for (var i = 0; i < RES_TABLES.length; i++) if (String(RES_TABLES[i].id) === String(c.id)) return RES_TABLES[i];
    return null;
  }
  function resInTable(tbl, r) { return Number(r.cost_type) === tbl.cost; }
  function renderResCatTree(u) {
    var cats = u ? (u.resource_categories || []) : [];
    var all = u ? u.resources.length : 0;
    var h = '<div class="tree-hd"><span>人材机分类</span><span class="cnt">' + all + '</span></div>';
    h += treeRow({ depth: 0, guides: [], icon: 'list', iconCls: 's', name: '所有人材机', count: all,
      on: S.hjCat === -1, attrs: ' data-h="-1"', title: '所有人材机' });
    RES_TABLES.forEach(function (t, i) {
      var c = cats.filter(function (x) { return String(x.id) === String(t.id); })[0];
      var n = u ? u.resources.filter(function (r) { return resInTable(t, r); }).length : 0;
      h += treeRow({ depth: 1, guides: [false], icon: 'doc', iconCls: 'd',
        name: c && c.name ? c.name : t.name, count: n,
        on: String(S.hjCat) === String(t.id), attrs: ' data-h="' + t.id + '"', title: t.name });
    });
    $('tree2').innerHTML = h;
  }
  function catMatch(c, r) {
    if (!c) return true;
    if (c.cost_types && c.cost_types.length && c.cost_types.indexOf(Number(r.cost_type)) < 0) return false;
    if (c.mix_types && c.mix_types.length && c.mix_types.indexOf(Number(r.swc_id)) < 0) return false;
    if (c.supply_types && c.supply_types.length && c.supply_types.indexOf(Number(r.supply_type)) < 0) return false;
    return true;
  }

  function tableHead(cols) {
    var h = '<thead><tr>';
    cols.forEach(function (c) { h += '<th class="' + (c[2] === 'n' ? 'num' : '') + '">' + esc(c[0]) + '</th>'; });
    return h + '</tr></thead>';
  }

  // 按原生层级展开：整个项目 → 一/二/三/四级分部 → 清单 → 定额 → 主材
  // 定额模式（无清单）用 NormItemTitle 作分部，定额行直接挂在分部下
  function buildFbfx() {
    var u = unit(), out = [];
    if (!u) return out;
    var quotaMode = u.mode === 'quota' || (!((u.sections || []).length) && (u.norm_sections || []).length);
    var secs = (quotaMode ? u.norm_sections : u.sections) || [], map = {};
    secs.forEach(function (s) { map[s.id] = s; });
    var qBy = {}, rBy = {}, uBy = {};
    u.quota_items.forEach(function (q) { (qBy[q.parent_id] = qBy[q.parent_id] || []).push(q); });
    u.resources.forEach(function (r) { rBy[r.id] = r; });
    u.resource_usage.forEach(function (x) { (uBy[x.norm_id] = uBy[x.norm_id] || []).push(x); });
    // 层级不再裁剪数据：整棵行树都建出来，由 fbxHidden() 按当前层级 + 折叠状态决定显隐
    var filterId = S.section === '' ? null : Number(S.section), allowed = null;
    if (filterId !== null) {
      allowed = {};
      var fpath = map[filterId] ? String(map[filterId].path || '') : '';
      secs.forEach(function (s) {
        if (s.id === filterId || (fpath && String(s.path || '').indexOf(fpath + '\\') === 0)) allowed[s.id] = 1;
      });
    }
    var ql = S.q ? S.q.toLowerCase() : '';
    function has(v) { return ql && String(v === null || v === undefined ? '' : v).toLowerCase().indexOf(ql) >= 0; }
    function billText(b) { return String(b.code || '') + ' ' + String(b.name || '') + ' ' + String(b.description || ''); }
    function quotaText(q) { return String(q.code || '') + ' ' + String(q.name || ''); }
    function matText(r) { return String(r.code || '') + ' ' + String(r.name || '') + ' ' + String(r.spec || ''); }
    function matsOf(q) {
      var a = [];
      (uBy[q.id] || []).forEach(function (x) {
        var r = rBy[x.resource_id] || {};
        if (Number(r.cost_type) === 5) a.push({ x: x, r: r }); // 5 = 主材
      });
      return a;
    }
    // 全量建行：折叠只影响显示，不再重新构建整张表（点击箭头才能瞬间响应）
    function emitSection(s, depth, parents) {
      if (allowed && !allowed[s.id]) return;
      var key = 's' + s.id;
      out.push({ kind: 'section', row: s, depth: depth, code: depth === 0 ? '' : 'B' + depth, key: key, parents: parents });
      var mine = parents.concat([key]);
      if (depth < 12) secs.forEach(function (child) { if (child.pid === s.id) emitSection(child, depth + 1, mine); });
      if (quotaMode) {
        u.quota_items.forEach(function (q) {
          if (q.namespace !== 'FBFX') return;
          var qsid = q.section_id === null || q.section_id === undefined ? 0 : q.section_id;
          if (String(qsid) !== String(s.id)) return;
          var ms = matsOf(q), qh = ql && has(quotaText(q)), mh = false;
          ms.forEach(function (m) { if (has(matText(m.r))) mh = true; });
          if (ql && !qh && !mh) return;
          var qkey = 'q' + q.id;
          out.push({ kind: 'quota', row: q, bill: null, flat: true, key: qkey, parents: mine });
          var qmine = mine.concat([qkey]);
          ms.forEach(function (m) {
            if (ql && !qh && !has(matText(m.r))) return;
            out.push({ kind: 'material', row: m.x, res: m.r, quota: q, key: 'm' + m.x.id, parents: qmine });
          });
        });
        return;
      }
      u.bill_items.forEach(function (b) {
        if (b.namespace !== 'FBFX') return; // 单价措施单列在“措施项目”页签
        var sid = b.section_id === null || b.section_id === undefined ? 0 : b.section_id;
        if (sid !== s.id) return;
        var billHit = !ql || has(billText(b)), quotaHit = false, qList = [];
        (qBy[b.id] || []).forEach(function (q) {
          var ms = matsOf(q), qh = ql && has(quotaText(q)), mh = false;
          ms.forEach(function (m) { if (has(matText(m.r))) mh = true; });
          if (qh || mh) quotaHit = true;
          qList.push({ q: q, ms: ms, qh: qh, mh: mh });
        });
        if (ql && !billHit && !quotaHit) return;
        var bkey = 'b' + b.id, bmine = mine.concat([bkey]);
        out.push({ kind: 'bill', row: b, key: bkey, parents: mine });
        qList.forEach(function (it) {
          if (ql && !billHit && !it.qh && !it.mh) return;
          var qkey = 'q' + it.q.id;
          out.push({ kind: 'quota', row: it.q, bill: b, key: qkey, parents: bmine });
          it.ms.forEach(function (m) {
            if (ql && !billHit && !it.qh && !has(matText(m.r))) return;
            out.push({ kind: 'material', row: m.x, res: m.r, quota: it.q, key: 'm' + m.x.id, parents: bmine.concat([qkey]) });
          });
        });
      });
    }
    var root = null;
    secs.forEach(function (s) {
      if (s.pid === null || s.pid === undefined || s.id === 0) { if (!root || s.id === 0) root = s; }
    });
    var startNode = root, startDepth = 0;
    if (filterId !== null && map[filterId]) {
      startNode = map[filterId];
      startDepth = 1;
      var cur = startNode, guard = 0;
      while (cur && cur.pid !== null && cur.pid !== undefined && cur.pid !== 0 && guard++ < 20) {
        startDepth++; cur = map[cur.pid];
      }
    }
    if (startNode) emitSection(startNode, startDepth, []);
    if (!out.length) { // 无原生分部表时回退
      if (quotaMode) {
        u.quota_items.forEach(function (q) {
          if (q.namespace !== 'FBFX') return;
          if (ql && !has(quotaText(q))) return;
          out.push({ kind: 'quota', row: q, bill: null, flat: true, key: 'q' + q.id, parents: [] });
        });
      } else u.bill_items.forEach(function (b) {
        if (b.namespace !== 'FBFX') return;
        if (ql && !has(billText(b))) return;
        out.push({ kind: 'bill', row: b, key: 'b' + b.id, parents: [] });
      });
    }
    // 序号只给清单行；定额模式（无清单）退化为给顶层定额行；判定有无子行（决定是否画箭头）
    var billNo = 0;
    out.forEach(function (r, i) {
      if (r.kind === 'bill') r.no = ++billNo;
      var nxt = out[i + 1];
      r.hasKids = !!(nxt && nxt.key && nxt.parents.indexOf(r.key) >= 0);
    });
    if (!billNo) {
      var qNo = 0;
      out.forEach(function (r) { if (r.kind === 'quota' && r.flat) r.no = ++qNo; });
    }
    return out;
  }

  /* 分部分项：折叠只做显示/隐藏，箭头点击即时生效，不重建表格 */
  var FBX = { rows: [], trs: [], byKey: {}, kidsVis: {} };
  function lvCap() { return LVCAP[S.level] || LVCAP.all; }
  function rankOf(k) { return k === 'bill' ? 1 : k === 'quota' ? 2 : 3; }
  // 行本身是否超出当前层级（仍可能因为上一级被手动展开而露出）
  function lvHidden(r) {
    // 顶层行（无分部回退、跳转后的根分部）不受层级限制
    if (!r.parents || !r.parents.length) return false;
    var c = lvCap();
    return r.kind === 'section' ? r.depth > c.sec : rankOf(r.kind) > c.row;
  }
  function fbxHidden(r) {
    var p = r.parents || [], i;
    for (i = 0; i < p.length; i++) if (S.collapsed[p[i]] === true) return true;
    if (!lvHidden(r)) return false;
    // 超出层级的行：只有当它的上一级节点被手动展开时才显示（展开一层看一层）
    var pk = p.length ? p[p.length - 1] : '';
    return !(pk && S.collapsed[pk] === false);
  }
  // 箭头开合：显式折叠/展开优先，否则取决于「子行是否直接可见」（层级折叠的子行箭头朝右）
  function caretOpen(r) {
    var st = S.collapsed[r.key];
    if (st !== undefined) return !st;
    return !!(FBX.kidsVis && FBX.kidsVis[r.key]);
  }
  function refreshFbx() {
    for (var i = 0; i < FBX.rows.length; i++) {
      var r = FBX.rows[i], tr = FBX.trs[i];
      if (!tr) continue;
      tr.classList.toggle('hide', fbxHidden(r));
      if (r.hasKids) {
        var w = tr.querySelector('.tw[data-exp]');
        if (w) w.innerHTML = caretOpen(r) ? CARET_OPEN : CARET_CLOSED;
      }
    }
  }
  function paintPicked() {
    var trs = $('grid').querySelectorAll('tr[data-k]');
    for (var i = 0; i < trs.length; i++) {
      if (trs[i].getAttribute('data-k') === S.selKey && S.selKey) trs[i].classList.add('picked');
      else trs[i].classList.remove('picked');
    }
  }

  // 选中清单 / 定额 / 主材后统一刷新工料窗口
  function showDetail(bill, quota) {
    S.pickBill = bill || null;
    S.picked = quota || null;
    if (S.detailOn && S.tab === 'fbfx') renderDetail();
  }
  function quotasOfBill(bill) {
    var u = unit(), out = [];
    if (!u || !bill) return out;
    u.quota_items.forEach(function (q) {
      if (q.namespace !== 'FBFX') return;
      if (String(q.parent_id) === String(bill.id)) out.push(q);
    });
    return out;
  }
  function usageCount(q) {
    var u = unit(), n = 0;
    if (!u || !q) return 0;
    u.resource_usage.forEach(function (x) { if (String(x.norm_id) === String(q.id)) n++; });
    return n;
  }

  // 工料显示窗口：显/隐由标题栏按钮控制，切换页签时自动收起
  function syncDetail() {
    var on = !!(S.data && S.detailOn && S.tab === 'fbfx');
    if ($('detail')) $('detail').style.display = on ? '' : 'none';
    if ($('splitter')) $('splitter').style.display = on ? '' : 'none';
    if ($('detailBtn')) {
      $('detailBtn').classList.toggle('on', !!S.detailOn);
      $('detailBtn').setAttribute('aria-pressed', S.detailOn ? 'true' : 'false');
    }
  }
  function toggleDetail() {
    S.detailOn = !S.detailOn;
    try { localStorage.setItem('gbqDetailOn', S.detailOn ? '1' : '0'); } catch (e) {}
    syncDetail();
    if (S.detailOn && S.tab === 'fbfx' && (S.picked || S.pickBill)) renderDetail();
  }

  // 展开 / 折叠一个节点：展开 → 折叠；折叠（含层级默认折叠）→ 显式展开，所以手动一定能展开
  function toggleNode(key, item) {
    var it = item || FBX.byKey[key];
    S.collapsed[key] = it ? caretOpen(it) : !S.collapsed[key];
    refreshFbx();
  }

  // 表格点击统一委托：箭头最优先（点 SVG 描边也能命中），单击即生效
  function onGridClick(e) {
    var t = e.target, tw = t && t.closest ? t.closest('.tw') : null;
    if (tw && tw.getAttribute('data-exp') !== null) {
      var k = tw.getAttribute('data-exp');
      toggleNode(k, FBX.byKey[k]);
      return;
    }
    if (S.tab !== 'fbfx') return;
    var tr = t && t.closest ? t.closest('tr[data-i]') : null;
    if (!tr) return;
    var item = FBX.rows[Number(tr.getAttribute('data-i'))];
    if (!item) return;
    // 数据区点分部行只做展开 / 折叠（不做筛选，其他分支的数据不会被隐藏）
    if (item.kind === 'section') { if (item.hasKids) toggleNode(item.key, item); return; }
    if (item.kind === 'bill') { showDetail(item.row, null); S.selKey = 'b' + item.row.id; paintPicked(); return; }
    if (item.kind === 'quota') { showDetail(item.bill || null, item.row); S.selKey = 'q' + item.row.id; paintPicked(); return; }
    if (item.kind === 'material' && item.quota) { showDetail(item.bill || null, item.quota); S.selKey = 'm' + item.row.id; paintPicked(); }
  }

  function renderFbfx() {
    var cols = [
      ['序号', 'no'], ['编码', 'code'], ['类别', 'cat'], ['名称', 'name'], ['项目特征', 'feature'],
      ['单位', 'unit'], ['工程量表达式', 'expr'],
      ['含量', 'ratio'], ['工程量', 'qty', 'n'], ['单价', 'price', 'n'], ['合价', 'amount', 'n']
    ];
    var rows = buildFbfx();
    // 预判每个节点是否存在「当前层级下直接可见」的子行：决定箭头朝下还是朝右
    FBX.rows = rows;
    FBX.kidsVis = {};
    rows.forEach(function (r) {
      if (lvHidden(r)) return;
      var p = r.parents || [];
      if (p.length) FBX.kidsVis[p[p.length - 1]] = true;
    });
    var widths = [36, 112, 40, 190, 214, 48, 92, 58, 82, 82, 92];
    var h = '<table><colgroup>' + widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup>' +
      tableHead(cols) + '<tbody>';
    rows.forEach(function (r, i) {
      var k = r.kind, b = r.row;
      // 只有真的有子行才给箭头（含被当前层级折叠起来的子行），否则留等宽占位保持对齐
      var tw = r.hasKids
        ? '<span class="tw" data-exp="' + r.key + '">' + (caretOpen(r) ? CARET_OPEN : CARET_CLOSED) + '</span>'

        h += '<tr class="section sec' + r.depth + hide + '" data-i="' + i + '">' +
          '<td class="seq"></td><td title="' + esc(r.code) + '">' + tw + esc(r.code) + '</td>' +
          cell('部', 'cat') + cell(b.name, 'secname', b.name) +
          cell('') + cell('') + cell('') + cell('') + cell('') + cell('') + cell('') + '</tr>';
        return;
      }
      var ind = ''; // 清单 / 定额 / 主材编码与名称一律左对齐，不做分级缩进
      var code = k === 'material' ? (r.res.code || r.row.resource_code) : b.code;

      var name = k === 'material' ? (r.res.name || r.row.resource_name) : b.name;
      var feat = k === 'bill' ? b.description : k === 'material' ? (r.res.spec || '') : '';
      var unitName = k === 'material' ? (r.res.unit || r.row.resource_unit) : b.unit;
      var expr = (b.quantity_expression && b.quantity_expression.expression) || '';
      var ratio = k === 'material' ? r.row.usage : '';
      var qty = k === 'material' ? r.row.qty : b.qty;
      var price = k === 'material' ? r.res.market_rate : b.price;

      var selKey = k === 'bill' ? 'b' + b.id : k === 'quota' ? 'q' + b.id : k === 'material' ? 'm' + r.row.id : '';
      h += '<tr class="' + k + hide + (selKey && S.selKey === selKey ? ' picked' : '') + '" data-i="' + i + '"' +
        (selKey ? ' data-k="' + esc(selKey) + '"' : '') + '>' +
        '<td class="seq">' + (r.no || '') + '</td>' +
        '<td class="' + ind + '" title="' + esc(code) + '"' + (match(code) ? ' style="background:#fff3c4"' : '') + '>' + tw + esc(code || '') + '</td>' +
        cell(cat, 'cat') + cell(name, ind, name) +
        cell(feat, 'feature', feat) + cell(unitName) + cell(expr) + cell(ratio) +
        num(qty) + num(price) + num(amount) + '</tr>';
    });
    h += '</tbody></table>';
    $('grid').innerHTML = h;
    FBX.rows = rows;
    FBX.trs = $('grid').querySelectorAll('tbody tr[data-i]');
    FBX.byKey = {};
    rows.forEach(function (r) { if (r.hasKids) FBX.byKey[r.key] = r; });
    syncDetail();
    if (S.detailOn) renderDetail();
  }

  function product(a, b) {
    var x = Number(a), y = Number(b);
    return isFinite(x) && isFinite(y) ? (x * y).toFixed(2) : '';
  }
  function kindOf(res) {
    if (Number(res.cost_type) === 5) return '主';
    var code = String(res.code || '');
    if (code.slice(0, 2) === '00') return '人';
    if (/机|机械|设备/.test(String(res.name || ''))) return '机';
    return '材';
  }
  function renderDetail() {

    // 一个清单多个定额时，标题栏右侧给出可切换的定额标签

        tabs += '<button class="dq' + (q === active ? ' on' : '') + '" data-q="' + esc(q.id) + '" title="' +
          esc((q.code || '') + ' ' + (q.name || '')) + '"><span class="t">' + esc(q.code || '') + ' ' +

    var resMap = {}, usages = [];

    var cols = ['编码', '类别', '名称', '规格及型号', '单位', '特征率', '含量', '数量', '定额价', '市场价', '合价', '是否暂估', '锁定数量', '是否计价', '原始含量'];
    var widths = [85, 38, 130, 110, 48, 48, 52, 66, 66, 66, 82, 58, 58, 58, 58];
    var h = '<table><colgroup>' + widths.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup>' +
      tableHead(cols.map(function (c) { return [c, '']; })) + '<tbody>';
    usages.forEach(function (x) {
      var r = resMap[x.resource_id] || {};

        cell(x.usage) + cell(x.qty) + cell(r.budget_rate) + cell(r.market_rate) + cell(product(x.qty, r.market_rate)) +
        cell('') + cell('') + cell(r.is_referred ? '是' : '') + cell(x.usage) + '</tr>';
    });

  function simpleGrid(cols, rows) {
    var h = '<table>' + tableHead(cols) + '<tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      cols.forEach(function (c) {
        var v = r[c[1]];

    });

    $('grid').innerHTML = h;
    syncDetail();
  }
  function filtered(rows, keys) {
    if (!S.q) return rows;
    var q = S.q.toLowerCase();
    return rows.filter(function (r) {
      return keys.some(function (k) { return String(r[k] === null || r[k] === undefined ? '' : r[k]).toLowerCase().indexOf(q) >= 0; });
    });
